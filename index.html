<meta name="theme-color" content="#16241c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#16241c; --tinta2:#2c3f34; --papel:#edefe8; --alto:#f7f8f4;
  --chapeta:#f5c518; --chapeta-b:#d4a608; --pasto:#3e6b4a; --hierro:#a6432b;
  --ambar:#8a6c04; --linea:#d3d8cb; --tenue:#6d7a6f;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --texto:"IBM Plex Sans",system-ui,sans-serif;
  --dato:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:13.5px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pasto);outline-offset:2px}

/* ---------- marco ---------- */
.marco{display:grid;grid-template-columns:224px 1fr;height:100vh}
.rail{background:var(--tinta);color:var(--papel);padding:18px 14px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.marca{display:flex;align-items:center;gap:10px}
.marca strong{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.marca span{font-family:var(--dato);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,239,232,.45)}
.sello{width:28px;height:28px;flex:none;border-radius:6px 6px 11px 11px;background:var(--chapeta);position:relative}
.sello::after{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--tinta)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grupo{font-family:var(--dato);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,239,232,.35);padding:12px 10px 5px}
.nav button{background:none;border:0;color:rgba(237,239,232,.62);text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.nav button:hover{background:rgba(237,239,232,.07);color:var(--papel)}
.nav button.on{background:rgba(245,197,24,.14);color:var(--chapeta);font-weight:500}
.nav .cnt{font-family:var(--dato);font-size:10.5px;opacity:.65}
.nav button.alerta .cnt{background:var(--hierro);color:#fff;border-radius:9px;padding:1px 6px;opacity:1;font-weight:500}
.pie{margin-top:auto;border-top:1px solid rgba(237,239,232,.12);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.pie button{background:none;border:1px solid rgba(237,239,232,.18);color:rgba(237,239,232,.72);padding:6px 9px;border-radius:6px;font-size:11.5px;text-align:center;display:block}
.pie button:hover{border-color:rgba(237,239,232,.45);color:var(--papel)}

/* ---------- lienzo ---------- */
.lienzo{overflow-y:auto;padding:22px 26px 60px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cab h1{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0}
.cab p{margin:4px 0 0;color:var(--tenue);font-size:12.5px}

.conteos{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:18px}
.conteo{background:var(--alto);border:1px solid var(--linea);border-radius:9px;padding:11px 13px}
.conteo dt{font-family:var(--dato);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin:0 0 5px}
.conteo dd{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;margin:0;letter-spacing:-.02em}

/* ---------- barra ---------- */
.barra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.busca{flex:1 1 240px;position:relative;min-width:180px}
.busca input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--linea);border-radius:7px;background:var(--alto)}
.busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tenue)}
.barra select{padding:9px 11px;border:1px solid var(--linea);border-radius:7px;background:var(--alto)}
.fichas{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.ficha{border:1px solid var(--linea);background:var(--alto);padding:6px 12px;border-radius:20px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.ficha:hover{border-color:var(--tenue)}
.ficha.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.ficha b{font-family:var(--dato);font-weight:500;font-size:11px;opacity:.7}

/* ---------- botones ---------- */
.btn{border:1px solid var(--linea);background:var(--alto);color:var(--tinta);padding:9px 14px;border-radius:7px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--tenue)}
.btn-firme{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.btn-firme:hover{background:var(--tinta2);border-color:var(--tinta2)}
.btn-baja{color:var(--hierro);border-color:rgba(166,67,43,.3);background:transparent}
.btn-baja:hover{background:rgba(166,67,43,.07);border-color:var(--hierro)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* ---------- tabla ---------- */
.tabla-caja{border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--alto)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--alto);border-bottom:1px solid var(--linea);text-align:left;padding:10px 13px;font-family:var(--dato);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);font-weight:500;position:sticky;top:0;z-index:2;white-space:nowrap}
thead th.num{text-align:right}
tbody td{padding:10px 13px;border-bottom:1px solid var(--linea);vertical-align:middle}
tbody td.num{text-align:right;font-family:var(--dato);font-size:12.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr.fila{cursor:pointer}
tbody tr.fila:hover td{background:rgba(22,36,28,.035)}
tr.grupo td{background:rgba(22,36,28,.05);font-family:var(--dato);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);padding:7px 13px;font-weight:500;border-bottom:1px solid var(--linea)}
tr.grupo .n{opacity:.55;margin-left:6px}
.apilado{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.apilado em{font-style:normal;font-family:var(--texto);font-size:11px;color:var(--tenue)}
.chap{font-family:var(--dato);font-weight:600;font-size:13px;background:var(--chapeta);border:1px solid var(--chapeta-b);border-radius:3px 3px 5px 5px;padding:2px 7px;display:inline-block;color:var(--tinta);letter-spacing:-.02em}
.chap.gris{background:var(--linea);border-color:var(--tenue);color:var(--tinta2)}
.nom{font-weight:500}
.sub{color:var(--tenue);font-size:11.5px;margin-top:1px}
.flecha{color:var(--tenue);text-align:right;width:26px}

/* ---------- pastillas ---------- */
.p{font-family:var(--dato);font-size:10px;letter-spacing:.04em;padding:3px 7px;border-radius:4px;background:rgba(22,36,28,.06);color:var(--tinta2);text-transform:uppercase;white-space:nowrap;display:inline-block}
.p.verde{background:rgba(62,107,74,.14);color:var(--pasto)}
.p.roja{background:rgba(166,67,43,.13);color:var(--hierro)}
.p.ambar{background:rgba(212,166,8,.2);color:var(--ambar)}
.p.gris{background:rgba(22,36,28,.07);color:var(--tenue)}

/* ---------- vacío ---------- */
.vacio{border:1px dashed var(--linea);border-radius:10px;padding:48px 24px;text-align:center;background:var(--alto)}
.vacio h2{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 6px}
.vacio p{color:var(--tenue);margin:0 0 16px;font-size:13px}

/* ---------- hoja / modal ---------- */
.velo{position:fixed;inset:0;background:rgba(22,36,28,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.hoja{background:var(--alto);border-radius:12px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 64px -18px rgba(22,36,28,.55)}
.hoja.ancha{width:min(880px,100%)}
.hoja-cab{padding:17px 22px 14px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:center;gap:12px}
.hoja-cab h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.hoja-cab .sub{margin-top:2px}
.cerrar{background:none;border:0;color:var(--tenue);font-size:22px;line-height:1;padding:2px 8px;border-radius:6px}
.cerrar:hover{background:rgba(22,36,28,.07);color:var(--tinta)}
.hoja-cuerpo{padding:18px 22px;overflow-y:auto;flex:1}
.hoja-pie{padding:13px 22px 17px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--linea);flex-wrap:wrap}
.hoja-pie .btn-baja{margin-right:auto}

/* ---------- campos ---------- */
.rej{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.campo{display:flex;flex-direction:column;gap:5px}
.ancho{grid-column:1/-1}
.campo label{font-family:var(--dato);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue)}
.campo input,.campo select,.campo textarea{padding:9px 11px;border:1px solid var(--linea);border-radius:7px;background:var(--alto);width:100%}
.campo textarea{resize:vertical;min-height:64px;font-family:var(--texto)}
.campo .ayuda{font-size:11.5px;color:var(--tenue)}
/* control segmentado: Macho | Hembra | Gemelos */
.seg{display:flex;border:1px solid var(--linea);border-radius:7px;overflow:hidden}
.seg label{flex:1;min-width:0}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{display:block;text-align:center;padding:10px 6px;cursor:pointer;font-size:12.5px;
  border-right:1px solid var(--linea);background:var(--alto);transition:background .12s,color .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg label:last-child span{border-right:0}
.seg span:hover{background:rgba(22,36,28,.05)}
.seg input:checked+span{background:var(--tinta);color:var(--papel);font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--pasto);outline-offset:-3px}

/* ---------- ficha de la vaca ---------- */
.ficha-top{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.retrato{width:172px;flex:none;position:relative}
.retrato img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;
  border:1px solid var(--linea);background:var(--papel)}
.retrato .sinfoto{width:100%;aspect-ratio:4/3;border:1px dashed var(--linea);border-radius:10px;
  display:grid;place-items:center;background:var(--papel);color:var(--tenue);gap:5px;
  font-size:11.5px;text-align:center;padding:10px;cursor:pointer;transition:border-color .12s}
.retrato .sinfoto:hover{border-color:var(--pasto);color:var(--pasto)}
.retrato .foto-acc{display:flex;gap:5px;margin-top:6px}
.retrato .foto-acc button{flex:1;font-size:11px;padding:5px 6px;border-radius:6px;
  border:1px solid var(--linea);background:var(--alto);color:var(--tinta2)}
.retrato .foto-acc button:hover{border-color:var(--tenue)}
.retrato .foto-acc .quitar:hover{border-color:var(--hierro);color:var(--hierro)}
.ficha-id{flex:1;min-width:0}
.ficha-id .chap{font-size:17px;padding:4px 11px;margin-bottom:9px}
.ficha-id h2{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px;line-height:1}
.ficha-id .meta{color:var(--tenue);font-size:12.5px;margin-bottom:10px}
.ficha-id .tags{display:flex;gap:5px;flex-wrap:wrap}

.medidas{list-style:none;padding:0;margin:0 0 16px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--linea);
  border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.medidas li{background:var(--alto);padding:11px 13px}
.medidas dt{font-family:var(--dato);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:4px}
.medidas dd{margin:0;font-size:15px;font-weight:500;font-family:var(--display);letter-spacing:-.01em}
.medidas dd.g{font-size:22px;font-weight:700}
.medidas li.liga{cursor:pointer}
.medidas li.liga:hover{background:rgba(62,107,74,.07)}
.medidas li.liga dd::after{content:" ›";color:var(--tenue);font-weight:400}

.plan{display:flex;gap:8px;flex-wrap:wrap;background:rgba(245,197,24,.1);
  border:1px solid rgba(212,166,8,.3);border-radius:9px;padding:11px 13px;margin-bottom:16px}
.plan div{flex:1;min-width:104px}
.plan dt{font-family:var(--dato);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ambar);margin-bottom:3px}
.plan dd{margin:0;font-size:13.5px;font-weight:500}

.sub-tabla{border:1px solid var(--linea);border-radius:9px;overflow:hidden}
.sub-tabla table{font-size:12.5px}
.sub-tabla thead th{padding:8px 11px;font-size:9px}
.sub-tabla tbody td{padding:8px 11px}

/* casillas de personas en el formulario de finca */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--linea);background:var(--alto);
  border-radius:7px;padding:7px 11px;cursor:pointer;font-size:13px;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--tenue)}
.chip:has(input:checked){border-color:var(--pasto);background:rgba(62,107,74,.09)}
.chip input{accent-color:var(--pasto);margin:0;width:15px;height:15px;flex:none}
.chip span{display:flex;flex-direction:column;line-height:1.25}
.chip i{font-style:normal;font-size:11px;color:var(--tenue);font-family:var(--dato)}
.invitar{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.aviso{background:rgba(166,67,43,.08);border:1px solid rgba(166,67,43,.25);color:var(--hierro);border-radius:7px;padding:9px 12px;font-size:12.5px;margin-bottom:13px}
.nota{background:rgba(62,107,74,.08);border:1px solid rgba(62,107,74,.22);color:var(--pasto);border-radius:7px;padding:9px 12px;font-size:12.5px;margin-bottom:13px}

/* ---------- ficha detalle ---------- */
.datos{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:9px;overflow:hidden}
.datos li{background:var(--alto);padding:10px 13px}
.datos dt{font-family:var(--dato);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin-bottom:3px}
.datos dd{margin:0;font-size:13.5px;font-weight:500}
.seccion{margin-bottom:18px}
.seccion h3{font-family:var(--display);font-size:14px;font-weight:700;margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.linea-ev{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--linea);font-size:12.5px;align-items:flex-start}
.linea-ev:last-child{border-bottom:0}
.linea-ev .f{font-family:var(--dato);font-size:11.5px;color:var(--tenue);flex:none;width:74px;padding-top:1px}
.linea-ev .c{flex:1}
.linea-ev .d{color:var(--tenue);font-size:11.5px;margin-top:2px}
.mini{color:var(--tenue);font-size:12.5px;font-style:italic;padding:7px 0}

/* ---------- alertas ---------- */
.alerta-caja{border:1px solid var(--linea);border-left:3px solid var(--tenue);background:var(--alto);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;gap:13px;align-items:flex-start;cursor:pointer}
.alerta-caja:hover{border-color:var(--tenue)}
.alerta-caja[data-n="alta"]{border-left-color:var(--hierro)}
.alerta-caja[data-n="media"]{border-left-color:var(--chapeta-b)}
.alerta-caja[data-n="baja"]{border-left-color:var(--pasto)}
.alerta-caja .cu{flex:1}
.alerta-caja strong{display:block;font-size:13.5px;margin-bottom:2px}
.alerta-caja span{color:var(--tenue);font-size:12.5px}
.alerta-caja .q{font-family:var(--dato);font-size:11px;color:var(--tenue);text-align:right;flex:none}

/* ---------- notas (tarjetas) ---------- */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tarjeta{background:var(--alto);border:1px solid var(--linea);border-radius:10px;padding:15px;cursor:pointer;text-align:left;width:100%}
.tarjeta:hover{border-color:var(--tenue)}
.tarjeta h3{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 2px}
.tarjeta time{font-family:var(--dato);font-size:11px;color:var(--tenue);display:block;margin-bottom:9px}
.tarjeta p{margin:0;font-size:13px;line-height:1.45;white-space:pre-wrap}

.pasos-inicio{margin-top:18px;border:1px solid var(--linea);border-radius:11px;
  background:var(--alto);padding:18px 20px}
.pasos-inicio .paso:first-child{padding-top:0}

/* ---------- portada de acceso ---------- */
.portada{display:grid;grid-template-columns:1.05fr .95fr;height:100vh;overflow:hidden}
.portada-arte{background:var(--tinta);position:relative;overflow:hidden;display:grid;place-items:center}
.pared{position:absolute;inset:-8%;display:flex;flex-wrap:wrap;gap:14px;align-content:center;
  justify-content:center;transform:rotate(-11deg)}
.tag{width:60px;height:44px;border-radius:5px 5px 9px 9px;background:var(--chapeta);
  opacity:var(--o);position:relative;display:grid;place-items:end center;padding-bottom:6px;
  font-family:var(--dato);font-size:11px;font-weight:600;color:rgba(22,36,28,.72);
  animation:brota .5s var(--d) both}
.tag::after{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:var(--tinta);opacity:.55}
@keyframes brota{from{opacity:0;transform:translateY(9px)}to{opacity:var(--o);transform:none}}
.portada-texto{position:relative;z-index:2;text-align:center;padding:34px;
  background:radial-gradient(closest-side,rgba(22,36,28,.97) 55%,rgba(22,36,28,0));}
.portada-texto h1{font-family:var(--display);font-size:52px;font-weight:800;letter-spacing:-.04em;
  line-height:.95;color:var(--papel);margin:16px 0 12px}
.portada-texto p{color:rgba(237,239,232,.62);font-size:14px;margin:0;max-width:290px;
  margin-inline:auto;line-height:1.55}
.sello.grande{width:52px;height:52px;border-radius:11px 11px 20px 20px;margin:0 auto}
.sello.grande::after{width:10px;height:10px;top:9px}

.ver-arte{display:block;margin-top:22px;font-family:var(--dato);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(237,239,232,.3)}
.ver-chip{margin-left:auto;font-family:var(--dato);font-size:10px;color:var(--tenue);
  border:1px solid var(--linea);border-radius:20px;padding:2px 8px}
.ver-pie{font-family:var(--dato);font-size:10.5px;letter-spacing:.05em;color:var(--tinta2)}
.portada-forma{display:grid;place-items:center;padding:30px;overflow-y:auto;background:var(--papel)}
.forma-caja{width:min(370px,100%)}
.forma-caja h2{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.forma-caja .lede{color:var(--tenue);font-size:13px;line-height:1.55;margin:0 0 20px}
.forma-caja form{display:flex;flex-direction:column;gap:13px;margin-bottom:14px}
.btn.grande{padding:12px 16px;font-size:14px;margin-top:3px;width:100%}
.forma-caja .btn:not(.grande){width:100%}
.btn.google{display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;
  border-color:#dadce0;color:#3c4043;font-weight:500}
.btn.google:hover{background:#f7f8f8;border-color:#c6cacd}
.enlaces{display:flex;flex-direction:column;gap:7px;align-items:flex-start;margin-top:13px}
.liga{background:none;border:0;padding:2px 0;color:var(--pasto);font-size:12.5px;text-align:left;
  text-decoration:underline;text-underline-offset:2px}
.liga:hover{color:var(--tinta)}
.separa{display:flex;align-items:center;gap:11px;margin:15px 0;color:var(--tenue);
  font-family:var(--dato);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.separa::before,.separa::after{content:"";flex:1;height:1px;background:var(--linea)}
.pie-nota{color:var(--tenue);font-size:11.5px;line-height:1.5;margin:20px 0 0;
  padding-top:14px;border-top:1px solid var(--linea)}
.solo-movil{display:none}

.quien{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.quien strong{font-size:13px;color:var(--papel)}
.quien em{font-style:normal;font-family:var(--dato);font-size:10.5px;color:rgba(237,239,232,.45)}
.quien .p{align-self:flex-start;font-size:9px}

@media(max-width:860px){
  .portada{grid-template-columns:1fr}
  .portada-arte{display:none}
  .solo-movil{display:flex;align-items:center;gap:9px;margin-bottom:22px}
  .solo-movil strong{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.02em}
}

/* ---------- configuración ---------- */
.panel{border:1px solid var(--linea);border-radius:11px;background:var(--alto);margin-bottom:16px;overflow:hidden}
.panel-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--linea);background:rgba(22,36,28,.03)}
.panel-cab h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}
.panel-cuerpo{padding:18px}
.panel-cuerpo .expl{color:var(--tenue);font-size:12.5px;line-height:1.55;margin:0 0 14px}
.panel-cuerpo .rej{margin-bottom:14px}
.sub-titulo{font-family:var(--dato);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tenue);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--linea)}
.sub-titulo:first-child{margin-top:0}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.panel textarea{font-family:var(--dato);font-size:11.5px;line-height:1.5}

.cambios{margin:0 0 4px;padding-left:18px;font-size:13px;line-height:1.6;color:var(--tinta2)}
.cambios li{margin-bottom:4px}
.paso{display:flex;gap:14px;padding:15px 0;border-bottom:1px dashed var(--linea)}
.paso:last-child{border-bottom:0;padding-bottom:0}
.paso:first-child{padding-top:0}
.paso-n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--tinta);color:var(--chapeta);
  display:grid;place-items:center;font-family:var(--dato);font-size:12px;font-weight:600}
.paso-c{flex:1;min-width:0}
.paso-c h4{font-family:var(--display);font-size:14.5px;font-weight:700;margin:2px 0 7px}
.paso-c p{margin:0 0 9px;font-size:13px;line-height:1.6}
.paso-c p:last-child{margin-bottom:0}
.paso-c code{font-family:var(--dato);font-size:11.5px;background:rgba(22,36,28,.07);
  padding:1px 5px;border-radius:4px}
.paso-c details{margin-top:11px;border-top:1px dashed var(--linea);padding-top:11px}
.paso-c summary{cursor:pointer;font-size:12.5px;color:var(--pasto);font-weight:500}
.paso-c summary:hover{text-decoration:underline}

.codigo{border:1px solid var(--linea);border-radius:8px;overflow:hidden;margin:10px 0}
.codigo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:7px 11px;background:rgba(22,36,28,.05);border-bottom:1px solid var(--linea)}
.codigo-cab span{font-family:var(--dato);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--tenue)}
.codigo pre{margin:0;padding:13px;overflow-x:auto;background:var(--tinta);color:#dfe6dc;
  font-family:var(--dato);font-size:11.5px;line-height:1.6}

.sync{font-family:var(--dato);font-size:10.5px;letter-spacing:.05em;padding:5px 2px;
  color:rgba(237,239,232,.5)}
.sync.listo{color:#8fd6a0}
.sync.error{color:#e4907a}
.sync.cargando{color:var(--chapeta)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:11px 18px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}

/* ==========================================================
   MÓVIL
   La app se usa en el corral, con una mano y a veces con guantes.
   ========================================================== */
.topbar{display:none}
.rail-fondo{display:none}
.banda-nueva{background:rgba(245,197,24,.16);border:1px solid var(--chapeta-b);color:var(--tinta);
  border-radius:9px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.banda-nueva strong{display:block;margin-bottom:2px}
.banda-nueva span{color:var(--tinta2);font-size:12.5px}
.banda-riesgo{background:var(--hierro);color:#fff;padding:9px 14px;font-size:12.5px;line-height:1.45}
.banda-riesgo strong{display:block}

@media (max-width:860px){
  html,body{overflow-x:hidden}

  /* ---- barra superior con el menú ---- */
  .topbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:45;
    background:var(--tinta);color:var(--papel);padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .menu-btn{background:none;border:1px solid rgba(237,239,232,.22);color:var(--papel);
    width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;padding:0}
  .menu-btn:active{background:rgba(237,239,232,.12)}
  .topbar-tit{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.02em;
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .ver-chip{border-color:rgba(237,239,232,.22);color:rgba(237,239,232,.55)}
  .topbar-alertas{background:var(--hierro);color:#fff;font-family:var(--dato);font-size:11px;
    border-radius:20px;padding:4px 10px;border:0;flex:none}

  /* ---- cajón lateral ---- */
  .marco{grid-template-columns:1fr;height:auto;min-height:100vh}
  .rail{position:fixed;top:0;bottom:0;left:0;width:262px;max-width:84vw;transform:translateX(-100%);
    transition:transform .22s ease;z-index:70;padding-top:calc(18px + env(safe-area-inset-top));
    padding-bottom:calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
  .rail.abierto{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.35)}
  .rail-fondo{display:block;position:fixed;inset:0;background:rgba(22,36,28,.5);z-index:65;
    opacity:0;pointer-events:none;transition:opacity .22s}
  .rail-fondo.visible{opacity:1;pointer-events:auto}
  .nav button{padding:12px 11px;font-size:14.5px}

  .lienzo{padding:calc(62px + env(safe-area-inset-top)) 13px calc(40px + env(safe-area-inset-bottom))}
  .cab h1{font-size:23px}
  .cab{margin-bottom:14px}
  .cab > .btn{width:100%}
  .banda-riesgo{margin:0 -13px 14px;border-radius:0}

  /* ---- filtros ---- */
  .barra{gap:7px}
  .busca{flex:1 1 100%}
  .barra select{flex:1 1 calc(50% - 4px);min-width:0}
  .fichas{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -13px 14px;padding:0 13px 3px}
  .fichas::-webkit-scrollbar{display:none}
  .ficha{flex:none}
  .conteos{grid-template-columns:1fr 1fr;gap:7px}
  .conteo dd{font-size:21px}

  /* ---- tablas convertidas en tarjetas ---- */
  .tabla-caja{border:0;border-radius:0;background:transparent;overflow:visible}
  .tabla-caja table,.sub-tabla table{display:block}
  .tabla-caja thead,.sub-tabla thead{display:none}
  .tabla-caja tbody,.sub-tabla tbody{display:block}
  .sub-tabla{border:0;background:transparent}

  .tabla-caja tbody tr,.sub-tabla tbody tr{display:block;background:var(--alto);
    border:1px solid var(--linea);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .tabla-caja tbody tr.grupo,.sub-tabla tbody tr.grupo{background:transparent;border:0;
    margin:15px 0 7px;padding:0}
  .tabla-caja tbody tr.grupo:first-child{margin-top:0}
  tr.grupo td{display:block;padding:0;border:0;background:transparent}

  .tabla-caja tbody td,.sub-tabla tbody td{display:flex;align-items:baseline;gap:12px;
    justify-content:space-between;text-align:right;padding:8px 13px;border:0;
    border-bottom:1px dashed var(--linea)}
  .tabla-caja tbody tr td:last-of-type,.sub-tabla tbody tr td:last-of-type{border-bottom:0}
  tbody td::before{content:attr(data-label);font-family:var(--dato);font-size:9px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);text-align:left;
    flex:none;max-width:46%}

  /* la primera celda hace de título de la tarjeta */
  .tabla-caja tbody tr:not(.grupo) td:first-child,
  .sub-tabla tbody tr:not(.grupo) td:first-child{background:rgba(22,36,28,.04);padding:11px 13px;
    border-bottom:1px solid var(--linea);justify-content:flex-start;text-align:left;
    font-size:15px;font-weight:600}
  .tabla-caja tbody tr:not(.grupo) td:first-child::before,
  .sub-tabla tbody tr:not(.grupo) td:first-child::before{display:none}
  td.flecha{display:none!important}

  /* ---- hoja modal casi a pantalla completa ---- */
  .velo{padding:0;align-items:flex-end}
  .hoja,.hoja.ancha{width:100%;max-width:100%;max-height:95vh;border-radius:15px 15px 0 0}
  .hoja-cab{padding:15px 16px 12px;position:sticky;top:0;background:var(--alto);z-index:2}
  .hoja-cab h2{font-size:18px}

/* ---------- fechas ---------- */
function aFecha(s) { return s ? new Date(s + "T12:00:00") : null; }
function hoyISO() { return new Date().toISOString().slice(0, 10); }

function aMedianoche(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

/** Días completos entre dos fechas. Ambas se normalizan a medianoche para
    que no se pierda un día por la hora ni por el cambio de horario. */
function dias(desde, hasta) {
  if (!desde) return null;
  const a = aMedianoche(typeof desde === "string" ? aFecha(desde) : desde);
  const b = aMedianoche(hasta ? (typeof hasta === "string" ? aFecha(hasta) : hasta) : new Date());

  if (!s) return "—";

  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;

  if (!s) return "—";

/* ----------------------------------------------------------
   DIFERENCIA DE CALENDARIO
   Los meses no miden lo mismo: febrero tiene 28 y mayo 31.
   Contamos meses corridos de fecha a fecha y el resto en dias,
   igual que la formula de la app anterior.
   ---------------------------------------------------------- */
function difCalendario(desde, hasta) {
  if (!desde) return null;
  const a = typeof desde === "string" ? aFecha(desde) : desde;
  const b = hasta ? (typeof hasta === "string" ? aFecha(hasta) : hasta) : HOY();
  if (b < a) return { meses: 0, dias: 0 };

  const meses = (b.getFullYear() - a.getFullYear()) * 12
              + (b.getMonth() - a.getMonth())
              - (b.getDate() < a.getDate() ? 1 : 0);

  // Dias del mes en que cae la fecha de partida (equivale a EOMONTH(desde, 0)).
  const finDeMes = new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate();
  const dias = b.getDate() >= a.getDate()
    ? b.getDate() - a.getDate()
    : finDeMes - a.getDate() + b.getDate();

  return { meses: Math.max(0, meses), dias: Math.max(0, dias) };
}

/** "8 meses y 4 días", "21 días", "3 meses" o "0". */
function textoCalendario(desde, hasta) {
  const d = difCalendario(desde, hasta);
  if (!d) return "0";
  const m = d.meses ? `${d.meses} ${d.meses === 1 ? "mes" : "meses"}` : "";
  const s = d.dias  ? `${d.dias} ${d.dias === 1 ? "día" : "días"}`     : "";
  if (m && s) return `${m} y ${s}`;
  return m || s || "0";
}

  if (n === null || n === undefined || n < 0) return "—";
  const meses = Math.floor(n / 30.44);
  const resto = Math.round(n - meses * 30.44);
  if (meses === 0) return `${resto} ${resto === 1 ? "día" : "días"}`;
  if (resto === 0) return `${meses} ${meses === 1 ? "mes" : "meses"}`;
  return `${meses} ${meses === 1 ? "mes" : "meses"} y ${resto} ${resto === 1 ? "día" : "días"}`;
}

  const d = dias(desde);

function normaliza(s) {
  return String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  if (_idxVer !== VERSION_DATOS) { _idx.clear(); _idxVer = VERSION_DATOS; }
  let v = _idx.get(clave);
  if (v === undefined) { v = normaliza(construir()); _idx.set(clave, v); }

}

  return t.split(/\s+/).every(p => h.includes(p));
}

  d.personas ||= [];
  d.secados ||= [];
  d.config ||= {};
  // Si el archivo viene publicado con la configuración adentro, se usa esa,
  // salvo que en este equipo alguien la haya quitado a propósito.
  if (d.config.firebase == null && typeof CONFIG_INCLUIDA === "object" && CONFIG_INCLUIDA

    d.config.firebase = { ...CONFIG_INCLUIDA };

  delete d.config.params.celo;
  delete d.config.params.diasAbiertos;
  d.personas.forEach(p => { p.fincas ??= []; p.activo ??= true; });

  // fincas: encargado (texto) -> persona vinculada
  for (const f of d.fincas) {
    if (f.personas) continue;
    f.personas = [];
    const nom = (f.encargado || "").trim();
    if (nom) {
      let p = d.personas.find(x => x.nombre.toLowerCase() === nom.toLowerCase());
      if (!p) {
        p = { id: uid(), nombre: nom, rol: "empleado", correo: f.correoEncargado || "",
              telefono: "", documento: "", notas: "", activo: true };
        d.personas.push(p);
      }
      f.personas.push(p.id);
    }
    delete f.encargado; delete f.correoEncargado;
  }

  // animales: tipo -> categoria + campos nuevos
  for (const a of d.animales) {
    if (a.tipo && !a.categoria) { a.categoria = a.tipo; delete a.tipo; }
    a.categoria ||= "vaca";
    if (!CATEGORIAS[a.categoria]) a.categoria = "vaca";   // categoría desconocida
    if (a.detalles === undefined && a.observaciones) a.detalles = a.observaciones;
    a.detalles ??= "";
    a.partosPrevios ??= 0;
    a.ultimoPartoPrevio ??= null;
    a.raza ??= "";
    a.foto ??= null;
  }
  (d.inseminaciones || []).forEach(i => { delete i.estatus; delete i.intento; });
  recalcularAccesos(d);
  return d;
}

/* ----------------------------------------------------------
   DENORMALIZACION
   Las reglas de Firestore no saben hacer joins: cada documento
   tiene que llevar encima la finca a la que pertenece, y cada
   persona la lista de fincas que puede ver.
   ---------------------------------------------------------- */
function recalcularAccesos(d) {
  d = d || D;
  const fincaDe = {};
  (d.animales || []).forEach(a => fincaDe[a.id] = a.fincaId);

  for (const col of ["inseminaciones", "palpaciones", "partos", "secados", "tratamientos"]) {
    (d[col] || []).forEach(e => { e.fincaId = fincaDe[e.animalId] || e.fincaId || null; });
  }
  (d.personas || []).forEach(p => {
    p.fincas = (d.fincas || []).filter(f => (f.personas || []).includes(p.id)).map(f => f.id);
  });
  return d;
}

let D = migrar(cargar() || semilla());

/** Avisa una sola vez cuando el archivo publicado cambió de versión. */
const CLAVE_VERSION = CLAVE + "-version";
function revisarVersion() {
  let previa = null;
  try { previa = localStorage.getItem(CLAVE_VERSION); } catch {}
  if (previa === VERSION) return null;
  try { localStorage.setItem(CLAVE_VERSION, VERSION); } catch {}
  return previa;   // null la primera vez, o la versión anterior
}

/* ==========================================================
   ESTADO REPRODUCTIVO — todo se deriva de los eventos.
   Nada de esto se digita a mano.
   ========================================================== */

const finca = (id) => D.fincas.find(f => f.id === id);
const animal = (id) => D.animales.find(a => a.id === id);
const nombreFinca = (id) => finca(id)?.nombre || "Sin finca";
const porFecha = (a, b) => (b.fecha || "").localeCompare(a.fecha || "");

function partosDe(id) { return D.partos.filter(p => p.animalId === id).sort(porFecha); }
function insemDe(id) { return D.inseminaciones.filter(i => i.animalId === id).sort(porFecha); }
function palpDe(id) { return D.palpaciones.filter(p => p.animalId === id).sort(porFecha); }
function secadosDe(id) { return D.secados.filter(s => s.animalId === id).sort(porFecha); }
function tratDe(id) { return D.tratamientos.filter(t => t.animalId === id).sort((a,b)=>(b.inicio||"").localeCompare(a.inicio||"")); }

/**
 * Calcula todo el estado reproductivo de un animal.
 * Regla de prenez: el ultimo servicio cuenta si no repitio,
 * no hubo parto posterior, y ninguna palpacion posterior lo
 * declaro vacio.
 */
/**
 * Vaca que ya parió y a la que nadie ha vuelto a servir.
 * Escala a los 30, 60 y 90 días del parto.
 */
function calcularAlertaCelo(totalInsemCiclo, ultPartoReal, a) {
  if (totalInsemCiclo > 0 || !ultPartoReal) return null;
  const d = dias(ultPartoReal.fecha);
  if (d === null) return null;
  const u = par(a).celo;
  const t = (n) => `${n} días sin caloriarse`;
  if (d >= u.tres) return { texto: u.tres === 90 ? "3 meses sin caloriarse" : t(u.tres), nivel: "alta",  dias: d };
  if (d >= u.dos)  return { texto: u.dos  === 60 ? "2 meses sin caloriarse" : t(u.dos),  nivel: "media", dias: d };
  if (d >= u.uno)  return { texto: u.uno  === 30 ? "un mes sin caloriarse"  : t(u.uno),  nivel: "media", dias: d };
  return null;
}

function estado(a) {
  const P = par(a);
  const partos = partosDe(a.id);
  const insems = insemDe(a.id);
  const palps  = palpDe(a.id);
  const secas  = secadosDe(a.id);

  const partosReales = partos.filter(p => p.tipo === "parto");
  // Si no hay partos capturados pero el animal traia historia, usamos el dato inicial.
  const ultParto = partos[0]
    || (a.ultimoPartoPrevio ? { fecha: a.ultimoPartoPrevio, tipo: "parto", previo: true } : null);
  // Último parto propiamente dicho, sin contar abortos.
  const ultPartoReal = partosReales[0]
    || (a.ultimoPartoPrevio ? { fecha: a.ultimoPartoPrevio, previo: true } : null);
  const ultInsem = insems[0] || null;
  const ultPalp  = palps[0] || null;

  let prenada = false, diasGest = null, servicioValido = null;

  // El ultimo servicio manda: si hubo uno mas nuevo, ese ya reemplazo al anterior.
  if (ultInsem) {
    const hayPartoDespues = ultParto && ultParto.fecha > ultInsem.fecha;
    const palpVaciaDespues = palps.some(p => p.fecha > ultInsem.fecha && p.resultado === "vacia");
    if (!hayPartoDespues && !palpVaciaDespues) {
      const d = dias(ultInsem.fecha);
      if (d !== null && d <= P.gestacion + 25) {
        prenada = true; diasGest = d; servicioValido = ultInsem;
      }
    }
  }

  // Dias abiertos: desde el ultimo parto hasta hoy (si esta vacia)
  // o hasta el servicio que la preñó (si esta prenada).
  let diasAbiertos = null;
  if (ultParto) {
    diasAbiertos = prenada
      ? dias(ultParto.fecha, servicioValido.fecha)
      : dias(ultParto.fecha);
    if (diasAbiertos < 0) diasAbiertos = null;
  }

  // Intervalo entre los dos ultimos partos
  let intervaloPartos = null;
  if (partosReales.length >= 2) {
    intervaloPartos = dias(partosReales[1].fecha, aFecha(partosReales[0].fecha));
  }

  const fechaProbableParto = prenada ? sumarDias(servicioValido.fecha, P.gestacion) : null;
  const fechaSecado = (prenada && P.lechero) ? sumarDias(servicioValido.fecha, P.secarDesde) : null;
  // Toca palpar si hay un servicio vigente que nadie ha confirmado todavia.
  const yaPalpada = ultInsem && palps.some(p => p.fecha > ultInsem.fecha);
  const dentroVentana = ultInsem && dias(ultInsem.fecha) <= P.palpar + 45;
  const fechaPalpacion = (ultInsem && !yaPalpada && dentroVentana &&
    !(ultParto && ultParto.fecha > ultInsem.fecha))
    ? sumarDias(ultInsem.fecha, P.palpar) : null;

  // Secado registrado a mano: vale desde que se hace hasta el próximo parto.
  const secadoActual = secas.find(s => !ultPartoReal || s.fecha > ultPartoReal.fecha) || null;

  // ---- Inseminaciones del ciclo actual (se reinicia con cada parto o aborto) ----
  const desdeCiclo = ultParto ? ultParto.fecha : "0000-00-00";
  const insemCiclo = insems.filter(x => x.fecha > desdeCiclo);

  // ---- Alerta de celo: parió y nadie la ha vuelto a servir ----
  const alertaCelo = calcularAlertaCelo(insemCiclo.length, ultPartoReal, a);

  // ---- Meses vacía ----
  // Cuenta desde el último parto y se congela en cuanto la sirven.
  const yaServida = insemCiclo.length > 0;
  const mesesVacia = (yaServida || !ultPartoReal || dias(ultPartoReal.fecha) === 0)
    ? "0" : textoCalendario(ultPartoReal.fecha);
  const diasVacia = (yaServida || !ultPartoReal) ? 0 : dias(ultPartoReal.fecha);

  // ---- Meses gestación ----
  const gestacion = (insemCiclo.length === 0 || alertaCelo || !ultInsem || dias(ultInsem.fecha) === 0)
    ? "0" : textoCalendario(ultInsem.fecha);
  const diasDesdeServicio = (insemCiclo.length && !alertaCelo) ? dias(ultInsem.fecha) : null;

  // ---- Días transcurridos entre inseminación ----
  // Con dos o más servicios mide el hueco entre los dos últimos; con uno solo,
  // mide parto → servicio.
  const primerServicio = insemCiclo[insemCiclo.length - 1] || null;
  let diasEntreInsem = null, motivoDias = null;
  if (insemCiclo.length >= 2) {
    diasEntreInsem = dias(insemCiclo[1].fecha, aFecha(insemCiclo[0].fecha));
    motivoDias = "repeticion";
  } else if (insemCiclo.length === 1 && ultParto) {
    diasEntreInsem = dias(ultParto.fecha, aFecha(insemCiclo[0].fecha));
    motivoDias = "parto";
  }
  const partoAServicio = diasEntreInsem;

  // Etapa productiva. En especies lecheras hay Producción y Seca;
  // en las demás lo que importa es si está gestante o con cría.
  let etapa = "sin_datos";
  if (!P.sirve && P.sexo === "M") etapa = "macho";
  else if (P.etapa === "cria") etapa = "levante";
  else if (!ultParto && !prenada) etapa = "levante";
  else if (P.lechero) {
    if (secadoActual) etapa = "seca";
    else if (prenada && diasGest > P.secarHasta) etapa = "seca";
    else if (ultParto) etapa = "produccion";
    else etapa = "gestante";
  } else {
    if (prenada) etapa = "gestante";
    else if (ultParto) etapa = "con_cria";
    else etapa = "levante";
  }

  return {
    prenada, diasGest, servicioValido, ultParto, ultInsem, ultPalp,
    mesesVacia, diasVacia, gestacion, partoAServicio, primerServicio,
    diasEntreInsem, motivoDias,
    alertaCelo, diasDesdeServicio, secadoActual,
    diasSeca: secadoActual ? dias(secadoActual.fecha) : null,
    ultPartoReal, totalInsemCiclo: insemCiclo.length, totalInsemHistorico: insems.length,
    totalPartos: partosReales.length + (Number(a.partosPrevios) || 0),
    totalAbortos: partos.length - partosReales.length,
    diasAbiertos, intervaloPartos, fechaProbableParto, fechaSecado, fechaPalpacion,
    etapa, edadMeses: mesesEntre(a.fechaNacimiento),
  };
}

const ETAPAS = {
  levante:    { et: "Levante",    cl: "gris"  },
  produccion: { et: "Producción", cl: "verde" },
  seca:       { et: "Seca",       cl: "ambar" },
  gestante:   { et: "Gestante",   cl: "verde" },
  con_cria:   { et: "Con cría",   cl: "verde" },
  macho:      { et: "Macho",      cl: "gris"  },
  sin_datos:  { et: "Sin datos",  cl: "gris"  },
};

/* ==========================================================
   ALERTAS — se calculan, no se digitan.
   ========================================================== */
function alertas() {
  const out = [];
  const push = (a, nivel, titulo, detalle, orden) =>
    out.push({ animalId: a.id, nombre: a.nombre, chapeta: a.chapeta,
               fincaId: a.fincaId, nivel, titulo, detalle, orden });

  const visibles = (typeof misAnimales === "function") ? misAnimales() : D.animales;
  for (const a of visibles.filter(x => x.estado === "activo")) {
    const e = estado(a);

    // 1. Palpación vencida o próxima
    if (e.fechaPalpacion) {
      const d = dias(e.fechaPalpacion);
      if (d >= 0) push(a, "alta", "Palpación vencida",
        `Servicio del ${fmt(e.ultInsem.fecha)}. ${d === 0 ? "Toca palparla hoy." : `Debió palparse hace ${d} ${d===1?"día":"días"}.`}`, 1000 + d);
      else if (d >= -7) push(a, "media", "Palpación próxima",
        `Palpar el ${fmt(e.fechaPalpacion)}, a ${-d} ${d===-1?"día":"días"}.`, 500 + d);
    }

    // 2. Salió vacía en la palpación y nadie la ha vuelto a servir
    if (e.ultPalp && e.ultPalp.resultado === "vacia" && !e.prenada &&
        (!e.ultInsem || e.ultInsem.fecha < e.ultPalp.fecha)) {
      const d = dias(e.ultPalp.fecha);
      push(a, "alta", "Vacía, sin servicio nuevo",
        `Palpada vacía el ${fmt(e.ultPalp.fecha)}, hace ${d} ${d===1?"día":"días"}. Toca volver a servirla.`, 900 + d);
    }

    // 3. Secar la vaca: solo dentro de la ventana y si no la han secado ya
    if (par(a).lechero && !e.secadoActual && e.prenada &&
        e.diasGest >= par(a).secarDesde && e.diasGest <= par(a).secarHasta) {
      const quedan = par(a).secarHasta - e.diasGest;
      push(a, "alta", `Secar la ${par(a).et.toLowerCase()}`,
        `${e.diasGest} días de gestación. Parto probable ${fmt(e.fechaProbableParto)}. ` +
        `${quedan === 0 ? "Último día de la ventana." : `Quedan ${quedan} día${quedan === 1 ? "" : "s"} de ventana.`}`,
        800 + e.diasGest);
    }

    // 3b. Se pasó la ventana y nadie registró el secado
    if (par(a).lechero && !e.secadoActual && e.prenada && e.totalPartos > 0 &&
        e.diasGest > par(a).secarHasta) {
      const tarde = e.diasGest - par(a).secarHasta;
      push(a, "alta", "Secado vencido",
        `Van ${tarde} día${tarde === 1 ? "" : "s"} pasada la ventana y no hay secado registrado. ` +
        `Parto probable ${fmt(e.fechaProbableParto)}.`, 850 + tarde);
    }

    // 4. Parto próximo
    if (e.prenada && e.diasGest >= par(a).gestacion - 21) {
      const faltan = par(a).gestacion - e.diasGest;
      push(a, faltan <= 7 ? "alta" : "media", "Parto próximo",
        `Faltan ${Math.max(0, faltan)} días. Probable ${fmt(e.fechaProbableParto)}.`, 1100 - faltan);
    }

    // 5. Alerta de celo: parió y nadie la ha vuelto a servir
    if (e.alertaCelo) {
      const c = e.alertaCelo;
      push(a, c.nivel, c.texto.charAt(0).toUpperCase() + c.texto.slice(1),
        `Parió el ${fmt(e.ultPartoReal.fecha)}, hace ${e.mesesVacia}, y no tiene ningún servicio.`,
        600 + c.dias);
    }

    // 6. Novillona en edad de servicio sin servir
    if (par(a).sirve && e.totalPartos === 0 && !e.ultInsem && e.edadMeses >= par(a).edadServicio) {
      push(a, "media", `${par(a).et} lista para servir`,
        `${e.edadMeses} meses de edad y sin ningún servicio registrado.`, 550);
    }

    // 7. Servicio que quedó sin desenlace: ni parto, ni palpación, ni servicio nuevo
    if (e.diasDesdeServicio !== null && e.diasDesdeServicio > par(a).gestacion + 25 && !e.prenada) {
      push(a, "alta", "Servicio sin desenlace",
        `${e.gestacion} desde el servicio del ${fmt(e.ultInsem.fecha)} y no hay parto registrado. ` +
        `Revisa si parió, abortó o quedó vacía.`, 950);
    }

    // 8. Tratamiento en curso
    for (const t of tratDe(a.id)) {
      if (t.fin && dias(t.fin) <= 0 && dias(t.inicio) >= 0) {
        push(a, "baja", "Tratamiento en curso",
          `${t.tipo}. Termina el ${fmt(t.fin)}.`, 200);
      }
    }
  }
  return out.sort((a, b) => b.orden - a.orden);
}


/* ==========================================================
   SERVICIO — intento y estatus se calculan, no se digitan.
   ========================================================== */

/** Numero de intento dentro del ciclo actual (se reinicia con cada parto o aborto). */
function servicioCalc(i) {
  const a = animal(i.animalId);
  const partos = partosDe(i.animalId);
  const insems = insemDe(i.animalId);

  // El ciclo arranca en el ultimo parto o aborto anterior a este servicio.
  const partoPrevio = partos.find(p => p.fecha <= i.fecha);
  const desde = partoPrevio ? partoPrevio.fecha : "0000-00-00";
  const ciclo = insems.filter(x => x.fecha > desde && x.fecha <= i.fecha);
  const intento = ciclo.length;

  // Estatus tal como lo maneja tu app: el primer intento no repite nada.
  const repitio = intento > 1;

  // Resultado real de este servicio concreto.
  const posterior = insems.find(x => x.fecha > i.fecha && x.fecha <= (partoPrevio ? "9999" : "9999"));
  const gest = par(a).gestacion;
  const partoDespues = partos.filter(p => p.fecha > i.fecha && dias(i.fecha, aFecha(p.fecha)) <= gest + 30)
                             .sort((x, y) => x.fecha.localeCompare(y.fecha))[0];
  const palpDespues = palpDe(i.animalId).filter(p => p.fecha > i.fecha)
                             .sort((x, y) => x.fecha.localeCompare(y.fecha))[0];

  let resultado;
  if (partoDespues) resultado = partoDespues.tipo === "parto" ? "pario" : "aborto";
  else if (posterior) resultado = "fallo";
  else if (palpDespues) resultado = palpDespues.resultado === "vacia" ? "vacia" : "prenada";
  else if (dias(i.fecha) <= gest + 25) resultado = "sin_confirmar";
  else resultado = "sin_datos";

  return { intento, repitio, resultado };
}

const RESULTADOS = {
  prenada:       { et:"Preñada",       cl:"verde" },
  pario:         { et:"Parió",         cl:"verde" },
  sin_confirmar: { et:"Sin confirmar", cl:"ambar" },
  fallo:         { et:"Repitió calor", cl:"roja"  },
  vacia:         { et:"Vacía",         cl:"roja"  },
  aborto:        { et:"Aborto",        cl:"roja"  },
  sin_datos:     { et:"Sin datos",     cl:"gris"  },
};

/* ==========================================================
   ÍNDICES DE BÚSQUEDA
   Cada registro arrastra todo su contexto: un animal incluye
   el texto de sus servicios, partos, palpaciones, secados y
   tratamientos. Así "Jorge" encuentra las vacas que él sirvió.
   ========================================================== */

const fechaBuscable = (f) => f ? `${f} ${fmt(f)} ${fmtCorto(f)}` : "";

function idxAnimal(a) {
  return indice("an:" + a.id, () => {
    const e = estado(a);
    return [
      a.nombre, a.chapeta, a.raza, a.detalles, a.observaciones, a.madre, a.padre, a.lote,
      CATEGORIAS[a.categoria]?.et, ESPECIES[especieDe(a)]?.plural, ESPECIES[especieDe(a)]?.et,
      nombreFinca(a.fincaId), ETAPAS[e.etapa]?.et,
      a.estado === "activo" ? "activo en el hato" : a.estado,
      a.motivoSalida, fechaBuscable(a.fechaSalida), fechaBuscable(a.fechaNacimiento),
      e.mesesVacia, e.gestacion, e.alertaCelo?.texto,
      e.prenada ? "preñada gestando" : "vacía",
      e.totalPartos ? `${e.totalPartos} partos` : "sin partos",
      a.foto ? "con foto" : "sin foto",
      ...insemDe(a.id).flatMap(i => [i.pajilla, i.detalles, fechaBuscable(i.fecha),
        RESULTADOS[servicioCalc(i).resultado]?.et, "inseminación servicio"]),
      ...partosDe(a.id).flatMap(p => [p.tipo, p.detalles, p.sexoCria, fechaBuscable(p.fecha)]),
      ...palpDe(a.id).flatMap(p => [p.resultado === "prenada" ? "preñada" : "vacía",
        p.observaciones, fechaBuscable(p.fecha), "palpación"]),
      ...secadosDe(a.id).flatMap(x => [MOTIVOS_SECADO[x.motivo], x.observaciones,
        fechaBuscable(x.fecha), "secado seca"]),
      ...tratDe(a.id).flatMap(t => [t.tipo, t.detalles, fechaBuscable(t.inicio), "tratamiento"]),
    ].filter(Boolean).join(" ");
  });
}

/** Contexto común de cualquier evento: el animal y su finca. */
function idxDeAnimal(animalId) {
  const a = animal(animalId);
  return a ? [a.nombre, a.chapeta, a.raza, CATEGORIAS[a.categoria]?.et,
              ESPECIES[especieDe(a)]?.plural, nombreFinca(a.fincaId)]
             .filter(Boolean).join(" ") : "";
}

function idxInsem(i) {
  return indice("in:" + i.id, () => {
    const c = servicioCalc(i);
    return [idxDeAnimal(i.animalId), i.pajilla, i.detalles, fechaBuscable(i.fecha),
      `intento ${c.intento}`, c.repitio ? "repitió" : "no aplica",
      RESULTADOS[c.resultado]?.et, i.tipo === "monta" ? "monta natural" : "inseminación"
    ].filter(Boolean).join(" ");
  });
}

function idxParto(p) {
  return indice("pa:" + p.id, () => [idxDeAnimal(p.animalId), p.tipo, p.detalles,
    p.sexoCria, fechaBuscable(p.fecha)].filter(Boolean).join(" "));
}

function idxPalp(p) {
  return indice("pl:" + p.id, () => [idxDeAnimal(p.animalId),
    p.resultado === "prenada" ? "preñada" : "vacía", p.observaciones,
    fechaBuscable(p.fecha), p.diasGestacion ? `${p.diasGestacion} días` : ""
  ].filter(Boolean).join(" "));
}

function idxSecado(s) {
  return indice("se:" + s.id, () => [idxDeAnimal(s.animalId), MOTIVOS_SECADO[s.motivo],
    s.observaciones, fechaBuscable(s.fecha), "secado"].filter(Boolean).join(" "));
}

function idxTrat(t) {
  return indice("tr:" + t.id, () => [idxDeAnimal(t.animalId), t.tipo, t.detalles,
    fechaBuscable(t.inicio), fechaBuscable(t.fin), "tratamiento"].filter(Boolean).join(" "));
}

function idxPersona(p) {
  return indice("pe:" + p.id, () => [p.nombre, p.correo, p.telefono, p.documento, p.notas,
    ROLES[p.rol]?.et, p.activo === false ? "inactivo" : "activo",
    ...(p.fincas || []).map(nombreFinca)].filter(Boolean).join(" "));
}

function idxFinca(f) {
  return indice("fi:" + f.id, () => [f.nombre, f.ubicacion,
    ...personasDe(f.id).flatMap(p => [p.nombre, p.correo, ROLES[p.rol]?.et]),
    ...D.animales.filter(a => a.fincaId === f.id).map(a => `${a.nombre} ${a.chapeta}`)
  ].filter(Boolean).join(" "));
}

function idxNota(n) {
  return indice("no:" + n.id, () => [n.texto, nombreFinca(n.fincaId),
    fechaBuscable(n.fecha)].filter(Boolean).join(" "));
}

function idxAlerta(x) {
  return [x.nombre, x.chapeta, x.titulo, x.detalle, nombreFinca(x.fincaId), x.nivel]
    .filter(Boolean).join(" ");
}

   ========================================================== */

let S = { persona: null, modo: null, error: "", aviso: "", cargando: false,
          modoAcceso: "entrar" };

/* Qué puede hacer cada rol. El empleado registra el día a día;
   dueño y administrador además gestionan fincas y gente. */
const PERMISOS = {
  dueno:         { fincas:1, editaFinca:1, borraFinca:1, personas:1, editaPersona:1,
                   config:1, borra:1, animales:1, editaAnimal:1, eventos:1 },
  administrador: { fincas:1, editaFinca:1, borraFinca:0, personas:1, editaPersona:1,
                   config:1, borra:1, animales:1, editaAnimal:1, eventos:1 },
  empleado:      { fincas:1, editaFinca:0, borraFinca:0, personas:0, editaPersona:0,
                   config:0, borra:0, animales:1, editaAnimal:1, eventos:1 },
};

const rolActual = () => S.persona?.rol || "empleado";
const puede = (q) => !!PERMISOS[rolActual()]?.[q];
const manda = () => rolActual() === "dueno" || rolActual() === "administrador";

/**
 * Dueño principal. Es el único que ve la conexión con Firebase, las reglas
 * y la publicación, para que nadie más pueda apuntar la app a otra base.
 * Si nadie está marcado todavía, manda el primer dueño.
 */
function esMaestro() {
  const m = (D.config.maestro || "").toLowerCase();
  const mio = (S.persona?.correo || "").toLowerCase();
  if (!m) return rolActual() === "dueno";
  return !!mio && mio === m;
}

/** Fincas que esta persona tiene asignadas. Es la base de todo el filtrado. */
function misFincas() {
  if (!S.persona) return [];
  return D.fincas.filter(f => (f.personas || []).includes(S.persona.id)).map(f => f.id);
}
const veFinca = (id) => misFincas().includes(id);
const veAnimal = (a) => a && veFinca(a.fincaId);

/* ---------- vistas filtradas ---------- */
const misFincasObj = () => D.fincas.filter(f => veFinca(f.id));
const misAnimales  = () => D.animales.filter(veAnimal);
const misPersonas  = () => {
  if (!S.persona) return [];
  if (!puede("personas")) return [S.persona];
  const mias = misFincas();
  return D.personas.filter(p => D.fincas.some(f => mias.includes(f.id) && (f.personas || []).includes(p.id)));
};
const misEventos = (col) => {
  const mias = misFincas();
  return (D[col] || []).filter(e => mias.includes(e.fincaId ?? animal(e.animalId)?.fincaId));
};

function conectarAcceso() {
  const f = document.querySelector("[data-acceso]");
  if (f) f.onsubmit = async (e) => {
    e.preventDefault();
    const v = datos(f);
    S.error = ""; S.aviso = "";

    if (f.dataset.acceso === "primero") {
      S.persona = crearPrimerUsuario(v.nombre, v.correo);
      S.modo = D.config.firebase?.apiKey ? "firebase" : "local";
      guardar(); guardarSesion(); pintar();
      return;
    }
    if (f.dataset.acceso === "local") {
      S.persona = persona(v.personaId); S.modo = "local";
      guardarSesion(); pintar(); return;
    }

    const correo = (v.correo || "").trim().toLowerCase();

    if (f.dataset.acceso === "primera-vez") {
      S.cargando = true; pantallaAcceso();
      try {
        await invitarPorCorreo(correo);
        try { localStorage.setItem(CLAVE_INVITADO, correo); } catch {}
        D.config.correo = correo; guardarLocal();
        S.cargando = false;
        S.aviso = `Listo. Revisa ${correo} y abre el enlace desde este mismo dispositivo. ` +
                  `Si no llega en un par de minutos, mira en correo no deseado.`;
      } catch (err) { S.cargando = false; S.error = errorFB(err); }
      pantallaAcceso(); return;
    }

    if (f.dataset.acceso === "olvide") {
      S.cargando = true; pantallaAcceso();
      try {
        await enviarReinicio(correo);
        S.cargando = false;
        S.aviso = `Te mandamos un correo a ${correo} para cambiar la contraseña.`;
      } catch (err) { S.cargando = false; S.error = errorFB(err); }
      pantallaAcceso(); return;
    }

    // Entrar con contraseña
    S.cargando = true; pantallaAcceso();
    try { await entrarFirebase(correo, v.clave); }
    catch (err) {
      S.cargando = false;
      S.error = errorFB(err);
      if (/no existe|no coinciden/i.test(S.error)) {
        S.error += " Si es tu primera vez, usa el enlace de abajo para crear tu contraseña.";
      }
      pantallaAcceso();
    }
  };

  document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => {
    S.modoAcceso = b.dataset.modo; S.error = ""; S.aviso = ""; pantallaAcceso();
  });

  document.querySelectorAll("[data-acc]").forEach(b => b.onclick = async () => {
    const a = b.dataset.acc;

    if (a === "olvide-ir") { S.modoAcceso = "olvide"; S.error = ""; S.aviso = ""; return pantallaAcceso(); }

    if (a === "google") {
      S.error = ""; S.aviso = ""; S.cargando = true; pantallaAcceso();
      try { await entrarConGoogle(); }
      catch (e) { S.error = errorFB(e); S.cargando = false; pantallaAcceso(); }
      return;
    }

    if (a === "modo-local") { D.config.firebase = null; D.config.sinFirebase = true;
                              guardarLocal(); pantallaAcceso(); }
    if (a === "modo-demo") {
      let p = D.personas.find(x => x.rol === "administrador") || D.personas[0];
      if (!p) { p = { id: uid(), nombre: "Administrador", rol: "administrador", correo: "",
                      telefono: "", documento: "", notas: "", activo: true, fincas: [] };
                D.personas.push(p); }
      D.fincas.forEach(f2 => { if (!(f2.personas || []).includes(p.id)) (f2.personas ||= []).push(p.id); });
      recalcularAccesos(); S.persona = p; S.modo = "local"; guardar(); guardarSesion(); pintar();
    }
  });

  const c = document.querySelector("[data-ir-config]");
  if (c) c.onclick = () => {
    S.persona = D.personas.find(x => x.rol === "dueno")
             || { id: "_tmp", nombre: "Configuración", rol: "dueno", correo: "", fincas: [] };
    S.modo = "config"; V.vista = "configuracion"; pintar();
  };
}

/** Crea el usuario inicial. Queda como dueño porque alguien tiene que poder empezar. */
function crearPrimerUsuario(nombre, correo) {
  const p = {
    id: uid(), nombre: (nombre || "").trim() || "Dueño",
    rol: "dueno", correo: (correo || "").trim().toLowerCase(),
    telefono: "", documento: "", notas: "", activo: true, fincas: [],
  };
  D.personas.push(p);
  if (p.correo) {
    D.config.correo = p.correo;
    if (!D.config.maestro) D.config.maestro = p.correo;
  }
  return p;
}

/* ---------- persistir la sesión local ---------- */
const CLAVE_SESION = CLAVE + "-sesion";
function guardarSesion() {
  try {
    if (S.persona && S.modo === "local") localStorage.setItem(CLAVE_SESION, S.persona.id);
    else localStorage.removeItem(CLAVE_SESION);
  } catch {}
}
function recuperarSesion() {
  if (D.config.firebase?.apiKey) return;  // con Firebase manda la sesión de auth
  try {
    const id = localStorage.getItem(CLAVE_SESION);
    if (id) { const p = persona(id); if (p) { S.persona = p; S.modo = "local"; } }
  } catch {}
}
function cerrarSesion() {
  if (S.modo === "firebase") { salirFirebase(); }
  S.persona = null; S.modo = null; S.error = "";
  guardarSesion(); pantallaAcceso();
}

/** Une la cuenta de Firebase con su ficha de persona, si ya existe. */
function vincularUsuario(email) {
  const p = D.personas.find(x => (x.correo || "").toLowerCase() === email.toLowerCase());
  if (p) { S.persona = p; S.modo = "firebase"; S.error = ""; }
  else { S.persona = null; }   // se resuelve al llegar los datos de Firestore
  S.cargando = false;
}

const nombreDesdeCorreo = (c) => c.split("@")[0]
  .replace(/[._-]+/g, " ").replace(/\b\w/g, (l) => l.toUpperCase());

/**
 * Se llama cuando ya llegaron los datos de Firestore. Si nadie tiene ese
 * correo, es el primer ingreso contra un proyecto vacío y se crea la ficha.
 */
function asegurarPersona(email) {
  const p = D.personas.find(x => (x.correo || "").toLowerCase() === email.toLowerCase());
  if (p) { S.persona = p; S.modo = "firebase"; S.error = ""; ofrecerClave(); return; }

  if (D.personas.length > 0) {
    S.error = `La cuenta ${email} entró bien, pero no hay ninguna persona registrada con ese ` +
              `correo. Pídele a un dueño que te cree la ficha y te asigne a una finca.`;
    S.persona = null;
    return;
  }

  S.persona = crearPrimerUsuario(nombreDesdeCorreo(email), email);
  if (FB.rolRemoto) S.persona.rol = FB.rolRemoto;
  S.modo = "firebase"; S.error = "";
  guardar();
  ofrecerClave();
}

/** Una sola vez: si entró por el enlace del correo, invitarle a poner contraseña. */
function ofrecerClave() {
  if (S.claveOfrecida) return;
  S.claveOfrecida = true;
  setTimeout(() => {
    if (S.persona && !hojaAbierta && metodoAcceso() === "enlace") hojaClave(false);
