function vistaPermitida(id) {
  if (["duenos","administradores","empleados"].includes(id)) return puede("personas");
  if (id === "configuracion") return true;
  return true;
}

function conteoVista(id) {
  const mios = misAnimales();
  const act = mios.filter(a => a.estado === "activo");
  switch (id) {
    case "alertas":      return alertas().length;
    case "activos":      return act.length;
    case "salidas":      return mios.filter(a => a.estado !== "activo").length;
    case "fincas":       return misFincasObj().length;
    case "palpacion":    return act.filter(a => estado(a).fechaPalpacion).length;
    case "inseminacion": return misEventos("inseminaciones").length;
    case "partos":       return misEventos("partos").length;
    case "secados":      return misEventos("secados").length;
    case "tratamientos": return misEventos("tratamientos").length;
    case "anotaciones":  return D.anotaciones.filter(n => veFinca(n.fincaId)).length;
    case "duenos":          return misPersonas().filter(p => p.rol === "dueno").length;
    case "administradores": return misPersonas().filter(p => p.rol === "administrador").length;
    case "empleados":       return misPersonas().filter(p => p.rol === "empleado").length;
    case "configuracion":   return "";
  }
}

/** Compara la consulta contra el índice completo del registro. */
const busca = (texto) => contiene(texto, V.busca);
function coincide(txt) { return contiene(txt, V.busca); }
function filtroFinca(fincaId) {
  return V.finca === "todas" || fincaId === V.finca;
}
const filtroEspecie = (a) => V.especie === "todas" || especieDe(a) === V.especie;

/* ---------- armazón ---------- */
function pintar() {
  if (!S.persona) return pantallaAcceso();
  let v = VISTAS.find(x => x.id === V.vista);
  if (v && !vistaPermitida(v.id)) { V.vista = "activos"; v = VISTAS.find(x => x.id === "activos"); }
  const grupos = [...new Set(VISTAS.map(x => x.grupo))];

  const nAlertas = alertas().length;
  $("#app").innerHTML = `
  <header class="topbar">
    <button class="menu-btn" data-menu aria-label="Abrir el menú">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar-tit">${esc(v ? v.et : "Control Ganadero")}</div>
    ${nAlertas ? `<button class="topbar-alertas" data-ir="alertas">${nAlertas}</button>`
               : `<span class="ver-chip">v${VERSION}</span>`}
  </header>
  <div class="rail-fondo ${V.railAbierto ? "visible" : ""}" data-cerrar-menu></div>
  <div class="marco">
    <aside class="rail ${V.railAbierto ? "abierto" : ""}">
      <div class="marca">
        <div class="sello"></div>
        <div><strong>Control<br>Ganadero</strong><span>v${VERSION}</span></div>
      </div>
      <nav class="nav">
        ${grupos.filter(g => VISTAS.some(x => x.grupo === g && vistaPermitida(x.id))).map(g => `
          <div class="grupo">${g}</div>
          ${VISTAS.filter(x => x.grupo === g && vistaPermitida(x.id)).map(x => {
            const n = conteoVista(x.id);
            return `<button data-ir="${x.id}" class="${x.id===V.vista?"on":""} ${x.id==="alertas"&&n>0?"alerta":""}">
              <span>${x.et}</span><span class="cnt">${n}</span></button>`;
          }).join("")}
        `).join("")}
      </nav>
      <div class="pie">
        <div class="sync ${FB.estado}">${
          FB.estado === "listo" && FB.user ? "● Sincronizado" :
          FB.estado === "cargando" ? "● Conectando…" :
          FB.estado === "error" ? "● Error de conexión" :
          D.config.firebase ? "○ Falta iniciar sesión" : "○ Solo en este equipo"}</div>
        <div class="quien">
          <span class="p ${ROLES[S.persona.rol].cl}">${ROLES[S.persona.rol].et}</span>
          <strong>${esc(S.persona.nombre)}</strong>
          <em>${misFincas().length} finca${misFincas().length === 1 ? "" : "s"}</em>
        </div>
        <button data-salir>Cerrar sesión</button>
      </div>
    </aside>
    <main class="lienzo">${VERSION_NUEVA ? `<div class="banda-nueva">
        <div><strong>Hay una versión nueva: ${esc(VERSION_NUEVA)}</strong>
        <span>Tienes la ${VERSION}. Actualiza para tener los últimos arreglos.</span></div>
        <button class="btn btn-sm" data-acc="actualizar">Actualizar ahora</button>
      </div>` : ""}
      ${SIN_ALMACEN ? `<div class="banda-riesgo">
        <strong>Este navegador no está guardando los datos.</strong>
        Suele pasar en modo incógnito. Lo que registres se pierde al cerrar la pestaña:
        sal del modo privado o conecta Firebase antes de seguir.</div>` : ""}
      ${misFincas().length === 0 && v.id !== "configuracion" && v.id !== "fincas"
      ? sinFincas() : cuerpo(v)}</main>
  </div>`;
  conectar();
}

function selectorFinca() {
  return `<select data-f="finca">
    <option value="todas">Todas las fincas</option>
    ${misFincasObj().map(f => `<option value="${f.id}" ${V.finca===f.id?"selected":""}>${esc(f.nombre)}</option>`).join("")}
  </select>`;
}
/** Solo aparece si en la finca hay más de una especie. */
function selectorEspecie() {
  const hay = [...new Set(misAnimales().map(especieDe))];
  if (hay.length < 2) return "";
  return `<select data-f="especie">
    <option value="todas">Todas las especies</option>
    ${hay.map(e => `<option value="${e}" ${V.especie===e?"selected":""}>${ESPECIES[e].plural}</option>`).join("")}
  </select>`;
}

function buscador(ph) {
  return `<div class="busca">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input data-f="busca" value="${esc(V.busca)}" placeholder="${ph}" aria-label="Buscar">
  </div>`;
}
function fichas(lista) {
  return `<div class="fichas">${lista.map(([v, et, n]) =>
    `<button class="ficha ${V.sub===v?"on":""}" data-sub="${v}">${et}${n!==undefined?`<b>${n}</b>`:""}</button>`
  ).join("")}</div>`;
}
function vacio(t, p, btn) {
  return `<div class="vacio"><h2>${t}</h2><p>${p}</p>${btn||""}</div>`;
}
function tabla(cols, filas) {
  if (!filas.trim()) return vacio("Nada por aquí", "Ajusta los filtros o la búsqueda para ver más registros.");
  return `<div class="tabla-caja"><table>
    <thead><tr>${cols.map(c => `<th class="${c.num?"num":""}">${c.et}</th>`).join("")}<th></th></tr></thead>
    <tbody>${filas}</tbody></table></div>`;
}
/** Agrupa filas por finca como en AppSheet. */
function agrupado(items, fn) {
  const por = {};
  items.forEach(i => { (por[i._finca] ||= []).push(i); });
  return Object.entries(por).map(([f, arr]) =>
    `<tr class="grupo"><td colspan="9">${esc(f)}<span class="n">${arr.length}</span></td></tr>` +
    arr.map(fn).join("")
  ).join("");
}
const persona = (id) => D.personas.find(p => p.id === id);
const personasDe = (fincaId) => (finca(fincaId)?.personas || []).map(persona).filter(Boolean);
const fincasDe = (personaId) => D.fincas.filter(f => (f.personas || []).includes(personaId));

function celdaAnimal(a) {
  return `<td><div class="nom">${esc(a.nombre)}</div></td>
          <td><span class="chap ${a.estado!=="activo"?"gris":""}">${esc(a.chapeta)}</span></td>`;
}

/* ==========================================================
   VISTAS
   ========================================================== */
function cuerpo(v) {
  const mapa = {
    alertas: vAlertas, activos: vActivos, salidas: vSalidas, fincas: vFincas,
    palpacion: vPalpacion, inseminacion: vInseminacion, partos: vPartos,
    secados: vSecados, tratamientos: vTratamientos, anotaciones: vAnotaciones,
    duenos: () => vPersonas("dueno"),
    administradores: () => vPersonas("administrador"),
    empleados: () => vPersonas("empleado"),
    configuracion: vConfiguracion,
  };
  return mapa[v.id]();
}

/* ---------- ALERTAS ---------- */
function vAlertas() {
  let L = alertas().filter(x => filtroFinca(x.fincaId) && busca(idxAlerta(x)));
  if (V.sub !== "todos") L = L.filter(x => x.nivel === V.sub);
  const t = alertas();
  return `
  <header class="cab"><div><h1>Alertas</h1>
    <p>Se calculan solas a partir de los eventos. No hay nada que digitar.</p></div></header>
  <div class="barra">${buscador("Buscar en las alertas")}${selectorFinca()}</div>
  ${fichas([["todos","Todas",t.length],["alta","Urgente",t.filter(x=>x.nivel==="alta").length],
            ["media","Pronto",t.filter(x=>x.nivel==="media").length],["baja","Aviso",t.filter(x=>x.nivel==="baja").length]])}
  ${L.length === 0
    ? vacio("Sin alertas", "Todo al día con los filtros actuales.")
    : L.map(x => `<div class="alerta-caja" data-n="${x.nivel}" data-abrir="${x.animalId}">
        <span class="chap">${esc(x.chapeta)}</span>
        <div class="cu"><strong>${esc(x.nombre)} — ${esc(x.titulo)}</strong><span>${esc(x.detalle)}</span></div>
        <div class="q">${esc(nombreFinca(x.fincaId))}</div></div>`).join("")}`;
}

/* ---------- ACTIVOS ---------- */
function vActivos() {
  let L = misAnimales().filter(a => a.estado === "activo" && filtroFinca(a.fincaId) && filtroEspecie(a))
    .map(a => ({ a, e: estado(a), _finca: nombreFinca(a.fincaId) }))
    .filter(({a}) => busca(idxAnimal(a)));

  const todos = misAnimales().filter(a => a.estado === "activo" && filtroEspecie(a)).map(a => estado(a).etapa);
  if (V.sub !== "todos") L = L.filter(x => x.e.etapa === V.sub ||
    (V.sub === "levante" && x.e.etapa === "levante"));

  L.sort((x, y) => x.a.nombre.localeCompare(y.a.nombre));

  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Etapa"},{et:"Meses vacía"},
                {et:"Meses gestación"},{et:"Alerta celo"},{et:"Días entre servicios",num:1},{et:"Total partos",num:1}];

  return `
  <header class="cab"><div><h1>Activos</h1>
    <p>${L.length} de ${todos.length} animales en el hato</p></div>
    <button class="btn btn-firme" data-nuevo="animal">Añadir animal</button></header>
  <div class="barra">${buscador("Buscar en todo: nombre, chapeta, raza, pajilla, detalles…")}${selectorFinca()}${selectorEspecie()}</div>
  ${fichas([["todos","Todos",todos.length],
            ["levante","Levante",todos.filter(e=>e==="levante").length],
            ...["produccion","gestante","con_cria","seca","macho","sin_datos"]
              .map(k=>[k,ETAPAS[k].et,todos.filter(e=>e===k).length]).filter(x=>x[2]>0)])}
  ${tabla(cols, agrupado(L, ({a, e}) => {
    const et = ETAPAS[e.etapa];
    return `<tr class="fila" data-abrir="${a.id}">
      ${celdaAnimal(a)}
      <td><span class="p ${et.cl}">${et.et}</span></td>
      <td>${e.mesesVacia}</td>
      <td>${e.gestacion}</td>
      <td>${e.alertaCelo
            ? `<span class="p ${e.alertaCelo.nivel === "alta" ? "roja" : "ambar"}">${e.alertaCelo.texto}</span>`
            : '<span class="sub">—</span>'}</td>
      <td class="num">${e.diasEntreInsem === null ? "—"
        : `<span class="apilado">${e.diasEntreInsem}<em>${e.motivoDias === "repeticion" ? "repitió" : "tras el parto"}</em></span>`}</td>
      <td class="num">${e.totalPartos}</td>
      <td class="flecha">›</td></tr>`;
  }))}`;
}

/* ---------- VENDIDO / MUERTO ---------- */
function vSalidas() {
  let L = misAnimales().filter(a => a.estado !== "activo" && filtroFinca(a.fincaId))
    .filter(a => busca(idxAnimal(a)))
    .map(a => ({ a, e: estado(a), _finca: a.estado === "vendido" ? "Vendido" : "Muerto" }));
  if (V.sub !== "todos") L = L.filter(x => x.a.estado === V.sub);
  L.sort((x, y) => (y.a.fechaSalida || "").localeCompare(x.a.fechaSalida || ""));

  const tot = misAnimales().filter(a => a.estado !== "activo");
  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Salida"},{et:"Motivo"},{et:"Partos",num:1}];

  return `
  <header class="cab"><div><h1>Vendido-Muerto</h1>
    <p>Animales que salieron del hato. Conservan todo su historial.</p></div></header>
  <div class="barra">${buscador("Buscar en todo: nombre, chapeta, raza, pajilla, detalles…")}${selectorFinca()}</div>
  ${fichas([["todos","Todo",tot.length],["vendido","Vendido",tot.filter(a=>a.estado==="vendido").length],
            ["muerto","Muerto",tot.filter(a=>a.estado==="muerto").length]])}
  ${tabla(cols, agrupado(L, ({a, e}) => `<tr class="fila" data-abrir="${a.id}">
      ${celdaAnimal(a)}
      <td>${fmt(a.fechaSalida)}</td>
      <td><span class="sub">${esc(a.motivoSalida) || "—"}</span></td>
      <td class="num">${e.totalPartos}</td>
      <td class="flecha">›</td></tr>`))}`;
}

/* ---------- FINCAS ---------- */
function vFincas() {
  const L = misFincasObj().filter(f => busca(idxFinca(f)));
  const cols = [{et:"Nombre finca"},{et:"Ubicación"},{et:"Encargados"},{et:"Animales",num:1}];
  return `
  <header class="cab"><div><h1>Fincas</h1>
    <p>${misFincasObj().length} finca${misFincasObj().length===1?"":"s"} asignada${misFincasObj().length===1?"":"s"}</p></div>
    ${puede("editaFinca") ? '<button class="btn btn-firme" data-nuevo="finca">Añadir finca</button>' : ""}</header>
  <div class="barra">${buscador("Buscar finca, encargado, correo o animal")}</div>
  ${L.length === 0 ? vacio(
      D.fincas.length ? "Ninguna finca te tiene asignado" : "Todavía no hay fincas",
      D.fincas.length ? "Pídele a un dueño que te marque en la finca que atiendes."
                      : "La finca es la base de todo. Créala y quedas asignado automáticamente.",
      puede("editaFinca") ? '<button class="btn btn-firme" data-nuevo="finca">Crear finca</button>' : "")
   : tabla(cols, L.map(f => {
    const n = D.animales.filter(a => a.fincaId === f.id && a.estado === "activo").length;
    const ps = personasDe(f.id);
    return `<tr class="fila" data-finca="${f.id}">
      <td><div class="nom">${esc(f.nombre)}</div></td>
      <td>${esc(f.ubicacion)}</td>
      <td>${ps.length ? ps.map(p => `<span class="p ${ROLES[p.rol].cl}">${esc(p.nombre)}</span>`).join(" ")
                      : '<span class="sub">Sin asignar</span>'}</td>
      <td class="num">${n}</td><td class="flecha">›</td></tr>`;
  }).join(""))}`;
}

/* ---------- PALPACIÓN ---------- */
function vPalpacion() {
  let L = misAnimales().filter(a => a.estado === "activo" && filtroFinca(a.fincaId))
    .map(a => ({ a, e: estado(a), _finca: nombreFinca(a.fincaId) }))
    .filter(x => x.e.fechaPalpacion || x.e.ultPalp)
    .filter(x => busca(idxAnimal(x.a)));

  if (V.sub === "pendiente") L = L.filter(x => x.e.fechaPalpacion);
  if (V.sub === "vencida") L = L.filter(x => x.e.fechaPalpacion && dias(x.e.fechaPalpacion) >= 0);
  L.sort((x, y) => (x.e.fechaPalpacion || "9999").localeCompare(y.e.fechaPalpacion || "9999"));

  const base = misAnimales().filter(a => a.estado === "activo").map(a => estado(a));
  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Tipo"},{et:"Fecha estimada"},{et:"Servicio anterior"},{et:"Última palpación"}];

  return `
  <header class="cab"><div><h1>Palpación</h1>
    <p>La fecha se calcula a ${DIAS_PALPAR} días del servicio. Se palpa para confirmar preñez.</p></div>
    <button class="btn btn-firme" data-nuevo="palpacion">Registrar palpación</button></header>
  <div class="barra">${buscador("Buscar en todo: nombre, chapeta, raza, pajilla, detalles…")}${selectorFinca()}</div>
  ${fichas([["todos","Todas"],["pendiente","Pendientes",base.filter(e=>e.fechaPalpacion).length],
            ["vencida","Vencidas",base.filter(e=>e.fechaPalpacion&&dias(e.fechaPalpacion)>=0).length]])}
  ${tabla(cols, agrupado(L, ({a, e}) => {
    const d = e.fechaPalpacion ? dias(e.fechaPalpacion) : null;
    return `<tr class="fila" data-abrir="${a.id}">
      ${celdaAnimal(a)}
      <td><span class="p ${a.categoria==="novillona"?"ambar":"gris"}">${CATEGORIAS[a.categoria]?.et || "—"}</span></td>
      <td>${e.fechaPalpacion
            ? `${fmt(e.fechaPalpacion)} ${d>=0?`<span class="p roja">vencida ${d}d</span>`:`<span class="sub">en ${-d} d</span>`}`
            : '<span class="sub">—</span>'}</td>
      <td>${e.ultInsem ? `<span class="sub">Última: ${fmt(e.ultInsem.fecha)} · ${esc(e.ultInsem.pajilla)}</span>`
                       : '<span class="sub">Sin registros de servicio</span>'}</td>
      <td>${e.ultPalp
            ? `${fmt(e.ultPalp.fecha)} <span class="p ${e.ultPalp.resultado==="prenada"?"verde":"roja"}">${e.ultPalp.resultado==="prenada"?"Preñada":"Vacía"}</span>`
            : '<span class="sub">—</span>'}</td>
      <td class="flecha">›</td></tr>`;
  }))}`;
}

/* ---------- INSEMINACIONES ---------- */
function vInseminacion() {
  let L = misEventos("inseminaciones").map(i => {
    const a = animal(i.animalId);
    return a ? { i, a, _finca: nombreFinca(a.fincaId) } : null;
  }).filter(Boolean).filter(x => filtroFinca(x.a.fincaId))
    .filter(x => busca(idxInsem(x.i)));
  L.forEach(x => x.c = servicioCalc(x.i));
  if (V.sub !== "todos") L = L.filter(x => x.c.resultado === V.sub);
  L.sort((x, y) => y.i.fecha.localeCompare(x.i.fecha));

  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Fecha"},{et:"N.º intento",num:1},{et:"Pajilla"},{et:"Detalles"},{et:"Estatus servicio"}];
  const todos = misEventos("inseminaciones").map(i => servicioCalc(i).resultado);
  return `
  <header class="cab"><div><h1>Inseminaciones</h1>
    <p>${misEventos("inseminaciones").length} servicios registrados</p></div>
    <button class="btn btn-firme" data-nuevo="inseminacion">Registrar servicio</button></header>
  <div class="barra">${buscador("Buscar en todo: pajilla, toro, intento, estatus…")}${selectorFinca()}</div>
  ${fichas([["todos","Todas",misEventos("inseminaciones").length],
            ...Object.entries(RESULTADOS).map(([k,v])=>[k,v.et,todos.filter(r=>r===k).length])
              .filter(x=>x[2]>0)])}
  ${tabla(cols, agrupado(L, ({i, a, c}) => `<tr class="fila" data-ev="insem:${i.id}">
      ${celdaAnimal(a)}
      <td>${fmtCorto(i.fecha)}</td>
      <td class="num"><span class="apilado">${c.intento}${c.repitio ? "<em>repitió</em>" : ""}</span></td>
      <td>${esc(i.pajilla)}</td>
      <td><span class="sub">${esc(i.detalles)}</span></td>
      <td><span class="p ${RESULTADOS[c.resultado].cl}">${RESULTADOS[c.resultado].et}</span></td>
      <td class="flecha">›</td></tr>`))}`;
}

/* ---------- PARTOS / ABORTOS ---------- */
function vPartos() {
  let L = misEventos("partos").map(p => {
    const a = animal(p.animalId);
    return a ? { p, a, _finca: nombreFinca(a.fincaId) } : null;
  }).filter(Boolean).filter(x => filtroFinca(x.a.fincaId))
    .filter(x => busca(idxParto(x.p)));
  if (V.sub !== "todos") L = L.filter(x => x.p.tipo === V.sub);
  L.sort((x, y) => y.p.fecha.localeCompare(x.p.fecha));

  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Tipo"},{et:"Fecha"},{et:"Detalles"},{et:"Sexo cría"}];
  return `
  <header class="cab"><div><h1>Partos-Abortos</h1>
    <p>${misEventos("partos").filter(p=>p.tipo==="parto").length} partos y ${misEventos("partos").filter(p=>p.tipo==="aborto").length} abortos</p></div>
    <button class="btn btn-firme" data-nuevo="parto">Registrar parto</button></header>
  <div class="barra">${buscador("Buscar en todo: cría, detalles, fecha…")}${selectorFinca()}</div>
  ${fichas([["todos","Todo",misEventos("partos").length],["parto","Parto",misEventos("partos").filter(p=>p.tipo==="parto").length],
            ["aborto","Aborto",misEventos("partos").filter(p=>p.tipo==="aborto").length]])}
  ${tabla(cols, agrupado(L, ({p, a}) => `<tr class="fila" data-ev="parto:${p.id}">
      ${celdaAnimal(a)}
      <td><span class="p ${p.tipo==="parto"?"verde":"roja"}">${p.tipo==="parto"?"Parto":"Aborto"}</span></td>
      <td>${fmtCorto(p.fecha)}</td>
      <td><span class="sub">${esc(p.detalles) || "—"}</span></td>
      <td>${p.sexoCria ? esc(p.sexoCria) : '<span class="sub">—</span>'}</td>
      <td class="flecha">›</td></tr>`))}`;
}

/* ---------- TRATAMIENTOS ---------- */
function vTratamientos() {
  let L = misEventos("tratamientos").map(t => {
    const a = animal(t.animalId);
    return a ? { t, a, _finca: nombreFinca(a.fincaId) } : null;
  }).filter(Boolean).filter(x => filtroFinca(x.a.fincaId))
    .filter(x => busca(idxTrat(x.t)));
  const activo = (t) => t.fin && dias(t.fin) <= 0 && dias(t.inicio) >= 0;
  if (V.sub === "curso") L = L.filter(x => activo(x.t));
  if (V.sub === "final") L = L.filter(x => !activo(x.t));
  L.sort((x, y) => y.t.inicio.localeCompare(x.t.inicio));

  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Tipo tratamiento"},{et:"Inicio"},{et:"Fin"},{et:"Detalles"}];
  return `
  <header class="cab"><div><h1>Tratamientos</h1>
    <p>${misEventos("tratamientos").length} tratamientos registrados</p></div>
    <button class="btn btn-firme" data-nuevo="tratamiento">Registrar tratamiento</button></header>
  <div class="barra">${buscador("Buscar en todo: producto, dosis, fecha…")}${selectorFinca()}</div>
  ${fichas([["todos","Todos",misEventos("tratamientos").length],
            ["curso","En curso",misEventos("tratamientos").filter(activo).length],
            ["final","Terminados",misEventos("tratamientos").filter(t=>!activo(t)).length]])}
  ${tabla(cols, agrupado(L, ({t, a}) => `<tr class="fila" data-ev="trat:${t.id}">
      ${celdaAnimal(a)}
      <td>${esc(t.tipo)} ${activo(t) ? '<span class="p verde">En curso</span>' : ""}</td>
      <td>${fmtCorto(t.inicio)}</td>

      <td><span class="sub">${esc(t.detalles)}</span></td>
      <td class="flecha">›</td></tr>`))}`;
}

/* ---------- PERSONAS (Dueños / Administradores / Empleados) ---------- */
function vPersonas(rol) {
  const R = ROLES[rol];
  let L = misPersonas().filter(p => p.rol === rol)
    .filter(p => busca(idxPersona(p)));
  if (V.finca !== "todas") L = L.filter(p => fincasDe(p.id).some(f => f.id === V.finca));
  if (V.sub === "activos") L = L.filter(p => p.activo !== false);
  if (V.sub === "inactivos") L = L.filter(p => p.activo === false);
  L.sort((a, b) => a.nombre.localeCompare(b.nombre));

  const tot = misPersonas().filter(p => p.rol === rol);
  const cols = [{et:"Nombre"},{et:"Correo"},{et:"Teléfono"},{et:"Fincas"},{et:"Notas"}];

  return `
  <header class="cab"><div><h1>${R.plural}</h1>
    <p>${L.length} de ${tot.length} registrados</p></div>
    ${puede("editaPersona") ? `<button class="btn btn-firme" data-nuevo="persona" data-rol="${rol}">Añadir ${R.et.toLowerCase()}</button>` : ""}</header>
  <div class="barra">${buscador("Buscar nombre, correo, teléfono, finca…")}${selectorFinca()}</div>
  ${fichas([["todos","Todos",tot.length],
            ["activos","Activos",tot.filter(p=>p.activo!==false).length],
            ["inactivos","Inactivos",tot.filter(p=>p.activo===false).length]])}
  ${L.length === 0
    ? vacio(`Sin ${R.plural.toLowerCase()}`, "Añade la primera persona para poder asignarla a una finca.",
        `<button class="btn btn-firme" data-nuevo="persona" data-rol="${rol}">Añadir ${R.et.toLowerCase()}</button>`)
    : tabla(cols, L.map(p => {
        const fs = fincasDe(p.id);
        return `<tr class="fila" data-ev="persona:${p.id}">
          <td><div class="nom">${esc(p.nombre)}${p.activo === false ? ' <span class="p gris">Inactivo</span>' : ""}</div></td>
          <td>${p.correo ? esc(p.correo) : '<span class="sub">—</span>'}</td>
          <td>${p.telefono ? esc(p.telefono) : '<span class="sub">—</span>'}</td>
          <td>${fs.length ? fs.map(f => `<span class="p">${esc(f.nombre)}</span>`).join(" ")
                          : '<span class="sub">Sin asignar</span>'}</td>
          <td><span class="sub">${esc(p.notas) || "—"}</span></td>
          <td class="flecha">›</td></tr>`;
      }).join(""))}`;
}


/* ---------- SECADOS ---------- */
function vSecados() {
  let L = misEventos("secados").map(s => {
    const a = animal(s.animalId);
    return a ? { s, a, _finca: nombreFinca(a.fincaId) } : null;
  }).filter(Boolean)
    .filter(x => filtroFinca(x.a.fincaId))
    .filter(x => busca(idxSecado(x.s)));
  if (V.sub !== "todos") L = L.filter(x => x.s.motivo === V.sub);
  L.sort((x, y) => y.s.fecha.localeCompare(x.s.fecha));

  const tot = misEventos("secados");
  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Fecha"},{et:"Motivo"},{et:"Días de gestación",num:1},{et:"Observaciones"}];

  return `
  <header class="cab"><div><h1>Secados</h1>
    <p>Un secado registrado manda sobre el calendario: la vaca pasa a Seca de inmediato.</p></div>
    <button class="btn btn-firme" data-nuevo="secado">Secar una vaca</button></header>
  <div class="barra">${buscador("Buscar en todo: motivo, observaciones, fecha…")}${selectorFinca()}</div>
  ${fichas([["todos","Todos",tot.length],
            ...Object.entries(MOTIVOS_SECADO).map(([k,v])=>[k,v,tot.filter(s=>s.motivo===k).length])
              .filter(x=>x[2]>0)])}
  ${tabla(cols, agrupado(L, ({s, a}) => {
    // Días de gestación que llevaba el día que la secaron.
    const srv = insemDe(a.id).find(i => i.fecha <= s.fecha);
    const g = srv ? dias(srv.fecha, aFecha(s.fecha)) : null;
    const temprano = g !== null && g < par(a).secarDesde;
    return `<tr class="fila" data-ev="secado:${s.id}">
      ${celdaAnimal(a)}
      <td>${fmtCorto(s.fecha)}</td>
      <td><span class="p ${s.motivo === "ventana" ? "gris" : "ambar"}">${MOTIVOS_SECADO[s.motivo] || "—"}</span></td>
      <td class="num">${g === null ? "—" : `<span class="apilado">${g}${temprano ? "<em>antes de tiempo</em>" : ""}</span>`}</td>
      <td><span class="sub">${esc(s.observaciones) || "—"}</span></td>
      <td class="flecha">›</td></tr>`;
  }))}`;
}

/* ==========================================================
   HOJA MODAL
   ========================================================== */
let hojaAbierta = null;

function abrirHoja(html, ancha) {
  cerrarHoja();
  const d = document.createElement("div");
  d.className = "velo";
  d.innerHTML = `<div class="hoja ${ancha?"ancha":""}" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener("mousedown", e => { if (e.target === d) cerrarHoja(); });
  document.body.appendChild(d);
  document.body.style.overflow = "hidden";   // que el fondo no se desplace
  hojaAbierta = d;
  conectarHoja(d);
  // En móvil no enfocamos solos: abriría el teclado y taparía el formulario.
  if (window.innerWidth > 860) d.querySelector("input,select,textarea")?.focus();
}
function cerrarHoja() {
  hojaAbierta?.remove();
  hojaAbierta = null;
  document.body.style.overflow = "";
}
function avisar(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function persistir(msg) {
  recalcularAccesos();   // cada evento debe llevar su fincaId para las reglas
  guardar(); cerrarHoja(); pintar(); if (msg) avisar(msg);
}

const opFincas = (sel) => misFincasObj().map(f =>

function fichaAnimal(id) {
  const a = animal(id); if (!a) return;
  const e = estado(a);
  const P = par(a);
  const et = ETAPAS[e.etapa];
  const insems = insemDe(id), partos = partosDe(id), palps = palpDe(id), trats = tratDe(id);
  const abortos = partos.filter(p => p.tipo === "aborto").length;

    ? `<img src="${a.foto}" alt="Foto de ${esc(a.nombre)}">

    : `<div class="sinfoto" data-foto="${id}">
         <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">

         <span>Añadir foto</span></div>`;

  abrirHoja(`
    <div class="hoja-cab">
      <h2 style="font-size:16px">Ficha del animal</h2>
      <button class="cerrar" data-cerrar aria-label="Cerrar">×</button>
    </div>
    <div class="hoja-cuerpo">
      ${a.estado !== "activo" ? `<div class="aviso">${a.estado === "vendido" ? "Vendido" : "Muerto"} el ${fmt(a.fechaSalida)}. ${esc(a.motivoSalida)}</div>` : ""}

      <div class="ficha-top">
        <div class="retrato">${foto}</div>
        <div class="ficha-id">
          <span class="chap ${a.estado !== "activo" ? "gris" : ""}">${esc(a.chapeta)}</span>
          <h2>${esc(a.nombre)}</h2>
          <div class="meta">${esc(nombreFinca(a.fincaId))}${a.fechaNacimiento ? ` · nació el ${fmt(a.fechaNacimiento)}` : ""}${e.edadMeses !== null ? ` · ${e.edadMeses} meses` : ""}</div>
          <div class="tags">
            <span class="p ${et.cl}">${et.et}</span>
            <span class="p">${CATEGORIAS[a.categoria]?.et || a.categoria}</span>
            ${a.raza ? `<span class="p">${esc(a.raza)}</span>` : ""}
          </div>
        </div>
      </div>

      <ul class="medidas">
        <li><dt>Meses vacía</dt><dd class="g">${e.mesesVacia}</dd></li>
        <li><dt>Meses gestación</dt><dd class="g">${e.gestacion}</dd></li>
        <li><dt>Estado productivo</dt><dd>${et.et}${e.secadoActual
          ? ` <span class="sub">secada a mano</span>` : ""}</dd></li>
        <li><dt>Total partos</dt><dd class="g">${e.totalPartos}</dd></li>
        <li><dt>Total abortos</dt><dd class="g">${abortos}</dd></li>
        <li><dt>Alerta celo</dt><dd>${e.alertaCelo
          ? `<span class="p ${e.alertaCelo.nivel === "alta" ? "roja" : "ambar"}">${e.alertaCelo.texto}</span>`
          : "—"}</dd></li>
        <li><dt>Total inseminaciones</dt><dd class="g">${e.totalInsemCiclo}</dd>
          ${e.totalInsemHistorico !== e.totalInsemCiclo ? `<span class="sub">${e.totalInsemHistorico} en total</span>` : ""}</li>
        <li class="${e.ultPartoReal && !e.ultPartoReal.previo ? "liga" : ""}" ${e.ultPartoReal && !e.ultPartoReal.previo ? `data-ev="parto:${e.ultPartoReal.id}"` : ""}>
          <dt>Fecha parto</dt><dd>${e.ultPartoReal ? fmt(e.ultPartoReal.fecha) : "—"}</dd></li>
        <li class="${e.ultInsem ? "liga" : ""}" ${e.ultInsem ? `data-ev="insem:${e.ultInsem.id}"` : ""}>
          <dt>Fecha inseminación</dt><dd>${e.ultInsem ? fmt(e.ultInsem.fecha) : "—"}</dd></li>
        <li><dt>${e.motivoDias === "repeticion" ? "Días entre servicios" : "Días parto → servicio"}</dt>

        <div><dt>Faltan</dt><dd>${Math.max(0, P.gestacion - e.diasGest)} días</dd></div>

            <td>${esc(i.pajilla) || "—"}</td><td><span class="sub">${esc(i.detalles) || "—"}</span></td>

      ${subTabla("Partos-Abortos", partos.length,
        `<button class="btn btn-sm" data-nuevo="parto" data-an="${id}">Añadir</button>`,
        ["Fecha","Tipo","Sexo cría","Detalles"],
        partos.map(p => `<tr class="fila" data-ev="parto:${p.id}">
            <td>${fmtCorto(p.fecha)}</td>
            <td><span class="p ${p.tipo === "parto" ? "verde" : "roja"}">${p.tipo === "parto" ? "Parto" : "Aborto"}</span></td>

      ${subTabla("Palpaciones", palps.length,
        `<button class="btn btn-sm" data-nuevo="palpacion" data-an="${id}">Añadir</button>`,
        ["Fecha","Resultado","Días gestación","Observaciones"],
        palps.map(p => `<tr class="fila" data-ev="palp:${p.id}">
            <td>${fmtCorto(p.fecha)}</td>
            <td><span class="p ${p.resultado === "prenada" ? "verde" : "roja"}">${p.resultado === "prenada" ? "Preñada" : "Vacía"}</span></td>
            <td class="num">${p.diasGestacion || "—"}</td><td><span class="sub">${esc(p.observaciones) || "—"}</span></td></tr>`).join(""))}

      ${!P.lechero && secadosDe(id).length === 0 ? "" : subTabla("Secados", secadosDe(id).length,
        `<button class="btn btn-sm" data-nuevo="secado" data-an="${id}">Añadir</button>`,
        ["Fecha","Motivo","Observaciones"],
        secadosDe(id).map(x => `<tr class="fila" data-ev="secado:${x.id}">
            <td>${fmtCorto(x.fecha)}</td><td>${MOTIVOS_SECADO[x.motivo] || "—"}</td>
            <td><span class="sub">${esc(x.observaciones) || "—"}</span></td></tr>`).join(""))}

      ${subTabla("Tratamientos", trats.length,
        `<button class="btn btn-sm" data-nuevo="tratamiento" data-an="${id}">Añadir</button>`,
        ["Inicio","Fin","Tipo","Detalles"],
        trats.map(t => `<tr class="fila" data-ev="trat:${t.id}">
            <td>${fmtCorto(t.inicio)}</td><td>${t.fin ? fmtCorto(t.fin) : "—"}</td>

    </div>
    <div class="hoja-pie">

function subTabla(titulo, n, boton, cols, filas) {
  return `<div class="seccion"><h3>${titulo} <span class="p gris">${n}</span>${boton}</h3>

      <thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${filas}</tbody></table></div>`}</div>`;
}

          <datalist id="razas">${razas.map(r=>`<option value="${esc(r)}">`).join("")}</datalist></div>

        <!-- Solo para Vaca: historia previa a la app -->
        <div class="campo ancho" data-solo-vaca hidden>
          <div class="nota" style="margin:0">Como es una hembra adulta, trae historia. Estos dos datos arrancan
          los contadores sin tener que digitar todos los partos viejos uno por uno.</div></div>
        <div class="campo" data-solo-vaca hidden><label>Partos anteriores</label>
          <input type="number" min="0" name="partosPrevios" value="${a.partosPrevios||0}">
          <span class="ayuda">Los que tuvo antes de entrar a la app</span></div>
        <div class="campo" data-solo-vaca hidden><label>Fecha del último parto</label>
          <input type="date" name="ultimoPartoPrevio" value="${a.ultimoPartoPrevio||""}">
          <span class="ayuda">Desde aquí cuentan los días vacía</span></div>

        <div class="campo"><label>Estado</label><select name="estado">
          ${[["activo","En el hato"],["vendido","Vendido"],["muerto","Muerto"]].map(([v,t])=>`<option value="${v}" ${a.estado===v?"selected":""}>${t}</option>`).join("")}
        </select></div>
        <div class="campo"><label>Fecha de salida</label><input type="date" name="fechaSalida" value="${a.fechaSalida||""}">
          <span class="ayuda">Solo si fue vendido o murió</span></div>
        <div class="campo ancho"><label>Motivo de salida</label><input name="motivoSalida" value="${esc(a.motivoSalida)}"></div>
        <div class="campo ancho"><label>Detalles</label><textarea name="detalles">${esc(a.detalles)}</textarea></div>
      </div></div>
      <div class="hoja-pie">
        ${id && puede("borra") ? '<button type="button" class="btn btn-baja" data-borrar="animal:'+id+'">Eliminar</button>' : ""}
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-firme">${id ? "Guardar cambios" : "Añadir"}</button>
      </div></form>`);

  // Especie manda: la categoría se repuebla y los campos de historia
  // solo salen en hembras adultas, que son las que traen partos.
  const selEsp = hojaAbierta.querySelector("[data-esp]");
  const selCat = hojaAbierta.querySelector("[data-cat]");
  const ayuda  = hojaAbierta.querySelector("[data-gest]");

  const poblar = (mantener) => {
    const esp = selEsp.value;
    const ops = Object.entries(CATEGORIAS).filter(([, c]) => c.especie === esp);
    selCat.innerHTML = ops.map(([k, c]) => `<option value="${k}">${c.et}</option>`).join("");
    const previa = mantener && ops.some(([k]) => k === a.categoria) ? a.categoria : null;
    selCat.value = previa || ops.find(([, c]) => c.etapa === "adulta")?.[0] || ops[0][0];
    const p = parEspecie(esp);
    ayuda.textContent = `Gesta ${p.gestacion} días · palpación a los ${p.palpar}` +
      (p.lechero ? ` · secado del día ${p.secarDesde} al ${p.secarHasta}` : " · no lechera");
    alternar();
  };
  const alternar = () => {
    const c = CATEGORIAS[selCat.value];
    const traeHistoria = c && c.sexo === "H" && c.etapa === "adulta";
    hojaAbierta.querySelectorAll("[data-solo-vaca]").forEach(el => el.hidden = !traeHistoria);
  };
  selEsp.onchange = () => poblar(false);
  selCat.onchange = alternar;
  poblar(true);
}

   ========================================================== */

const COLECCIONES = ["fincas", "personas", "animales", "inseminaciones",
                     "palpaciones", "partos", "secados", "tratamientos", "anotaciones"];

const FB = {
  mods: null, app: null, db: null, auth: null, user: null,
  estado: "apagado",   // apagado | cargando | listo | error
  error: "", escuchas: [], espejo: {}, aplicando: false, pendiente: null,
};

const SDK = "https://www.gstatic.com/firebasejs/10.13.0/";
const enArchivoLocal = () => location.protocol === "file:";

async function cargarSDK() {
  if (FB.mods) return FB.mods;
  const [app, auth, fs] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-auth.js"),
    import(SDK + "firebase-firestore.js"),
  ]);
  FB.mods = { app, auth, fs };
  return FB.mods;
}

/** Traduce los códigos de Firebase a algo accionable. */
function errorFB(e) {
  const c = e?.code || String(e);
  const mapa = {
    "auth/invalid-email": "El correo no tiene un formato válido.",
    "auth/user-not-found": "No existe una cuenta con ese correo. Créala en Authentication → Users.",
    "auth/wrong-password": "La contraseña no coincide.",
    "auth/invalid-credential": "El correo o la contraseña no coinciden.",
    "auth/too-many-requests": "Demasiados intentos. Espera unos minutos.",
    "auth/network-request-failed": "Sin conexión a internet.",
    "auth/operation-not-allowed": "Falta habilitar Correo/contraseña en Authentication → Sign-in method.",
    "auth/invalid-api-key": "La apiKey no es válida. Revisa que la pegaste completa.",
    "permission-denied": "Las reglas de Firestore rechazaron la operación. Revisa el paso 3 de esta página.",
    "unavailable": "No se pudo llegar a Firestore. Revisa la conexión.",
    "failed-precondition": "Falta crear la base de datos en Firestore. Ve a Firestore Database → Crear base de datos.",
  };
  for (const k in mapa) if (c.includes(k)) return mapa[k];
  if (String(e).includes("Failed to fetch") || String(e).includes("dynamically imported"))
    return "No se pudo descargar el SDK de Firebase. Si abriste el archivo con doble clic, " +
           "el navegador lo bloquea: publícalo en un servidor o en GitHub Pages.";
  return e?.message || String(e);
}

/* ---------- conectar ---------- */
async function conectarFirebase(silencioso) {
  const cfg = D.config.firebase;
  if (!cfg || !cfg.apiKey || !cfg.projectId) { FB.estado = "apagado"; return; }

  FB.estado = "cargando"; FB.error = "";
  if (!silencioso) pintar();

  try {
    const { app, auth, fs } = await cargarSDK();
    if (!FB.app) {
      FB.app = app.initializeApp(cfg);
      FB.auth = auth.getAuth(FB.app);
      try {
        FB.db = fs.initializeFirestore(FB.app, {
          localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
        });
      } catch { FB.db = fs.getFirestore(FB.app); }

      // Si volvió de Google por redirección, recoger el resultado.
      auth.getRedirectResult(FB.auth).catch(() => {});
      // Si llegó por un enlace de invitación, terminar de entrarlo.
      completarEnlace().catch(() => {});

      auth.onAuthStateChanged(FB.auth, (u) => {
        FB.user = u;
        if (u) { vincularUsuario(u.email); escucharTodo(); }
        else { pararTodo(); S.persona = null; S.modo = null; }
        pintar();
      });
    }
    FB.estado = "listo";
  } catch (e) {
    FB.estado = "error"; FB.error = errorFB(e);
  }
  pintar();
}

async function entrarFirebase(correo, clave, registrar) {
  const { auth } = await cargarSDK();
  const fn = registrar ? auth.createUserWithEmailAndPassword : auth.signInWithEmailAndPassword;
  await fn(FB.auth, correo, clave);
  D.config.correo = correo;
  guardarLocal();
}

async function salirFirebase() {
  const { auth } = await cargarSDK();
  await auth.signOut(FB.auth);
}

function pararEscuchas() {
  FB.escuchas.forEach(f => { try { f(); } catch {} });
  FB.escuchas = [];
}

function pararTodo() {
  pararEscuchas();
  try { FB.escuchaUsuario?.(); } catch {}
  FB.escuchaUsuario = null;
  FB.claveFincas = null;
}

/* ---------- escuchar cambios remotos ----------
   Las consultas van filtradas por finca a propósito: si pidiéramos la
   colección entera, Firestore la rechazaría por no poder demostrar que
   el usuario alcanza todos los documentos. */

/** Observa mi propio documento de usuario. Cuando cambian mis fincas
    —por ejemplo al crear la primera— vuelve a suscribir las colecciones. */
function escucharTodo() {
  if (FB.escuchaUsuario) return;
  const { fs } = FB.mods;
  const correo = FB.user.email.toLowerCase();

  FB.escuchaUsuario = fs.onSnapshot(fs.doc(FB.db, "usuarios", correo),
    (snap) => {
      if (!snap.exists()) {
        // El correo entró bien pero nadie lo autorizó: fuera.
        return rechazarAcceso(correo);
      }
      const datos = snap.data();
      FB.rolRemoto = datos.rol || null;
      const mias = (datos.fincas || []).filter(Boolean);
      const clave = JSON.stringify(mias.slice().sort());
      if (clave === FB.claveFincas) return;    // nada cambió
      FB.claveFincas = clave;
      escucharColecciones(mias);
    },
    (e) => { FB.estado = "error"; FB.error = errorFB(e); pintar(); });
}

function escucharColecciones(mias) {
  pararEscuchas();
  limpiarSiCambioDeUsuario(FB.user.email);
  const { fs } = FB.mods;

  if (!mias.length) {
    // Todavía sin fincas: normal recién creada la cuenta.
    FB.estado = "listo";
    FB.error = "";
    asegurarPersona(FB.user.email);
    return pintar();
  }

  // Firestore admite hasta 30 valores en un "in".
  const trozo = mias.slice(0, 30);
  if (mias.length > 30) {
    FB.error = `Tienes ${mias.length} fincas y Firestore solo consulta 30 a la vez. ` +
               `Se están mostrando las primeras 30.`;
  }

  const escuchar = (nombre, consulta) => {
    const u = fs.onSnapshot(consulta,
      (snap) => {
        FB.aplicando = true;
        const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        FB.espejo[nombre] = {};
        docs.forEach(d => FB.espejo[nombre][d.id] = JSON.stringify(d));
        D[nombre] = docs;
        guardarLocal();
        FB.aplicando = false;
        if (nombre === "personas") asegurarPersona(FB.user.email);
        else if (S.persona) S.persona = D.personas.find(p => p.id === S.persona.id) || S.persona;
        pintar();
      },
      (e) => { FB.estado = "error"; FB.error = errorFB(e); pintar(); });
    FB.escuchas.push(u);
  };

  const col = (n) => fs.collection(FB.db, n);
  escuchar("fincas", fs.query(col("fincas"), fs.where(fs.documentId(), "in", trozo)));
  escuchar("personas", fs.query(col("personas"), fs.where("fincas", "array-contains-any", trozo)));
  for (const n of ["animales", "inseminaciones", "palpaciones", "partos",
                   "secados", "tratamientos", "anotaciones"]) {
    escuchar(n, fs.query(col(n), fs.where("fincaId", "in", trozo)));
  }

  FB.estado = "listo";
  pintar();
  // La configuración se queda local: cada equipo tiene la suya.
}

/** Mantiene /usuarios en Firestore al día con las asignaciones de la app. */
async function sincronizarUsuarios() {
  if (!FB.db || !FB.user || !manda()) return;
  const { fs } = FB.mods;
  try {
    const lote = fs.writeBatch(FB.db);
    let n = 0;
    for (const p of D.personas) {
      if (!p.correo) continue;
      lote.set(fs.doc(FB.db, "usuarios", p.correo.toLowerCase()),
               { rol: p.rol, fincas: p.fincas || [], persona: p.id }, { merge: true });
      n++;
    }
    if (n) await lote.commit();
  } catch (e) { console.warn("usuarios:", errorFB(e)); }
}

/* ---------- empujar cambios locales ---------- */
function programarEmpuje() {
  if (!FB.db || !FB.user || FB.aplicando) return;
  clearTimeout(FB.pendiente);
  FB.pendiente = setTimeout(empujar, 700);
}

async function empujar() {
  if (!FB.db || !FB.user) return;
  const { fs } = FB.mods;
  const cambios = [];

  for (const nombre of COLECCIONES) {
    const espejo = FB.espejo[nombre] || {};
    const vistos = new Set();
    for (const doc of (D[nombre] || [])) {
      vistos.add(doc.id);
      const json = JSON.stringify(doc);
      if (espejo[doc.id] !== json) cambios.push(["set", nombre, doc.id, doc]);
    }
    for (const id in espejo) if (!vistos.has(id)) cambios.push(["del", nombre, id]);
  }
  if (!cambios.length) return sincronizarUsuarios();


  try {
    // Firestore acepta máximo 500 operaciones por lote.
    for (let i = 0; i < cambios.length; i += 450) {
      const lote = fs.writeBatch(FB.db);
      for (const [op, col, id, doc] of cambios.slice(i, i + 450)) {
        const ref = fs.doc(FB.db, col, id);
        if (op === "set") { const { id: _, ...resto } = doc; lote.set(ref, resto); }
        else lote.delete(ref);
      }
      await lote.commit();
    }
    await sincronizarUsuarios();
  } catch (e) {
    FB.estado = "error"; FB.error = errorFB(e); pintar();
  }
}

/** Primera vez: manda todo lo que hay en el equipo a Firestore. */
async function subirTodo() {
  if (!FB.user) return alert("Primero inicia sesión.");
  if (!confirm("Se van a subir todos los datos de este equipo a Firebase. ¿Continuar?")) return;
  FB.espejo = {};
  recalcularAccesos();
  await empujar();
  await sincronizarUsuarios();
  avisar("Datos subidos a Firebase");
}

function desconectarFirebase() {
  if (!confirm("La app vuelve a trabajar solo en este equipo. Los datos en Firebase no se borran. ¿Continuar?")) return;
  pararTodo();
  D.config.firebase = null;
  D.config.sinFirebase = true;   // que no vuelva a entrar la del archivo
  FB.app = null; FB.db = null; FB.auth = null; FB.user = null;
  FB.estado = "apagado"; FB.espejo = {};
  guardarLocal(); pintar(); avisar("Desconectado de Firebase");
}

/** Acepta el objeto pegado tal cual sale de la consola de Firebase. */
function leerConfigPegada(txt) {
  const t = txt.trim();
  if (!t) return null;
  try { return JSON.parse(t); } catch {}
  const campos = ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId"];
  const out = {};
  for (const c of campos) {
    const m = t.match(new RegExp(c + '\\s*:\\s*["\'`]([^"\'`]+)["\'`]'));
    if (m) out[c] = m[1];
  }
  return out.apiKey && out.projectId ? out : null;
}


/* ==========================================================
   GENERAR EL ARCHIVO PARA PUBLICAR
   Toma la app tal como está, le incrusta la configuración de
   Firebase y la descarga. Ese archivo es el que subes a GitHub
   para que todos abran la misma base.
   ========================================================== */
function generarArchivoPublicable() {
  const cfg = D.config.firebase;
  if (!cfg || !cfg.apiKey) {
    return alert("Primero pega y guarda la configuración de Firebase, arriba en esta página.");
  }
  if (!confirm(
    "Se va a generar una copia de la app con la configuración de Firebase adentro.\n\n" +
    "Antes de publicarla asegúrate de haber publicado las reglas de seguridad (paso 4) " +
    "y de tener la colección 'usuarios' creada (paso 5).\n\n" +
    "Sin las reglas, cualquiera que abra el enlace podría leer los datos de la finca.\n\n" +
    "¿Continuar?")) return;

  try {
    // Copiamos el documento y le quitamos lo que la app haya pintado,
    // para que el archivo salga limpio.
    const clon = document.documentElement.cloneNode(true);
    const app = clon.querySelector("#app");
    if (app) app.innerHTML = "";
    clon.querySelectorAll(".velo, .toast").forEach(e => e.remove());

    let html = "<!doctype html>\n" + clon.outerHTML;

    // El marcador va escapado dentro de la expresión, así que este mismo
    // archivo no se confunde a sí mismo. Y replace sin /g cambia solo la
    // primera coincidencia, que siempre es la declaración del principio.
    const marca = /let CONFIG_INCLUIDA = [^;]*; \/\*\[\[CONFIG-FIREBASE\]\]\*\//;
    if (!marca.test(html)) {
      return alert("No encontré la línea de configuración en el archivo. " +
                   "Puede que estés usando una copia modificada a mano.");
    }
    html = html.replace(marca,
      "let CONFIG_INCLUIDA = " + JSON.stringify(cfg) + "; /*[[" + "CONFIG-FIREBASE]]*/");

    const b = new Blob([html], { type: "text/html;charset=utf-8" });
    const u = URL.createObjectURL(b);
    const el = document.createElement("a");
    el.href = u; el.download = "index.html";
    el.click(); URL.revokeObjectURL(u);
    avisar("Archivo generado. Súbelo a GitHub como index.html");
  } catch (e) {
    alert("No se pudo generar el archivo: " + e.message);
  }
}

  } catch {}
  return window.navigator.standalone === true;
}

window.addEventListener("beforeinstallprompt", (e) => {

  promptInstalar = e;
  pintar();
});
window.addEventListener("appinstalled", () => { promptInstalar = null; pintar(); });

/* ==========================================================
   FORMAS DE ENTRAR
   Contraseña, cuenta de Google, o enlace enviado al correo.
   El enlace es el que sirve para invitar gente nueva: crea la
   cuenta sin tumbar la sesión de quien invita.
   ========================================================== */

/** Si en este equipo estuvo otra persona, se borra su caché antes de sincronizar. */
function limpiarSiCambioDeUsuario(correo) {
  const c = (correo || "").toLowerCase();
  if ((D.config.sesionDe || "") === c) return;
  for (const col of COLECCIONES) D[col] = [];
  FB.espejo = {};
  D.config.sesionDe = c;
  guardarLocal();
}

const ajustesEnlace = () => ({
  url: location.origin + location.pathname,
  handleCodeInApp: true,
});
const CLAVE_INVITADO = CLAVE + "-invitado";

/** Manda el enlace de acceso. Si la cuenta no existe, la crea al abrirlo. */
async function invitarPorCorreo(correo) {
  if (!FB.auth) throw new Error("Firebase no está conectado.");
  const { auth } = await cargarSDK();
  const c = correo.trim().toLowerCase();
  await auth.sendSignInLinkToEmail(FB.auth, c, ajustesEnlace());
  return c;
}

/** Si la persona llegó por el enlace, termina de entrarla. */
async function completarEnlace() {
  const { auth } = FB.mods;
  if (!auth.isSignInWithEmailLink(FB.auth, location.href)) return false;

  let correo = null;
  try { correo = localStorage.getItem(CLAVE_INVITADO); } catch {}
  if (!correo) {
    correo = prompt("Para terminar de entrar, confirma tu correo:");
    if (!correo) return false;
  }
  try {
    await auth.signInWithEmailLink(FB.auth, correo.trim().toLowerCase(), location.href);
    try { localStorage.removeItem(CLAVE_INVITADO); } catch {}
    history.replaceState(null, "", location.pathname);
    S.reciénInvitado = true;
    return true;
  } catch (e) {
    S.error = errorFB(e);
    history.replaceState(null, "", location.pathname);
    return false;
  }
}

async function entrarConGoogle() {
  const { auth } = await cargarSDK();
  const prov = new auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  try {
    await auth.signInWithPopup(FB.auth, prov);
  } catch (e) {
    const c = e?.code || "";
    if (/popup-blocked|popup-closed|cancelled-popup|operation-not-supported/.test(c)) {
      await auth.signInWithRedirect(FB.auth, prov);
      return;
    }
    throw e;
  }
}

/** Correo para restablecer la contraseña de una cuenta que ya existe. */
async function enviarReinicio(correo) {
  const { auth } = await cargarSDK();
  await auth.sendPasswordResetEmail(FB.auth, correo.trim().toLowerCase());
}

/** Le pone contraseña a quien entró por enlace o por Google. */
async function definirClave(nueva) {
  const { auth } = FB.mods;
  await auth.updatePassword(FB.auth.currentUser, nueva);
}

/**
 * Cierra la sesión de quien no está en la lista de autorizados y le explica
 * por qué. Sin esto quedaría dentro viendo una pantalla vacía.
 */
async function rechazarAcceso(correo) {
  pararTodo();
  try { await salirFirebase(); } catch {}
  S.persona = null; S.modo = null; S.modoAcceso = "entrar"; S.aviso = "";
  S.error = `La cuenta ${correo} existe, pero no está autorizada en esta finca. ` +
            `Pídele al dueño que te registre con ese mismo correo y te asigne a una finca.`;
  FB.estado = "listo"; FB.error = "";
  pantallaAcceso();
}

/** Con qué método entró la persona. */
function metodoAcceso() {
  const u = FB.auth?.currentUser;
  if (!u) return null;
  const p = u.providerData.map(x => x.providerId);
  if (p.includes("google.com")) return "google";
  if (p.includes("password")) return "clave";
  return "enlace";
}

/* ==========================================================
   ACTUALIZACIONES
   GitHub Pages pide guardar el HTML unos minutos, así que la
   versión nueva no llega sola. Se consulta el archivo saltando
   la caché y se avisa si cambió.
   ========================================================== */

let VERSION_NUEVA = null;
let ultimaRevision = 0;

async function buscarActualizacion(manual) {
  if (!location.protocol.startsWith("http")) {
    if (manual) alert("Solo se puede buscar actualizaciones con la app publicada en internet.");
    return null;
  }
  const ahora = Date.now();
  if (!manual && ahora - ultimaRevision < 120000) return null;   // como mucho cada 2 minutos
  ultimaRevision = ahora;

  try {
    const r = await fetch(location.pathname + "?v=" + ahora, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const html = await r.text();
    const m = html.match(/const VERSION = "([^"]+)"/);
    if (!m) throw new Error("sin versión");

    if (m[1] !== VERSION) {
      VERSION_NUEVA = m[1];
      pintar();
      return m[1];
    }
    VERSION_NUEVA = null;
    if (manual) avisar(`Ya tienes la versión más reciente (${VERSION})`);
    return null;
  } catch (e) {
    if (manual) alert("No se pudo consultar: " + (e.message || e));
    return null;
  }
}

/** Borra todo lo guardado del archivo y recarga. Los datos no se tocan. */
async function aplicarActualizacion() {
  try {
    if (window.caches) {
      const claves = await caches.keys();
      await Promise.all(claves.map(k => caches.delete(k)));
    }
    const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
    await Promise.all(regs.map(r => r.update().catch(() => {})));
  } catch {}
  location.replace(location.pathname + "?v=" + Date.now());
}

// Al abrir y al volver a la pestaña, revisar si hay versión nueva.
if (location.protocol.startsWith("http")) {
  setTimeout(() => buscarActualizacion(false), 4000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) buscarActualizacion(false);
  });
}

/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */

const REGLAS = `rules_version = '2';

// Control Ganadero — cada quien solo ve sus fincas.
// El permiso sale de /usuarios/{correo}, que lleva el rol y la
// lista de fincas asignadas. La app mantiene esos documentos sola.

service cloud.firestore {
  match /databases/{database}/documents {

    function yo() {
      return get(/databases/$(database)/documents/usuarios/$(request.auth.token.email)).data;
    }
    function registrado() {
      return request.auth != null
        && exists(/databases/$(database)/documents/usuarios/$(request.auth.token.email));
    }
    function misFincas()  { return yo().fincas; }
    function rol()        { return yo().rol; }
    function manda()      { return rol() == 'dueno' || rol() == 'administrador'; }
    function esDueno()    { return rol() == 'dueno'; }

    // El documento pertenece a una finca que tengo asignada.
    function mia()        { return resource.data.fincaId in misFincas(); }
    function seraMia()    { return request.resource.data.fincaId in misFincas(); }

    // ---- quién puede entrar y a qué fincas ----
    match /usuarios/{correo} {
      allow read:  if request.auth != null
                   && (correo == request.auth.token.email || (registrado() && manda()));
      allow write: if registrado() && manda();
    }

    // ---- fincas: solo las asignadas ----
    match /fincas/{id} {
      allow read:   if registrado() && id in misFincas();
      allow create: if registrado() && manda();
      allow update: if registrado() && manda() && id in misFincas();
      allow delete: if registrado() && esDueno() && id in misFincas();
    }

    // ---- personal: solo quien comparte finca conmigo ----
    match /personas/{id} {
      allow read:   if registrado() && (
                      (manda() && resource.data.fincas.hasAny(misFincas()))
                      || resource.data.correo == request.auth.token.email);
      allow create: if registrado() && manda();
      allow update: if registrado() && manda();
      allow delete: if registrado() && manda();
    }

    // ---- ganado y sus eventos: filtrados por finca ----
    match /animales/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();

      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /palpaciones/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /partos/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /secados/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /tratamientos/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();

    match /anotaciones/{id} {

      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /{document=**} { allow read, write: if false; }
  }
}`;

}

function etiquetarTablas(raiz) {
  (raiz || document).querySelectorAll("table").forEach(t => {
    const enc = [...t.querySelectorAll("thead th")].map(th => th.textContent.trim());
    if (!enc.length) return;
    t.querySelectorAll("tbody tr").forEach(tr => {
      if (tr.classList.contains("grupo")) return;
      [...tr.children].forEach((td, i) => {
        if (enc[i] && !td.classList.contains("flecha")) td.setAttribute("data-label", enc[i]);
      });
    });
  });
}

/** Reduce la foto antes de guardarla: si no, el navegador se llena. */
function comprimirFoto(file, max = 640, calidad = 0.62) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h > max) { w = Math.round(w * max / h); h = max; }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", calidad));
      };
      img.onerror = () => rej(new Error("imagen"));
      img.src = r.result;
    };
    r.onerror = () => rej(new Error("lectura"));
    r.readAsDataURL(file);
  });
}

function pedirFoto(animalId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      animal(animalId).foto = await comprimirFoto(f);
      guardar(); fichaAnimal(animalId); avisar("Foto guardada");
    } catch { alert("No se pudo leer esa imagen. Intenta con otra."); }
  };
  inp.click();
}

    const i = b.dataset.quitafoto;
    if (!confirm("¿Quitar la foto?")) return;
    animal(i).foto = null; guardar(); fichaAnimal(i);
  });
  d.querySelectorAll("[data-ev]").forEach(el => el.onclick = () => {
    const [t, i] = el.dataset.ev.split(":"); ABRIR_EV[t](i);
  });

  d.querySelectorAll("[data-nuevo]").forEach(el =>

    const [t, id] = b.dataset.editar.split(":");
    (t === "animal" ? formAnimal : formFinca)(id);
  });

  d.querySelectorAll("[data-borrar]").forEach(b => b.onclick = () => {
    const [t, id] = b.dataset.borrar.split(":");
    borrar(t, id);
  });

  etiquetarTablas(d);

  d.querySelectorAll("[data-invitar]").forEach(b => b.onclick = async () => {
    const c = b.dataset.invitar;
    if (!FB.user) return alert("Necesitas estar conectado a Firebase para enviar invitaciones.");
    if (!confirm(`¿Enviarle a ${c} el enlace para entrar a la app?`)) return;
    b.disabled = true; b.textContent = "Enviando…";
    try {
      await invitarPorCorreo(c);
      b.textContent = "Invitación enviada";
      avisar(`Enlace enviado a ${c}`);
    } catch (e) {
      b.disabled = false; b.textContent = "Enviarle la invitación";
      alert("No se pudo enviar: " + errorFB(e) +
        "\n\nSi dice que falta habilitar el método, ve a Authentication → Método de acceso " +
        "y activa 'Vínculo del correo electrónico' dentro de Correo/contraseña.");
    }
  });

  const fc = d.querySelector("form[data-clave]");
  if (fc) fc.onsubmit = async (e) => {
    e.preventDefault();
    const v = datos(fc);
    if (v.clave.length < 6) return error(fc, "La contraseña debe tener al menos 6 caracteres.");
    if (v.clave !== v.clave2) return error(fc, "Las dos contraseñas no coinciden.");
    try {
      await definirClave(v.clave);
      cerrarHoja(); avisar("Contraseña guardada. Ya puedes entrar con ella.");
    } catch (err) {
      error(fc, errorFB(err) + " Si pide volver a entrar, cierra sesión y usa el enlace otra vez.");
    }
  };

  const f = d.querySelector("form[data-guardar]");
  if (f) f.onsubmit = (e) => { e.preventDefault(); enviar(f); };
}

function datos(f) {
  const o = {};
  const fd = new FormData(f);
  fd.forEach((v, k) => o[k] = typeof v === "string" ? v.trim() : v);
  if (f.querySelector('[name=personas]')) o.personas = fd.getAll("personas");
  return o;
}
function error(f, msg) {
  const a = f.querySelector("[data-error]");
  a.textContent = msg; a.hidden = false;
}

function enviar(f) {
  const [tipo, id] = f.dataset.guardar.split(":");
  const v = datos(f);

  if (tipo === "animal") {
    v.partosPrevios = Number(v.partosPrevios) || 0;
    v.ultimoPartoPrevio = v.ultimoPartoPrevio || null;
    delete v.especie;   // se deriva de la categoría
    const cat = CATEGORIAS[v.categoria];
    if (!cat || cat.sexo !== "H" || cat.etapa !== "adulta") {
      v.partosPrevios = 0; v.ultimoPartoPrevio = null;
    }
    if (D.animales.some(a => a.chapeta === v.chapeta && a.id !== id))
      return error(f, `La chapeta ${v.chapeta} ya está registrada.`);
    if (v.estado !== "activo" && !v.fechaSalida)
      return error(f, "Pon la fecha de salida para un animal vendido o muerto.");
    if (id) Object.assign(animal(id), v);
    else D.animales.push({ id: uid(), ...v });
    return persistir(id ? "Animal actualizado" : "Animal añadido");
  }

  if (tipo === "finca") {
    v.personas = v.personas || [];
    if (id) Object.assign(finca(id), v);
    else D.fincas.push({ id: uid(), ...v });
    return persistir("Finca guardada");
  }

  if (tipo === "persona") {
    v.activo = v.activo !== "no";
    if (v.correo && D.personas.some(p => p.correo && p.correo.toLowerCase() === v.correo.toLowerCase() && p.id !== id))
      return error(f, `Ya hay una persona con el correo ${v.correo}.`);
    if (id) Object.assign(persona(id), v);
    else D.personas.push({ id: uid(), ...v });
    return persistir("Persona guardada");
  }

  if (tipo === "insem") {
    // intento y estatus no se guardan: se calculan al mostrar.
    if (id) Object.assign(D.inseminaciones.find(x => x.id === id), v);
    else D.inseminaciones.push({ id: uid(), ...v });
    return persistir("Servicio registrado");
  }

  if (tipo === "palp") {
    v.diasGestacion = v.diasGestacion ? Number(v.diasGestacion) : null;
    if (id) Object.assign(D.palpaciones.find(x => x.id === id), v);
    else D.palpaciones.push({ id: uid(), ...v });
    return persistir("Palpación registrada");
  }

  if (tipo === "parto") {
    if (v.tipo === "aborto") v.sexoCria = "";
    if (id) Object.assign(D.partos.find(x => x.id === id), v);
    else D.partos.push({ id: uid(), ...v });
    // Una novillona que pare pasa a ser vaca.
    const a = animal(v.animalId);
    if (a && v.tipo === "parto" && CATEGORIAS[a.categoria]?.etapa === "levante") {
      const esp = CATEGORIAS[a.categoria].especie;
      const adulta = Object.entries(CATEGORIAS)
        .find(([, c]) => c.especie === esp && c.sexo === "H" && c.etapa === "adulta");
      if (adulta) a.categoria = adulta[0];
    }
    return persistir(v.tipo === "parto" ? "Parto registrado" : "Aborto registrado");
  }

  if (tipo === "secado") {
    const prev = D.secados.find(x => x.animalId === v.animalId && x.fecha === v.fecha && x.id !== id);
    if (prev) return error(f, "Esa vaca ya tiene un secado registrado en esa misma fecha.");
    if (id) Object.assign(D.secados.find(x => x.id === id), v);
    else D.secados.push({ id: uid(), ...v });
    return persistir("Secado registrado");
  }

  if (tipo === "trat") {
    if (id) Object.assign(D.tratamientos.find(x => x.id === id), v);
    else D.tratamientos.push({ id: uid(), ...v });
    return persistir("Tratamiento guardado");
  }

  if (tipo === "nota") {
    if (id) Object.assign(D.anotaciones.find(x => x.id === id), v);
    else D.anotaciones.push({ id: uid(), ...v });
    return persistir("Anotación guardada");
  }
}

function borrar(tipo, id) {
  const mapa = { animal:"animales", finca:"fincas", insem:"inseminaciones",
                 palp:"palpaciones", parto:"partos", trat:"tratamientos",
                 nota:"anotaciones", persona:"personas", secado:"secados" };
  if (tipo === "persona") {
    const p = persona(id), fs = fincasDe(id);
    if (!confirm(`¿Eliminar a ${p.nombre}?${fs.length ? ` Quedará desasignada de ${fs.length} finca(s).` : ""}`)) return;
    D.fincas.forEach(f => f.personas = (f.personas || []).filter(x => x !== id));
  }
  if (tipo === "animal") {
    const a = animal(id);
    const n = partosDe(id).length + insemDe(id).length + palpDe(id).length + tratDe(id).length;
    if (!confirm(`¿Eliminar a ${a.nombre} (${a.chapeta}) y sus ${n} registros? No se puede deshacer.`)) return;
    D.partos = D.partos.filter(x => x.animalId !== id);
    D.inseminaciones = D.inseminaciones.filter(x => x.animalId !== id);
    D.palpaciones = D.palpaciones.filter(x => x.animalId !== id);
    D.tratamientos = D.tratamientos.filter(x => x.animalId !== id);
    D.secados = D.secados.filter(x => x.animalId !== id);
  } else if (tipo === "finca") {
    if (D.animales.some(a => a.fincaId === id))
      return alert("Esa finca todavía tiene animales. Muévelos primero a otra finca.");
    if (!confirm("¿Eliminar la finca?")) return;
    D.anotaciones = D.anotaciones.filter(x => x.fincaId !== id);
  } else {
    if (!confirm("¿Eliminar este registro?")) return;
  }
  D[mapa[tipo]] = D[mapa[tipo]].filter(x => x.id !== id);
  persistir("Registro eliminado");
}

/* ---------- exportar / importar / reiniciar ---------- */
async function acciones(a) {
  const val = (id) => document.getElementById(id)?.value.trim() || "";

  if (a === "guardar-cfg") {
    const cfg = leerConfigPegada(val("cfg-pegar"));
    if (!cfg) return alert("No encontré apiKey ni projectId ahí.\n\n" +
      "Copia el bloque completo desde Configuración del proyecto → Tus apps → Web.");
    D.config.firebase = cfg; guardarLocal(); recuperarSesion();
pintar();

// Si el archivo cambió de versión desde la última vez, avisarlo.
const versionPrevia = revisarVersion();
if (versionPrevia) setTimeout(() => avisar(`Actualizada de la ${versionPrevia} a la ${VERSION}`), 900);
conectarFirebase(true);
    avisar("Configuración guardada"); conectarFirebase();
    return;
  }
  if (a === "entrar-fb" || a === "registrar-fb") {
    const c = val("fb-correo"), k = val("fb-clave");
    if (!c || !k) return alert("Escribe el correo y la contraseña.");
    try { await entrarFirebase(c, k, a === "registrar-fb"); avisar("Sesión iniciada"); }
    catch (e) { FB.error = errorFB(e); pintar(); }
    return;
  }
  if (a === "salir-fb")     { await salirFirebase(); avisar("Sesión cerrada"); return; }
  if (a === "subir-todo")   { await subirTodo(); return; }
  if (a === "desconectar")  { desconectarFirebase(); return; }
  if (a === "publicar")     { generarArchivoPublicable(); return; }
  if (a === "instalar")     { instalarApp(); return; }
  if (a === "bajar-sw")     { descargarSW(); return; }
  if (a === "actualizar")   { aplicarActualizacion(); return; }
  if (a === "revisar-version") { await buscarActualizacion(true); return; }
  if (a === "guardar-maestro") {
    const m = val("maestro").toLowerCase();
    if (m && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return alert("Ese correo no es válido.");
    const mio = (S.persona?.correo || "").toLowerCase();
    if (m && m !== mio &&
        !confirm(`Vas a pasarle el control de la base de datos a ${m}.\n\n` +
                 `Tú dejarás de ver la conexión con Firebase, las reglas y la publicación ` +
                 `en este equipo. ¿Seguro?`)) return;
    D.config.maestro = m;
    guardar(); pintar(); avisar("Dueño principal actualizado");
    return;
  }
  if (a === "cambiar-clave") {
    const c = FB.user?.email;
    if (!c) return;
    try { await enviarReinicio(c); avisar(`Te mandamos un correo a ${c}`); }
    catch (e) { alert("No se pudo: " + errorFB(e)); }
    return;
  }
  if (a === "poner-clave") {
    const k = val("nueva-clave");
    if (k.length < 6) return alert("La contraseña debe tener al menos 6 caracteres.");
    try { await definirClave(k); avisar("Contraseña guardada"); pintar(); }
    catch (e) { alert("No se pudo: " + errorFB(e) +
      "\n\nSi dice que hace falta volver a entrar, cierra sesión y entra de nuevo."); }
    return;
  }
  if (a === "params-fabrica") {
    if (!confirm("¿Volver a los valores de fábrica?")) return;
    D.config.params = JSON.parse(JSON.stringify(PARAMS_BASE));
    guardar(); pintar(); avisar("Parámetros restablecidos");
    return;
  }

  if (a === "exportar") {
    const b = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
    const u = URL.createObjectURL(b);
    const el = document.createElement("a");
    el.href = u; el.download = `control-ganadero-${hoyISO()}.json`;
    el.click(); URL.revokeObjectURL(u);
    avisar("Copia descargada");
  }
  if (a === "importar") {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const j = JSON.parse(r.result);
          if (!j.animales || !j.fincas) throw 0;
          D = migrar(j); guardar(); pintar(); avisar("Datos importados");
        } catch { alert("Ese archivo no tiene el formato esperado. Usa uno exportado desde esta misma app."); }
      };
      r.readAsText(f);
    };
    inp.click();
  }
  if (a === "reiniciar") {
    if (!confirm("Esto borra todos los animales, fincas, personas y eventos de este equipo.\n\n" +
                 "Si tienes Firebase conectado, los datos de la nube NO se borran.\n\n¿Seguro?")) return;
    if (!confirm("Última confirmación: no hay forma de deshacer esto.")) return;
    D = migrar(semilla()); guardarLocal();
    S.persona = null; S.modo = null; guardarSesion();
    pantallaAcceso();
  }
}
