<style>
:root{
  /* --- claro --- */
  --tinta:#16241c; --tinta2:#2c3f34; --papel:#edefe8; --alto:#f7f8f4;
  --chapeta:#f5c518; --chapeta-b:#d4a608; --pasto:#3e6b4a; --hierro:#a6432b;
  --ambar:#7d6203; --linea:#d3d8cb; --tenue:#5f6d62;

  /* Componentes de color, para poder teñir sin repetir números */
  --tinta-rgb:22,36,28; --papel-rgb:237,239,232; --sombra-rgb:22,36,28;
  --pasto-rgb:62,107,74; --chapeta-rgb:245,197,24;
  --ambar-rgb:212,166,8; --hierro-rgb:166,67,43;

  /* Lo que NO se invierte: la chapeta siempre es amarilla con letra oscura,
     y la barra lateral siempre es verde oscuro. */
  --sobre-chapeta:#16241c;
  --rail-bg:#16241c; --rail-fg:#edefe8; --velo-rgb:22,36,28;
  /* Sobre el menú lateral, que siempre es oscuro, hacen falta tonos claros */
  --pasto-rail:#8fd6a0; --hierro-rail:#f0a08c;
  --firme-bg:#16241c; --firme-bg2:#2c3f34; --firme-fg:#edefe8;

  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --texto:"IBM Plex Sans",system-ui,sans-serif;
  --dato:"IBM Plex Mono",ui-monospace,monospace;

  --radio:10px;
  --sombra:0 1px 2px rgba(var(--sombra-rgb),.06),
    0 8px 24px -12px rgba(var(--sombra-rgb),.18);
  color-scheme:light;
}

/* ==========================================================
   MODO OSCURO
   No es una inversión: el verde de la marca sigue siendo el
   fondo, y el amarillo de la chapeta se conserva intacto
   porque es lo que identifica a la app.
   ========================================================== */
[data-tema="oscuro"]{
  --tinta:#e6ebe4;          /* ahora es el color del texto */
  --tinta2:#b4c1b6;
  --papel:#0f1712;          /* fondo general */
  --alto:#18231c;           /* tarjetas y campos */
  --linea:#2b3a30;
  --tenue:#93a295;

  --chapeta:#f5c518; --chapeta-b:#c69d09;
  --pasto:#71b985;          /* aclarado para que se lea sobre oscuro */
  --hierro:#e8907a;
  --ambar:#e5c356;

  /* Las capas translúcidas ahora aclaran en vez de oscurecer */
  --tinta-rgb:230,235,228; --papel-rgb:230,235,228; --sombra-rgb:0,0,0;
  --pasto-rgb:113,185,133; --chapeta-rgb:245,197,24;
  --ambar-rgb:224,185,63;  --hierro-rgb:232,144,122;

  --sobre-chapeta:#16241c;
  --rail-bg:#0a110d; --rail-fg:#e6ebe4; --velo-rgb:10,17,13;
  --pasto-rail:#8fd6a0; --hierro-rail:#f0a08c;
  --firme-bg:#2f7048; --firme-bg2:#3a8657; --firme-fg:#f2f8f3;

  --sombra:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
/* El navegador trae [hidden]{display:none}, pero cualquier clase con display
   propio (.campo, .chip, .palpa-fila, .combo-lista li) le gana. Por eso
   ocultar con el atributo hidden no hacía nada: salían la fecha y el motivo
   de salida de un animal en el hato, y no filtraban ni los desplegables con
   buscador, ni la palpación en grupo, ni las personas de una finca. */
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:13.5px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pasto);outline-offset:2px}

/* ---------- marco ---------- */
.marco{display:grid;grid-template-columns:224px 1fr;height:100vh}
.rail{background:var(--rail-bg);color:var(--rail-fg);padding:18px 14px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.marca{display:flex;align-items:center;gap:10px}
.marca strong{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.marca span{font-family:var(--dato);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--papel-rgb),.45)}
.sello{width:28px;height:28px;flex:none;border-radius:6px 6px 11px 11px;background:var(--chapeta);position:relative}
.sello::after{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--sobre-chapeta)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grupo{font-family:var(--dato);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--papel-rgb),.35);padding:12px 10px 5px}
.nav button{background:none;border:0;color:rgba(var(--papel-rgb),.62);text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.nav button:hover{background:rgba(var(--papel-rgb),.07);color:var(--rail-fg)}
.nav button.on{background:rgba(var(--chapeta-rgb),.14);color:var(--chapeta);font-weight:500}
.nav .cnt{font-family:var(--dato);font-size:10.5px;opacity:.65}
.nav button.alerta .cnt{background:var(--hierro);color:#fff;border-radius:9px;padding:1px 6px;opacity:1;font-weight:500}
.pie{margin-top:auto;border-top:1px solid rgba(var(--papel-rgb),.12);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.temas{display:flex;gap:4px;margin-bottom:7px}
.temas button{flex:1;background:none;border:1px solid rgba(var(--papel-rgb),.18);
  color:rgba(var(--papel-rgb),.6);padding:5px 0;border-radius:6px;font-size:11.5px}
.temas button:hover{border-color:rgba(var(--papel-rgb),.4);color:var(--rail-fg)}
.temas button.on{background:rgba(var(--chapeta-rgb),.16);border-color:rgba(var(--chapeta-rgb),.4);
  color:var(--chapeta)}
.interruptor.on{border-color:var(--pasto);background:rgba(var(--pasto-rgb),.09)}
.pie button{background:none;border:1px solid rgba(var(--papel-rgb),.18);color:rgba(var(--papel-rgb),.72);padding:6px 9px;border-radius:6px;font-size:11.5px;text-align:center;display:block}
.pie button:hover{border-color:rgba(var(--papel-rgb),.45);color:var(--rail-fg)}

/* ---------- lienzo ---------- */
.lienzo{overflow-y:auto;padding:22px 26px 60px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cab h1{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0}
.cab p{margin:4px 0 0;color:var(--tenue);font-size:12.5px}

.conteos{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:18px}
.conteo{background:var(--alto);border:1px solid var(--linea);border-radius:9px;padding:11px 13px}
.conteo dt{font-family:var(--dato);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin:0 0 5px}
.conteo dd{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;margin:0;letter-spacing:-.02em}

/* ---------- barra ---------- */
.barra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.busca{flex:1 1 240px;position:relative;min-width:180px}
.busca input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--linea);border-radius:7px;background:var(--alto)}
.busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tenue)}
.barra select{padding:9px 11px;border:1px solid var(--linea);border-radius:7px;background:var(--alto)}
.fichas{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.ficha{border:1px solid var(--linea);background:var(--alto);padding:6px 12px;border-radius:20px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.ficha:hover{border-color:var(--tenue)}
.ficha.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.ficha b{font-family:var(--dato);font-weight:500;font-size:11px;opacity:.7}

/* ---------- botones ---------- */
.btn{border:1px solid var(--linea);background:var(--alto);color:var(--tinta);padding:9px 14px;border-radius:7px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--tenue)}
.btn-firme{background:var(--firme-bg);border-color:var(--firme-bg);color:var(--firme-fg)}
.btn-firme:hover{background:var(--firme-bg2);border-color:var(--firme-bg2)}
.btn-baja{color:var(--hierro);border-color:rgba(var(--hierro-rgb),.3);background:transparent}
.btn-baja:hover{background:rgba(var(--hierro-rgb),.07);border-color:var(--hierro)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* ---------- tabla ---------- */
.tabla-caja{border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--alto)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--alto);border-bottom:1px solid var(--linea);text-align:left;padding:10px 13px;font-family:var(--dato);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);font-weight:500;position:sticky;top:0;z-index:2;white-space:nowrap}
thead th.num{text-align:right}
tbody td{padding:10px 13px;border-bottom:1px solid var(--linea);vertical-align:middle}
tbody td.num{text-align:right;font-family:var(--dato);font-size:12.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr.fila{cursor:pointer}
tbody tr.fila:hover td{background:rgba(var(--tinta-rgb),.035)}
tr.grupo td{background:rgba(var(--tinta-rgb),.05);font-family:var(--dato);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);padding:7px 13px;font-weight:500;border-bottom:1px solid var(--linea)}
tr.grupo .n{opacity:.55;margin-left:6px}
.apilado{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.apilado em{font-style:normal;font-family:var(--texto);font-size:11px;color:var(--tenue)}
.chap{font-family:var(--dato);font-weight:600;font-size:13px;background:var(--chapeta);border:1px solid var(--chapeta-b);border-radius:3px 3px 5px 5px;padding:2px 7px;display:inline-block;color:var(--sobre-chapeta);letter-spacing:-.02em}
.chap.gris{background:var(--linea);border-color:var(--tenue);color:var(--tinta)}
.nom{font-weight:500}
.sub{color:var(--tenue);font-size:11.5px;margin-top:1px}
.flecha{color:var(--tenue);text-align:right;width:26px}

/* ---------- pastillas ---------- */
.p{font-family:var(--dato);font-size:10px;letter-spacing:.04em;padding:3px 7px;border-radius:4px;background:rgba(var(--tinta-rgb),.06);color:var(--tinta2);text-transform:uppercase;white-space:nowrap;display:inline-block}
.p.verde{background:rgba(var(--pasto-rgb),.14);color:var(--pasto)}
.p.roja{background:rgba(var(--hierro-rgb),.13);color:var(--hierro)}
.p.ambar{background:rgba(var(--ambar-rgb),.2);color:var(--ambar)}
.p.gris{background:rgba(var(--tinta-rgb),.07);color:var(--tenue)}

/* ---------- vacío ---------- */
.vacio{border:1px dashed var(--linea);border-radius:10px;padding:48px 24px;text-align:center;background:var(--alto)}
.vacio h2{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 6px}
.vacio p{color:var(--tenue);margin:0 0 16px;font-size:13px}

/* ---------- hoja / modal ---------- */
.velo{position:fixed;inset:0;background:rgba(var(--tinta-rgb),.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.hoja{background:var(--alto);border-radius:12px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 64px -18px rgba(var(--sombra-rgb),.55)}
.hoja.ancha{width:min(880px,100%)}
.hoja-cab{padding:17px 22px 14px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:center;gap:12px}
.hoja-cab h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.hoja-cab .sub{margin-top:2px}
.cerrar{background:none;border:0;color:var(--tenue);font-size:22px;line-height:1;padding:2px 8px;border-radius:6px}
.cerrar:hover{background:rgba(var(--tinta-rgb),.07);color:var(--tinta)}
/* El <form> va entre la hoja y el cuerpo: si no hereda el diseño flexible,
   crece sin límite y empuja los botones fuera de la pantalla. */
.hoja>form{display:flex;flex-direction:column;flex:1;min-height:0}
.hoja-cuerpo{padding:18px 22px;overflow-y:auto;flex:1;min-height:0;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hoja-pie{flex:none}
.hoja-pie{padding:13px 22px 17px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--linea);flex-wrap:wrap}
.hoja-pie .btn-baja{margin-right:auto}

/* ---------- campos ---------- */
.rej{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.campo{display:flex;flex-direction:column;gap:5px}
.ancho{grid-column:1/-1}
.oblig{color:var(--hierro);font-weight:600;margin-left:1px}
.campo.falta input,.campo.falta select,.campo.falta textarea,.campo.falta .combo-btn{
  border-color:var(--hierro);box-shadow:0 0 0 3px rgba(var(--hierro-rgb),.18)}
.campo.falta label{color:var(--hierro)}
@keyframes latido{0%,100%{transform:none}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.campo.falta{animation:latido .3s}
.campo label{font-family:var(--dato);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue)}
.campo input,.campo select,.campo textarea{padding:9px 11px;border:1px solid var(--linea);border-radius:7px;background:var(--alto);width:100%}
.campo textarea{resize:vertical;min-height:64px;font-family:var(--texto)}
.campo .ayuda{font-size:11.5px;color:var(--tenue)}
/* control segmentado: Macho | Hembra | Gemelos */
.seg{display:flex;border:1px solid var(--linea);border-radius:7px;overflow:hidden}
.seg label{flex:1;min-width:0}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{display:block;text-align:center;padding:10px 6px;cursor:pointer;font-size:12.5px;
  border-right:1px solid var(--linea);background:var(--alto);transition:background .12s,color .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg label:last-child span{border-right:0}
.seg span:hover{background:rgba(var(--tinta-rgb),.05)}
.seg input:checked+span{background:var(--tinta);color:var(--papel);font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--pasto);outline-offset:-3px}

/* ---------- ficha de la vaca ---------- */
.ficha-top{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.retrato{width:172px;flex:none;position:relative}
.retrato img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;
  border:1px solid var(--linea);background:var(--papel)}
.retrato .sinfoto{width:100%;aspect-ratio:4/3;border:1px dashed var(--linea);border-radius:10px;
  display:grid;place-items:center;background:var(--papel);color:var(--tenue);gap:5px;
  font-size:11.5px;text-align:center;padding:10px;cursor:pointer;transition:border-color .12s}
.retrato .sinfoto:hover{border-color:var(--pasto);color:var(--pasto)}
.cargando-foto{cursor:default;border-style:solid}
.giro{width:20px;height:20px;border:2px solid var(--linea);border-top-color:var(--pasto);
  border-radius:50%;animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.retrato .foto-acc{display:flex;gap:5px;margin-top:6px}
.retrato .foto-acc button{flex:1;font-size:11px;padding:5px 6px;border-radius:6px;
  border:1px solid var(--linea);background:var(--alto);color:var(--tinta2)}
.retrato .foto-acc button:hover{border-color:var(--tenue)}
.retrato .foto-acc .quitar:hover{border-color:var(--hierro);color:var(--hierro)}
.ficha-id{flex:1;min-width:0}
.ficha-id .chap{font-size:17px;padding:4px 11px;margin-bottom:9px}
.ficha-id h2{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px;line-height:1}
.ficha-id .meta{color:var(--tenue);font-size:12.5px;margin-bottom:10px}
.ficha-id .tags{display:flex;gap:5px;flex-wrap:wrap}

.medidas{list-style:none;padding:0;margin:0 0 16px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--linea);
  border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.medidas li{background:var(--alto);padding:11px 13px}
.medidas dt{font-family:var(--dato);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:4px}
.medidas dd{margin:0;font-size:15px;font-weight:500;font-family:var(--display);letter-spacing:-.01em}
.medidas dd.g{font-size:22px;font-weight:700}
.medidas li.liga{cursor:pointer}
.medidas li.liga:hover{background:rgba(var(--pasto-rgb),.07)}
.medidas li.liga dd::after{content:" ›";color:var(--tenue);font-weight:400}

.plan{display:flex;gap:8px;flex-wrap:wrap;background:rgba(var(--chapeta-rgb),.1);
  border:1px solid rgba(var(--ambar-rgb),.3);border-radius:9px;padding:11px 13px;margin-bottom:16px}
.plan div{flex:1;min-width:104px}
.plan dt{font-family:var(--dato);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ambar);margin-bottom:3px}
.plan dd{margin:0;font-size:13.5px;font-weight:500}

.sub-tabla{border:1px solid var(--linea);border-radius:9px;overflow:hidden}
.sub-tabla table{font-size:12.5px}
.sub-tabla thead th{padding:8px 11px;font-size:9px}
.sub-tabla tbody td{padding:8px 11px}

/* casillas de personas en el formulario de finca */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--linea);background:var(--alto);
  border-radius:7px;padding:7px 11px;cursor:pointer;font-size:13px;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--tenue)}
.chip:has(input:checked){border-color:var(--pasto);background:rgba(var(--pasto-rgb),.09)}
.chip input{accent-color:var(--pasto);margin:0;width:15px;height:15px;flex:none}
.chip span{display:flex;flex-direction:column;line-height:1.25}
.chip i{font-style:normal;font-size:11px;color:var(--tenue);font-family:var(--dato)}
.invitar{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.aviso{background:rgba(var(--hierro-rgb),.08);border:1px solid rgba(var(--hierro-rgb),.25);color:var(--hierro);border-radius:7px;padding:9px 12px;font-size:12.5px;margin-bottom:13px}
.nota.recorte{background:rgba(var(--chapeta-rgb),.13);border-color:rgba(var(--ambar-rgb),.35);color:var(--tinta2);
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:space-between}
.nota.recorte .btn{flex:none}
.nota{background:rgba(var(--pasto-rgb),.08);border:1px solid rgba(var(--pasto-rgb),.22);color:var(--pasto);border-radius:7px;padding:9px 12px;font-size:12.5px;margin-bottom:13px}

/* ---------- ficha detalle ---------- */
.datos{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:9px;overflow:hidden}
.datos li{background:var(--alto);padding:10px 13px}
.datos dt{font-family:var(--dato);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin-bottom:3px}
.datos dd{margin:0;font-size:13.5px;font-weight:500}
.seccion{margin-bottom:18px}
.seccion h3{font-family:var(--display);font-size:14px;font-weight:700;margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.linea-ev{display:flex;gap:11px;padding:9px 0;border-bottom:1px dashed var(--linea);font-size:12.5px;align-items:flex-start}
.linea-ev:last-child{border-bottom:0}
.linea-ev .f{font-family:var(--dato);font-size:11.5px;color:var(--tenue);flex:none;width:74px;padding-top:1px}
.linea-ev .c{flex:1}
.linea-ev .d{color:var(--tenue);font-size:11.5px;margin-top:2px}
.mini{color:var(--tenue);font-size:12.5px;font-style:italic;padding:7px 0}

/* ---------- alertas ---------- */
.alerta-caja{border:1px solid var(--linea);border-left:3px solid var(--tenue);background:var(--alto);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;gap:13px;align-items:flex-start;cursor:pointer}
.alerta-caja:hover{border-color:var(--tenue)}
.alerta-caja[data-n="alta"]{border-left-color:var(--hierro)}
.alerta-caja[data-n="media"]{border-left-color:var(--chapeta-b)}
.alerta-caja[data-n="baja"]{border-left-color:var(--pasto)}
.alerta-caja[data-n="hecha"]{border-left-color:var(--linea);opacity:.62}
.alerta-caja .cu,.alerta-caja .chap{cursor:pointer}
.alerta-acc{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.hecha-el{display:block;font-family:var(--dato);font-size:10.5px;color:var(--pasto);margin-top:3px}
.btn-listo{background:var(--pasto);border-color:var(--pasto);color:var(--sobre-chapeta);font-weight:500}
.btn-listo:hover{filter:brightness(1.1)}
@media(max-width:860px){
  .alerta-acc{flex-direction:row;align-items:center;justify-content:space-between;width:100%;
    margin-top:4px}
}
.alerta-caja .cu{flex:1}
.alerta-caja strong{display:block;font-size:13.5px;margin-bottom:2px}
.alerta-caja span{color:var(--tenue);font-size:12.5px}
.alerta-caja .q{font-family:var(--dato);font-size:11px;color:var(--tenue);text-align:right;flex:none}

/* ---------- notas (tarjetas) ---------- */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tarjeta{background:var(--alto);border:1px solid var(--linea);border-radius:10px;padding:15px;cursor:pointer;text-align:left;width:100%}
.tarjeta:hover{border-color:var(--tenue)}
.tarjeta h3{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 2px}
.tarjeta time{font-family:var(--dato);font-size:11px;color:var(--tenue);display:block;margin-bottom:9px}
.tarjeta p{margin:0;font-size:13px;line-height:1.45;white-space:pre-wrap}

.pasos-inicio{margin-top:18px;border:1px solid var(--linea);border-radius:11px;
  background:var(--alto);padding:18px 20px}
.pasos-inicio .paso:first-child{padding-top:0}

/* ---------- portada de acceso ---------- */
.portada{display:grid;grid-template-columns:1.05fr .95fr;height:100vh;overflow:hidden}
.portada-arte{background:var(--rail-bg);position:relative;overflow:hidden;display:grid;place-items:center}
.pared{position:absolute;inset:-8%;display:flex;flex-wrap:wrap;gap:14px;align-content:center;
  justify-content:center;transform:rotate(-11deg)}
.tag{width:60px;height:44px;border-radius:5px 5px 9px 9px;background:var(--chapeta);
  opacity:var(--o);position:relative;display:grid;place-items:end center;padding-bottom:6px;
  font-family:var(--dato);font-size:11px;font-weight:600;color:rgba(22,36,28,.72);
  animation:brota .5s var(--d) both}
.tag::after{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:var(--sobre-chapeta);opacity:.55}
@keyframes brota{from{opacity:0;transform:translateY(9px)}to{opacity:var(--o);transform:none}}
.portada-texto{position:relative;z-index:2;text-align:center;padding:34px;
  background:radial-gradient(closest-side,rgba(var(--velo-rgb),.94) 52%,rgba(var(--velo-rgb),0));}
.portada-texto h1{font-family:var(--display);font-size:52px;font-weight:800;letter-spacing:-.04em;
  line-height:.95;color:var(--papel);margin:16px 0 12px}
.portada-texto p{color:rgba(var(--papel-rgb),.62);font-size:14px;margin:0;max-width:290px;
  margin-inline:auto;line-height:1.55}
.sello.grande{width:52px;height:52px;border-radius:11px 11px 20px 20px;margin:0 auto}
.sello.grande::after{width:10px;height:10px;top:9px}

.ver-arte{display:block;margin-top:22px;font-family:var(--dato);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(var(--papel-rgb),.3)}
.ver-chip{margin-left:auto;font-family:var(--dato);font-size:10px;color:var(--tenue);
  border:1px solid var(--linea);border-radius:20px;padding:2px 8px}
.ver-pie{font-family:var(--dato);font-size:10.5px;letter-spacing:.05em;color:var(--tinta2)}
.portada-forma{display:grid;place-items:center;padding:30px;overflow-y:auto;background:var(--papel)}
.forma-caja{width:min(370px,100%)}
.forma-caja h2{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.forma-caja .lede{color:var(--tenue);font-size:13px;line-height:1.55;margin:0 0 20px}
.forma-caja form{display:flex;flex-direction:column;gap:13px;margin-bottom:14px}
.btn.grande{padding:12px 16px;font-size:14px;margin-top:3px;width:100%}
.forma-caja .btn:not(.grande){width:100%}
.btn.google{display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;
  border-color:#dadce0;color:#3c4043;font-weight:500}
.btn.google:hover{background:#f7f8f8;border-color:#c6cacd}
.recordar{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linea);
  border-radius:8px;padding:11px;cursor:pointer;background:var(--alto);margin-top:2px}
.recordar:has(input:checked){border-color:var(--pasto);background:rgba(var(--pasto-rgb),.07)}
.recordar input{margin:2px 0 0;accent-color:var(--pasto);flex:none;width:16px;height:16px}
.recordar span{display:flex;flex-direction:column;gap:3px;font-size:13px}
.recordar em{font-style:normal;font-size:11.5px;color:var(--tenue);line-height:1.45}
.enlaces{display:flex;flex-direction:column;gap:7px;align-items:flex-start;margin-top:13px}
.liga{background:none;border:0;padding:2px 0;color:var(--pasto);font-size:12.5px;text-align:left;
  text-decoration:underline;text-underline-offset:2px}
.liga:hover{color:var(--tinta)}
.separa{display:flex;align-items:center;gap:11px;margin:15px 0;color:var(--tenue);
  font-family:var(--dato);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.separa::before,.separa::after{content:"";flex:1;height:1px;background:var(--linea)}
.pie-nota{color:var(--tenue);font-size:11.5px;line-height:1.5;margin:20px 0 0;
  padding-top:14px;border-top:1px solid var(--linea)}
.solo-movil{display:none}

.pie button.quien{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;background:none;
  border:0;padding:7px 8px;border-radius:8px;text-align:left;width:100%;color:var(--rail-fg)}
.pie button.quien strong{color:var(--rail-fg)}
.pie button.quien em{color:rgba(var(--papel-rgb),.5)}
.pie button.quien:hover{background:rgba(var(--papel-rgb),.08)}
.quien strong{font-size:13px;color:var(--papel)}
.quien em{font-style:normal;font-family:var(--dato);font-size:10.5px;color:rgba(var(--papel-rgb),.45)}
.quien .p{align-self:flex-start;font-size:9px}

@media(max-width:860px){
  .portada{grid-template-columns:1fr}
  .portada-arte{display:none}
  .solo-movil{display:flex;align-items:center;gap:9px;margin-bottom:22px}
  .solo-movil strong{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.02em}
}

/* ---------- configuración ---------- */
.panel{border:1px solid var(--linea);border-radius:11px;background:var(--alto);
  margin-bottom:10px;overflow:hidden}
details.panel>summary{cursor:pointer;list-style:none;user-select:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary:hover{background:rgba(var(--tinta-rgb),.06)}
.flecha-acord{color:var(--tenue);font-size:13px;transition:transform .18s;flex:none;margin-left:2px}
details.panel[open]>summary .flecha-acord{transform:rotate(180deg)}
details.panel[open]>summary{border-bottom:1px solid var(--linea)}
details.panel:not([open])>summary{border-bottom:0}

.lista-correos{list-style:none;margin:0;padding:0;border:1px solid var(--linea);border-radius:9px;
  overflow:hidden}
.lista-correos li{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 13px;border-bottom:1px solid var(--linea);font-size:13px;flex-wrap:wrap}
.lista-correos li:last-child{border-bottom:0}
.lista-correos span:first-child{font-family:var(--dato);font-size:12.5px;word-break:break-all}

.interruptores{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.interruptor{display:flex;align-items:center;gap:10px;border:1px solid var(--linea);
  border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--alto)}
.interruptor:has(input:checked){border-color:var(--pasto);background:rgba(var(--pasto-rgb),.07)}
.interruptor input{width:17px;height:17px;accent-color:var(--pasto);margin:0;flex:none}
.interruptor span{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.interruptor strong{font-size:13px;font-weight:500}
.interruptor em{font-style:normal;font-family:var(--dato);font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--tenue)}
.panel-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--linea);background:rgba(var(--tinta-rgb),.03)}
.panel-cab h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}
.panel-cuerpo{padding:18px}
.panel-cuerpo .expl{color:var(--tenue);font-size:12.5px;line-height:1.55;margin:0 0 14px}
.panel-cuerpo .rej{margin-bottom:14px}
.sub-titulo{font-family:var(--dato);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tenue);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--linea)}
.sub-titulo:first-child{margin-top:0}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.panel textarea{font-family:var(--dato);font-size:11.5px;line-height:1.5}

.cambios{margin:0 0 4px;padding-left:18px;font-size:13px;line-height:1.6;color:var(--tinta2)}
.cambios li{margin-bottom:4px}
.paso{display:flex;gap:14px;padding:15px 0;border-bottom:1px dashed var(--linea)}
.paso:last-child{border-bottom:0;padding-bottom:0}
.paso:first-child{padding-top:0}
.paso-n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--rail-bg);color:var(--chapeta);
  display:grid;place-items:center;font-family:var(--dato);font-size:12px;font-weight:600}
.paso-c{flex:1;min-width:0}
.paso-c h4{font-family:var(--display);font-size:14.5px;font-weight:700;margin:2px 0 7px}
.paso-c p{margin:0 0 9px;font-size:13px;line-height:1.6}
.paso-c p:last-child{margin-bottom:0}
.paso-c code{font-family:var(--dato);font-size:11.5px;background:rgba(var(--tinta-rgb),.07);
  padding:1px 5px;border-radius:4px}
.paso-c details{margin-top:11px;border-top:1px dashed var(--linea);padding-top:11px}
.paso-c summary{cursor:pointer;font-size:12.5px;color:var(--pasto);font-weight:500}
.paso-c summary:hover{text-decoration:underline}

.codigo{border:1px solid var(--linea);border-radius:8px;overflow:hidden;margin:10px 0}
.codigo-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:7px 11px;background:rgba(var(--tinta-rgb),.05);border-bottom:1px solid var(--linea)}
.codigo-cab span{font-family:var(--dato);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--tenue)}
.codigo pre{margin:0;padding:13px;overflow-x:auto;background:var(--rail-bg);color:#dfe6dc;
  font-family:var(--dato);font-size:11.5px;line-height:1.6}

.sync{font-family:var(--dato);font-size:10.5px;letter-spacing:.03em;padding:5px 2px;
  white-space:normal;overflow-wrap:anywhere;line-height:1.45;
  color:rgba(var(--papel-rgb),.5)}
.sync.listo{color:var(--pasto-rail)}
.sync.error{color:var(--hierro-rail)}
.sync.cargando{color:var(--chapeta)}
.sync.espera{color:var(--chapeta)}
.sync-chip.listo{border-color:rgba(var(--pasto-rgb),.5);color:var(--pasto-rail)}
.sync-chip.espera,.sync-chip.cargando{border-color:rgba(var(--chapeta-rgb),.5);color:var(--chapeta)}
.sync-chip.error{border-color:rgba(var(--hierro-rgb),.55);color:var(--hierro-rail)}
.banda-espera{background:rgba(var(--chapeta-rgb),.13);border:1px solid rgba(var(--ambar-rgb),.35);
  border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:13px}
.banda-espera strong{display:block;margin-bottom:2px}
.banda-espera span{color:var(--tinta2);font-size:12.5px}

/* ---------- gráfico de leche ---------- */
.grafico{display:flex;align-items:flex-end;gap:5px;height:190px;padding:22px 0 0;
  border-bottom:1px solid var(--linea);overflow-x:auto}
.barra-col{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;height:100%;gap:4px}
.barra-cuerpo{width:100%;max-width:44px;background:var(--chapeta);border:1px solid var(--chapeta-b);
  border-radius:4px 4px 0 0;min-height:4px;transition:height .2s}
.barra-col:hover .barra-cuerpo{background:var(--chapeta-b)}
.barra-val{font-family:var(--dato);font-size:10.5px;color:var(--tinta2);white-space:nowrap}
.barra-et{font-size:9.5px;color:var(--tenue);text-align:center;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  padding-top:5px;border-top:0}
.conteo .sub{display:block;margin-top:3px;font-size:11px}
@media(max-width:860px){
  .grafico{height:160px}
  .barra-col{min-width:52px}
  .barra-et{font-size:9px}
}

/* ---------- palpar en grupo ---------- */
.palpa-conteo{font-family:var(--dato);font-size:11.5px;color:var(--tenue);
  padding:7px 0 11px;letter-spacing:.03em}
.palpa-conteo.hay{color:var(--pasto)}
.palpa-conteo strong{font-size:14px}
.palpa-lista{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.palpa-fila{display:grid;grid-template-columns:1.4fr .9fr 1.5fr .9fr;gap:11px;align-items:center;
  border:1px solid var(--linea);border-radius:9px;padding:9px 11px;background:var(--alto)}
.palpa-fila.marcada{border-color:var(--pasto);background:rgba(var(--pasto-rgb),.07)}
.palpa-fila.dudosa{border-color:var(--hierro);background:rgba(var(--hierro-rgb),.08)}
.palpa-quien{display:flex;align-items:center;gap:9px;min-width:0}
.palpa-quien strong{display:block;font-size:13.5px}
.palpa-quien em{font-style:normal;font-family:var(--dato);font-size:10.5px;color:var(--tenue);
  display:block;margin-top:1px}
.palpa-res{display:flex;gap:4px;flex-wrap:wrap}
.palpa-res label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;
  border:1px solid var(--linea);border-radius:6px;padding:4px 7px}
.palpa-res label:has(input:checked){border-color:var(--pasto);background:rgba(var(--pasto-rgb),.12)}
.palpa-res input{width:13px;height:13px;accent-color:var(--pasto);margin:0}
.palpa-nums{display:flex;gap:6px}
.palpa-nums label{display:flex;flex-direction:column;gap:2px;font-size:10px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);font-family:var(--dato)}
.palpa-nums input{width:58px;padding:6px 7px;border:1px solid var(--linea);border-radius:6px;
  background:var(--alto);color:var(--tinta);font-size:14px}
.palpa-nums .palpa-desde input{width:132px}
.palpa-calc{font-size:12px;color:var(--tinta2);text-align:right}
.palpa-calc em{font-style:normal;display:block;font-size:10.5px;color:var(--tenue);
  font-family:var(--dato)}
.palpa-manda{display:flex;align-items:center;gap:5px;justify-content:flex-end;
  font-size:11px;margin-top:5px;cursor:pointer;color:var(--hierro)}
.palpa-manda input{width:13px;height:13px;accent-color:var(--hierro);margin:0}
@media(max-width:860px){
  .palpa-fila{grid-template-columns:1fr;gap:8px}
  .palpa-calc{text-align:left}
  .palpa-nums input{width:100%;font-size:16px}
  .palpa-nums label{flex:1}
}

/* ---------- diagnóstico ---------- */
.diag{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.diag li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linea);
  border-radius:8px;padding:10px 12px;background:var(--alto);font-size:13px}
.diag li.ok{border-color:rgba(var(--pasto-rgb),.35)}
.diag li.mal{border-color:rgba(var(--hierro-rgb),.45);background:rgba(var(--hierro-rgb),.06)}
.diag li.aviso{border-color:rgba(var(--ambar-rgb),.45);background:rgba(var(--ambar-rgb),.07)}
.diag-marca{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;flex:none;margin-top:1px}
.diag li.ok .diag-marca{background:rgba(var(--pasto-rgb),.2);color:var(--pasto)}
.diag li.mal .diag-marca{background:rgba(var(--hierro-rgb),.2);color:var(--hierro)}
.diag li.aviso .diag-marca{background:rgba(var(--ambar-rgb),.25);color:var(--ambar)}
.diag p{margin:3px 0 0;font-size:12px;color:var(--tinta2);line-height:1.5;word-break:break-word}
.diag a{color:var(--pasto)}

/* ---------- carga masiva ---------- */
.modos{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.modo{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linea);border-radius:9px;
  padding:12px;cursor:pointer;background:var(--alto)}
.modo.on{border-color:var(--pasto);background:rgba(var(--pasto-rgb),.07)}
.modo input{margin:2px 0 0;accent-color:var(--pasto);flex:none}
.modo span{display:flex;flex-direction:column;gap:3px;min-width:0}
.modo strong{font-size:13.5px}
.modo em{font-style:normal;font-size:11.5px;color:var(--tenue);line-height:1.4}

.guia{list-style:none;counter-reset:g;margin:0 0 14px;padding:0;
  display:flex;flex-direction:column;gap:7px}
.guia li{counter-increment:g;position:relative;border:1px solid var(--linea);border-radius:8px;
  padding:10px 12px 10px 40px;background:var(--alto)}
.guia li::before{content:counter(g);position:absolute;left:11px;top:10px;width:20px;height:20px;
  border-radius:50%;background:var(--rail-bg);color:var(--chapeta);display:grid;place-items:center;
  font-family:var(--dato);font-size:10.5px}
.guia-cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.guia p{margin:5px 0 0;font-size:12.5px;line-height:1.5;color:var(--tinta2)}
.guia code{display:inline-block;margin-top:6px;font-family:var(--dato);font-size:11.5px;
  background:rgba(var(--tinta-rgb),.06);padding:2px 7px;border-radius:4px;color:var(--tinta2)}
@media(max-width:860px){.modos{grid-template-columns:1fr}}

/* ---------- mapeo de columnas ---------- */
.mapeo{display:flex;flex-direction:column;gap:7px}
.mapeo-fila{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:center;
  border:1px solid var(--linea);border-radius:8px;padding:9px 11px;background:var(--alto)}
.mapeo-org{min-width:0}
.mapeo-org strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapeo-org em{font-style:normal;font-family:var(--dato);font-size:10.5px;color:var(--tenue);
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.mapeo-fila select{padding:8px 10px;border:1px solid var(--linea);border-radius:6px;
  background:var(--alto);font-size:13px}
#imp-texto{font-family:var(--dato);font-size:11.5px;white-space:pre;overflow-x:auto}
@media(max-width:860px){.mapeo-fila{grid-template-columns:1fr;gap:7px}}

/* ---------- filas de pajilla ---------- */
.pajilla-fila{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:11px;
  border:1px solid var(--linea);border-radius:9px;padding:13px 34px 13px 13px;margin-bottom:9px;
  background:rgba(var(--tinta-rgb),.02)}
.pajilla-fila .pajilla-ancha{grid-column:1/-1}
.quita-pajilla{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:6px;
  border:1px solid var(--linea);background:var(--alto);color:var(--tenue);font-size:15px;
  line-height:1;padding:0;display:grid;place-items:center}
.quita-pajilla:hover{border-color:var(--hierro);color:var(--hierro)}
@media(max-width:860px){.pajilla-fila{grid-template-columns:1fr}}

/* ---------- desplegable con buscador ---------- */
.combo{position:relative}
.combo-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 11px;border:1px solid var(--linea);border-radius:7px;background:var(--alto);
  text-align:left;font-size:14px;color:var(--tinta)}
.combo-btn:hover{border-color:var(--tenue)}
.combo.abierto .combo-btn{border-color:var(--pasto);box-shadow:0 0 0 2px rgba(var(--pasto-rgb),.15)}
.combo-btn.vacio .combo-txt{color:var(--tenue)}
.combo-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-flecha{color:var(--tenue);font-size:12px;flex:none}
.combo-panel{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;
  background:var(--alto);border:1px solid var(--tenue);border-radius:9px;overflow:hidden;
  box-shadow:0 12px 30px -8px rgba(var(--sombra-rgb),.35)}
.combo-busca{width:100%;border:0;border-bottom:1px solid var(--linea);padding:10px 12px;
  font-size:14px;background:var(--papel-alto,var(--alto));outline:0}
.combo-lista{list-style:none;margin:0;padding:4px;max-height:238px;overflow-y:auto}
.combo-lista li{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;
  align-items:baseline;gap:9px;justify-content:space-between;font-size:13.5px}
.combo-lista li:hover{background:rgba(var(--pasto-rgb),.1)}
.combo-lista li em{font-style:normal;font-size:11.5px;color:var(--tenue);flex:none;
  font-family:var(--dato)}
.combo-lista li.combo-grupo{font-family:var(--dato);font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tenue);cursor:default;padding:9px 10px 4px;background:none}
.combo-lista li.combo-grupo:hover{background:none}
.combo-lista li.combo-vacio{color:var(--tenue);font-style:italic}
.combo-nada{padding:11px 12px;font-size:12.5px;color:var(--tenue);border-top:1px solid var(--linea)}
@media(max-width:860px){
  .combo-btn{padding:12px;font-size:16px}
  .combo-busca{font-size:16px;padding:12px}
  .combo-lista{max-height:46vh}
  .combo-lista li{padding:11px 10px;font-size:15px}
}

/* ---------- modo selección ---------- */
.celda-sel{width:38px;padding-left:13px!important;padding-right:0!important}
.celda-sel input{width:17px;height:17px;accent-color:var(--pasto);margin:0;cursor:pointer}
tbody tr.marcada td{background:rgba(var(--pasto-rgb),.09)!important}
.tarjeta{position:relative}
.marca-tarjeta{position:absolute;top:11px;right:11px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--linea);display:grid;place-items:center;font-size:12px;
  background:var(--alto);color:var(--papel)}
.marca-tarjeta.on{background:var(--pasto);border-color:var(--pasto);color:var(--sobre-chapeta)}
.barra-sel{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;
  background:var(--rail-bg);color:var(--rail-fg);border-radius:11px;padding:11px 15px;
  display:flex;align-items:center;gap:15px;flex-wrap:wrap;
  box-shadow:0 12px 34px -8px rgba(0,0,0,.5);font-size:13.5px;max-width:calc(100vw - 24px)}
.barra-sel strong{font-family:var(--dato);font-size:15px}
.barra-sel-btns{display:flex;gap:7px;flex-wrap:wrap}
.barra-sel .btn{background:rgba(var(--papel-rgb),.1);border-color:rgba(var(--papel-rgb),.22);
  color:var(--rail-fg)}
.barra-sel .btn:disabled{opacity:.42}
.barra-sel .btn:hover{background:rgba(var(--papel-rgb),.2)}
.barra-sel .btn-baja{color:#f0a08c;border-color:rgba(var(--hierro-rgb),.4);background:transparent}
@media(max-width:860px){
  .barra-sel{left:10px;right:10px;transform:none;bottom:calc(12px + env(safe-area-inset-bottom));
    justify-content:space-between}
  .celda-sel{display:none}
  tbody tr.marcada{outline:2px solid var(--pasto);outline-offset:-1px}
}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--rail-bg);color:var(--rail-fg);padding:11px 18px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}

/* ==========================================================
   MÓVIL
   La app se usa en el corral, con una mano y a veces con guantes.
   ========================================================== */
.topbar{display:none}
.rail-fondo{display:none}
.banda-nueva{background:rgba(var(--chapeta-rgb),.16);border:1px solid var(--chapeta-b);color:var(--tinta);
  border-radius:9px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.banda-nueva strong{display:block;margin-bottom:2px}
.banda-nueva span{color:var(--tinta2);font-size:12.5px}
.banda-riesgo{background:var(--hierro);color:var(--sobre-chapeta);padding:9px 14px;font-size:12.5px;line-height:1.45}
.banda-riesgo strong{display:block}

@media (max-width:860px){
  html,body{overflow-x:hidden}

  /* ---- barra superior con el menú ---- */
  .topbar{display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:45;
    background:var(--rail-bg);color:var(--rail-fg);padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .menu-btn{background:none;border:1px solid rgba(var(--papel-rgb),.22);color:var(--rail-fg);
    width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;padding:0}
  .menu-btn:active{background:rgba(var(--papel-rgb),.12)}
  .topbar-tit{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.02em;
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .ver-chip{border-color:rgba(var(--papel-rgb),.22);color:rgba(var(--papel-rgb),.55)}
  .topbar-giro{background:rgba(var(--papel-rgb),.1);border:1px solid rgba(var(--papel-rgb),.2);
  color:var(--rail-fg);width:32px;height:32px;border-radius:8px;font-size:15px;line-height:1;
  padding:0;display:grid;place-items:center;flex:none}
.topbar-giro.on{background:rgba(var(--chapeta-rgb),.2);border-color:rgba(var(--chapeta-rgb),.45);
  color:var(--chapeta)}
.topbar-alertas{background:var(--hierro);color:var(--sobre-chapeta);font-family:var(--dato);font-size:11px;
    border-radius:20px;padding:4px 10px;border:0;flex:none}

  /* ---- cajón lateral ---- */
  .marco{grid-template-columns:1fr;height:auto;min-height:100vh}
  .rail{position:fixed;top:0;bottom:0;left:0;width:262px;max-width:84vw;transform:translateX(-100%);
    transition:transform .22s ease;z-index:70;padding-top:calc(18px + env(safe-area-inset-top));
    padding-bottom:calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
  .rail.abierto{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.35)}
  .rail-fondo{display:block;position:fixed;inset:0;background:rgba(var(--tinta-rgb),.5);z-index:65;
    opacity:0;pointer-events:none;transition:opacity .22s}
  .rail-fondo.visible{opacity:1;pointer-events:auto}
  .nav button{padding:12px 11px;font-size:14.5px}

  .lienzo{padding:calc(62px + env(safe-area-inset-top)) 13px calc(40px + env(safe-area-inset-bottom))}
  .cab h1{font-size:23px}
  .cab{margin-bottom:14px}
  .cab > .btn{width:100%}
  .banda-riesgo{margin:0 -13px 14px;border-radius:0}

  /* ---- filtros ---- */
  .barra{gap:7px}
  .busca{flex:1 1 100%}
  .barra select{flex:1 1 calc(50% - 4px);min-width:0}
  .fichas{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -13px 14px;padding:0 13px 3px}
  .fichas::-webkit-scrollbar{display:none}
  .ficha{flex:none}
  .conteos{grid-template-columns:1fr 1fr;gap:7px}
  .conteo dd{font-size:21px}

  /* ---- tablas convertidas en tarjetas ---- */
  .tabla-caja{border:0;border-radius:0;background:transparent;overflow:visible}
  .tabla-caja table,.sub-tabla table{display:block}
  .tabla-caja thead,.sub-tabla thead{display:none}
  .tabla-caja tbody,.sub-tabla tbody{display:block}
  .sub-tabla{border:0;background:transparent}

  .tabla-caja tbody tr,.sub-tabla tbody tr{display:block;background:var(--alto);
    border:1px solid var(--linea);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .tabla-caja tbody tr.grupo,.sub-tabla tbody tr.grupo{background:transparent;border:0;
    margin:15px 0 7px;padding:0}
  .tabla-caja tbody tr.grupo:first-child{margin-top:0}
  tr.grupo td{display:block;padding:0;border:0;background:transparent}

  .tabla-caja tbody td,.sub-tabla tbody td{display:flex;align-items:baseline;gap:12px;
    justify-content:space-between;text-align:right;padding:8px 13px;border:0;
    border-bottom:1px dashed var(--linea)}

/** Cómo se le dice al macho de esa especie: toro, verraco, carnero… */
function machoDe(especie) {
  const e = Object.entries(CATEGORIAS)
    .find(([, c]) => c.especie === especie && c.sexo === "M" && c.etapa === "adulto");
  return e ? e[1].et.toLowerCase() : "macho";
}

/** Razas de una especie, más las que ya se hayan escrito a mano. */
function razasDe(especie) {
  const base = RAZAS[especie] || [];
  const usadas = D.animales
    .filter(a => especieDe(a) === especie && a.raza)
    .map(a => a.raza);
  return [...new Set([...base, ...usadas])].sort((a, b) => a.localeCompare(b, "es"));
}

/** Solo las hembras que ya salieron de cría se pueden servir. */

function par(a) {
  const c = CATEGORIAS[a?.categoria] || CATEGORIAS.vaca;
  const base = ESPECIES[c.especie];
  const cfg = D?.config?.params?.[c.especie] || {};
  // El orden importa: los parámetros vienen de la especie, pero el nombre
  // ("Vaca", "Cabra") sale de la categoría.
  return { ...base, ...cfg, ...c,
           etEspecie: base.et, plural: base.plural,
           sirve: puedeServir(c) ? 1 : 0, especie: c.especie };
}

const HOY = () => new Date(new Date().toDateString());
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- fechas ---------- */
function aFecha(s) { return s ? new Date(s + "T12:00:00") : null; }
/** La fecha de hoy en la hora de la finca. Con toISOString se calculaba en
    hora de Londres: en Colombia, todo lo anotado después de las 7 p. m.
    quedaba con la fecha del día siguiente. */
function aISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function hoyISO() { return aISO(new Date()); }
/** Solo la parte de fecha, a medianoche local. */
function aMedianoche(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

/** Días completos entre dos fechas. Ambas se normalizan a medianoche para
    que no se pierda un día por la hora ni por el cambio de horario. */
function dias(desde, hasta) {
  if (!desde) return null;
  const a = aMedianoche(typeof desde === "string" ? aFecha(desde) : desde);
  const b = aMedianoche(hasta ? (typeof hasta === "string" ? aFecha(hasta) : hasta) : new Date());
  return Math.round((b - a) / 86400000);
}
function fmt(s) {
  if (!s) return "—";
  const d = aFecha(s);
  const m = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtCorto(s) {
  if (!s) return "—";
  const d = aFecha(s);
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getFullYear()).slice(2)}`;
}
/* ----------------------------------------------------------
   DIFERENCIA DE CALENDARIO
   Los meses no miden lo mismo: febrero tiene 28 y mayo 31.
   Contamos meses corridos de fecha a fecha y el resto en dias,
   igual que la formula de la app anterior.
   ---------------------------------------------------------- */
function difCalendario(desde, hasta) {
  if (!desde) return null;
  const a = typeof desde === "string" ? aFecha(desde) : desde;
  const b = hasta ? (typeof hasta === "string" ? aFecha(hasta) : hasta) : HOY();
  if (b < a) return { meses: 0, dias: 0 };

  const meses = (b.getFullYear() - a.getFullYear()) * 12
              + (b.getMonth() - a.getMonth())
              - (b.getDate() < a.getDate() ? 1 : 0);

  // Dias del mes en que cae la fecha de partida (equivale a EOMONTH(desde, 0)).
  const finDeMes = new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate();
  const dias = b.getDate() >= a.getDate()
    ? b.getDate() - a.getDate()
    : finDeMes - a.getDate() + b.getDate();

  return { meses: Math.max(0, meses), dias: Math.max(0, dias) };
}

/** Resta meses de calendario sin pasarse de fin de mes (31 ene − 1 mes = 28 feb). */
function restarMeses(iso, n) {
  const d = aFecha(iso);
  const dia = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() - (Number(n) || 0), 1, 12);
  const ultimo = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(dia, ultimo));
  return t;
}

/** "8 meses y 4 días", "21 días", "3 meses" o "0". */
function textoCalendario(desde, hasta) {
  const d = difCalendario(desde, hasta);
  if (!d) return "0";
  const m = d.meses ? `${d.meses} ${d.meses === 1 ? "mes" : "meses"}` : "";
  const s = d.dias  ? `${d.dias} ${d.dias === 1 ? "día" : "días"}`     : "";
  if (m && s) return `${m} y ${s}`;
  return m || s || "0";
}

/** Aproximacion por dias sueltos. Se usa donde no hay una fecha de partida. */
function enMesesDias(n) {
  if (n === null || n === undefined || n < 0) return "—";
  const meses = Math.floor(n / 30.44);
  const resto = Math.round(n - meses * 30.44);
  if (meses === 0) return `${resto} ${resto === 1 ? "día" : "días"}`;
  if (resto === 0) return `${meses} ${meses === 1 ? "mes" : "meses"}`;
  return `${meses} ${meses === 1 ? "mes" : "meses"} y ${resto} ${resto === 1 ? "día" : "días"}`;
}
function mesesEntre(desde) {
  const d = dias(desde);
  return d === null ? null : Math.floor(d / 30.44);
}
function sumarDias(s, n) {
  const d = aFecha(s);
  d.setDate(d.getDate() + n);
  return aISO(d);
}
/* ----------------------------------------------------------
   TEMA
   "auto" sigue lo que tenga puesto el sistema.
   ---------------------------------------------------------- */
const TEMAS = { auto: "Automático", claro: "Claro", oscuro: "Oscuro" };

function temaEfectivo() {
  const t = D?.config?.tema || "auto";
  if (t !== "auto") return t;
  try {
    return window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
  } catch { return "claro"; }
}

   En el corral, con el celular en la mano y agachado, la pantalla
   se voltea sola y estorba. Esto la deja quieta hasta que se
   pulse el botón.
