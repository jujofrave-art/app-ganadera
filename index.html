function selectorFinca() {
  return `<select data-f="finca">
    <option value="todas">Todas las fincas</option>
    ${misFincasObj().map(f => `<option value="${f.id}" ${V.finca===f.id?"selected":""}>${esc(f.nombre)}</option>`).join("")}
  </select>`;
}
/** Solo aparece si en la finca hay más de una especie. */
/** Cómo va la sincronización, en una línea. */
function estadoSync() {
  const sinRed = typeof navigator !== "undefined" && navigator.onLine === false;
  if (!D.config.firebase) return { clase: "", texto: "○ Solo en este equipo", corto: "Local" };
  if (FB.estado === "cargando") return { clase: "cargando", texto: "◍ Conectando…", corto: "…" };
  if (!FB.user) return { clase: "", texto: "○ Falta iniciar sesión", corto: "Entrar" };
  const fallos = Object.keys(FB.falloSubida || {});
  if (fallos.length) return { clase: "error",
    texto: `▲ No sube: ${fallos.slice(0, 2).join(", ")}${fallos.length > 2 ? "…" : ""}`,
    corto: "!" };
  if (FB.estado === "error") return { clase: "error", texto: "▲ Error de conexión", corto: "Error" };
  if (sinRed || FB.enCache) {
    return FB.sinSubir
      ? { clase: "espera", texto: `◌ Sin señal · ${FB.sinSubir} por subir`, corto: `${FB.sinSubir}` }
      : { clase: "espera", texto: "◌ Sin señal · al día", corto: "Sin señal" };
  }
  if (FB.sinSubir) return { clase: "espera", texto: `↑ Subiendo ${FB.sinSubir}…`, corto: `↑${FB.sinSubir}` };
  return { clase: "listo", texto: "● Todo guardado", corto: "OK" };
}

function selectorEspecie() {
  const hay = [...new Set(misAnimales().map(especieDe))];
  if (hay.length < 2) return "";
  return `<select data-f="especie">
    <option value="todas">Todas las especies</option>
    ${hay.map(e => `<option value="${e}" ${V.especie===e?"selected":""}>${ESPECIES[e].plural}</option>`).join("")}
  </select>`;
}

function buscador(ph) {
  return `<div class="busca">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input data-f="busca" value="${esc(V.busca)}" placeholder="${ph}" aria-label="Buscar">
  </div>`;
}
function fichas(lista) {
  return `<div class="fichas">${lista.map(([v, et, n]) =>
    `<button class="ficha ${V.sub===v?"on":""}" data-sub="${v}">${et}${n!==undefined?`<b>${n}</b>`:""}</button>`
  ).join("")}</div>`;
}
/** Avisa cuando la lista puede estar incompleta por el recorte de fechas. */
function avisoRecorte(coleccion) {
  if (!CON_VENTANA[coleccion] || !FB.user) return "";

  // Falta el índice compuesto: la app se recuperó sola bajando todo. Antes
  // lo hacía callada y no había forma de saber por qué salía de más.
  if (FB.sinIndice?.has(coleccion)) return `<div class="nota" style="display:flex;
    align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap">
    <span>Falta un índice en Firestore para esta tabla, así que se está trayendo
    <strong>todo el historial</strong> sin recorte de fechas. Se arregla creando el
    índice desde Configuración → «¿Por qué no cargan los datos?».</span>
    <button class="btn btn-sm" data-ir="configuracion">Ir a Configuración</button>
  </div>`;

  // Cuando está bajando todo, se ofrece volver al recorte.
  if (sinRecorte()) return `<div class="nota" style="display:flex;
    align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap">
    <span>Estás viendo <strong>todo el historial</strong>, sin recorte de fechas.
    ${!FB.todoElHistorial ? "Así quedó configurado en este equipo." : ""}</span>
    <button class="btn btn-sm" data-acc="volver-recorte">Volver a los últimos meses</button>
  </div>`;

  if (!historialRecortado()) return "";
  return `<div class="nota recorte">
    Solo se muestran los registros desde el <strong>${fmt(FB.corte)}</strong>.
    Lo anterior sigue guardado en Firebase.
    <button class="btn btn-sm" data-acc="todo-historial">Traer todo</button>
  </div>`;
}

function vacio(t, p, btn) {
  return `<div class="vacio"><h2>${t}</h2><p>${p}</p>${btn||""}</div>`;
}
function tabla(cols, filas) {
  if (!filas.trim()) return vacio("Nada por aquí", "Ajusta los filtros o la búsqueda para ver más registros.");
  return `<div class="tabla-caja"><table>
    <thead><tr>${cols.map(c => `<th class="${c.num?"num":""}">${c.et}</th>`).join("")}<th></th></tr></thead>
    <tbody>${filas}</tbody></table></div>`;
}
/** Agrupa filas por finca como en AppSheet. */
function agrupado(items, fn) {
  const por = {};
  items.forEach(i => { (por[i._finca] ||= []).push(i); });
  return Object.entries(por).map(([f, arr]) =>
    `<tr class="grupo"><td colspan="9">${esc(f)}<span class="n">${arr.length}</span></td></tr>` +
    arr.map(fn).join("")
  ).join("");
}
const persona = (id) => D.personas.find(p => p.id === id);
const personasDe = (fincaId) => (finca(fincaId)?.personas || []).map(persona).filter(Boolean);
const fincasDe = (personaId) => D.fincas.filter(f => (f.personas || []).includes(personaId));

function celdaAnimal(a) {
  return `<td><div class="nom">${esc(a.nombre)}</div></td>
          <td><span class="chap ${a.estado!=="activo"?"gris":""}">${esc(a.chapeta)}</span></td>`;
}

/* ==========================================================
   VISTAS
   ========================================================== */
function cuerpo(v) {
  const mapa = {
    alertas: vAlertas, activos: vActivos, salidas: vSalidas, fincas: vFincas,
    palpacion: vPalpacion, inseminacion: vInseminacion, partos: vPartos,
    secados: vSecados, leche: vLeche, tratamientos: vTratamientos, anotaciones: vAnotaciones,
    superadmins: () => vPersonas("superadmin"),
    duenos: () => vPersonas("dueno"),
    administradores: () => vPersonas("administrador"),
    empleados: () => vPersonas("empleado"),
    configuracion: vConfiguracion,
  };
  return mapa[v.id]();
}

/* ---------- ALERTAS ---------- */
function vAlertas() {
  const todas = alertas(true);
  const pend = todas.filter(x => !x.hecha);
  let L = (V.sub === "hechas" ? todas.filter(x => x.hecha) : pend)
    .filter(x => filtroFinca(x.fincaId) && busca(idxAlerta(x)));
  if (["alta","media","baja"].includes(V.sub)) L = L.filter(x => x.nivel === V.sub);

  return `
  <header class="cab"><div><h1>Alertas</h1>
    <p>Se calculan solas a partir de los eventos. Marca «Listo» cuando la resuelvas.</p></div>
    ${puede("eventos") && pend.some(x => String(x.clave || "").startsWith("palpar:"))
      ? '<button class="btn" data-acc="palpar-grupo">Palpar en grupo</button>' : ""}</header>
  <div class="barra">${buscador("Buscar en las alertas")}${selectorFinca()}</div>
  ${fichas([["todos","Pendientes",pend.length],
            ["alta","Urgente",pend.filter(x=>x.nivel==="alta").length],
            ["media","Pronto",pend.filter(x=>x.nivel==="media").length],
            ["baja","Aviso",pend.filter(x=>x.nivel==="baja").length],
            ["hechas","Hechas",todas.filter(x=>x.hecha).length]])}
  ${L.length === 0
    ? vacio(V.sub === "hechas" ? "Nada marcado como hecho" : "Sin alertas pendientes",
            V.sub === "hechas" ? "Aquí aparecen las que vayas resolviendo."
                               : "Todo al día con los filtros actuales.")
    : L.map(x => `<div class="alerta-caja" data-n="${x.hecha ? "hecha" : x.nivel}">
        <span class="chap" data-abrir="${x.animalId}">${esc(x.chapeta)}</span>
        <div class="cu" data-abrir="${x.animalId}">
          <strong>${esc(x.nombre)} — ${esc(x.titulo)}</strong>
          <span>${esc(x.detalle)}</span>
          ${x.hecha ? `<span class="hecha-el">Hecha el ${fmt(x.hecha)}</span>` : ""}
        </div>
        <div class="alerta-acc">
          <span class="q">${esc(nombreFinca(x.fincaId))}</span>
          ${x.hecha
            ? `<button class="btn btn-sm" data-deshacer="${x.animalId}|${esc(x.clave)}">Deshacer</button>`
            : x.clave && puede("eventos")
              ? `<button class="btn btn-sm btn-listo"
                   data-listo="${x.animalId}|${esc(x.clave)}|${x.accion || ""}">Listo</button>`
              : ""}
        </div>
      </div>`).join("")}`;
}

/* ---------- ACTIVOS ---------- */
function vActivos() {
  let L = misAnimales().filter(a => a.estado === "activo" && filtroFinca(a.fincaId) && filtroEspecie(a))
    .map(a => ({ a, e: estado(a), _finca: nombreFinca(a.fincaId) }))
    .filter(({a}) => busca(idxAnimal(a)));

  const todos = misAnimales().filter(a => a.estado === "activo" && filtroEspecie(a)).map(a => estado(a).etapa);
  if (V.sub !== "todos") L = L.filter(x => x.e.etapa === V.sub ||
    (V.sub === "levante" && x.e.etapa === "levante"));

  L.sort((x, y) => x.a.nombre.localeCompare(y.a.nombre));

  const cols = [{et:"Nombre"},{et:"Chapeta"},{et:"Etapa"},{et:"Meses vacía"},
                {et:"Meses gestación"},{et:"Alerta celo"},{et:"Días entre servicios",num:1},{et:"Total partos",num:1}];

  return `
  <header class="cab"><div><h1>Activos</h1>
    <p>${L.length} de ${todos.length} animales en el hato</p></div>
    <button class="btn btn-firme" data-nuevo="animal">Añadir animal</button></header>
  <div class="barra">${buscador("Buscar en todo: nombre, chapeta, raza, pajilla, detalles…")}${selectorFinca()}${selectorEspecie()}</div>
  ${fichas([["todos","Todos",todos.length],
            ["levante","Levante",todos.filter(e=>e==="levante").length],
            ...["produccion","gestante","con_cria","seca","macho","sin_datos"]
              .map(k=>[k,ETAPAS[k].et,todos.filter(e=>e===k).length]).filter(x=>x[2]>0)])}
  ${tabla(cols, agrupado(L, ({a, e}) => {
    const et = ETAPAS[e.etapa];
    return `<tr class="fila" data-abrir="${a.id}">
      ${celdaAnimal(a)}
      <td><span class="p ${et.cl}">${et.et}</span></td>
      <td>${e.mesesVacia}</td>
      <td>${e.gestacion}</td>
      <td>${e.alertaCelo
            ? `<span class="p ${e.alertaCelo.nivel === "alta" ? "roja" : "ambar"}">${e.alertaCelo.texto}</span>`
            : '<span class="sub">—</span>'}</td>
      <td class="num">${e.diasEntreInsem === null ? "—"
        : `<span class="apilado">${e.diasEntreInsem}<em>${e.motivoDias === "repeticion" ? "repitió" : "tras el parto"}</em></span>`}</td>
      <td class="num">${e.totalPartos}</td>
      <td class="flecha">›</td></tr>`;
  }))}`;
}

/* ---------- LECHE ---------- */
function vLeche() {
  const mias = misFincas();
  let L = (D.leche || []).filter(r => mias.includes(r.fincaId) && filtroFinca(r.fincaId))
    .filter(r => busca(idxLeche(r)));
  if (V.sub === "animal") L = L.filter(r => r.animalId);
  if (V.sub === "finca")  L = L.filter(r => !r.animalId);
  L.sort((a, b) => b.fecha.localeCompare(a.fecha));

  const epoca = V.epoca || "semana";
  const res = resumenLeche(L, epoca);
  const modo = V.graficoLeche === "vaca" ? "porVaca" : "promedio";
  const tope = Math.max(1, ...res.map(r => r[modo]));

  // Totales de los últimos 30 días, para tener una referencia rápida.
  const ult30 = L.filter(r => dias(r.fecha) <= 30);
  const litros30 = ult30.reduce((t, r) => t + (Number(r.litros) || 0), 0);
  const dias30 = ult30.reduce((t, r) => t + Math.max(1, Number(r.dias) || 1), 0);
  const hayPrecio = L.some(r => Number(r.precio) > 0);
  // Las pestañas contaban toda la leche del usuario aunque hubiera una finca
  // seleccionada: decían «Todo 300» encima de una lista de 40.
  const total = D.leche.filter(r => mias.includes(r.fincaId) && filtroFinca(r.fincaId));

  // Vacas en producción hoy, solo en las fincas que se estén viendo.
  const alcance = V.finca === "todas" ? mias : [V.finca];
  const vacasHoy = alcance.reduce((t, f) => t + vacasEnProduccion(f, hoyISO()), 0);

  // Y el promedio ponderado de los últimos 30 días.

/**
 * Cuánto da cada vaca y cómo se compara con las demás.
 *
 * Solo entran los días en que estaba en producción. Lo anotado a una vaca
 * seca, a un macho o a una que ya salió del hato se aparta y se cuenta al
 * final, para que se vea que hay algo que corregir en vez de que ensucie
 * el promedio en silencio.
 */
function rankingVacas(L) {
  const por = new Map();
  let apartados = 0;
  for (const r of L) {
    if (!r.animalId) continue;
    const a = animal(r.animalId);
    if (!a) continue;
    if (!enProduccionEn(a, r.fecha)) { apartados++; continue; }
    const o = por.get(r.animalId) || { a, lt: 0, dd: 0, n: 0 };
    o.lt += Number(r.litros) || 0;
    o.dd += Math.max(1, Number(r.dias) || 1);
    o.n++;
    por.set(r.animalId, o);
  }
  const filas = [...por.values()].map(o => ({ ...o, prom: o.dd ? o.lt / o.dd : 0 }))
    .sort((x, y) => y.prom - x.prom);
  if (!filas.length) return apartados
    ? `<div class="nota">Los ${apartados} registros por animal que hay aquí son de vacas que
       no estaban en producción ese día, así que no se puede sacar promedio.</div>`
    : "";

  const ltT = filas.reduce((t, o) => t + o.lt, 0);
  const ddT = filas.reduce((t, o) => t + o.dd, 0);
  const media = ddT ? ltT / ddT / filas.length : 0;
  const mediaVaca = filas.reduce((t, o) => t + o.prom, 0) / filas.length;

  return `
  <div class="seccion"><h3>Promedio por vaca <span class="p gris">${filas.length}</span></h3>
    <p class="mini">Contra el promedio de las ${filas.length} vacas medidas:
      <strong>${litros(mediaVaca)}</strong> litros al día cada una.
      ${apartados ? `Se apartaron ${apartados} registro(s) de vacas que no estaban en
        producción ese día.` : ""}</p>
    <div class="sub-tabla"><table>
      <thead><tr><th>Vaca</th><th>Registros</th><th>Litros</th><th>Días</th>
        <th>Prom. al día</th><th>Contra el promedio</th></tr></thead>
      <tbody>${filas.map(o => {
        const p = mediaVaca ? o.prom / mediaVaca : 0;
        const cl = p >= 1.1 ? "verde" : p <= 0.9 ? "roja" : "gris";
        return `<tr class="fila" data-abrir="${o.a.id}">
          <td><span class="chap">${esc(o.a.chapeta)}</span> ${esc(o.a.nombre)}</td>
          <td class="num">${o.n}</td>
          <td class="num">${litros(o.lt)}</td>
          <td class="num">${o.dd}</td>
          <td class="num"><strong>${litros(o.prom)}</strong></td>
          <td><span class="p ${cl}">${Math.round(p * 100)}%</span></td></tr>`;
      }).join("")}</tbody></table></div></div>`;
}

let hojaAbierta = null;

function abrirHoja(html, ancha) {
  cerrarHoja();
  const d = document.createElement("div");
  d.className = "velo";
  d.innerHTML = `<div class="hoja ${ancha?"ancha":""}" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener("mousedown", e => { if (e.target === d) cerrarHoja(); });
  document.body.appendChild(d);
  document.body.style.overflow = "hidden";   // que el fondo no se desplace
  hojaAbierta = d;
  conectarHoja(d);
  // En móvil no enfocamos solos: abriría el teclado y taparía el formulario.
  if (window.innerWidth > 860) d.querySelector("input,select,textarea")?.focus();
}
function cerrarHoja() {
  hojaAbierta?.remove();
  hojaAbierta = null;
  document.body.style.overflow = "";
}
function avisar(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function persistir(msg) {
  recalcularAccesos();   // cada evento debe llevar su fincaId para las reglas
  guardar(); cerrarHoja(); pintar(); if (msg) avisar(msg);
}

        así que los totales de arriba pueden quedarse cortos.</span>
        <button class="btn btn-sm">Ver todo su historial</button></div>`) : ""}

      ${a.detalles ? `<div class="seccion"><h3>Detalles</h3><p class="mini" style="font-style:normal;color:var(--tinta2)">${esc(a.detalles)}</p></div>` : ""}

      ${subTabla("Inseminaciones", insems.length,
        (puedoEditarAnimal(a) ? `<button class="btn btn-sm" data-nuevo="inseminacion" data-an="${id}">Añadir</button>` : ""),
        ["Fecha","Intento","Pajillas","Detalles","Estatus"],
        insems.map(i => { const c = servicioCalc(i); const r = RESULTADOS[c.resultado];
          return `<tr class="fila" data-ev="insem:${i.id}">
            <td>${fmtCorto(i.fecha)}</td><td class="num">${c.intento}</td>
            <td>${esc(pajillasDe(i))}${(i.aplicaciones || []).length > 1
              ? `<div class="sub">${esc(aplicacionesTexto(i))}</div>` : ""}</td>
            <td><span class="sub">${esc(i.detalles) || "—"}</span></td>
            <td><span class="p ${r.cl}">${r.et}</span></td></tr>`; }).join(""))}

      ${subTabla("Partos-Abortos", partos.length,
        (puedoEditarAnimal(a) ? `<button class="btn btn-sm" data-nuevo="parto" data-an="${id}">Añadir</button>` : ""),
        ["Fecha","Tipo","Sexo cría","Detalles"],
        partos.map(p => `<tr class="fila" data-ev="parto:${p.id}">
            <td>${fmtCorto(p.fecha)}</td>
            <td><span class="p ${p.tipo === "parto" ? "verde" : "roja"}">${p.tipo === "parto" ? "Parto" : "Aborto"}</span></td>
            <td>${esc(p.sexoCria) || "—"}</td><td><span class="sub">${esc(p.detalles) || "—"}</span></td></tr>`).join(""))}

      ${subTabla("Palpaciones", palps.length,
        (puedoEditarAnimal(a) ? `<button class="btn btn-sm" data-nuevo="palpacion" data-an="${id}">Añadir</button>` : ""),
        ["Fecha","Resultado","De cuánto","Parto probable","Observaciones"],
        palps.map(p => `<tr class="fila" data-ev="palp:${p.id}">
            <td>${fmtCorto(p.fecha)}</td>
            <td><span class="p ${p.resultado === "prenada" ? "verde" : "roja"}">${p.resultado === "prenada" ? "Preñada" : "Vacía"}</span></td>
            <td>${p.resultado === "prenada"
              ? `${p.mesesGest || 0} m ${p.diasGest || 0} d${p.manda
                  ? ' <span class="p verde">manda</span>' : ""}`
              : "—"}</td>
            <td>${p.resultado === "prenada" ? fmtCorto(partoDePalpacion(p, a)) : "—"}</td>
            <td><span class="sub">${esc(p.observaciones) || "—"}</span></td></tr>`).join(""))}

      ${!P.lechero && secadosDe(id).length === 0 ? "" : subTabla("Secados", secadosDe(id).length,
        (puedoEditarAnimal(a) ? `<button class="btn btn-sm" data-nuevo="secado" data-an="${id}">Añadir</button>` : ""),
        ["Fecha","Motivo","Observaciones"],
        secadosDe(id).map(x => `<tr class="fila" data-ev="secado:${x.id}">
            <td>${fmtCorto(x.fecha)}</td><td>${MOTIVOS_SECADO[x.motivo] || "—"}</td>
            <td><span class="sub">${esc(x.observaciones) || "—"}</span></td></tr>`).join(""))}

      ${(() => {
        if (!P.lechero || !P.sirve) return "";
        const suya = (D.leche || []).filter(r => r.animalId === id)
          .sort((x, y) => y.fecha.localeCompare(x.fecha));
        const pr = promedioLecheAnimal(id, null);
        if (!suya.length) return "";
        return `
        ${pr && pr.registros ? `<dl class="plan">
          <div><dt>Da al día</dt><dd>${litros(pr.suya)} L</dd></div>
          <div><dt>Medida en</dt><dd>${pr.dias} días</dd></div>
          ${pr.fincaPorVaca ? `<div><dt>${pr.deTanque ? "Promedio del tanque" : "Promedio de las medidas"}</dt>
            <dd>${litros(pr.fincaPorVaca)} L por vaca</dd></div>
          <div><dt>Contra ese promedio</dt>
            <dd><span class="p ${pr.parte >= 1.1 ? "verde" : pr.parte <= 0.9 ? "roja" : "gris"}">${
              Math.round(pr.parte * 100)}%</span></dd></div>` : ""}
          ${pr.descartados ? `<div><dt>Sin contar</dt><dd>${pr.descartados}</dd>
            <span class="sub">días en que no estaba en producción</span></div>` : ""}
        </dl>` : `<div class="nota">Tiene ${suya.length} registro(s) de leche, pero ninguno cae
          en un día en que estuviera en producción, así que no se le puede sacar promedio.</div>`}

        ${subTabla("Leche", suya.length,
          (puedoEditarAnimal(a) ? `<button class="btn btn-sm" data-nuevo="leche" data-an="${id}">Añadir</button>` : ""),
          ["Fecha","Litros","Días","Al día","Cuenta"],
          suya.slice(0, 40).map(r => {
            const dd = Math.max(1, Number(r.dias) || 1);
            const ok = enProduccionEn(a, r.fecha);
            return `<tr class="fila" data-ev="leche:${r.id}">
              <td>${fmtCorto(r.fecha)}</td>
              <td class="num">${litros(r.litros)}</td>
              <td class="num">${dd}</td>
              <td class="num">${litros((Number(r.litros) || 0) / dd)}</td>
              <td>${ok ? '<span class="p verde">Sí</span>'
                       : `<span class="p roja">No</span>
                          <div class="sub">${esc(motivoNoProduce(a, r.fecha))}</div>`}</td></tr>`;
          }).join(""))}`;
      })()}

      ${subTabla("Tratamientos", trats.length,
        (puedoEditarAnimal(a) ? `<button class="btn btn-sm" data-nuevo="tratamiento" data-an="${id}">Añadir</button>` : ""),
        ["Inicio","Fin","Tipo","Detalles"],
        trats.map(t => `<tr class="fila" data-ev="trat:${t.id}">
            <td>${fmtCorto(t.inicio)}</td><td>${t.fin ? fmtCorto(t.fin) : "—"}</td>
            <td>${esc(t.tipo)}</td><td><span class="sub">${esc(t.detalles) || "—"}</span></td></tr>`).join(""))}
    </div>
    <div class="hoja-pie">
      <button class="btn" data-cerrar>Cerrar</button>
      ${puedoEditarAnimal(a)
        ? `<button class="btn btn-firme" data-editar="animal:${id}">Editar animal</button>`
        : a.estado !== "activo"
          ? `<span class="ayuda" style="align-self:center">Solo un dueño puede editar un animal ${a.estado}.</span>`
          : ""}
    </div>`, true);
}

function subTabla(titulo, n, boton, cols, filas) {
  return `<div class="seccion"><h3>${titulo} <span class="p gris">${n}</span>${boton}</h3>
    ${n === 0 ? '<p class="mini">Sin registros.</p>' : `<div class="sub-tabla"><table>
      <thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${filas}</tbody></table></div>`}</div>`;
}

/* ---------- FORMULARIOS ---------- */
function formAnimal(id, estadoIni) {
  if (misFincasObj().length === 0) {
    return abrirHoja(`
      <div class="hoja-cab"><h2>Primero la finca</h2><button class="cerrar" data-cerrar>×</button></div>
      <div class="hoja-cuerpo"><p class="expl" style="margin:0">Todo animal vive en una finca,
      así que no se puede registrar ganado antes de crear al menos una.</p></div>
      <div class="hoja-pie"><button class="btn" data-cerrar>Cerrar</button>
        ${puede("editaFinca") ? '<button class="btn btn-firme" data-nuevo="finca">Crear finca</button>' : ""}
      </div>`);
  }
  // Al añadir desde la tabla de Vendido-Muerto, el estado ya viene puesto y
  // el formulario abre mostrando la fecha y el motivo de salida.
  const inicial = ["vendido", "muerto"].includes(estadoIni) ? estadoIni : "activo";
  const a = id ? animal(id) : { nombre:"", chapeta:"", fincaId:D.fincas[0]?.id, categoria:"vaca",
    estado:inicial, fechaNacimiento:"", raza:"", detalles:"", partosPrevios:0, ultimoPartoPrevio:"",
    fechaSalida:"", motivoSalida:"", observaciones:"" };
  abrirHoja(`
    <div class="hoja-cab"><h2>${id ? "Editar animal"
      : inicial === "vendido" ? "Añadir animal vendido"
      : inicial === "muerto"  ? "Añadir animal muerto"
      : "Añadir animal"}</h2>
      <button class="cerrar" data-cerrar>×</button></div>
    <form data-guardar="animal:${id||""}">
      <div class="hoja-cuerpo"><div class="aviso" data-error hidden></div><div class="rej">
        <div class="campo"><label>Chapeta</label><input name="chapeta" value="${esc(a.chapeta)}" required></div>
        <div class="campo"><label>Nombre</label><input name="nombre" value="${esc(a.nombre)}" required></div>
        <div class="campo"><label>Finca</label>${comboFincas("fincaId", a.fincaId)}</div>
        <div class="campo"><label>Especie</label><select name="especie" data-esp>
          ${Object.entries(ESPECIES).map(([k,v])=>
            `<option value="${k}" ${especieDe(a)===k?"selected":""}>${v.et}</option>`).join("")}
        </select></div>
        <div class="campo"><label>Categoría</label><div data-cat-caja></div>
          <span class="ayuda" data-gest></span></div>
        <div class="campo"><label>Raza</label><div data-raza-caja></div></div>
        <div class="campo"><label>Fecha de nacimiento</label><input type="date" name="fechaNacimiento" value="${a.fechaNacimiento||""}"></div>

        <!-- Solo para hembras adultas. El total de partos y la fecha del
             último NO se escriben: salen de la tabla de Partos. -->
        ${(() => {
          const suyos = id ? partosDe(id).filter(p => p.tipo === "parto") : [];
          const previos = Number(a.partosPrevios) || 0;
          return `<div class="campo ancho" data-solo-vaca hidden>
            <div class="nota" style="margin:0">
              ${suyos.length
                ? `Tiene <strong>${suyos.length} parto(s) registrados</strong>, el último el
                   ${fmt(suyos[0].fecha)}.`
                : previos
                  ? `Trae <strong>${previos} parto(s)</strong> de antes de la app.`
                  : `Todavía no tiene partos registrados.`}
              El total de partos y la fecha del último se calculan de la tabla de
              <strong>Partos</strong>, así que no se escriben aquí. Si trae historia
              vieja, súbela por <strong>Importar</strong> o registra los partos.
            </div></div>`;
        })()}

        <!-- Al añadir desde la tabla de Vendido-Muerto no tiene sentido
             ofrecer «En el hato»: ahí solo se registran animales que ya
             salieron. Al editar sí sale, para poder deshacer un error. -->
        <div class="campo"><label>Estado</label><select name="estado" data-estado>
          ${[["activo","En el hato"],["vendido","Vendido"],["muerto","Muerto"]]
            .filter(([v]) => !(!id && inicial !== "activo" && v === "activo"))
            .map(([v,t])=>`<option value="${v}" ${a.estado===v?"selected":""}>${t}</option>`).join("")}
        </select></div>
        <div class="campo" data-solo-salida ${a.estado==="activo"?"hidden":""}>
          <label>Fecha de salida</label>
          <input type="date" name="fechaSalida" value="${a.fechaSalida||""}">
          <span class="ayuda">Obligatoria si salió del hato</span></div>
        <div class="campo ancho" data-solo-salida ${a.estado==="activo"?"hidden":""}>
          <label>Motivo de salida</label>
          <input name="motivoSalida" value="${esc(a.motivoSalida)}"
            placeholder="A quién se vendió, causa de la muerte…"></div>
        <div class="campo ancho"><label>Detalles</label><textarea name="detalles">${esc(a.detalles)}</textarea></div>
      </div></div>
      <div class="hoja-pie">
        ${id && puede("borra") ? '<button type="button" class="btn btn-baja" data-borrar="animal:'+id+'">Eliminar</button>' : ""}
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-firme">${id ? "Guardar cambios" : "Añadir"}</button>
      </div></form>`);

  // Especie manda: la categoría se repuebla y los campos de historia
  // solo salen en hembras adultas, que son las que traen partos.
  const selEsp   = hojaAbierta.querySelector("[data-esp]");
  const cajaCat  = hojaAbierta.querySelector("[data-cat-caja]");
  const cajaRaza = hojaAbierta.querySelector("[data-raza-caja]");
  const ayuda    = hojaAbierta.querySelector("[data-gest]");

  const valorCat = () => cajaCat.querySelector("input[type=hidden]")?.value;

  const poblar = (mantener) => {
    const esp = selEsp.value;
    const ops = Object.entries(CATEGORIAS).filter(([, c]) => c.especie === esp);
    const previa = mantener && ops.some(([k]) => k === a.categoria) ? a.categoria : null;
    const elegida = previa || ops.find(([, c]) => c.etapa === "adulta")?.[0] || ops[0][0];

    // La categoría y la raza dependen de la especie: se rehacen las dos.
    cajaCat.innerHTML  = comboCategorias("categoria", esp, elegida);
    cajaRaza.innerHTML = comboRazas("raza", esp, mantener ? a.raza : "");
    conectarCombos(cajaCat);
    conectarCombos(cajaRaza);
    cajaCat.addEventListener("change", alternar);   // sube desde el combo

    const p = parEspecie(esp);
    ayuda.textContent = `Gesta ${p.gestacion} días · palpación a los ${p.palpar}` +
      (p.lechero ? ` · secado del día ${p.secarDesde} al ${p.secarHasta}` : " · no lechera");
    alternar();
  };

  const alternar = () => {
    const c = CATEGORIAS[valorCat()];
    // Solo hembras adultas de especie que se sirve: ni machos ni levante.
    const traeHistoria = !!c && c.sexo === "H" && c.etapa === "adulta";
    hojaAbierta.querySelectorAll("[data-solo-vaca]").forEach(el => el.hidden = !traeHistoria);
    // La opción de no palpar aplica a cualquier hembra que se sirva.
    const sirve = !!c && c.sexo === "H" && c.etapa !== "cria";
    hojaAbierta.querySelectorAll("[data-solo-hembra]").forEach(el => el.hidden = !sirve);
  };

  const selEstado = hojaAbierta.querySelector("[data-estado]");
  const verSalida = () => {
    const fuera = selEstado.value !== "activo";
    hojaAbierta.querySelectorAll("[data-solo-salida]").forEach(el => el.hidden = !fuera);
  };
  selEstado.onchange = verSalida;
  verSalida();

  selEsp.onchange = () => poblar(false);
  poblar(true);
}

function formFinca(id) {
  const f = id ? finca(id) : { nombre:"", ubicacion:"", personas: S.persona ? [S.persona.id] : [] };
  const asig = f.personas || [];
  const bloque = (rol) => {
    const gente = (esSuper() ? D.personas : misPersonas())
      .filter(p => p.rol === rol).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    return `<div class="campo ancho"><label>${ROLES[rol].plural}</label>
      ${gente.length === 0
        ? `<span class="ayuda">No hay ${ROLES[rol].plural.toLowerCase()} registrados todavía.</span>`
        : `<div class="chips">${gente.map(p => `
            <label class="chip">
              <input type="checkbox" name="personas" value="${p.id}" ${asig.includes(p.id)?"checked":""}>
              <span>${esc(p.nombre)}${p.correo?`<i>${esc(p.correo)}</i>`:""}</span>
            </label>`).join("")}</div>`}
    </div>`;
  };

  abrirHoja(`
    <div class="hoja-cab"><h2>${id ? "Editar finca" : "Añadir finca"}</h2>
      <button class="cerrar" data-cerrar>×</button></div>
    <form data-guardar="finca:${id||""}">
      <div class="hoja-cuerpo"><div class="aviso" data-error hidden></div><div class="rej">
        <div class="campo"><label>Nombre de la finca</label><input name="nombre" value="${esc(f.nombre)}" required></div>
        <div class="campo"><label>Ubicación</label><input name="ubicacion" value="${esc(f.ubicacion)}"></div>
        <div class="campo ancho"><div class="nota" style="margin:0">Marca a todas las personas que atienden esta finca.
          El correo sale de la ficha de cada una, no se escribe aquí.</div></div>
        ${D.personas.length > 6 ? `<div class="campo ancho">
          <input type="text" data-filtro-chips placeholder="Buscar persona por nombre o correo…"></div>` : ""}
        ${esSuper() ? bloque("superadmin") : ""}${bloque("dueno")}${bloque("administrador")}${bloque("empleado")}
      </div></div>
      <div class="hoja-pie">
        ${id && puedoBorrarFinca(f) ? '<button type="button" class="btn btn-baja" data-borrar="finca:'+id+'">Eliminar</button>' : ""}
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-firme">Guardar</button>
      </div></form>`);
}

function formPersona(id, rolPre) {
  const p = id ? persona(id)
              : { nombre:"", rol: rolPre || "empleado", correo:"", telefono:"", documento:"", notas:"", activo:true };
  abrirHoja(`
    <div class="hoja-cab"><h2>${id === S.persona?.id ? "Mis datos"
        : id ? "Editar persona" : `Añadir ${ROLES[p.rol].et.toLowerCase()}`}</h2>
      <button class="cerrar" data-cerrar>×</button></div>
    <form data-guardar="persona:${id||""}">
      <div class="hoja-cuerpo"><div class="aviso" data-error hidden></div>
        ${p.nombrePorDefecto ? `<div class="nota">Tu nombre se sacó del correo al crear la cuenta.
          Escríbelo bien: es el que van a ver los demás en la app.</div>` : ""}
        <div class="rej">
        <div class="campo"><label>Nombre completo</label>
          <input name="nombre" value="${esc(p.nombre)}" required
            ${p.nombrePorDefecto ? "autofocus placeholder=\"Juan José Franco\"" : ""}></div>
        ${(() => {
          // Al añadir desde una sección, el rol es el de esa sección y no se elige.
          const fijo = !id && !!rolPre;
          const bloqueado = fijo || (!esSuper() && id);
          const opciones = fijo
            ? [[p.rol, ROLES[p.rol]]]
            : Object.entries(ROLES).filter(([k]) =>
                esSuper() || rolesQuePuedoCrear().includes(k) || k === p.rol);
          return `<div class="campo"><label>Rol</label>
            <select name="rol" ${bloqueado ? "disabled" : ""}>
              ${opciones.map(([k,v]) =>
                `<option value="${k}" ${p.rol===k?"selected":""}>${v.et}</option>`).join("")}
            </select>
            ${fijo ? `<span class="ayuda">Lo estás añadiendo desde ${ROLES[p.rol].plural}.
              Para otro rol, entra a su sección.</span>`
             : bloqueado ? '<span class="ayuda">Solo un superadministrador cambia el rol de alguien ya registrado.</span>'
             : ""}
            ${bloqueado ? `<input type="hidden" name="rol" value="${p.rol}">` : ""}
          </div>`;
        })()}
        <div class="campo"><label>Correo</label><input type="email" name="correo" value="${esc(p.correo)}"></div>
        <div class="campo"><label>Teléfono</label><input name="telefono" value="${esc(p.telefono)}"></div>
        <div class="campo"><label>Documento</label><input name="documento" value="${esc(p.documento)}"></div>
        <div class="campo"><label>Estado</label><select name="activo">
          <option value="si" ${p.activo!==false?"selected":""}>Activo</option>
          <option value="no" ${p.activo===false?"selected":""}>Inactivo</option></select></div>
        <div class="campo ancho"><label>Notas</label><input name="notas" value="${esc(p.notas)}" placeholder="Mayordomo, inseminador…"></div>
        ${id && p.correo ? `<div class="campo ancho"><label>Acceso a la app</label>
          <div class="invitar">
            <button type="button" class="btn btn-sm" data-invitar="${esc(p.correo)}">
              Enviarle la invitación</button>
            <span class="ayuda">Le llega un enlace a ${esc(p.correo)}. Al abrirlo entra sin
            contraseña y puede ponerse una. También puede entrar con su cuenta de Google si
            usa ese mismo correo.</span>
          </div></div>` : ""}
        ${(() => {
          const disponibles = misFincasObj();
          if (!puede("editaPersona") && id !== S.persona?.id) return "";
          const suyas = id ? new Set(fincasDe(id).map(f => f.id)) : new Set();
          // Las que tiene asignadas pero yo no administro: se muestran y no se tocan.
          const ajenas = id ? fincasDe(id).filter(f => !disponibles.some(x => x.id === f.id)) : [];

          if (!disponibles.length) return `<div class="campo ancho"><label>Fincas</label>
            <span class="ayuda">Todavía no hay fincas que puedas asignar.</span></div>`;

          return `<div class="campo ancho"><label>Fincas asignadas</label>
            <span class="ayuda">${id && sinAsignar(p) && p.id !== S.persona?.id
              ? "Esta persona no tiene finca todavía, por eso la ves. Al asignarla queda a tu cargo."
              : "Sin al menos una, entra a la app pero no ve nada."}</span>
            ${disponibles.length > 6 ? `<input type="text" data-filtro-fincas
              placeholder="Buscar finca…" style="margin-bottom:7px">` : ""}
            <div class="chips">${disponibles
              .sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).map(f => `
              <label class="chip">
                <input type="checkbox" name="fincas" value="${f.id}" ${suyas.has(f.id)?"checked":""}>
                <span>${esc(f.nombre)}${f.ubicacion?`<i>${esc(f.ubicacion)}</i>`:""}</span>
              </label>`).join("")}</div>
            ${ajenas.length ? `<span class="ayuda">También está en
              ${ajenas.map(f => esc(f.nombre)).join(", ")}, que no administras tú.</span>` : ""}
          </div>`;
        })()}
      </div></div>
      <div class="hoja-pie">
        ${id && puedoEditarPersona(p) && id !== S.persona?.id ? '<button type="button" class="btn btn-baja" data-borrar="persona:'+id+'">Eliminar</button>' : ""}
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-firme">Guardar</button>
      </div></form>`);
}

/** Una fila de pajilla dentro del servicio. */
function filaPajilla(ap, sugerencias) {
  ap = ap || { fecha: hoyISO(), hora: "", pajilla: "", detalles: "" };
  return `<div class="pajilla-fila">
    <div class="campo"><label>Fecha</label>
      <input type="date" name="ap_fecha" value="${ap.fecha || hoyISO()}" required></div>
    <div class="campo"><label>Hora</label>
      <input type="time" name="ap_hora" value="${esc(ap.hora || "")}"></div>

  abrirHoja(`

        </div>

        <h4 class="sub-titulo">Pajillas aplicadas</h4>
        <div data-pajillas>${aps.map(a => filaPajilla(a, sugerencias)).join("")}</div>
        <div class="fila-btn" style="margin-bottom:14px">
          <button type="button" class="btn btn-sm" data-mas-pajilla>Añadir otra pajilla</button>
        </div>

        <div class="rej">

            <input name="detalles" value="${esc(i.detalles)}"

            ${seg("tipo", [["inseminacion","Inseminación"],["monta","Monta natural"]],
                  i.tipo || "inseminacion")}</div>
          <div class="campo ancho"><label>¿Hay que palparla por este servicio?</label>
            ${seg("palpar", [["","Lo que diga la finca"],["si","Sí, quedó dudoso"],
                             ["no","No hace falta"]],
                  i.palpar === true ? "si" : (i.palpar || ""))}
            <span class="ayuda">Se decide aquí, en el servicio, y no en la ficha del animal:
            quien la sirve confirma o duda de <em>esta</em> monta, no de la vaca para siempre.
            Con «lo que diga la finca» se sigue el ajuste de Configuración → Parámetros. Al
            registrarle un servicio nuevo, la marca se olvida sola.</span></div>
        </div>
      </div>
      <div class="hoja-pie">
        ${id && puede("borra") ? '<button type="button" class="btn btn-baja" data-borrar="insem:'+id+'">Eliminar</button>' : ""}
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-firme">Guardar</button>
      </div></form>`);

  // Añadir y quitar filas sobre la marcha.
  const caja = hojaAbierta.querySelector("[data-pajillas]");
  const refrescarQuitar = () => {
    const filas = caja.querySelectorAll(".pajilla-fila");
    filas.forEach(f2 => {
      const b = f2.querySelector("[data-quita-pajilla]");
      b.hidden = filas.length < 2;
      b.onclick = () => { f2.remove(); refrescarQuitar(); };
    });
  };
  hojaAbierta.querySelector("[data-mas-pajilla]").onclick = () => {
    // La nueva hereda la fecha de la última, que suele ser la misma o la del día siguiente.
    const ultima = [...caja.querySelectorAll("[name=ap_fecha]")].pop();
    const div = document.createElement("div");
    div.innerHTML = filaPajilla({ fecha: ultima?.value || hoyISO() }, sugerencias);
    const fila = div.firstElementChild;
    caja.appendChild(fila);
    conectarCombos(fila);
    refrescarQuitar();
    try { fila.scrollIntoView?.({ block: "nearest", behavior: "smooth" }); } catch {}
  };
  refrescarQuitar();
}

function formPalpacion(id, anId) {
  const p = id ? D.palpaciones.find(x => x.id === id)
              : { animalId: anId || "", fecha: hoyISO(), resultado: "prenada",
                  mesesGest: 0, diasGest: 0, manda: false, observaciones: "" };

  abrirHoja(`
    <div class="hoja-cab"><h2>${id ? "Editar palpación" : "Registrar palpación"}</h2>
      <button class="cerrar" data-cerrar>×</button></div>
    <form data-guardar="palp:${id||""}">
      <div class="hoja-cuerpo"><div class="aviso" data-error hidden></div>
        <div class="rej">
          <div class="campo ancho"><label>Nombre</label>
            ${comboAnimales("animalId", p.animalId, a => par(a).sirve)}</div>
          <div class="campo"><label>Fecha de la palpación</label>
            <input type="date" name="fecha" value="${p.fecha}" required></div>
          <div class="campo"><label>Resultado</label>
            ${seg("resultado", [["prenada","Preñada"],["vacia","Vacía"]], p.resultado)}</div>

          <div class="campo ancho" data-solo-prenada>
            <div class="nota" style="margin:0">Escribe de cuánto la encontró el veterinario.
            De ahí sale cuándo quedó preñada y la fecha del parto, contando meses de
            calendario de verdad.</div></div>
          <div class="campo" data-solo-prenada><label>Meses de gestación</label>
            <input type="number" name="mesesGest" min="0" max="12" step="1"
              value="${p.mesesGest || 0}" inputmode="numeric"></div>
          <div class="campo" data-solo-prenada><label>Días</label>
            <input type="number" name="diasGest" min="0" max="60" step="1"
              value="${p.diasGest || 0}" inputmode="numeric"></div>
          <div class="campo ancho" data-solo-prenada>
            <div class="nota" data-calculo style="margin:0"></div></div>

          <div class="campo ancho" data-solo-prenada>
            <label class="recordar" style="margin:0">
              <input type="checkbox" name="manda" ${p.manda ? "checked" : ""}>
              <span>Que esta palpación mande sobre la inseminación
              <em>Marca esto si confías más en lo que dijo el veterinario que en la fecha
              del servicio. Todos los cálculos —gestación, secado, parto probable— saldrán
              de aquí.</em></span></label></div>

          <div class="campo ancho"><label>Observaciones</label>
            <input name="observaciones" value="${esc(p.observaciones || "")}"></div>
        </div>
      </div>
      <div class="hoja-pie">
        ${id && puede("borra") ? '<button type="button" class="btn btn-baja" data-borrar="palp:'+id+'">Eliminar</button>' : ""}
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-firme">Guardar</button>
      </div></form>`);

  // Ir mostrando lo que implica cada número.
  const caja = hojaAbierta.querySelector("[data-calculo]");
  const recalcular = () => {
    const v = {
      fecha: hojaAbierta.querySelector("[name=fecha]").value,
      mesesGest: hojaAbierta.querySelector("[name=mesesGest]").value,
      diasGest: hojaAbierta.querySelector("[name=diasGest]").value,
    };
    const idA = hojaAbierta.querySelector("input[name=animalId]")?.value;
    const a = idA ? animal(idA) : null;
    const c = concepcionDePalpacion(v);
    if (!c || !a) { caja.textContent = "Elige el animal y la fecha para ver el cálculo."; return; }
    const reparo = reparoPalpacion(a, { ...v, resultado: "prenada" });
    if (reparo) {
      caja.className = "aviso";
      caja.innerHTML = `No cuadra: ${esc(reparo)}.`;
      return;
    }
    caja.className = "nota";
    const parto = partoDePalpacion(v, a);
    const d = desfaseConServicio(a, v);
    const lejos = d && Math.abs(d.dif) > 12;
    caja.innerHTML = `Quedó preñada alrededor del <strong>${fmt(c)}</strong>.
      Parto probable: <strong>${fmt(parto)}</strong>
      (gestación de ${par(a).gestacion} días).` +
      (lejos ? `<br><br>No cuadra con el servicio apuntado del
        <strong>${fmt(d.servicio.fecha)}</strong>: hay
        <strong>${Math.abs(d.dif)} días</strong> de diferencia. Si confías más en el
        veterinario, marca abajo que esta palpación mande.` : "");
  };
  const prenada = () => {
    const r = hojaAbierta.querySelector("[name=resultado]:checked")?.value === "prenada";
    hojaAbierta.querySelectorAll("[data-solo-prenada]").forEach(el => el.hidden = !r);
    if (r) recalcular();
  };
  ["fecha","mesesGest","diasGest"].forEach(n =>
    hojaAbierta.querySelector(`[name=${n}]`).oninput = recalcular);
  hojaAbierta.querySelectorAll("[name=resultado]").forEach(x => x.onchange = prenada);
  hojaAbierta.querySelector("[data-combo]")?.addEventListener("change", recalcular);
  prenada();
}

              inputmode="numeric" placeholder="${ultimoPrecio ? "Último: " + ultimoPrecio : "Opcional"}">
            <span class="ayuda">Opcional. Sirve para calcular el ingreso.</span></div>
          <div class="campo"><label>Nota</label>
            <input name="observaciones" value="${esc(r.observaciones || "")}"
              placeholder="Se cortó un poco, calidad…"></div>
        </div>
      </div>
      <div class="hoja-pie">
        ${id && puede("borra") ? '<button type="button" class="btn btn-baja" data-borrar="leche:'+id+'">Eliminar</button>' : ""}
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn btn-firme">Guardar</button>
      </div></form>`);

  // Mostrar el promedio mientras escribe, para que se note el efecto de los días.
  const li = hojaAbierta.querySelector("[name=litros]");
  const ay = hojaAbierta.querySelector("[data-promedio]");
  const calc = () => {
    const n = Number(li.value) || 0;
    const d = Number(hojaAbierta.querySelector("[name=dias]:checked")?.value) || 1;
    ay.textContent = n ? `Son ${litros(n / d)} litros por día.` : "";
  };
  li.oninput = calc;
  hojaAbierta.querySelectorAll("[name=dias]").forEach(x => x.onchange = calc);

  /* Avisar en el momento si esa vaca no estaba dando leche ese día. Es el
     caso de secarla el martes y anotarle leche el miércoles: el registro
     quedaría fuera del promedio de la finca sin que nadie se enterara. */
  const cajaProd = hojaAbierta.querySelector("[data-aviso-prod]");
  const revisarProd = () => {
    const idA = hojaAbierta.querySelector("[name=animalId]")?.value;
    const f = hojaAbierta.querySelector("[name=fecha]")?.value;
    const a = idA ? animal(idA) : null;
    if (!cajaProd) return;
    if (!a || !f) { cajaProd.textContent = ""; return; }
    cajaProd.textContent = enProduccionEn(a, f) ? ""
      : `${a.nombre} no estaba en producción el ${fmtCorto(f)}: ${motivoNoProduce(a, f)}. ` +
        `Ese registro no entrará en el promedio.`;
  };
  hojaAbierta.querySelector("[name=fecha]")?.addEventListener("change", revisarProd);
  hojaAbierta.addEventListener("change", (ev) => {
    if (ev.target?.name === "animalId") revisarProd();
  });
  revisarProd();
  calc();
}

/* ==========================================================
   INTEGRIDAD
   Qué depende de qué, y qué hay que arrastrar al borrar.
   ========================================================== */

/** Colecciones de eventos que cuelgan de un animal. */
const EVENTOS_DE_ANIMAL = ["inseminaciones", "palpaciones", "partos", "secados", "tratamientos"];

/** La leche puede ser de un animal o del tanque de la finca. */
const EVENTOS_DE_FINCA = ["leche"];

/** Cuenta lo que se llevaría por delante borrar algo. */
function dependencias(tipo, id) {
  if (tipo === "animal") {
    const n = EVENTOS_DE_ANIMAL.reduce((t, c) => t + D[c].filter(x => x.animalId === id).length, 0);
    const a = animal(id);
    const crias = D.animales.filter(x => x.id !== id &&
      (x.madre === a?.chapeta || x.padre === a?.chapeta)).length;
    return { eventos: n, crias };
  }
  if (tipo === "finca") {
    const animales = D.animales.filter(a => a.fincaId === id).length;
    const lech = D.leche.filter(x => x.fincaId === id).length;
    D.leche = D.leche.filter(x => x.fincaId !== id);
    if (lech) quitados.leche = lech;

    const notas = D.anotaciones.filter(n => n.fincaId === id).length;
    const gente = D.personas.filter(p => (p.fincas || []).includes(id)).length;
    return { animales, notas, gente };
  }
  if (tipo === "persona") {
    const fincas = fincasDe(id).length;
    const creo = ["fincas", "animales", "personas", ...EVENTOS_DE_ANIMAL, "anotaciones"]
      .reduce((t, c) => t + (D[c] || []).filter(x => x.creadoPor === id).length, 0);
    return { fincas, creo };
  }
  return {};
}

/**
 * Borra un registro con todo lo que cuelga de él.
 * Devuelve un resumen de lo que se llevó, o null si no se pudo.
 */
/** Saca de una colección lo que cumpla la condición y ordena su borrado remoto. */
function quitarDe(coleccion, condicion) {
  const van = (D[coleccion] || []).filter(condicion);
  if (!van.length) return 0;
  const fuera = new Set(van.map(x => x.id));
  D[coleccion] = (D[coleccion] || []).filter(x => !fuera.has(x.id));
  for (const id of fuera) borrarRemoto(coleccion, id);
  return van.length;
}

/**
 * Borra un registro con todo lo que cuelga de él.
 * Devuelve un resumen de lo que se llevó, o null si no se pudo.
 */
function borrarEnCascada(tipo, id, opciones) {
  opciones = opciones || {};
  const quitados = {};

  if (tipo === "animal") {
    for (const c of EVENTOS_DE_ANIMAL) {
      const n = quitarDe(c, x => x.animalId === id);
      if (n) quitados[c] = n;
    }
    // La leche sí salió del tanque: no se borra, solo deja de ser de ese animal.
    D.leche.forEach(x => { if (x.animalId === id) x.animalId = null; });
    quitarDe("animales", x => x.id === id);
    borrarRemoto("fotos", id);
    return quitados;
  }

  if (tipo === "finca") {
    const animales = D.animales.filter(a => a.fincaId === id);
    if (animales.length && !opciones.arrastrarAnimales) return null;
    for (const a of animales) borrarEnCascada("animal", a.id);
    if (animales.length) quitados.animales = animales.length;

    const lech = quitarDe("leche", x => x.fincaId === id);
    if (lech) quitados.leche = lech;
    const notas = quitarDe("anotaciones", n => n.fincaId === id);
    if (notas) quitados.anotaciones = notas;

    quitarDe("fincas", f => f.id === id);
    recalcularAccesos();   // deja al día persona.fincas y la marca de sin finca
    return quitados;
  }

  if (tipo === "persona") {
    const p = persona(id);
    D.fincas.forEach(f => {
      if ((f.personas || []).includes(id)) {
        f.personas = f.personas.filter(x => x !== id);
        borrarRemoto._tocada = true;   // la finca cambió: se sube en el empuje normal
      }
    });
    limpiarConfigDe(p?.correo);
    // Lo que registró no se borra: se queda sin autor conocido.
    for (const c of ["fincas", "animales", "personas", ...EVENTOS_DE_ANIMAL, "leche", "anotaciones"]) {
      (D[c] || []).forEach(x => { if (x.creadoPor === id) x.creadoPor = null; });
    }
    quitarDe("personas", x => x.id === id);
    recalcularAccesos();
    if (p?.correo) borrarUsuarioRemoto(p.correo);
    return quitados;
  }

  const mapa = { insem:"inseminaciones", palp:"palpaciones", parto:"partos",
                 secado:"secados", trat:"tratamientos", nota:"anotaciones", leche:"leche" };
  const col = mapa[tipo];
  if (!col) return null;
  quitarDe(col, x => x.id === id);
  return quitados;
}

/**
 * Revisa que nada apunte a algo que ya no existe. Devuelve el informe;
 * con arreglar=true además lo corrige.
 */
function revisarIntegridad(arreglar) {
  const ids = (c) => new Set((D[c] || []).map(x => x.id));
  const animales = ids("animales"), fincas = ids("fincas"), personas = ids("personas");
  const informe = [];

  const anota = (t, n, fn) => { if (n) { informe.push({ que: t, n }); if (arreglar) fn(); } };

  for (const c of EVENTOS_DE_ANIMAL) {
    const sueltos = (D[c] || []).filter(x => !animales.has(x.animalId));
    anota(`${c} sin animal`, sueltos.length, () => {
      quitarDe(c, x => !animales.has(x.animalId));
    });
  }

  anota("animales sin finca", D.animales.filter(a => !fincas.has(a.fincaId)).length, () => {});
  anota("anotaciones sin finca", D.anotaciones.filter(n => !fincas.has(n.fincaId)).length, () => {
    quitarDe("anotaciones", n => !fincas.has(n.fincaId));
  });
  anota("registros de leche sin finca", D.leche.filter(r => !fincas.has(r.fincaId)).length, () => {
    quitarDe("leche", r => !fincas.has(r.fincaId));
  });
  anota("leche atada a un animal borrado",
    D.leche.filter(r => r.animalId && !animales.has(r.animalId)).length, () => {
      D.leche.forEach(r => { if (r.animalId && !animales.has(r.animalId)) r.animalId = null; });
    });

  const asignacionesRotas = D.fincas.reduce((t, f) =>
    t + (f.personas || []).filter(p => !personas.has(p)).length, 0);
  anota("personas asignadas que ya no existen", asignacionesRotas, () => {
    D.fincas.forEach(f => { f.personas = (f.personas || []).filter(p => personas.has(p)); });
  });

  const autoresRotos = ["fincas", "animales", "personas", ...EVENTOS_DE_ANIMAL, "anotaciones"]
    .reduce((t, c) => t + (D[c] || []).filter(x => x.creadoPor && !personas.has(x.creadoPor)).length, 0);
  anota("registros con autor borrado", autoresRotos, () => {
    for (const c of ["fincas", "animales", "personas", ...EVENTOS_DE_ANIMAL, "anotaciones"]) {
      (D[c] || []).forEach(x => { if (x.creadoPor && !personas.has(x.creadoPor)) x.creadoPor = null; });
    }
  });

  // Correos en la configuración que ya no corresponden a nadie.
  const correos = new Set(D.personas.map(p => (p.correo || "").toLowerCase()).filter(Boolean));
  const accesosRotos = (D.config.accesoConfig || [])
    .filter(c => !correos.has((c || "").toLowerCase())).length;
  anota("accesos a configuración de correos que ya no existen", accesosRotos, () => {
    D.config.accesoConfig = (D.config.accesoConfig || [])
      .filter(c => correos.has((c || "").toLowerCase()));
  });
  const permisosRotos = Object.keys(D.config.permisos || {})
    .filter(c => !correos.has(c.toLowerCase())).length;
  anota("permisos por sección de correos que ya no existen", permisosRotos, () => {
    for (const c of Object.keys(D.config.permisos || {})) {
      if (!correos.has(c.toLowerCase())) delete D.config.permisos[c];
    }
  });
  const maestroRoto = D.config.maestro && !correos.has((D.config.maestro || "").toLowerCase()) ? 1 : 0;
  anota("el dueño principal apunta a un correo que ya no existe", maestroRoto, () => {});

  // Eventos cuyo fincaId no coincide con el de su animal.
  const desalineados = EVENTOS_DE_ANIMAL.reduce((t, c) =>
    t + (D[c] || []).filter(x => {
      const a = D.animales.find(y => y.id === x.animalId);
      return a && x.fincaId !== a.fincaId;
    }).length, 0);
  anota("eventos con finca desalineada", desalineados, () => recalcularAccesos());

  if (arreglar && informe.length) { recalcularAccesos(); guardar(); }
  return informe;
}

/**
 * Cuando cambia la chapeta de un animal, las crías que lo tenían por madre
 * o padre lo guardaban por ese número. Hay que moverlas con él.
 */
function renombrarChapeta(anterior, nueva) {
  if (!anterior || !nueva || anterior === nueva) return 0;
  let n = 0;
  D.animales.forEach(a => {
    if (a.madre === anterior) { a.madre = nueva; n++; }
    if (a.padre === anterior) { a.padre = nueva; n++; }
  });
  return n;
}

/* ==========================================================
   MODO SELECCIÓN
   Se inyecta sobre la tabla ya dibujada, así funciona igual
   en todas las vistas sin duplicar código en cada una.
   ========================================================== */

/** Qué colección corresponde a cada vista, y qué se puede hacer en ella. */
const SELECCIONABLE = {
  activos:      { tipo:"animal",  et:"animales",       edita:1 },
  salidas:      { tipo:"animal",  et:"animales",       edita:1 },
  palpacion:    { tipo:"animal",  et:"animales",       edita:1 },
  fincas:       { tipo:"finca",   et:"fincas",         edita:0 },
  duenos:       { tipo:"persona", et:"personas",       edita:1 },
  administradores:{ tipo:"persona", et:"personas",     edita:1 },
  empleados:    { tipo:"persona", et:"personas",       edita:1 },
  inseminacion: { tipo:"insem",   et:"inseminaciones", edita:0 },
  partos:       { tipo:"parto",   et:"registros",      edita:0 },
  secados:      { tipo:"secado",  et:"secados",        edita:0 },
  tratamientos: { tipo:"trat",    et:"tratamientos",   edita:0 },
  anotaciones:  { tipo:"nota",    et:"anotaciones",    edita:0 },
  leche:        { tipo:"leche",   et:"registros",      edita:0 },
};

/** Saca el identificador de una fila, sea del tipo que sea. */
function idDeFila(el) {
  if (el.dataset.abrir) return el.dataset.abrir;
  if (el.dataset.finca) return el.dataset.finca;
  if (el.dataset.ev) return el.dataset.ev.split(":")[1];
  return null;
}

/** A qué destino de importación corresponde cada vista. */
const IMPORTABLE = {
  fincas:"fincas", activos:"animales", salidas:"animales",
  duenos:"personas", administradores:"personas", empleados:"personas",
  inseminacion:"inseminaciones", partos:"partos", palpacion:"palpaciones",
  secados:"secados", tratamientos:"tratamientos", leche:"leche", anotaciones:"anotaciones",
};

function montarSeleccion() {
  const cfg = SELECCIONABLE[V.vista];
  const barra = document.querySelector(".barra");

  // Botón de carga masiva, en las vistas donde tiene sentido.
  if (barra && IMPORTABLE[V.vista] && puede("eventos") && !V.sel) {
    const bi = document.createElement("button");
    bi.className = "btn";
    bi.textContent = "Importar";
    bi.title = "Cargar muchos registros de una hoja de cálculo";
    bi.onclick = () => abrirImportador(IMPORTABLE[V.vista]);
    barra.appendChild(bi);
  }

  const filas = [...document.querySelectorAll("tbody tr.fila, .tarjeta")];
  if (!cfg || !barra || !filas.length) { V.sel = null; return; }

  // Botón para entrar y salir del modo
  const btn = document.createElement("button");
  btn.className = "btn" + (V.sel ? " btn-firme" : "");
  btn.textContent = V.sel ? "Salir de selección" : "Seleccionar";
  btn.onclick = () => { V.sel = V.sel ? null : { tipo: cfg.tipo, ids: new Set() }; pintar(); };
  barra.appendChild(btn);
  if (!V.sel) return;

  // Casilla en el encabezado
  const cab = document.querySelector("thead tr");
  if (cab && !cab.querySelector(".celda-sel")) {
    const th = document.createElement("th");
    th.className = "celda-sel";
    th.innerHTML = '<input type="checkbox" aria-label="Seleccionar todo">';
    cab.insertBefore(th, cab.firstChild);
    th.querySelector("input").onclick = (e) => {
      e.stopPropagation();
      const todos = e.target.checked;
      filas.forEach(f => { const i = idDeFila(f); if (i) todos ? V.sel.ids.add(i) : V.sel.ids.delete(i); });
      pintar();
    };
  }

  // Casilla en cada fila
  filas.forEach(f => {
    const id = idDeFila(f);
    if (!id) return;
    const marcado = V.sel.ids.has(id);
    f.classList.toggle("marcada", marcado);

    if (f.tagName === "TR") {
      const td = document.createElement("td");
      td.className = "celda-sel";
      td.innerHTML = `<input type="checkbox" ${marcado ? "checked" : ""}>`;
      f.insertBefore(td, f.firstChild);
    } else {
      const marca = document.createElement("span");
      marca.className = "marca-tarjeta" + (marcado ? " on" : "");
      marca.textContent = marcado ? "✓" : "";
      f.appendChild(marca);
    }
    // En modo selección, tocar la fila marca en vez de abrir.
    f.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      V.sel.ids.has(id) ? V.sel.ids.delete(id) : V.sel.ids.add(id);
      pintar();
    };
  });

  if (V.sel.ids.size) pintarBarraSeleccion(cfg);
}

/** ¿Puede editar en grupo esta clase de registro? */
function puedeEditarLote(cfg) {
  if (!cfg.edita) return false;
  if (cfg.tipo === "persona") return puede("editaPersona");
  if (cfg.tipo === "animal") return puede("editaAnimal");
  return false;
}

function pintarBarraSeleccion(cfg) {
  const n = V.sel.ids.size;
  const d = document.createElement("div");
  d.className = "barra-sel";
  d.innerHTML = `
    <span><strong>${n}</strong> ${n === 1 ? "seleccionado" : "seleccionados"}</span>
    <div class="barra-sel-btns">
      ${puedeEditarLote(cfg) ? '<button class="btn btn-sm" data-sel-editar>Editar en grupo</button>' : ""}
      ${puede("borra") ? '<button class="btn btn-sm btn-baja" data-sel-borrar>Eliminar</button>' : ""}
      <button class="btn btn-sm" data-sel-cancelar>Cancelar</button>
    </div>`;
  document.body.appendChild(d);
  d.querySelector("[data-sel-cancelar]").onclick = () => { V.sel = null; pintar(); };
  d.querySelector("[data-sel-borrar]")?.addEventListener("click", () => borrarSeleccion(cfg));
  d.querySelector("[data-sel-editar]")?.addEventListener("click", () => editarSeleccion(cfg));
}

/* ---------- eliminar en grupo ---------- */
function borrarSeleccion(cfg) {
  const ids = [...V.sel.ids];
  const bloqueados = [];
  const permitidos = [];

  for (const id of ids) {
    if (cfg.tipo === "animal") {
      const a = animal(id);
      if (!puedoEditarAnimal(a)) { bloqueados.push(`${a.nombre} (${a.estado})`); continue; }
    }
    if (cfg.tipo === "persona") {
      const p = persona(id);
      if (!puedoEditarPersona(p) || p.id === S.persona?.id) { bloqueados.push(p.nombre); continue; }
    }
    if (cfg.tipo === "finca" && !puedoBorrarFinca(finca(id))) {
      bloqueados.push(finca(id).nombre); continue;
    }
    permitidos.push(id);
  }

  if (!permitidos.length) {
    return alert("No puedes eliminar ninguno de los seleccionados.\n\n" +
                 bloqueados.slice(0, 8).join("\n"));
  }

  // Contar el arrastre antes de preguntar.
  let arrastre = 0, animalesFinca = 0;
  for (const id of permitidos) {
    const dep = dependencias(cfg.tipo, id);
    arrastre += dep.eventos || 0;
    animalesFinca += dep.animales || 0;
  }

  let msg = `¿Eliminar ${permitidos.length} ${cfg.et}?`;
  if (arrastre) msg += `\n\nSe borran también ${arrastre} registros asociados.`;
  if (animalesFinca) msg += `\n\nOJO: se borran ${animalesFinca} animales con todo su historial.`;
  if (bloqueados.length) msg += `\n\nQuedan fuera ${bloqueados.length} que no puedes tocar.`;
  msg += "\n\nNo se puede deshacer.";
  if (!confirm(msg)) return;
  if ((arrastre > 20 || animalesFinca) &&
      !confirm("Última confirmación. Es un borrado grande y no hay vuelta atrás.")) return;

  let n = 0;
  for (const id of permitidos) {
    // Barrer también lo anterior al recorte, si lo hay.
    if (cfg.tipo === "animal") {
      const a = animal(id);
      if (a) barrerAnimalRemoto(id, a.fincaId);
    } else if (cfg.tipo === "finca") {
      barrerFincaRemota(id);
    }
    if (borrarEnCascada(cfg.tipo, id, { arrastrarAnimales: true }) !== null) n++;
  }
  V.sel = null;
  recalcularAccesos(); guardar(); pintar();
  avisar(`${n} ${cfg.et} eliminados`);
}

              <input type="checkbox" name="usarRol"> Cambiar el rol</label>
              <select name="rol">${Object.entries(ROLES)
                .filter(([k]) => rolesQuePuedoCrear().includes(k))
                .map(([k,v])=>`<option value="${k}">${v.et}</option>`).join("")}</select></div>` : ""}
            <div class="campo ancho"><label>
              <input type="checkbox" name="usarFinca"> Asignarlos a una finca</label>
              ${comboFincas("fincaId", "")}
              <span class="ayuda">Se añade la finca; no se quitan las que ya tengan.</span></div>
          </div>
        </div>
        <div class="hoja-pie">
          <button type="button" class="btn" data-cerrar>Cancelar</button>
          <button class="btn btn-firme">Aplicar a los ${n}</button>
        </div>
      </form>`);
  }
}

function aplicarLote(f) {
  const tipo = f.dataset.lote;
  const v = datos(f);
  const ids = [...(V.sel?.ids || [])];
  if (!ids.length) return cerrarHoja();
  let n = 0, bloqueados = 0;

  if (tipo === "animal") {
    if (v.usarEstado && v.estado !== "activo" && !v.fechaSalida) {
      return error(f, "Pon la fecha de salida para marcarlos como vendidos o muertos.");
    }
    for (const id of ids) {
      const a = animal(id);
      if (!a || !puedoEditarAnimal(a)) { bloqueados++; continue; }
      if (v.usarFinca) a.fincaId = v.fincaId;
      if (v.usarCategoria) a.categoria = v.categoria;
      if (v.usarRaza) a.raza = v.raza;
      if (v.usarEstado) {
        a.estado = v.estado;
        a.fechaSalida = v.estado === "activo" ? null : v.fechaSalida;
        if (v.estado === "activo") a.motivoSalida = "";
      }
      n++;
    }
  }

  if (tipo === "persona") {
    for (const id of ids) {
      const p = persona(id);
      if (!p || !puedoEditarPersona(p)) { bloqueados++; continue; }
      if (v.usarActivo) p.activo = v.activo !== "no";
      if (v.usarRol && esSuper() && p.id !== S.persona?.id) p.rol = v.rol;
      if (v.usarFinca) {
        const fi = finca(v.fincaId);
        if (fi && !(fi.personas || []).includes(p.id)) (fi.personas ||= []).push(p.id);
      }
      n++;
    }
  }

  V.sel = null;
  recalcularAccesos(); guardar(); cerrarHoja(); pintar();
  avisar(bloqueados ? `${n} actualizados · ${bloqueados} sin permiso` : `${n} actualizados`);
}

/* ==========================================================
   DESPLEGABLE CON BUSCADOR
   Un <select> con cuarenta razas o doscientos animales es
   inmanejable, sobre todo en el celular. Este lo reemplaza:
   se escribe y la lista se filtra sola, sin tildes.
   ========================================================== */

let _combo = 0;

/**
 * opciones: [{ v, et, sub, grupo }]
 * opts: { libre, ph, vacio }
 *   libre  → deja usar lo que se escriba aunque no esté en la lista
 *   ph     → texto cuando no hay nada elegido
 *   vacio  → etiqueta de la opción "ninguno"
 */
function combo(nombre, opciones, valor, opts) {
  opts = opts || {};
  const id = "cb" + (++_combo);
  const sel = opciones.find(o => o.v === valor);
  const texto = sel ? sel.et : (valor && opts.libre ? valor : "");

  return `<div class="combo" data-combo id="${id}"
      data-libre="${opts.libre ? 1 : 0}" data-ph="${esc(opts.ph || "Selecciona…")}">
    <input type="hidden" name="${nombre}" value="${esc(valor || "")}">
    <button type="button" class="combo-btn ${texto ? "" : "vacio"}">
      <span class="combo-txt">${esc(texto || opts.ph || "Selecciona…")}</span>
      <span class="combo-flecha">▾</span>
    </button>
    <div class="combo-panel" hidden>
      <input class="combo-busca" type="text" placeholder="Escribe para buscar…"
        autocomplete="off" inputmode="search">
      <ul class="combo-lista">
        ${opts.vacio ? `<li data-v="" class="combo-vacio">${esc(opts.vacio)}</li>` : ""}
        ${filasCombo(opciones)}
      </ul>
      <div class="combo-nada" hidden></div>
    </div>
  </div>`;
}

function filasCombo(opciones) {
  let html = "", grupoActual = null;
  for (const o of opciones) {
    if (o.grupo && o.grupo !== grupoActual) {
      grupoActual = o.grupo;
      html += `<li class="combo-grupo" data-grupo>${esc(o.grupo)}</li>`;
    }
    html += `<li data-v="${esc(o.v)}" data-busca="${esc([o.et, o.sub, o.grupo].filter(Boolean).join(" "))}">
      <span>${esc(o.et)}</span>${o.sub ? `<em>${esc(o.sub)}</em>` : ""}</li>`;
  }
  return html;
}

/** Cambia las opciones de un combo ya dibujado (p. ej. razas al cambiar de especie). */
function rellenarCombo(el, opciones, valor, ph) {
  const lista = el.querySelector(".combo-lista");
  const vacio = lista.querySelector(".combo-vacio");
  lista.innerHTML = (vacio ? vacio.outerHTML : "") + filasCombo(opciones);
  const sel = opciones.find(o => o.v === valor);
  el.querySelector("input[type=hidden]").value = sel ? sel.v : "";
  const btn = el.querySelector(".combo-btn");
  btn.classList.toggle("vacio", !sel);
  el.querySelector(".combo-txt").textContent = sel ? sel.et : (ph || el.dataset.ph);
  conectarUnCombo(el);
}

function conectarUnCombo(el) {
  const btn    = el.querySelector(".combo-btn");
  const panel  = el.querySelector(".combo-panel");
  const busca  = el.querySelector(".combo-busca");
  const lista  = el.querySelector(".combo-lista");
  const nada   = el.querySelector(".combo-nada");
  const oculto = el.querySelector("input[type=hidden]");
  const txt    = el.querySelector(".combo-txt");
  const libre  = el.dataset.libre === "1";

  const cerrar = () => { panel.hidden = true; el.classList.remove("abierto"); };
  const abrir = () => {
    document.querySelectorAll(".combo.abierto").forEach(o => {
      if (o !== el) { o.classList.remove("abierto"); o.querySelector(".combo-panel").hidden = true; }
    });
    panel.hidden = false; el.classList.add("abierto");
    busca.value = ""; filtrar("");
    // En el celular no enfocamos: abriría el teclado tapando la lista.
    if (window.innerWidth > 860) busca.focus();
  };

  const filtrar = (q) => {
    let visibles = 0;
    lista.querySelectorAll("li[data-v]").forEach(li => {
      const ok = contiene(li.dataset.busca || li.textContent, q);
      li.hidden = !ok;
      if (ok && li.dataset.v) visibles++;
    });
    // Los títulos de grupo se ocultan si no quedó nada debajo.
    lista.querySelectorAll("li[data-grupo]").forEach(g => {
      let n = 0;
      for (let s = g.nextElementSibling; s && !s.hasAttribute("data-grupo"); s = s.nextElementSibling) {
        if (!s.hidden) n++;
      }
      g.hidden = n === 0;
    });
    if (!visibles && q.trim()) {
      nada.hidden = false;
      nada.innerHTML = libre
        ? `<button type="button" class="btn btn-sm" data-usar>Usar «${esc(q.trim())}»</button>`
        : "Sin resultados";
      nada.querySelector("[data-usar]")?.addEventListener("click", () => {
        oculto.value = q.trim();
        txt.textContent = q.trim();
        btn.classList.remove("vacio");
        cerrar();
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
    } else nada.hidden = true;
  };

  btn.onclick = (e) => { e.preventDefault(); panel.hidden ? abrir() : cerrar(); };
  busca.oninput = () => filtrar(busca.value);
  busca.onkeydown = (e) => {
    if (e.key === "Escape") { e.preventDefault(); cerrar(); }
    if (e.key === "Enter") {
      e.preventDefault();
      const primera = [...lista.querySelectorAll("li[data-v]")].find(li => !li.hidden);
      if (primera) primera.click();
      else nada.querySelector("[data-usar]")?.click();
    }
  };
  lista.onclick = (e) => {
    const li = e.target.closest("li[data-v]");
    if (!li) return;
    oculto.value = li.dataset.v;
    txt.textContent = li.dataset.v ? li.querySelector("span").textContent : el.dataset.ph;
    btn.classList.toggle("vacio", !li.dataset.v);
    cerrar();
    el.dispatchEvent(new Event("change", { bubbles: true }));
  };
}

function conectarCombos(raiz) {
  (raiz || document).querySelectorAll("[data-combo]").forEach(conectarUnCombo);
}

// Un clic fuera cierra el que esté abierto.
document.addEventListener("mousedown", (e) => {
  if (!e.target.closest(".combo")) {
    document.querySelectorAll(".combo.abierto").forEach(o => {
      o.classList.remove("abierto"); o.querySelector(".combo-panel").hidden = true;
    });
  }
});
