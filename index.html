/* ==========================================================
   RESUMEN DE LECHE
   ========================================================== */

/** Semana ISO: lunes a domingo. */
function semanaISO(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const primera = new Date(t.getFullYear(), 0, 4);
  const n = 1 + Math.round(((t - primera) / 86400000 - 3 + ((primera.getDay() + 6) % 7)) / 7);
  return { anio: t.getFullYear(), n };
}

function lunesDe(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return t;
}

const EPOCAS = { semana:"Semanal", quincena:"Quincenal", mes:"Mensual", anio:"Anual" };
const NOMBRE_EPOCA = { semana:"semana", quincena:"quincena", mes:"mes", anio:"año" };

/** A qué periodo pertenece una fecha, con una etiqueta legible. */
function periodoDe(fecha, epoca) {
  const d = aFecha(fecha);
  const a = d.getFullYear(), m = d.getMonth(), dia = d.getDate();

  if (epoca === "anio") return { k: String(a), et: String(a), orden: `${a}` };

  if (epoca === "mes") return {
    k: `${a}-${String(m + 1).padStart(2, "0")}`,
    et: `${MESES[m][0].toUpperCase()}${MESES[m].slice(1)} ${a}`,
    orden: `${a}-${String(m + 1).padStart(2, "0")}`,
  };

  if (epoca === "quincena") {
    const q = dia <= 15 ? 1 : 2;
    const fin = new Date(a, m + 1, 0).getDate();
    return {
      k: `${a}-${String(m + 1).padStart(2, "0")}-Q${q}`,
      et: `${q === 1 ? "1 al 15" : `16 al ${fin}`} de ${MESES[m]} ${a}`,
      orden: `${a}-${String(m + 1).padStart(2, "0")}-${q}`,
    };
  }

  const s = semanaISO(d);
  const lun = lunesDe(d);
  const dom = new Date(lun); dom.setDate(dom.getDate() + 6);
  const corto = (x) => `${x.getDate()} ${MESES[x.getMonth()].slice(0, 3)}`;
  return {
    k: `${s.anio}-W${String(s.n).padStart(2, "0")}`,
    et: `${corto(lun)} – ${corto(dom)}`,
    orden: `${s.anio}-${String(s.n).padStart(2, "0")}`,
  };
}

/**
 * Agrupa los registros por periodo. El promedio diario se saca sobre los
 * días que cubren los registros, no sobre el número de entregas.
 */
function resumenLeche(registros, epoca) {
  const por = {};
  for (const r of registros) {
    const p = periodoDe(r.fecha, epoca);
    const g = (por[p.k] ||= { ...p, litros: 0, dias: 0, n: 0, ingreso: 0, vacasDia: 0 });
    const d = Math.max(1, Number(r.dias) || 1);
    g.litros += Number(r.litros) || 0;
    g.dias   += d;
    g.ingreso += (Number(r.litros) || 0) * (Number(r.precio) || 0);
    // Las vacas se ponderan por los días que cubre el registro: así un
    // periodo con el hato creciendo da el promedio correcto.
    g.vacasDia += vacasDeRegistro(r) * d;
    g.n++;
  }
  return Object.values(por)
    .map(g => {
      const vacas = g.dias ? g.vacasDia / g.dias : 0;
      return { ...g,
        promedio: g.dias ? g.litros / g.dias : 0,
        vacas,
        porVaca: g.dias && vacas ? (g.litros / g.dias) / vacas : 0 };
    })
    .sort((a, b) => b.orden.localeCompare(a.orden));
}

/** Comparativo entre las fincas a las que se tiene acceso. */
function resumenPorFinca(registros) {
  const por = {};
  for (const r of registros) {
    const g = (por[r.fincaId] ||= { fincaId: r.fincaId, litros: 0, dias: 0, vacasDia: 0, n: 0, ingreso: 0 });
    const d = Math.max(1, Number(r.dias) || 1);
    g.litros += Number(r.litros) || 0;
    g.dias += d;
    g.vacasDia += vacasDeRegistro(r) * d;
    g.ingreso += (Number(r.litros) || 0) * (Number(r.precio) || 0);
    g.n++;
  }
  return Object.values(por).map(g => {
    const vacas = g.dias ? g.vacasDia / g.dias : 0;
    return { ...g, nombre: nombreFinca(g.fincaId),
      promedio: g.dias ? g.litros / g.dias : 0,
      vacas, porVaca: g.dias && vacas ? (g.litros / g.dias) / vacas : 0 };
  }).sort((a, b) => b.porVaca - a.porVaca);
}

const litros = (n) => (Math.round((Number(n) || 0) * 10) / 10)
  .toLocaleString("es-CO", { maximumFractionDigits: 1 });
const pesos = (n) => "$" + Math.round(Number(n) || 0).toLocaleString("es-CO");


/** Quita de la configuración todo lo que colgaba de un correo. */
function limpiarConfigDe(correo) {
  const c = (correo || "").toLowerCase();
  if (!c) return;
  D.config.accesoConfig = (D.config.accesoConfig || [])
    .filter(x => (x || "").toLowerCase() !== c);
  if (D.config.permisos) delete D.config.permisos[c];
  if ((D.config.maestro || "").toLowerCase() === c) D.config.maestro = "";
}

/** Mueve al correo nuevo lo que estaba atado al anterior. */
function moverConfigDe(viejo, nuevo) {
  const v = (viejo || "").toLowerCase(), n = (nuevo || "").toLowerCase();
  if (!v || v === n) return;

  if ((D.config.maestro || "").toLowerCase() === v) D.config.maestro = n;

  D.config.accesoConfig = [...new Set((D.config.accesoConfig || [])
    .map(x => (x || "").toLowerCase() === v ? n : x)
    .filter(Boolean))];

  if (D.config.permisos && D.config.permisos[v]) {
    if (n) D.config.permisos[n] = D.config.permisos[v];
    delete D.config.permisos[v];
  }
}


/* ==========================================================
   FUSIONAR FICHAS DUPLICADAS

   Hasta la 1.27 el identificador de cada persona salía al azar,
   así que entrar en un equipo nuevo creaba otra ficha para el
   mismo correo. Esa ficha no estaba en ninguna finca y por eso
   no se veía nada. Esto las une en una sola.
   ========================================================== */

function unificarPersonas() {
  const grupos = {};
  for (const p of D.personas) {
    const c = (p.correo || "").trim().toLowerCase();
    if (!c) continue;
    (grupos[c] ||= []).push(p);
  }

  let fusionadas = 0;
  for (const [correo, lista] of Object.entries(grupos)) {
    if (lista.length < 2) continue;

    const estable = idDesdeCorreo(correo);
    // Gana la que ya tenga el id estable; si no, la que esté en más fincas
    // y tenga el nombre puesto a mano.
    const puntos = (p) =>
      (p.id === estable ? 10000 : 0) +
      D.fincas.filter(f => (f.personas || []).includes(p.id)).length * 100 +
      (p.nombrePorDefecto ? 0 : 50) +
      (p.telefono ? 5 : 0) + (p.documento ? 5 : 0) +
      (RANGO[p.rol] ?? 0);
    lista.sort((a, b) => puntos(b) - puntos(a));
    const buena = lista[0];

    // El nombre escrito por una persona manda sobre el sacado del correo.
    const conNombre = lista.find(p => !p.nombrePorDefecto && (p.nombre || "").trim());
    if (conNombre) { buena.nombre = conNombre.nombre; delete buena.nombrePorDefecto; }
    // Y el rol más alto de todas.
    for (const p of lista) {
      if ((RANGO[p.rol] ?? 0) > (RANGO[buena.rol] ?? 0)) buena.rol = p.rol;
    }

    for (const otra of lista.slice(1)) {
      for (const k of ["telefono", "documento", "notas"]) {
        if (!buena[k] && otra[k]) buena[k] = otra[k];
      }
      // Todo lo que apuntaba a la ficha vieja pasa a la buena.
      D.fincas.forEach(f => {
        if ((f.personas || []).includes(otra.id)) {
          f.personas = [...new Set(f.personas.map(x => x === otra.id ? buena.id : x))];
        }
      });
      for (const c of COLECCIONES) {
        (D[c] || []).forEach(x => { if (x.creadoPor === otra.id) x.creadoPor = buena.id; });
      }
      if (S.persona?.id === otra.id) S.persona = buena;
      quitarDe("personas", x => x.id === otra.id);
      fusionadas++;
    }
  }

  if (fusionadas) { recalcularAccesos(); guardar(); }
  return fusionadas;
}

/* ==========================================================
   PALPAR EN GRUPO
   Como la pantalla de AppSheet: una fila por animal, se escriben
   los meses y los días, y la fecha de parto sale sola.
   ========================================================== */

/**
 * La lista de palpar en grupo es más amplia que la de Palpación: si el
 * veterinario ya está en el corral, conviene poder revisar también a las que
 * ya se palparon o a las que se pasaron de plazo. Esto explica, para cada una,
 * por qué no está en la lista de pendientes.
 */
function porQueNoPendiente(a, e) {
  if (e.fechaPalpacion) return "";
  if (!e.ultInsem) return "sin servicio apuntado";
  if (e.ultParto && e.ultParto.fecha > e.ultInsem.fecha) return "ya parió";
  if (palpDe(a.id).some(p => p.fecha > e.ultInsem.fecha)) return "ya palpada";
  if (!palpaPorServicio(e.ultInsem)) return "no se le pide palpación";
  const P = par(a);
  if (dias(e.ultInsem.fecha) > P.gestacion - 45) return "servicio muy viejo";
  return "";
}

/** Hembras que se pueden palpar, según el modo elegido. */
function candidatasPalpacion(modo, fincaId) {
  return misAnimales()
    .filter(a => a.estado === "activo" && par(a).sirve)
    .filter(a => fincaId === "todas" || a.fincaId === fincaId)
    .filter(a => {
      const e = estado(a);
      // Con toro no hay servicio apuntado: en ese modo entran todas.
      if (modo === "todas") return true;
      return e.ultInsem && palpaPorServicio(e.ultInsem)
        && !(e.ultParto && e.ultParto.fecha > e.ultInsem.fecha);
    })
    .sort((a, b) => {
      const fa = estado(a).fechaPalpacion || "9999", fb = estado(b).fechaPalpacion || "9999";
      return fa.localeCompare(fb) || a.nombre.localeCompare(b.nombre, "es");
    });
}

function abrirPalpacionGrupo(modo, fincaId) {
  V.palpaModo = modo || V.palpaModo || "servidas";
  V.palpaFinca = fincaId || V.palpaFinca || (V.finca !== "todas" ? V.finca : "todas");
  V.palpaSolo = false;
  const candidatas = candidatasPalpacion(V.palpaModo, V.palpaFinca);

  if (!candidatas.length && V.palpaModo === "servidas") {
    if (confirm("No hay hembras con servicio registrado pendientes de palpar.\n\n" +
        "Si en esa finca manejan monta natural, nadie apunta la fecha del servicio.\n\n" +
        "¿Mostrar todas las hembras para palparlas de una vez?")) {
      return abrirPalpacionGrupo("todas", V.palpaFinca);
    }
    return;
  }
  if (!candidatas.length) return alert("No hay hembras para palpar con ese filtro.");

  const porFinca = {};
  candidatas.forEach(a => { (porFinca[a.fincaId] ||= []).push(a); });

  abrirHoja(`
    <div class="hoja-cab"><div><h2>Palpar en grupo</h2>
      <div class="sub">${(() => {
        const pend = candidatas.filter(a => estado(a).fechaPalpacion).length;
        const otras = candidatas.length - pend;
        return `${candidatas.length} hembras · ${pend} pendiente${pend === 1 ? "" : "s"} de palpar` +
               (otras ? ` · ${otras} de más, por si aprovechas al veterinario` : "");
      })()}</div></div>
      <button class="cerrar" data-cerrar>×</button></div>
    <form data-palpar-grupo>
      <div class="hoja-cuerpo">
        <div class="aviso" data-error hidden></div>
        <div class="rej">
          <div class="campo"><label>Fecha de la palpación</label>
            <input type="date" name="fecha" value="${hoyISO()}" required></div>

  const fechaInp = hojaAbierta.querySelector("[name=fecha]");

  /* De los meses y días sale la fecha de preñez, y de la fecha salen los meses
     y días. Se puede escribir por donde sea más cómodo y lo otro se rellena. */
  const desdeFecha = (fila) => {
    const idA = fila.dataset.animal;
    const c = fila.querySelector(`[name=c_${idA}]`).value;
    const g = gestacionDesdeFecha(fechaInp.value, c);

    fila.querySelector(`[name=m_${idA}]`).value = g.mesesGest;
    fila.querySelector(`[name=d_${idA}]`).value = g.diasGest;

    const idA = fila.dataset.animal;

    const caja = fila.querySelector("[data-calc]");

    const v = { fecha: fechaInp.value,
                mesesGest: fila.querySelector(`[name=m_${idA}]`).value,
                diasGest: fila.querySelector(`[name=d_${idA}]`).value };
    // La fecha de preñez se mantiene al día con lo que digan los números.
    const conc = concepcionDePalpacion(v);
    if (conc && cInp.value !== conc) cInp.value = conc;
    const reparo = reparoPalpacion(a, { ...v, resultado: "prenada" });

      fila.classList.add("dudosa");
      caja.innerHTML = `<span class="p roja">Revisa</span><em>${esc(reparo)}</em>`;

    fila.classList.remove("dudosa");
    const parto = partoDePalpacion(v, a);
    /* Si lo que dice el veterinario se aparta mucho del servicio apuntado, hay
       que elegir cuál manda: de esa fecha salen el parto y el secado. */
    const des = desfaseConServicio(a, v);
    const lejos = des && Math.abs(des.dif) > 12;
    const md = fila.querySelector(".palpa-manda");
    if (md) md.hidden = !lejos;
    caja.innerHTML = parto
      ? `Parto <strong>${fmtCorto(parto)}</strong><em>preñada desde ${fmtCorto(concepcionDePalpacion(v))}</em>${
          lejos ? `<em style="color:var(--hierro)">no cuadra con el servicio del ${
            fmtCorto(des.servicio.fecha)}: ${Math.abs(des.dif)} días</em>` : ""}`
      : "—";
  };
  const conteo = hojaAbierta.querySelector("[data-palpa-conteo]");
  const cajaDesfase = hojaAbierta.querySelector("[data-palpa-desfase]");
  const txtDesfase = hojaAbierta.querySelector("[data-palpa-desfase-txt]");
  const busca = hojaAbierta.querySelector("[data-palpa-busca]");
  const btnSolo = hojaAbierta.querySelector("[data-palpa-solo]");
  const btnGuardar = hojaAbierta.querySelector(".hoja-pie .btn-firme");

  /* Filtrar solo esconde: lo marcado sigue ahí y se guarda igual. */
  const filtrar = () => {
    const q = busca.value;
    let vistas = 0;
    hojaAbierta.querySelectorAll(".palpa-fila").forEach(fila => {
      const a = animal(fila.dataset.animal);
      const texto = [a?.nombre, a?.chapeta, nombreFinca(a?.fincaId),
                     CATEGORIAS[a?.categoria]?.et].filter(Boolean).join(" ");
      const pasa = contiene(texto, q) &&
        (!V.palpaSolo || fila.classList.contains("marcada"));
      fila.hidden = !pasa;
      if (pasa) vistas++;
    });
    // Los títulos de finca sin filas visibles se esconden.
    hojaAbierta.querySelectorAll(".palpa-lista").forEach(g => {
      const hay = [...g.querySelectorAll(".palpa-fila")].some(f => !f.hidden);
      g.hidden = !hay;
      const t = g.previousElementSibling;
      if (t && t.classList.contains("sub-titulo")) t.hidden = !hay;
    });
    if (!vistas) conteo.insertAdjacentHTML("afterend", "");
    return vistas;
  };

  const actualizarConteo = () => {
    const marcadas = hojaAbierta.querySelectorAll(".palpa-fila.marcada").length;
    const total = hojaAbierta.querySelectorAll(".palpa-fila").length;
    const vistas = hojaAbierta.querySelectorAll(".palpa-fila:not([hidden])").length;
    conteo.innerHTML = marcadas
      ? `<strong>${marcadas}</strong> marcada${marcadas === 1 ? "" : "s"} de ${total}` +
        (vistas !== total ? ` · viendo ${vistas}` : "")
      : `${vistas === total ? total : vistas + " de " + total} sin marcar todavía`;
    conteo.classList.toggle("hay", !!marcadas);

    // Cuántas se apartan del servicio apuntado, y cuántas ya están resueltas.
    const flojas = [...hojaAbierta.querySelectorAll(".palpa-manda:not([hidden]) input")];
    const puestas = flojas.filter(x => x.checked).length;
    if (cajaDesfase) {
      cajaDesfase.hidden = !flojas.length;
      if (flojas.length) txtDesfase.innerHTML =
        `<strong>${flojas.length}</strong> palpación${flojas.length === 1 ? "" : "es"} no
         cuadra${flojas.length === 1 ? "" : "n"} con la fecha del servicio apuntado.

           <strong>${puestas}</strong>.` : "Elige cuál manda: de esa fecha salen el parto y el secado."}`;
    }
    if (btnGuardar) {
      btnGuardar.textContent = marcadas
        ? `Guardar ${marcadas} ${marcadas === 1 ? "palpación" : "palpaciones"}`
        : "Guardar las palpaciones";
      btnGuardar.disabled = !marcadas;
    }
  };

  const decidirTodas = (valor) => {
    hojaAbierta.querySelectorAll(".palpa-manda:not([hidden]) input")
      .forEach(x => { x.checked = valor; });
    actualizarConteo();
    avisar(valor
      ? "En las que no cuadraban manda ahora la palpación"
      : "En las que no cuadraban manda la fecha de la inseminación");
  };
  hojaAbierta.querySelector("[data-palpa-mandan]")

    const mano = (ev) => {
      if (ev.target?.name?.startsWith("c_")) desdeFecha(fila);
      refrescar(fila); actualizarConteo();
    };
    fila.addEventListener("input", mano);
    fila.addEventListener("change", mano);
  });
  fechaInp.oninput = todas;
  todas();
}

function guardarPalpacionGrupo(f) {
  const fecha = f.querySelector("[name=fecha]").value;
  if (!fecha) return error(f, "Pon la fecha de la palpación.");
  if (dias(fecha) < 0) return error(f, "Esa fecha todavía no ha llegado.");

  // Primero se revisan todas: si una no cuadra, no se guarda ninguna.
  const reparos = [];
  for (const fila of f.querySelectorAll(".palpa-fila")) {
    const idA = fila.dataset.animal;
    const res = fila.querySelector(`[name=r_${idA}]:checked`)?.value;
    if (res !== "prenada") continue;
    const a = animal(idA);
    const r = reparoPalpacion(a, { fecha,
      mesesGest: fila.querySelector(`[name=m_${idA}]`).value,
      diasGest: fila.querySelector(`[name=d_${idA}]`).value, resultado: "prenada" });
    if (r) {
      reparos.push(`${a.nombre} (${a.chapeta}): ${r}`);
      fila.classList.add("dudosa");
      fila.hidden = false;
    }
  }
  if (reparos.length) {
    return error(f, `Revisa ${reparos.length === 1 ? "esta" : "estas"}:\n• ` +
      reparos.slice(0, 6).join("\n• ") +
      (reparos.length > 6 ? `\n…y ${reparos.length - 6} más` : ""));
  }

  let n = 0;
  for (const fila of f.querySelectorAll(".palpa-fila")) {
    const idA = fila.dataset.animal;
    const res = fila.querySelector(`[name=r_${idA}]:checked`)?.value;
    if (!res) continue;
    const a = animal(idA);
    if (!a) continue;
    const mesesGest = res === "prenada" ? Number(fila.querySelector(`[name=m_${idA}]`).value) || 0 : 0;
    const diasGest  = res === "prenada" ? Number(fila.querySelector(`[name=d_${idA}]`).value) || 0 : 0;
    // Que esta palpación mande sobre la fecha del servicio apuntado.
    const manda = res === "prenada"
      && !!fila.querySelector(`[name=md_${idA}]`)?.checked;
    D.palpaciones.push({
      id: uid(), animalId: idA, fincaId: a.fincaId, fecha,
      resultado: res, mesesGest, diasGest, manda,
      observaciones: "", creadoPor: S.persona?.id || null,
    });
    n++;
  }
  if (!n) return error(f, "No marcaste ningún resultado.");
  recalcularAccesos(); guardar(); cerrarHoja(); pintar();
  avisar(`${n} palpación(es) registradas`);
}


/**
 * ¿Tienen sentido esos meses y días para ese animal?
 * Devuelve el reparo, o null si va bien.
 */
function reparoPalpacion(a, v) {
  if (!a || v.resultado === "vacia") return null;
  const c = concepcionDePalpacion(v);
  if (!c) return "faltan los meses y días";

  const P = par(a);
  const d = dias(c, aFecha(v.fecha));
  if (d < 0) return "esos meses y días dan una fecha en el futuro";
  if (d > P.gestacion) {
    return `de ${v.mesesGest || 0} meses y ${v.diasGest || 0} días ya habría parido: ` +
           `en ${(P.plural || "esta especie").toLowerCase()} la gestación es de ${P.gestacion} días`;
  }
  // No pudo quedar preñada antes de su último parto.
  const e = estado(a);
  if (e.ultParto && c < e.ultParto.fecha) {
    return `quedaría preñada el ${fmtCorto(c)}, antes de su ${
      e.ultParto.tipo === "aborto" ? "aborto" : "parto"} del ${fmtCorto(e.ultParto.fecha)}`;
  }
  if (a.fechaNacimiento && c < a.fechaNacimiento) {
    return `quedaría preñada antes de nacer`;
  }
  return null;
}

/* ==========================================================
   CARGA MASIVA
   Pega lo copiado de Google Sheets o sube un CSV. La app
   adivina las columnas, resuelve las referencias por nombre
   y reparte las filas a la tabla que corresponda.
   ========================================================== */

/* ---------- leer el texto pegado ---------- */

/** Detecta el separador: tabulación al pegar de Sheets, coma o punto y coma en CSV. */
function detectarSeparador(txt) {
  const linea = txt.split(/\r?\n/).find(l => l.trim()) || "";
  const cuenta = (c) => (linea.match(new RegExp("\\" + c, "g")) || []).length;
  if (cuenta("\t")) return "\t";
  if (cuenta(";") > cuenta(",")) return ";";
  return ",";
}

/** Divide respetando comillas y saltos de línea dentro de una celda. */
function partirTabla(txt, sep) {
  const filas = [];
  let fila = [], celda = "", enComillas = false;

  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (enComillas) {
      if (c === '"') {
        if (txt[i + 1] === '"') { celda += '"'; i++; }
        else enComillas = false;
      } else celda += c;
      continue;
    }
    if (c === '"') { enComillas = true; continue; }
    if (c === sep) { fila.push(celda); celda = ""; continue; }
    if (c === "\n") { fila.push(celda); filas.push(fila); fila = []; celda = ""; continue; }
    if (c === "\r") continue;
    celda += c;
  }
  if (celda !== "" || fila.length) { fila.push(celda); filas.push(fila); }
  return filas.filter(f => f.some(x => String(x).trim() !== ""));
}

/* ---------- fechas ---------- */

const MES_CORTO = { ene:0, jan:0, feb:1, mar:2, abr:3, apr:3, may:4, jun:5, jul:6,
                    ago:7, aug:7, sep:8, oct:9, nov:10, dic:11, dec:11 };

/**
 * Lee una fecha en los formatos que salen de Sheets.
 * orden: "mdy" o "dmy" para resolver 11/09/2024, que es ambiguo.
 */
function leerFecha(v, orden) {
  const t = String(v ?? "").trim();
  if (!t) return null;

  // Ya viene bien
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

  // 9 Jan 24 · 19 nov 2022
  m = t.match(/^(\d{1,2})[\s-]+([a-zA-ZáéíóúÁÉÍÓÚ]{3,})[\s-]+(\d{2,4})/);
  if (m) {
    const mes = MES_CORTO[normaliza(m[2]).slice(0, 3)];
    if (mes !== undefined) {
      let a = Number(m[3]); if (a < 100) a += 2000;
      return `${a}-${String(mes+1).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    }
  }

  // 11/19/2022 · 19/11/2022 · 1-9-24
  m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let a = Number(m[3]); if (a < 100) a += 2000;
    let p = Number(m[1]), s = Number(m[2]);
    let mes, dia;
    if (p > 12) { dia = p; mes = s; }          // solo puede ser día
    else if (s > 12) { mes = p; dia = s; }     // solo puede ser mes
    else if (orden === "dmy") { dia = p; mes = s; }
    else { mes = p; dia = s; }
    if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
    return `${a}-${String(mes).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
  }

  // Número de serie de Excel
  if (/^\d{5}$/.test(t)) {
    const d = new Date(Date.UTC(1899, 11, 30) + Number(t) * 86400000);
    return d.toISOString().slice(0, 10);
  }
  return null;
}

const leerNumero = (v) => {
  const t = String(v ?? "").trim().replace(/\s/g, "");
  if (!t) return null;
  // 1.234,5 (europeo) o 1,234.5 (inglés)
  const n = Number(t.includes(",") && t.lastIndexOf(",") > t.lastIndexOf(".")
    ? t.replace(/\./g, "").replace(",", ".")
    : t.replace(/,/g, ""));
  return Number.isFinite(n) ? n : null;
};

const leerSiNo = (v) => {
  const t = normaliza(v).trim();
  if (["si","sí","true","verdadero","1","x","activo"].includes(t)) return true;
  if (["no","false","falso","0","","inactivo"].includes(t)) return false;
  return null;
};

/* ---------- adivinar el destino y las columnas ---------- */

function adivinarDestino(encabezados) {
  const h = encabezados.map(x => normaliza(x).trim());
  const tiene = (t) => h.some(x => x.includes(t));
  if (tiene("tipo registro")) return "registros";
  if (tiene("chapeta") && tiene("categoria")) return "animales";
  if (tiene("tipo tratamiento")) return "tratamientos";
  if (tiene("nombre finca") || (tiene("finca") && tiene("ubicacion"))) return "fincas";
  if (tiene("litros")) return "leche";
  if (tiene("nota") && tiene("finca")) return "anotaciones";
  if (tiene("correo") && tiene("nombre")) return "personas";
  if (tiene("pajilla")) return "inseminaciones";
  if (tiene("sexo")) return "partos";
  return "animales";
}

function adivinarMapeo(destino, encabezados) {
  const def = DESTINOS[destino];
  const usados = new Set();
  return encabezados.map((h) => {
    const n = normaliza(h).trim();
    if (!n) return "";
    let mejor = "";
    for (const c of def.campos) {
      if (usados.has(c.k)) continue;
      if (n === normaliza(c.et).trim() || c.alias.some(a => n === a)) { mejor = c.k; break; }
      if (!mejor && c.alias.some(a => n.includes(a))) mejor = c.k;
    }
    if (mejor) usados.add(mejor);
    return mejor;
  });
}

/* ---------- resolver referencias ---------- */

function buscarFinca(v) {
  const t = normaliza(v).trim();
  if (!t) return null;
  return misFincasObj().find(f => normaliza(f.refExterna || "") === t)
      || misFincasObj().find(f => normaliza(f.nombre) === t)
      || misFincasObj().find(f => normaliza(f.nombre).includes(t))
      || null;
}

function buscarAnimal(v) {
  const t = normaliza(v).trim();
  if (!t) return null;
  const mios = misAnimales();
  return mios.find(a => normaliza(a.refExterna || "") === t)
      || mios.find(a => normaliza(a.chapeta) === t)
      || mios.find(a => normaliza(a.nombre) === t)
      || null;
}

const CAT_ALIAS = (() => {
  const m = {};
  for (const [k, c] of Object.entries(CATEGORIAS)) m[normaliza(c.et)] = k;
  m["novilla"] = "novillona"; m["vaca seca"] = "vaca"; m["toro reproductor"] = "toro";
  return m;
})();

/* ---------- convertir una fila ---------- */

function convertirFila(destino, mapeo, fila, opciones) {
  const def = DESTINOS[destino];
  const crudo = {};
  mapeo.forEach((k, i) => { if (k) crudo[k] = String(fila[i] ?? "").trim(); });

  const errores = [];
  const val = {};

  for (const c of def.campos) {
    const bruto = crudo[c.k];
    if (bruto === undefined || bruto === "") {
      if (c.req) errores.push(`falta ${c.et.toLowerCase()}`);
      continue;
    }
    if (c.tipo === "fecha") {
      const f = leerFecha(bruto, opciones.ordenFecha);
      if (!f) { errores.push(`fecha ilegible «${bruto}»`); continue; }
      val[c.k] = f;
    } else if (c.tipo === "numero") {
      const n = leerNumero(bruto);
      if (n === null) { errores.push(`número ilegible «${bruto}»`); continue; }
      val[c.k] = n;
    } else if (c.tipo === "finca") {
      const f = buscarFinca(bruto);
      if (!f) { errores.push(`no encuentro la finca «${bruto}»`); continue; }
      val.fincaId = f.id;
    } else if (c.tipo === "animal") {
      const a = buscarAnimal(bruto);
      if (!a) { if (c.req) errores.push(`no encuentro el animal «${bruto}»`); continue; }
      val.animalId = a.id;
      val.fincaId = a.fincaId;
    } else if (c.tipo === "categoria") {
      const k2 = CAT_ALIAS[normaliza(bruto)];
      if (!k2) { errores.push(`categoría desconocida «${bruto}»`); continue; }
      val.categoria = k2;
    } else if (c.tipo === "estado") {
      const t = normaliza(bruto);
      val.estado = t.includes("vend") ? "vendido" : t.includes("muert") ? "muerto" : "activo";
    } else {
      val[c.k] = bruto;
    }
  }
  return { val, errores, crudo };
}

/** Decide a qué tabla va una fila de la hoja de registros mezclados. */
function repartirRegistro(val) {
  const t = normaliza(val.tipoRegistro || "");
  if (t.includes("insemin") || t.includes("monta") || t.includes("servicio")) return "inseminaciones";
  if (t.includes("aborto")) return "partos";
  if (t.includes("parto")) return "partos";
  if (t.includes("palpa")) return "palpaciones";
  if (t.includes("secad")) return "secados";
  if (t.includes("trata")) return "tratamientos";
  return null;
}

let IMP = null;   // { texto, sep, filas, encabezados, destino, mapeo, ordenFecha, paso }

function abrirImportador(destinoSugerido) {
  IMP = { texto: "", filas: [], encabezados: [], destino: destinoSugerido || "",
          mapeo: [], ordenFecha: "mdy", paso: 1, conEncabezado: true };
  pintarImportador();
}

function pintarImportador() {
  if (IMP.paso === 1) return pasoPegar();
  if (IMP.paso === 2) return pasoMapear();
  return pasoRevisar();
}

          <tbody>${r.errores.slice(0, 40).map(e => `<tr>
            <td>${e.n}</td><td>${esc(e.motivo)}</td>
            <td><span class="sub">${esc(e.muestra)}</span></td></tr>`).join("")}</tbody>
        </table></div>
        ${r.errores.length > 40 ? `<p class="mini">Y ${r.errores.length - 40} más.</p>` : ""}` : ""}

      ${r.ejemplos.length ? `
        <h4 class="sub-titulo">Así van a quedar</h4>
        <div class="sub-tabla"><table><tbody>
          ${r.ejemplos.map(x => `<tr><td>${esc(x)}</td></tr>`).join("")}
        </tbody></table></div>` : ""}
    </div>
    <div class="hoja-pie">
      <button type="button" class="btn" data-imp="atras2">Atrás</button>
      <button class="btn btn-firme" data-imp="guardar"
        ${r.nuevos + r.actualiza ? "" : "disabled"}>
        Guardar ${r.nuevos + r.actualiza} registros</button>
    </div>`, true);
}

/* ---------- procesar ---------- */

function procesarImportacion(soloRevisar) {
  const filas = IMP.filas.slice(IMP.conEncabezado ? 1 : 0);
  const def = DESTINOS[IMP.destino];
  const r = { nuevos: 0, actualiza: 0, errores: [], ejemplos: [], porTabla: {} };
  const pendientes = [];

  filas.forEach((fila, i) => {
    const n = i + (IMP.conEncabezado ? 2 : 1);
    const muestra = fila.filter(Boolean).slice(0, 4).join(" · ").slice(0, 60);
    const { val, errores } = convertirFila(IMP.destino, IMP.mapeo, fila, { ordenFecha: IMP.ordenFecha });

    if (errores.length) { r.errores.push({ n, motivo: errores.join("; "), muestra }); return; }

    let coleccion = def.col;
    if (def.reparte) {
      coleccion = repartirRegistro(val);
      if (!coleccion) {
        r.errores.push({ n, motivo: `tipo desconocido «${val.tipoRegistro}»`, muestra });
        return;
      }
      if (coleccion === "partos") {
        val.tipo = normaliza(val.tipoRegistro).includes("aborto") ? "aborto" : "parto";
      }
    }

    const doc = armarDoc(coleccion, val);
    if (!doc) { r.errores.push({ n, motivo: "no se pudo armar el registro", muestra }); return; }

    const existente = val.refExterna
      ? (D[coleccion] || []).find(x => x.refExterna === val.refExterna)
      : null;
    if (existente) r.actualiza++; else r.nuevos++;
    r.porTabla[coleccion] = (r.porTabla[coleccion] || 0) + 1;

    if (r.ejemplos.length < 5) r.ejemplos.push(describir(coleccion, doc));
    pendientes.push({ coleccion, doc, existente });
  });

  IMP.resultado = r;
  IMP.pendientes = pendientes;
  return r;
}

/** Da forma al documento según su tabla. */
function armarDoc(coleccion, v) {
  const base = { refExterna: v.refExterna || null, creadoPor: S.persona?.id || null };

  if (coleccion === "fincas") return { ...base, nombre: v.nombre, ubicacion: v.ubicacion || "",
    personas: S.persona ? [S.persona.id] : [] };

  if (coleccion === "animales") {
    if (!v.fincaId) return null;
    return { ...base, chapeta: String(v.chapeta), nombre: v.nombre || "", fincaId: v.fincaId,
      categoria: v.categoria || "vaca", estado: v.estado || "activo",
      raza: v.raza || "", detalles: v.detalles || "", foto: null, tieneFoto: false,
      fechaNacimiento: v.fechaNacimiento || null, hechas: {},
      partosPrevios: v.partosPrevios || 0, ultimoPartoPrevio: v.ultimoPartoPrevio || null,
      fechaSalida: null, motivoSalida: "" };
  }

  if (coleccion === "inseminaciones") {
    if (!v.animalId) return null;
    return { ...base, animalId: v.animalId, fincaId: v.fincaId, fecha: v.fecha,
      tipo: normaliza(v.tipoRegistro || "").includes("monta") ? "monta" : "inseminacion",
      detalles: v.detalles || "",
      aplicaciones: [{ fecha: v.fecha, hora: v.hora || "",
                       pajilla: v.pajilla || "", detalles: "" }] };
  }

  if (coleccion === "partos") {
    if (!v.animalId) return null;
    const tipo = v.tipo === "aborto" ? "aborto" : "parto";
    return { ...base, animalId: v.animalId, fincaId: v.fincaId, fecha: v.fecha, tipo,
      sexoCria: tipo === "aborto" ? "" : (v.sexoCria || ""), detalles: v.detalles || "" };
  }

  if (coleccion === "palpaciones") {
    if (!v.animalId) return null;
    const t = normaliza(v.resultado || "");
    return { ...base, animalId: v.animalId, fincaId: v.fincaId, fecha: v.fecha,
      resultado: (t.includes("vac") || t.includes("no")) ? "vacia" : "prenada",
      diasGestacion: v.diasGestacion ?? null, observaciones: v.observaciones || v.detalles || "" };
  }

  if (coleccion === "secados") {
    if (!v.animalId) return null;
    const t = normaliza(v.motivo || "");
    const motivo = Object.keys(MOTIVOS_SECADO).find(k => t.includes(normaliza(MOTIVOS_SECADO[k]).slice(0,6)))
                || (t ? "otro" : "ventana");
    return { ...base, animalId: v.animalId, fincaId: v.fincaId, fecha: v.fecha,
      motivo, observaciones: v.observaciones || v.detalles || "" };
  }

  if (coleccion === "tratamientos") {
    if (!v.animalId) return null;
    return { ...base, animalId: v.animalId, fincaId: v.fincaId, tipo: v.tipo,
      inicio: v.inicio, fin: v.fin || "", detalles: v.detalles || "" };
  }

  if (coleccion === "leche") {
    if (!v.fincaId) return null;
    return { ...base, fincaId: v.fincaId, fecha: v.fecha, litros: v.litros,
      dias: Math.max(1, v.dias || 1), momento: "total",
      animalId: v.animalId || "", precio: v.precio || 0,
      observaciones: v.observaciones || "" };
  }

  if (coleccion === "anotaciones") {
    if (!v.fincaId) return null;
    return { ...base, fincaId: v.fincaId, fecha: v.fecha, texto: v.texto };
  }

  if (coleccion === "personas") {
    const t = normaliza(v.rol || "");
    let rol = t.includes("due") ? "dueno" : t.includes("admin") ? "administrador" : "empleado";
    if (!rolesQuePuedoCrear().includes(rol)) rol = "empleado";
    return { ...base, nombre: v.nombre, correo: (v.correo || "").toLowerCase(),
      rol, telefono: v.telefono || "", documento: v.documento || "",
      notas: v.notas || "", activo: true, fincas: [], _finca: v.fincaId || null };
  }
  return null;
}

function describir(coleccion, d) {
  const a = d.animalId ? animal(d.animalId) : null;
  const quien = a ? `${a.nombre} (${a.chapeta})` : "";
  if (coleccion === "animales") return `${d.nombre} · chapeta ${d.chapeta} · ${CATEGORIAS[d.categoria]?.et} · ${nombreFinca(d.fincaId)}`;
  if (coleccion === "fincas") return `${d.nombre}${d.ubicacion ? " · " + d.ubicacion : ""}`;
  if (coleccion === "inseminaciones") return `${fmtCorto(d.fecha)} · ${quien} · ${d.aplicaciones[0].pajilla || "sin pajilla"}`;
  if (coleccion === "partos") return `${fmtCorto(d.fecha)} · ${quien} · ${d.tipo}${d.sexoCria ? " " + d.sexoCria : ""}`;
  if (coleccion === "palpaciones") return `${fmtCorto(d.fecha)} · ${quien} · ${d.resultado}`;
  if (coleccion === "secados") return `${fmtCorto(d.fecha)} · ${quien} · ${MOTIVOS_SECADO[d.motivo]}`;
  if (coleccion === "tratamientos") return `${fmtCorto(d.inicio)} · ${quien} · ${d.tipo}`;
  if (coleccion === "leche") return `${fmtCorto(d.fecha)} · ${litros(d.litros)} L en ${d.dias} día(s)`;
  if (coleccion === "anotaciones") return `${fmtCorto(d.fecha)} · ${nombreFinca(d.fincaId)}`;
  if (coleccion === "personas") return `${d.nombre} · ${ROLES[d.rol].et}`;
  return "";
}

/** Escribe de verdad. */
function guardarImportacion() {
  let n = 0, saltados = 0;
  for (const { coleccion, doc, existente } of IMP.pendientes) {
    // Los límites de creación también valen aquí.
    if (!existente) {
      if (coleccion === "fincas" && !cupo("fincas").ok) { saltados++; continue; }
      if (coleccion === "personas") {
        const clave = doc.rol === "administrador" ? "administradores"
                    : doc.rol === "empleado" ? "empleados" : null;
        if (clave && !cupo(clave).ok) { saltados++; continue; }
      }
    }
    const finca = doc._finca; delete doc._finca;
    if (existente) Object.assign(existente, doc);
    else {
      const id = uid();
      D[coleccion].push({ id, ...doc });
      if (coleccion === "personas" && finca) asignarFincas(id, [finca]);
    }
    n++;
  }
  recalcularAccesos();
  guardar();
  cerrarHoja();
  pintar();
  avisar(saltados ? `${n} registros guardados · ${saltados} sin cupo` : `${n} registros guardados`);
  IMP = null;
}

/* ==========================================================
   FIREBASE — conexión opcional.
   La app funciona sola sin esto. Al conectar, los datos pasan
   a vivir en Firestore y se sincronizan entre computadores.
   ========================================================== */

/* ----------------------------------------------------------
   VENTANA DE SINCRONIZACIÓN

   Los eventos crecen para siempre. Se baja solo lo reciente, que
   es lo que alimenta las alertas y los cálculos, y el historial
   viejo se pide al abrir la ficha de un animal.

   Los partos NO se recortan: son pocos y de ellos salen el total
   de partos y el intervalo entre partos, que deben ser exactos.
   ---------------------------------------------------------- */
const CON_VENTANA = {
  inseminaciones: "fecha", palpaciones: "fecha", secados: "fecha",
  tratamientos: "inicio", leche: "fecha",
};

function corteVentana() {
  const m = Number(D.config?.ventanaMeses ?? 24);
  if (!m) return null;                       // 0 = traer todo
  const d = new Date();
  d.setMonth(d.getMonth() - m);
  return aISO(d);
}

/**
 * ¿Se está trayendo todo, sin recorte de fechas?
 *
 * Puede ser por dos motivos, y antes solo se detectaba uno: porque en esta
 * sesión se pidió «traer todo», o porque la ventana guardada quedó en 0.
 * Lo segundo pasaba solo, sin avisar: el botón de emergencia de «bajar sin
 * necesidad de índices» dejaba la ventana en 0 para siempre, y desde
 * entonces la app abría con la base entera y en silencio.
 */
const sinRecorte = () => !!FB.todoElHistorial || !Number(D.config?.ventanaMeses ?? 24);

const COLECCIONES = ["fincas", "personas", "animales", "inseminaciones",
                     "palpaciones", "partos", "secados", "tratamientos", "leche", "anotaciones"];

/* ==========================================================
   AJUSTES QUE SON DE LA FINCA, NO DEL APARATO

   Toda la configuración vivía solo en cada equipo. Para el tema
   oscuro o los meses de historial está bien: dependen del
   aparato. Pero que una vaca geste 283 días es de la finca, y
   cerrarle una sección a un empleado es un permiso: hacerlo en
   el computador no servía de nada porque en el celular seguía
   viendo todo.

   Estos dos grupos viajan por Firestore. Van en documentos
   separados porque no los escribe la misma gente.
   ========================================================== */
const AJUSTES = {
  // Reglas de manejo. Las cambia quien manda en la finca.
  finca: ["params", "palpaSegun"],
  // Permisos y propiedad de la base. Solo dueño o superadministrador.
  mando: ["permisos", "accesoConfig", "limites", "maestro"],
};

/** Lo que se queda en este equipo: firebase, sinFirebase, sesionDe,
    ventanaMeses, recordarSesion, tema, cuentaGoogle, giroBloqueado, correo. */
const puedeEscribirAjustes = (cual) =>
  cual === "finca" ? manda() : (esSuper() || rolActual() === "dueno");

const FB = {
  mods: null, app: null, db: null, auth: null, user: null,
  estado: "apagado",   // apagado | cargando | listo | error
  error: "", escuchas: [], espejo: {}, aplicando: false, pendiente: null,
};

const SDK = "https://www.gstatic.com/firebasejs/10.13.0/";
const enArchivoLocal = () => location.protocol === "file:";

const ARCHIVOS_SDK = ["firebase-app.js", "firebase-auth.js", "firebase-firestore.js"];

async function cargarSDK() {
  if (FB.mods) return FB.mods;
  const tope = new Promise((_, r) =>
    setTimeout(() => r(new Error("El SDK de Firebase tardó demasiado")), 15000));
  const carga = Promise.all(ARCHIVOS_SDK.map(f => import(SDK + f)));
  const [app, auth, fs] = await Promise.race([carga, tope]);
  FB.mods = { app, auth, fs };

  // Pedirle al service worker que lo guarde, para poder abrir sin señal.
  try {
    navigator.serviceWorker?.controller?.postMessage({
      tipo: "guardar-sdk", urls: ARCHIVOS_SDK.map(f => SDK + f),
    });
  } catch {}
  return FB.mods;
}

/** Traduce los códigos de Firebase a algo accionable. */
function errorFB(e) {
  const c = e?.code || String(e);
  const mapa = {
    "auth/invalid-email": "El correo no tiene un formato válido.",
    "auth/user-not-found": "No existe una cuenta con ese correo. Créala en Authentication → Users.",
    "auth/wrong-password": "La contraseña no coincide.",
    "auth/invalid-credential": "El correo o la contraseña no coinciden.",
    "auth/too-many-requests": "Demasiados intentos. Espera unos minutos.",
    "auth/network-request-failed": "Sin conexión a internet.",
    "auth/operation-not-allowed": "Falta habilitar Correo/contraseña en Authentication → Sign-in method.",
    "auth/invalid-api-key": "La apiKey no es válida. Revisa que la pegaste completa.",
    "permission-denied": "Las reglas de Firestore rechazaron la operación. Revisa el paso 3 de esta página.",
    "unavailable": "No se pudo llegar a Firestore. Revisa la conexión.",
    "failed-precondition": "Falta crear la base de datos en Firestore. Ve a Firestore Database → Crear base de datos.",
  };
  for (const k in mapa) if (c.includes(k)) return mapa[k];
  if (String(e).includes("Failed to fetch") || String(e).includes("dynamically imported"))
    return "No se pudo descargar el SDK de Firebase. Si abriste el archivo con doble clic, " +
           "el navegador lo bloquea: publícalo en un servidor o en GitHub Pages.";
  return e?.message || String(e);
}

/* ---------- conectar ---------- */
async function conectarFirebase(silencioso) {
  const cfg = D.config.firebase;
  if (!cfg || !cfg.apiKey || !cfg.projectId) { FB.estado = "apagado"; return; }

  FB.estado = "cargando"; FB.error = "";
  if (!silencioso) pintar();

  try {
    const { app, auth, fs } = await cargarSDK();
    if (!FB.app) {
      FB.app = app.initializeApp(cfg);
      FB.auth = auth.getAuth(FB.app);
      // Por defecto la sesión es de la pestaña. Solo se guarda en el equipo
      // si la persona lo pidió expresamente.
      try {
        // Con la app instalada en el celular la sesión SIEMPRE se guarda.
        // Antes se borraba al salir de la app, y al volver pedía entrar otra
        // vez... cosa que necesita internet. En el corral eso dejaba la app
        // inservible justo cuando más falta hace.
        await auth.setPersistence(FB.auth, sesionPersistente()
          ? auth.browserLocalPersistence : auth.browserSessionPersistence);
      } catch {}
      try {
        FB.db = fs.initializeFirestore(FB.app, {
          localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
        });
      } catch { FB.db = fs.getFirestore(FB.app); }

      // Si volvió de Google por redirección, recoger el resultado.
      auth.getRedirectResult(FB.auth).catch(() => {});
      // Si llegó por un enlace de invitación, terminar de entrarlo.
      completarEnlace().catch(() => {});

      auth.onAuthStateChanged(FB.auth, (u) => {
        FB.user = u;
        if (u) {
          abrirDatosDe(u.email.toLowerCase());   // cada quien su caché
          vincularUsuario(u.email);
          escucharTodo();
        }
        else { pararTodo(); S.persona = null; S.modo = null; }
        pintar();
      });
    }
    FB.estado = "listo";
  } catch (e) {
    FB.estado = "error"; FB.error = errorFB(e);
    // Sin señal y sin SDK guardado: si ya se había usado aquí, seguir con lo local.
    if (silencioso && !S.persona && haySesionGuardada()) { entrarSinSenal(); return; }
  }
  pintar();
}

async function entrarFirebase(correo, clave, registrar) {
  const { auth } = await cargarSDK();
  const fn = registrar ? auth.createUserWithEmailAndPassword : auth.signInWithEmailAndPassword;
  await fn(FB.auth, correo, clave);
  marcarConClave(correo);
  D.config.correo = correo;
  guardarLocal();
}

async function salirFirebase() {
  const { auth } = await cargarSDK();
  await auth.signOut(FB.auth);
}

function pararEscuchas() {
  FB.escuchas.forEach(f => { try { f(); } catch {} });
  FB.escuchas = [];
}

function pararTodo() {
  pararEscuchas();
  try { FB.escuchaUsuario?.(); } catch {}
  FB.escuchaUsuario = null;
  FB.claveFincas = null;
}

/* ---------- escuchar cambios remotos ----------
   Las consultas van filtradas por finca a propósito: si pidiéramos la
   colección entera, Firestore la rechazaría por no poder demostrar que
   el usuario alcanza todos los documentos. */

/** Observa mi propio documento de usuario. Cuando cambian mis fincas
    —por ejemplo al crear la primera— vuelve a suscribir las colecciones. */
function escucharTodo() {
  if (FB.escuchaUsuario) return;
  const { fs } = FB.mods;
  const correo = FB.user.email.toLowerCase();

  FB.escuchaUsuario = fs.onSnapshot(fs.doc(FB.db, "usuarios", correo),
    (snap) => {
      if (!snap.exists()) {
        // El correo entró bien pero nadie lo autorizó: fuera.
        return rechazarAcceso(correo);
      }
      const datos = snap.data();
      const rolAntes = FB.rolRemoto, fincasAntes = (FB.fincasRemotas || []).join(",");
      FB.rolRemoto = datos.rol || null;
      FB.personaRemota = datos.persona || null;
      FB.fincasRemotas = datos.fincas || [];

      // ¿El permiso apunta a fincas que ya no existen y deja fuera las reales?
      if (!FB.permisoRevisado && S.persona) {
        FB.permisoRevisado = true;
        setTimeout(async () => {
          const idsReales = new Set(D.fincas.map(f => f.id));
          const autorizadas = new Set(FB.fincasRemotas || []);
          const fantasmas = [...autorizadas].filter(x => !idsReales.has(x));
          const huerfanas = D.fincas.filter(f => !autorizadas.has(f.id));
          if (fantasmas.length && (huerfanas.length || !autorizadas.size)) {
            const r = await repararPermiso(true);
            if (r) { pintar(); avisar(`Permiso corregido: ${r.buenas} finca(s)`); }
          }
        }, 2500);
      }

      // Si le cambiaron el rol o las fincas, lo que tenga abierto ya no vale.
      const cambioRol = rolAntes && rolAntes !== FB.rolRemoto;
      const cambioFincas = fincasAntes && fincasAntes !== FB.fincasRemotas.join(",");
      if ((cambioRol || cambioFincas) && S.persona) {
        if (typeof hojaAbierta !== "undefined" && hojaAbierta) cerrarHoja();
        V.sel = null;
        setTimeout(() => avisar(cambioRol
          ? `Tu rol cambió a ${ROLES[FB.rolRemoto]?.et || FB.rolRemoto}`
          : "Cambiaron las fincas a tu cargo"), 400);
      }

      // Si alguien lo puso inactivo, sale de inmediato aunque esté trabajando.
      if (datos.activo === false) {
        FB.estado = "listo";
        salirFirebase();
        S.persona = null; S.modo = null;
        S.error = "Tu acceso fue desactivado. Habla con el dueño de la finca.";
        CLAVE_DATOS = null;
        const cfg = D.config;
        D = migrar({ ...semilla(), config: cfg });
        pantallaAcceso();
        return;
      }
      const mias = (datos.fincas || []).filter(Boolean);
      const clave = JSON.stringify(mias.slice().sort());
      if (clave === FB.claveFincas) return;    // nada cambió
      FB.claveFincas = clave;
      escucharColecciones(mias);
    },
    (e) => { FB.estado = "error"; FB.error = errorFB(e); pintar(); });
}

function escucharColecciones(mias) {
  pararEscuchas();
  FB.cajones = {};
  FB.fallos = {};
  FB.fincasCargadas = false;
  FB.espejoUsuarios = {};
  FB.usuariosRemotos = {};
  limpiarSiCambioDeUsuario(FB.user.email);
  if (FB.rolRemoto !== "superadmin") soltarFincasAjenas(mias);
  const { fs } = FB.mods;

  if (!mias.length && FB.rolRemoto !== "superadmin") {
    // Todavía sin fincas: normal recién creada la cuenta.
    FB.estado = "listo";
    FB.error = "";
    asegurarPersona(FB.user.email);
    return pintar();
  }

  // Firestore admite hasta 30 valores en un "in".
  const trozo = mias.slice(0, 30);
  if (mias.length > 30) {
    FB.error = `Tienes ${mias.length} fincas y Firestore solo consulta 30 a la vez. ` +
               `Se están mostrando las primeras 30.`;
  }

  // Algunas colecciones se llenan con más de una consulta (personas: las de
  // mis fincas y las que todavía no tienen ninguna). Cada una escribe en su
  // propio cajón y al final se unen, para que no se pisen entre ellas.
  FB.cajones = FB.cajones || {};

  const escuchar = (nombre, consulta, cajon) => {
    const via = cajon || "principal";
    const u = fs.onSnapshot(consulta, { includeMetadataChanges: true },
      (snap) => {
        // Los metadatos cambian muchas veces sin que cambie ningún dato.
        // En ese caso solo se refresca el indicador, sin volver a guardar.
        FB.enCache = snap.metadata.fromCache;
        if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) {
          FB.ultimaSync = Date.now();
        }
        if (!snap.docChanges().length && FB.cajones?.[nombre]?.[via]) {
          recalcularPendientes();
          pintarPronto();
          return;
        }

        FB.aplicando = true;

        ((FB.cajones ||= {})[nombre] ||= {})[via] = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(d => !estaBorrado(nombre, d.id));
        let docs = recombinar(nombre);

        // El servidor manda los animales sin foto. Se vuelve a pegar la que
        // haya en este equipo; si no hay, queda pendiente de bajar.
        if (nombre === "animales") {
          const locales = new Map((D.animales || []).map(a => [a.id, a.foto]));
          docs = docs.map(a => {
            const mia = locales.get(a.id) || null;
            // El servidor ya tiene esta foto: se anota su huella para no
            // volver a subirla. Si dice que no tiene, se olvida.
            cargarSubidas();
            if (a.tieneFoto && mia) FB.fotosSubidas.set(a.id, huellaFoto(mia));
            if (!a.tieneFoto) FB.fotosSubidas.delete(a.id);
            return { ...a, foto: a.foto || mia || null };
          });
        }
        const vistos = new Set(docs.map(d => d.id));

        // Lo que se creó aquí y todavía no aparece en la consulta se conserva.
        // Sin esto, un registro hecho sin señal podría desaparecer de la
        // pantalla antes de haber llegado a Firestore.
        const propios = FB.sinConfirmar[nombre] || new Set();
        for (const local of (D[nombre] || [])) {
          if (!vistos.has(local.id) && propios.has(local.id)) docs.push(local);
        }

        FB.espejo[nombre] = {};
        docs.forEach(d => { FB.espejo[nombre][d.id] = JSON.stringify(d); });
        D[nombre] = docs;

        // Lo que el servidor ya confirmó deja de estar pendiente.
        if (!snap.metadata.hasPendingWrites) {
          snap.docs.forEach(d => propios.delete(d.id));
        }

        recalcularPendientes();

        guardarPronto();
        FB.aplicando = false;
        if (nombre === "fincas") FB.fincasCargadas = true;
        if (nombre === "personas") asegurarPersona(FB.user.email);
        else if (S.persona) S.persona = D.personas.find(p => p.id === S.persona.id) || S.persona;
        pintarPronto();
      },
      (e) => {
        const codigo = String(e?.code || "");
        const msg = String(e?.message || e);
        const url = (msg.match(/https:\/\/console\.firebase\.google\.com\S+/) || [])[0];
        (FB.fallos ||= {})[nombre] = { codigo, msg, url };
        if (url) (FB.indicesFaltantes ||= {})[nombre] = url;

        // Falta el índice compuesto: se reintenta sin el filtro de fechas,
        // que es lo que lo exige. Así la app sirve igual mientras lo creas.
        if (codigo.includes("failed-precondition") && CON_VENTANA[nombre] && !cajon?.startsWith("sin-ventana")) {
          console.warn(`Falta un índice para ${nombre}; se baja sin recorte de fechas.`);
          FB.sinIndice ||= new Set();
          FB.sinIndice.add(nombre);
          try {
            const q2 = FB.rolRemoto === "superadmin"
              ? fs.collection(FB.db, nombre)
              : fs.query(fs.collection(FB.db, nombre), fs.where("fincaId", "in", trozo));
            escuchar(nombre, q2, "sin-ventana");
          } catch {}
          pintar();
          return;
        }
        FB.estado = "error"; FB.error = errorFB(e); pintar();
      });
    FB.escuchas.push(u);
  };

  const col = (n) => fs.collection(FB.db, n);
  // El superadministrador no filtra: las reglas le permiten leerlo todo.
  const todo = FB.rolRemoto === "superadmin";

  escuchar("fincas", todo ? col("fincas")
    : fs.query(col("fincas"), fs.where(fs.documentId(), "in", trozo)));
  if (todo) {
    escuchar("personas", col("personas"));
  } else {
    escuchar("personas", fs.query(col("personas"),
      fs.where("fincas", "array-contains-any", trozo)), "misFincas");
    // Las que nadie ha asignado: quedan disponibles para cualquier dueño.
    escuchar("personas", fs.query(col("personas"),
      fs.where("sinFinca", "==", true)), "sueltas");
    // Y las mías, estén en la finca que estén. Sin esto no se pueden
    // detectar las fichas duplicadas del mismo correo.
    if (FB.user?.email) {
      escuchar("personas", fs.query(col("personas"),
        fs.where("correo", "==", FB.user.email.toLowerCase())), "mias");
    }
  }
  const corte = FB.todoElHistorial ? null : corteVentana();
  FB.corte = corte;

  for (const n of ["animales", "inseminaciones", "palpaciones", "partos",
                   "secados", "tratamientos", "leche", "anotaciones"]) {
    const campo = CON_VENTANA[n];
    const filtros = [];
    if (!todo) filtros.push(fs.where("fincaId", "in", trozo));
    if (campo && corte) filtros.push(fs.where(campo, ">=", corte));
    escuchar(n, filtros.length ? fs.query(col(n), ...filtros) : col(n));
  }

  escucharAjustes();

  FB.estado = "listo";
  pintar();
  // El resto de la configuración se queda local: cada equipo tiene la suya.
}

/**
 * Trae los ajustes compartidos y los mete en D.config sin tocar los que son
 * de este aparato. Hasta que no llega el primero, este equipo no sube nada:
 * si no, un computador recién instalado le pisaba a la finca sus parámetros
 * con los de fábrica.
 */
function escucharAjustes() {
  const { fs } = FB.mods;
  FB.espejoAjustes = {};
  FB.ajustesLeidos = {};

  for (const [cual, claves] of Object.entries(AJUSTES)) {
    const u = fs.onSnapshot(fs.doc(FB.db, "ajustes", cual),
      (snap) => {
        /* Solo se da por leído si el documento existe (aunque venga de la
           caché, su contenido se conoce) o si la respuesta viene del servidor.
           Sin señal y con la caché vacía, Firestore dice «no existe»: darlo
           por bueno haría que este equipo subiera lo suyo al volver la señal
           y le pisara a la finca sus ajustes. */
        FB.ajustesLeidos[cual] = snap.exists() || !snap.metadata?.fromCache;
        if (FB.ajustesError?.[cual]) { delete FB.ajustesError[cual]; pintarPronto(); }
        if (!snap.exists()) { pintarPronto(); return; }
        const d = snap.data() || {};
        let cambio = false;
        for (const k of claves) {
          if (d[k] === undefined) continue;
          const json = JSON.stringify(d[k]);
          FB.espejoAjustes[k] = json;
          if (JSON.stringify(D.config[k]) !== json) {
            D.config[k] = JSON.parse(json);
            cambio = true;
          }
        }
        if (cambio) { guardarPronto(); pintarPronto(); }
      },
      (e) => {
        /* Casi siempre es que faltan por publicar las reglas de /ajustes.
           Callarlo dejaba al usuario cambiando cosas que no viajaban. */
        FB.ajustesLeidos[cual] = true;
        (FB.ajustesError ||= {})[cual] = e?.code || String(e);
        pintarPronto();
      });
    FB.escuchas.push(u);
  }
}

/** Sube los ajustes compartidos que hayan cambiado en este equipo. */
function empujarAjustes() {
  if (!FB.db || !FB.user) return;
  const { fs } = FB.mods;
  for (const [cual, claves] of Object.entries(AJUSTES)) {
    if (!FB.ajustesLeidos?.[cual]) continue;      // todavía no sé qué hay allá
    if (!puedeEscribirAjustes(cual)) continue;
    const cambios = {};
    for (const k of claves) {
      if (D.config[k] === undefined) continue;
      const json = JSON.stringify(D.config[k]);
      if (FB.espejoAjustes?.[k] === json) continue;
      cambios[k] = JSON.parse(json);
    }
    if (!Object.keys(cambios).length) continue;
    if ((FB.ajustesEnVuelo ||= {})[cual]) continue;   // ya hay uno esperando
    FB.ajustesEnVuelo[cual] = true;
    fs.setDoc(fs.doc(FB.db, "ajustes", cual), limpiarParaFirestore(cambios), { merge: true })
      .then(() => {
        FB.ajustesEnVuelo[cual] = false;
        // El espejo se apunta DESPUÉS de que la escritura sale bien. Antes se
        // apuntaba primero, así que un fallo dejaba el ajuste sin reintentar.
        for (const k of Object.keys(cambios)) {
          (FB.espejoAjustes ||= {})[k] = JSON.stringify(D.config[k]);
        }
        if (FB.ajustesError?.[cual]) { delete FB.ajustesError[cual]; pintarPronto(); }
      })
      .catch((e) => {
        FB.ajustesEnVuelo[cual] = false;
        (FB.ajustesError ||= {})[cual] = e?.code || String(e);
        pintarPronto();
      });
  }
}

/** Le quita el acceso a un correo. Sin esto seguiría entrando a la finca. */
async function borrarUsuarioRemoto(correo) {
  const c = (correo || "").trim().toLowerCase();
  if (!c || !FB.db || !FB.user || !manda()) return;
  try {
    const { fs } = FB.mods;
    await fs.deleteDoc(fs.doc(FB.db, "usuarios", c));
  } catch (e) { console.warn("usuarios:", errorFB(e)); }
}

/** Une todos los cajones de una colección: escuchas y historial pedido a mano. */
function recombinar(nombre) {
  const juntos = new Map();
  for (const lista of Object.values(FB.cajones?.[nombre] || {})) {
    for (const doc of lista) juntos.set(doc.id, doc);
  }
  return [...juntos.values()];
}

/** Mantiene /usuarios en Firestore al día con las asignaciones de la app. */
/**
 * Mantiene /usuarios al día SIN pisar lo que este equipo no puede ver.
 *
 * Antes recalculaba el permiso de cada persona con las fincas que este
 * equipo alcanzaba, y lo escribía como verdad absoluta. Un equipo con la
 * vista a medias le achicaba el permiso a todos, el otro lo rehacía con su
 * propia vista, y se pisaban sin parar: por eso tocaba corregir a mano.
 *
 * Ahora solo se corrige lo que este equipo sí ve. Lo demás se respeta.
 */
async function sincronizarUsuarios() {
  if (!FB.db || !FB.user || !manda()) return;
  if (!FB.fincasCargadas) return;          // sin la lista de fincas no se toca nada
  const { fs } = FB.mods;

  const visibles = new Set(D.fincas.map(f => f.id));
  const borradas = FB.borrados?.fincas || new Set();
  const todoALaVista = FB.rolRemoto === "superadmin";
  FB.espejoUsuarios ||= {};
  FB.usuariosRemotos ||= {};

  for (const p of D.personas) {
    if (!p.correo) continue;
    const correo = p.correo.toLowerCase();

    // Lo que hay hoy en su permiso, para no borrar a ciegas.
    if (!FB.usuariosRemotos[correo]) {
      try {
        const s = await fs.getDoc(fs.doc(FB.db, "usuarios", correo));
        FB.usuariosRemotos[correo] = s.exists() ? s.data() : {};
      } catch { FB.usuariosRemotos[correo] = {}; }
    }
    const remoto = FB.usuariosRemotos[correo];

    // Fincas que este equipo no ve: se conservan tal cual, salvo que las
    // hayamos borrado nosotros. El superadministrador sí lo ve todo, así
    // que en su caso no hay zonas ciegas.
    const ciegas = todoALaVista ? []
      : (remoto.fincas || []).filter(id => !visibles.has(id) && !borradas.has(id));
    const propias = (p.fincas || []).filter(id => visibles.has(id));
    const fincas = [...new Set([...ciegas, ...propias])];

    const doc = { rol: p.rol, fincas, persona: p.id, activo: p.activo !== false };
    const firma = JSON.stringify(doc);
    if (FB.espejoUsuarios[correo] === firma) continue;   // nada cambió

    try {
      await fs.setDoc(fs.doc(FB.db, "usuarios", correo), doc, { merge: true });
      FB.espejoUsuarios[correo] = firma;
      FB.usuariosRemotos[correo] = { ...remoto, ...doc };
    } catch (e) { console.warn("usuarios:", errorFB(e)); }
  }
}

/* ---------- empujar cambios locales ----------
   Sin señal, Firestore guarda las escrituras en el teléfono y las manda
   solas al reconectar. Por eso NO esperamos la confirmación del servidor:
   si lo hiciéramos, la app se quedaría colgada en el corral.

   El espejo se actualiza en cuanto se emite la escritura, así el mismo
   cambio no se vuelve a mandar en el siguiente guardado. Eso es lo que
   evita que un registro hecho sin señal se suba dos veces. */

function programarEmpuje() {
  if (!FB.db || !FB.user || FB.aplicando) return;
  clearTimeout(FB.pendiente);
  FB.pendiente = setTimeout(empujar, 120);
}

/**
 * Cómo viaja cada documento. La foto no va dentro del animal: pesa 40 KB
 * y obligaría a descargarlas todas para ver una lista. Va aparte, en su
 * propia colección, y solo se baja al abrir la ficha.
 */
function paraRemoto(col, doc) {
  if (col !== "animales") return doc;
  const { foto, ...resto } = doc;
  return { ...resto, tieneFoto: !!foto };
}

/* ----------------------------------------------------------
   BORRADO EXPLÍCITO

   Antes el borrado se deducía: lo que estaba en Firebase y ya no
   en pantalla, se borraba. Eso fallaba porque entre el borrado y
   el envío podía llegar una actualización que reponía el registro,
   y además era peligroso: cualquier hueco se tomaba por un borrado.

   Ahora se ordena en el momento y se recuerda hasta que Firestore
   confirme, para que ninguna actualización lo resucite.
   ---------------------------------------------------------- */
FB.borrados = {};

function borrarRemoto(coleccion, id) {
  ((FB.borrados ||= {})[coleccion] ||= new Set()).add(id);
  if (FB.espejo?.[coleccion]) delete FB.espejo[coleccion][id];
  for (const cajon of Object.values(FB.cajones?.[coleccion] || {})) {
    const i = cajon.findIndex(x => x.id === id);
    if (i >= 0) cajon.splice(i, 1);
  }
  if (!FB.db || !FB.user || !FB.mods) return;
  const { fs } = FB.mods;
  fs.deleteDoc(fs.doc(FB.db, coleccion, id))
    .then(() => { FB.borrados?.[coleccion]?.delete(id); })
    .catch((e) => {
      // Sin señal Firestore lo encola y llega solo; un rechazo real sí se avisa.
      if (!/unavailable|network|offline/i.test(String(e?.code || e))) {
        FB.estado = "error"; FB.error = errorFB(e); pintar();
      }
    });
}

/** ¿Está pendiente de borrarse? Entonces ninguna escucha debe reponerlo. */
const estaBorrado = (coleccion, id) => !!FB.borrados?.[coleccion]?.has(id);

/**
 * Firestore rechaza cualquier campo con valor indefinido y tumba el envío
 * completo. Esto los quita antes de mandar, en todo el documento.
 */
function limpiarParaFirestore(obj) {
  if (Array.isArray(obj)) return obj.map(limpiarParaFirestore);
  if (obj && typeof obj === "object" && !(obj instanceof Date)) {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v === undefined) continue;
      out[k] = limpiarParaFirestore(v);
    }
    return out;
  }
  return obj === undefined ? null : obj;
}

/** Si una colección falla, se averigua cuál documento y por qué. */
async function manejarFalloSubida(col, tanda, e) {
  const cod = String(e?.code || "");
  if (/unavailable|network|offline/i.test(cod)) return;   // sin señal: ya volverá

  const { fs } = FB.mods;
  let culpable = null, motivo = String(e?.message || e);

  // Se reintenta uno por uno para señalar el documento exacto.
  for (const [op, , id, doc] of tanda.slice(0, 25)) {
    if (op !== "set") continue;
    try {
      const { id: _, ...resto } = paraRemoto(col, doc);
      await fs.setDoc(fs.doc(FB.db, col, id), limpiarParaFirestore(resto));
      delete (FB.espejo[col] || {})[id];   // sí entró: se reintentará bien
    } catch (e2) {
      culpable = doc;
      motivo = String(e2?.message || e2);
      break;
    }
  }

  FB.falloSubida[col] = {
    codigo: cod,
    motivo,
    culpable: culpable ? (culpable.nombre || culpable.chapeta || culpable.id) : null,
    cuando: Date.now(),
  };
  FB.estado = "error";
  FB.error = `No se pudo subir ${col}`;
  pintar();
}

function recalcularPendientes() {
  FB.sinConfirmar ||= {};
  FB.sinSubir = Object.values(FB.sinConfirmar).reduce((n, s) => n + (s?.size || 0), 0);
}

let empujando = false;

async function empujar() {
  if (!FB.db || !FB.user || empujando) return;
  const { fs } = FB.mods;
  const cambios = [];

  FB.espejo ||= {}; FB.sinConfirmar ||= {}; FB.borrados ||= {};
  for (const nombre of COLECCIONES) {
    const espejo = FB.espejo[nombre] || {};
    const vistos = new Set();
    for (const doc of (D[nombre] || [])) {
      vistos.add(doc.id);
      const json = JSON.stringify(paraRemoto(nombre, doc));
      if (espejo[doc.id] !== json) cambios.push(["set", nombre, doc.id, doc, json]);
    }
    // Los borrados ya no se deducen: se ordenan al momento en borrarRemoto.
    // Aquí solo se limpia el espejo de lo que ya no está.
    for (const id in espejo) if (!vistos.has(id)) delete espejo[id];
  }
  empujarAjustes();
  if (!cambios.length) return sincronizarUsuarios();

  empujando = true;
  FB.falloSubida = FB.falloSubida || {};
  try {
    // Un lote por colección. Antes iba todo junto: si Firestore rechazaba un
    // documento, se caía el envío entero y varias tablas quedaban sin subir
    // sin que nada lo dijera.
    const porColeccion = {};
    for (const c of cambios) (porColeccion[c[1]] ||= []).push(c);

    for (const [col, lista] of Object.entries(porColeccion)) {
      for (let i = 0; i < lista.length; i += 450) {
        const tanda = lista.slice(i, i + 450);
        const lote = fs.writeBatch(FB.db);

        for (const [op, , id, doc] of tanda) {
          const ref = fs.doc(FB.db, col, id);
          if (op === "set") {
            const { id: _, ...resto } = paraRemoto(col, doc);
            lote.set(ref, limpiarParaFirestore(resto));
          } else lote.delete(ref);
        }

        lote.commit()
          .then(() => { delete FB.falloSubida[col]; })
          .catch((e) => manejarFalloSubida(col, tanda, e));

        // Marcar como emitido: ni se reenvía, ni la escucha lo borra.
        for (const [op, , id, , json] of tanda) {
          (FB.espejo ||= {})[col] ||= {};
          (FB.sinConfirmar ||= {})[col] ||= new Set();
          if (op === "set") { FB.espejo[col][id] = json; FB.sinConfirmar[col].add(id); }
          else { delete FB.espejo[col][id]; FB.sinConfirmar[col].delete(id); }
        }
      }
    }

    recalcularPendientes();
    pintar();
    sincronizarUsuarios();
    subirFotos();
    esperarSubida();
  } finally {
    empujando = false;
  }
}

/** ¿Quedó todo guardado en el servidor? */
async function esperarSubida() {
  if (!FB.db || FB.esperando) return false;
  FB.esperando = true;
  try {
    await FB.mods.fs.waitForPendingWrites(FB.db);
    for (const k in FB.sinConfirmar) FB.sinConfirmar[k].clear();
    FB.sinSubir = 0; FB.ultimaSync = Date.now();
    pintar();
    return true;
  } catch { return false; }
  finally { FB.esperando = false; }
}

/* Red de seguridad: si el contador lleva rato sin bajar y hay señal,
   se vuelve a preguntar. Antes podía quedarse en «Subiendo 2» para siempre. */
if (typeof window !== "undefined") {
  setInterval(() => {
    if (FB.db && FB.user && FB.sinSubir > 0 && navigator.onLine !== false) esperarSubida();
  }, 12000);
}

/* Avisar cuando vuelve la señal, para que se note que está subiendo. */
if (typeof window !== "undefined") {
  window.addEventListener("online", () => {
    FB.enCache = false;
    if (FB.db) { programarEmpuje(); esperarSubida(); }
    pintar();
  });
  window.addEventListener("offline", () => { FB.enCache = true; pintar(); });
}

/** Primera vez: manda todo lo que hay en el equipo a Firestore. */
async function subirTodo() {
  if (!FB.user) return alert("Primero inicia sesión.");
  if (!confirm("Se van a subir todos los datos de este equipo a Firebase. ¿Continuar?")) return;
  FB.espejo = {};
  recalcularAccesos();
  await empujar();
  await sincronizarUsuarios();
  avisar("Datos subidos a Firebase");
}

function desconectarFirebase() {
  if (!confirm("La app vuelve a trabajar solo en este equipo. Los datos en Firebase no se borran. ¿Continuar?")) return;
  pararTodo();
  D.config.firebase = null;
  D.config.sinFirebase = true;   // que no vuelva a entrar la del archivo
  FB.app = null; FB.db = null; FB.auth = null; FB.user = null;
  FB.estado = "apagado"; FB.espejo = {};
  guardarLocal(); pintar(); avisar("Desconectado de Firebase");
}

/** Acepta el objeto pegado tal cual sale de la consola de Firebase. */
function leerConfigPegada(txt) {
  const t = txt.trim();
  if (!t) return null;
  try { return JSON.parse(t); } catch {}
  const campos = ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId"];
  const out = {};
  for (const c of campos) {
    const m = t.match(new RegExp(c + '\\s*:\\s*["\'`]([^"\'`]+)["\'`]'));
    if (m) out[c] = m[1];
  }
  return out.apiKey && out.projectId ? out : null;
}


/* ==========================================================
   GENERAR EL ARCHIVO PARA PUBLICAR
   Toma la app tal como está, le incrusta la configuración de
   Firebase y la descarga. Ese archivo es el que subes a GitHub
   para que todos abran la misma base.
   ========================================================== */
function generarArchivoPublicable() {
  const cfg = D.config.firebase;
  if (!cfg || !cfg.apiKey) {
    return alert("Primero pega y guarda la configuración de Firebase, arriba en esta página.");
  }
  if (!confirm(
    "Se va a generar una copia de la app con la configuración de Firebase adentro.\n\n" +
    "Antes de publicarla asegúrate de haber publicado las reglas de seguridad (paso 4) " +
    "y de tener la colección 'usuarios' creada (paso 5).\n\n" +
    "Sin las reglas, cualquiera que abra el enlace podría leer los datos de la finca.\n\n" +
    "¿Continuar?")) return;

  try {
    // Copiamos el documento y le quitamos lo que la app haya pintado,
    // para que el archivo salga limpio.
    const clon = document.documentElement.cloneNode(true);
    const app = clon.querySelector("#app");
    if (app) app.innerHTML = "";
    clon.querySelectorAll(".velo, .toast").forEach(e => e.remove());

    let html = "<!doctype html>\n" + clon.outerHTML;

    // El marcador va escapado dentro de la expresión, así que este mismo
    // archivo no se confunde a sí mismo. Y replace sin /g cambia solo la
    // primera coincidencia, que siempre es la declaración del principio.
    const marca = /let CONFIG_INCLUIDA = [^;]*; \/\*\[\[CONFIG-FIREBASE\]\]\*\//;
    if (!marca.test(html)) {
      return alert("No encontré la línea de configuración en el archivo. " +
                   "Puede que estés usando una copia modificada a mano.");
    }
    html = html.replace(marca,
      "let CONFIG_INCLUIDA = " + JSON.stringify(cfg) + "; /*[[" + "CONFIG-FIREBASE]]*/");

    const b = new Blob([html], { type: "text/html;charset=utf-8" });
    const u = URL.createObjectURL(b);
    const el = document.createElement("a");
    el.href = u; el.download = "index.html";
    el.click(); URL.revokeObjectURL(u);
    avisar("Archivo generado. Súbelo a GitHub como index.html");
  } catch (e) {
    alert("No se pudo generar el archivo: " + e.message);
  }
}

/** Si en este equipo estuvo otra persona, se borra su caché antes de sincronizar. */

const ajustesEnlace = () => ({

});
const CLAVE_INVITADO = CLAVE + "-invitado";

/** Manda el enlace de acceso. Si la cuenta no existe, la crea al abrirlo. */
async function invitarPorCorreo(correo) {
  if (!FB.auth) throw new Error("Firebase no está conectado.");
  const { auth } = await cargarSDK();
  const c = correo.trim().toLowerCase();
  await auth.sendSignInLinkToEmail(FB.auth, c, ajustesEnlace());
  return c;
}

/** Si la persona llegó por el enlace, termina de entrarla. */
async function completarEnlace() {
  const { auth } = FB.mods;
  if (!auth.isSignInWithEmailLink(FB.auth, location.href)) return false;

  let correo = null;
  try { correo = localStorage.getItem(CLAVE_INVITADO); } catch {}
  if (!correo) {
    correo = prompt("Para terminar de entrar, confirma tu correo:");
    if (!correo) return false;
  }
  try {
    const c = correo.trim().toLowerCase();
    await auth.signInWithEmailLink(FB.auth, c, location.href);
    marcarSinClave(c);          // entró por enlace: aún no tiene contraseña
    try { localStorage.removeItem(CLAVE_INVITADO); } catch {}
    history.replaceState(null, "", location.pathname);
    S.reciénInvitado = true;
    return true;
  } catch (e) {
    S.error = errorFB(e);
    history.replaceState(null, "", location.pathname);
    return false;
  }
}

async function entrarConGoogle() {
  const { auth } = await cargarSDK();
  const prov = new auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  try {
    const r = await auth.signInWithPopup(FB.auth, prov);
    // Si la cuenta solo tiene Google, todavía no hay contraseña.
    const ps = (r.user?.providerData || []).map(x => x.providerId);
    if (!ps.includes("password")) marcarSinClave(r.user.email);
  } catch (e) {
    const c = e?.code || "";
    if (/popup-blocked|popup-closed|cancelled-popup|operation-not-supported/.test(c)) {
      await auth.signInWithRedirect(FB.auth, prov);
      return;
    }
    throw e;
  }
}
