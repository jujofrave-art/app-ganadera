/* ----------------------------------------------------------
   ¿Esta cuenta tiene contraseña de verdad?

   Firebase no lo dice: a quien entra por enlace de correo lo
   marca igual que a quien tiene contraseña. Así que lo anotamos
   nosotros cuando pasa cada cosa.
   ---------------------------------------------------------- */
const CLAVE_SIN_PASS = CLAVE + "-sin-clave";

function _sinClave() {
  try { return JSON.parse(localStorage.getItem(CLAVE_SIN_PASS) || "[]"); } catch { return []; }
}
function marcarSinClave(correo) {
  const c = (correo || "").toLowerCase(); if (!c) return;
  const l = _sinClave(); if (l.includes(c)) return;
  l.push(c);
  try { localStorage.setItem(CLAVE_SIN_PASS, JSON.stringify(l)); } catch {}
}
function marcarConClave(correo) {
  const c = (correo || "").toLowerCase(); if (!c) return;
  try { localStorage.setItem(CLAVE_SIN_PASS, JSON.stringify(_sinClave().filter(x => x !== c))); } catch {}
}

/** Proveedores reales de la cuenta abierta. */
function proveedores() {
  const u = FB.auth?.currentUser;
  if (!u) return { google: false, correo: false };
  const p = u.providerData.map(x => x.providerId);
  return { google: p.includes("google.com"), correo: p.includes("password") };
}

/** true solo si sabemos que puso una contraseña. */
function tieneClave() {
  const u = FB.auth?.currentUser;
  if (!u) return false;
  const pr = proveedores();
  if (!pr.correo) return false;                       // solo Google: no hay contraseña
  return !_sinClave().includes((u.email || "").toLowerCase());
}

/** Cómo entró, para mostrarlo. */
function metodoAcceso() {
  const u = FB.auth?.currentUser;
  if (!u) return null;
  const pr = proveedores();
  if (pr.google && !tieneClave()) return "google";
  if (tieneClave()) return "clave";
  return "enlace";
}

/* ==========================================================
   ACTUALIZACIONES
   GitHub Pages pide guardar el HTML unos minutos, así que la
   versión nueva no llega sola. Se consulta el archivo saltando
   la caché y se avisa si cambió.
   ========================================================== */

let VERSION_NUEVA = null;
let ultimaRevision = 0;

async function buscarActualizacion(manual) {
  if (!location.protocol.startsWith("http")) {
    if (manual) alert("Solo se puede buscar actualizaciones con la app publicada en internet.");
    return null;
  }
  const ahora = Date.now();
  if (!manual && ahora - ultimaRevision < 120000) return null;   // como mucho cada 2 minutos
  ultimaRevision = ahora;

  try {
    const r = await fetch(location.pathname + "?v=" + ahora, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const html = await r.text();
    const m = html.match(/const VERSION = "([^"]+)"/);
    if (!m) throw new Error("sin versión");

    if (m[1] !== VERSION) {
      VERSION_NUEVA = m[1];
      pintar();
      return m[1];
    }
    VERSION_NUEVA = null;
    if (manual) avisar(`Ya tienes la versión más reciente (${VERSION})`);
    return null;
  } catch (e) {
    if (manual) alert("No se pudo consultar: " + (e.message || e));
    return null;
  }
}

/** Borra todo lo guardado del archivo y recarga. Los datos no se tocan. */
async function aplicarActualizacion() {
  try {
    if (window.caches) {
      const claves = await caches.keys();
      await Promise.all(claves.map(k => caches.delete(k)));
    }
    const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
    await Promise.all(regs.map(r => r.update().catch(() => {})));
  } catch {}
  location.replace(location.pathname + "?v=" + Date.now());
}

// Al abrir y al volver a la pestaña, revisar si hay versión nueva.
if (location.protocol.startsWith("http")) {
  setTimeout(() => buscarActualizacion(false), 4000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) buscarActualizacion(false);
  });
}


/* ==========================================================
   FOTOS
   Van en su propia colección para que la lista de animales sea
   liviana. Se suben aparte y se bajan solo al abrir la ficha.
   ========================================================== */

/* Qué foto tiene ya subida cada animal. Se guarda una huella corta, no la
   foto entera, y queda en el equipo: si no, al abrir la app se resubían
   todas las fotos otra vez, que en el campo son datos del plan. */
FB.fotosSubidas = new Map();
let _subidasCargadas = false;

function huellaFoto(s) {
  const t = String(s || "");
  let a = 5381;
  for (let i = 0; i < t.length; i++) a = ((a * 33) ^ t.charCodeAt(i)) >>> 0;
  return t.length + ":" + a.toString(36);
}
const CLAVE_SUBIDAS = () => (CLAVE_DATOS || CLAVE) + "-fsub";

function cargarSubidas() {
  if (_subidasCargadas) return;
  _subidasCargadas = true;
  try {
    FB.fotosSubidas = new Map(Object.entries(
      JSON.parse(localStorage.getItem(CLAVE_SUBIDAS()) || "{}")));
  } catch { FB.fotosSubidas = new Map(); }
}
function guardarSubidas() {
  try {
    localStorage.setItem(CLAVE_SUBIDAS(), JSON.stringify(Object.fromEntries(FB.fotosSubidas)));
  } catch {}
}

async function subirFotos() {
  if (!FB.db || !FB.user) return;
  cargarSubidas();
  const { fs } = FB.mods;
  let cambio = false;
  for (const a of D.animales) {
    // Todavía no se ha leído del disco: no se sabe qué tiene, no se toca.
    // Sin esto, borraría en Firebase la foto de un animal que sí la tiene.
    if (a.tieneFoto && !a.foto) continue;

    const marca = a.foto ? huellaFoto(a.foto) : null;
    if (FB.fotosSubidas.get(a.id) === marca) continue;
    if (!marca && !FB.fotosSubidas.has(a.id)) continue;   // nunca tuvo
    try {
      const ref = fs.doc(FB.db, "fotos", a.id);
      if (marca) {
        fs.setDoc(ref, { fincaId: a.fincaId, dato: a.foto }).catch(() => {});
        FB.fotosSubidas.set(a.id, marca);
      } else {
        fs.deleteDoc(ref).catch(() => {});
        FB.fotosSubidas.delete(a.id);
      }
      cambio = true;
    } catch (e) { /* sin señal: Firestore la encola */ }
  }
  if (cambio) guardarSubidas();
}

/** Baja la foto de un animal concreto. Devuelve true si llegó. */
async function cargarFoto(animalId) {
  const a = animal(animalId);
  if (!a || a.foto || !a.tieneFoto || !FB.db) return false;
  if (FB.bajando?.has(animalId)) return false;
  (FB.bajando ||= new Set()).add(animalId);
  try {
    const s = await FB.mods.fs.getDoc(FB.mods.fs.doc(FB.db, "fotos", animalId));
    if (s.exists() && s.data().dato) {
      a.foto = s.data().dato;
      cargarSubidas();
      FB.fotosSubidas.set(animalId, huellaFoto(a.foto));
      guardarSubidas();
      guardarLocal();
      return true;
    }
  } catch (e) { /* sin señal: se verá cuando vuelva */ }
  finally { FB.bajando.delete(animalId); }
  return false;
}


/**
 * Cuando a alguien le cambian de finca, lo de la anterior ya no le
 * corresponde. Se suelta de una: si no, seguiría en pantalla y ocupando
 * espacio hasta que llegara la primera actualización.
 */
function soltarFincasAjenas(mias) {
  // Guarda de seguridad: si llega una lista vacía pero el documento de
  // usuario dice que sí hay fincas, algo va mal. Antes que borrar, no hacer nada.
  if (!mias.length && FB.fincasRemotas?.length) {
    console.warn("Se ignoró un soltado con lista vacía: el usuario sí tiene fincas.");
    return 0;
  }
  const set = new Set(mias);
  let n = 0;
  for (const col of COLECCIONES) {
    if (col === "personas") continue;          // se filtran por otro criterio
    if (col === "fincas") {
      const antes = D.fincas.length;
      D.fincas = D.fincas.filter(f => set.has(f.id));
      n += antes - D.fincas.length;
      continue;
    }
    const antes = (D[col] || []).length;
    D[col] = (D[col] || []).filter(x => !x.fincaId || set.has(x.fincaId));
    n += antes - D[col].length;
  }
  // Y las fotos que quedaron sueltas en el disco. Van bajo la clave de cada
  // persona desde que los datos se separaron por usuario.
  const vivos = new Set(D.animales.map(a => a.id));
  const pre = (CLAVE_DATOS || CLAVE) + "-f-";
  (async () => {
    try {
      for (const k of await fotoClaves()) {
        if (typeof k === "string" && k.startsWith(pre) && !vivos.has(k.slice(pre.length))) {
          await fotoBorrar(k);
          _fotosEnDisco?.delete(k.slice(pre.length));
        }
      }
      for (const k of Object.keys(localStorage)) {   // restos de versiones viejas
        if (k.startsWith(pre) && !vivos.has(k.slice(pre.length))) localStorage.removeItem(k);
      }
    } catch {}
  })();
  if (n) { FB.espejo = {}; FB.cajones = {}; guardarLocal(); }
  return n;
}


/* ==========================================================
   HISTORIAL A PEDIDO
   ========================================================== */

/** Trae todo lo de un animal, incluso lo anterior a la ventana. */
/**
 * Rehace D[col] con lo que hay en los cajones, conservando lo que se creó en
 * este equipo y todavía no ha llegado a Firestore. recombinar() a secas solo
 * mira los cajones, así que un registro hecho sin señal desaparecía de la
 * pantalla hasta que volviera del servidor.
 */
function rehacerColeccion(col) {
  const docs = recombinar(col);
  const vistos = new Set(docs.map(d => d.id));
  const propios = FB.sinConfirmar?.[col] || new Set();
  for (const local of (D[col] || [])) {
    if (!vistos.has(local.id) && propios.has(local.id)) docs.push(local);
  }
  return docs;
}

/**
 * Suelta el historial que se había bajado de un animal y deja su ficha con el
 * mismo recorte que el resto de la app. No borra nada: los registros siguen
 * en Firebase y se vuelven a traer con el botón.
 */
function soltarHistorialAnimal(animalId) {
  let n = 0;
  for (const col of Object.keys(CON_VENTANA)) {
    const cajon = FB.cajones?.[col];
    const clave = "hist:" + animalId;
    if (!cajon || !cajon[clave]) continue;
    n += cajon[clave].length;
    delete cajon[clave];
    D[col] = rehacerColeccion(col);
  }
  FB.historial?.delete(animalId);
  guardarLocal();
  return n;
}

async function cargarHistorialAnimal(animalId) {
  const a = animal(animalId);
  if (!a || !FB.db || !FB.user) return false;
  if (!FB.corte) return false;                    // ya está todo
  FB.historial ||= new Set();
  if (FB.historial.has(animalId)) return false;
  FB.historial.add(animalId);

  const { fs } = FB.mods;
  let trajo = 0;
  const fallos = [];
  for (const col of Object.keys(CON_VENTANA)) {
    if (col === "leche") continue;                // la leche no cuelga del animal
    try {
      const s = await fs.getDocs(fs.query(fs.collection(FB.db, col),
        fs.where("fincaId", "==", a.fincaId),
        fs.where("animalId", "==", animalId)));
      const docs = s.docs.map(d => ({ id: d.id, ...d.data() }));
      ((FB.cajones[col] ||= {}))["hist:" + animalId] = docs;
      D[col] = rehacerColeccion(col);
      trajo += docs.length;
    } catch (e) {
      const m = String(e?.message || e);
      const url = (m.match(/https:\/\/console\.firebase\.google\.com\S+/) || [])[0];
      if (url) (FB.indicesFaltantes ||= {})["historial de " + col] = url;
      fallos.push(col);
      console.warn("historial:", m);
    }
  }
  guardarLocal();
  pintar();
  if (fallos.length) {
    FB.historial.delete(animalId);   // para poder reintentar
    alert(`No se pudo bajar el historial de ${fallos.join(", ")}.\n\n` +
      `Falta un índice en Firestore que combine finca y animal.\n\n` +
      `Ve a Configuración → «¿Por qué no cargan los datos?» y usa el botón para crearlos.`);
  }
  return trajo;
}

/** Quita el recorte y vuelve a suscribir con todo el historial. */
/**
 * Las fincas que manda el documento de usuario. Es la fuente de verdad:
 * la lista local puede venir vacía si las personas todavía no han bajado,
 * y usarla para resuscribir borraba todo lo que había en pantalla.
 */
function fincasAutorizadas() {
  if (FB.fincasRemotas?.length) return [...FB.fincasRemotas];
  const p = D.personas.find(x => x.id === S.persona?.id);
  if (p?.fincas?.length) return [...p.fincas];
  return misFincas();
}

function traerTodoElHistorial() {
  if (!FB.db || !FB.user) return;
  FB.todoElHistorial = true;
  FB.claveFincas = null;         // fuerza a resuscribir
  escucharColecciones(fincasAutorizadas());
  avisar("Bajando todo el historial…");
}

/** Vuelve a limitar la descarga a la ventana configurada. */
function volverAlRecorte() {
  if (!FB.db || !FB.user) return;
  FB.todoElHistorial = false;
  if (!D.config.ventanaMeses) D.config.ventanaMeses = 24;
  guardar();
  FB.claveFincas = null;
  escucharColecciones(fincasAutorizadas());
  avisar(`Volviendo a los últimos ${D.config.ventanaMeses} meses`);
}

/** ¿Hay cosas más viejas que la ventana que no están bajadas? */
const historialRecortado = () => !!FB.corte && !FB.todoElHistorial && !!FB.user;

/* ==========================================================
   BORRADO PROFUNDO
   Lo que está fuera de la ventana no se ve, pero existe. Al
   borrar un animal o una finca hay que barrer también eso, o
   quedaría basura en Firebase que nadie puede alcanzar.
   ========================================================== */

const COLS_DE_ANIMAL = ["inseminaciones", "palpaciones", "partos", "secados", "tratamientos"];
const COLS_DE_FINCA = [...COLS_DE_ANIMAL, "leche", "anotaciones", "animales"];

async function borrarEnLotes(refs) {
  const { fs } = FB.mods;
  for (let i = 0; i < refs.length; i += 450) {
    const lote = fs.writeBatch(FB.db);
    refs.slice(i, i + 450).forEach(r => lote.delete(r));
    await lote.commit();
  }
}

/** Barre en Firebase todo lo de un animal, incluido lo anterior al recorte. */
async function barrerAnimalRemoto(animalId, fincaId) {
  if (!FB.db || !FB.user) return 0;
  const { fs } = FB.mods;
  let n = 0;
  for (const col of COLS_DE_ANIMAL) {
    try {
      const s = await fs.getDocs(fs.query(fs.collection(FB.db, col),
        fs.where("fincaId", "==", fincaId), fs.where("animalId", "==", animalId)));
      if (!s.empty) { await borrarEnLotes(s.docs.map(d => d.ref)); n += s.size; }
      s.docs.forEach(d => { delete (FB.espejo[col] || {})[d.id]; });
    } catch (e) { console.warn("barrer:", errorFB(e)); }
  }
  try { await fs.deleteDoc(fs.doc(FB.db, "fotos", animalId)); } catch {}
  fotoBorrar(CLAVE_FOTO(animalId));       // y la copia de este equipo
  _fotosEnDisco?.delete(animalId);
  FB.fotosSubidas.delete(animalId);
  guardarSubidas();
  return n;
}

/** Lo mismo para una finca entera. */
async function barrerFincaRemota(fincaId) {
  if (!FB.db || !FB.user) return 0;
  const { fs } = FB.mods;
  let n = 0;
  for (const col of COLS_DE_FINCA) {
    try {
      const s = await fs.getDocs(fs.query(fs.collection(FB.db, col),
        fs.where("fincaId", "==", fincaId)));
      if (!s.empty) { await borrarEnLotes(s.docs.map(d => d.ref)); n += s.size; }
      s.docs.forEach(d => { delete (FB.espejo[col] || {})[d.id]; });
      if (col === "animales") {
        for (const doc of s.docs) {
          try { await fs.deleteDoc(fs.doc(FB.db, "fotos", doc.id)); } catch {}
        }
      }
    } catch (e) { console.warn("barrer:", errorFB(e)); }
  }
  return n;
}

/* ==========================================================
   LIMPIEZA DE DATOS ANTIGUOS
   ========================================================== */

const PURGABLES = {
  leche:          { et: "Leche",          campo: "fecha"  },
  tratamientos:   { et: "Tratamientos",   campo: "inicio" },
  inseminaciones: { et: "Inseminaciones", campo: "fecha"  },
  palpaciones:    { et: "Palpaciones",    campo: "fecha"  },
  secados:        { et: "Secados",        campo: "fecha"  },
};

/** Cuenta cuánto se borraría, sin borrar nada. */
async function contarAntiguos(corte, cols) {
  if (!FB.db || !FB.user) return null;
  const { fs } = FB.mods;
  const mias = misFincas();
  const out = {};
  for (const col of cols) {
    const campo = PURGABLES[col].campo;
    let n = 0;
    for (let i = 0; i < mias.length; i += 30) {
      const s = await fs.getDocs(fs.query(fs.collection(FB.db, col),
        fs.where("fincaId", "in", mias.slice(i, i + 30)),
        fs.where(campo, "<", corte)));
      n += s.size;
    }
    out[col] = n;
  }
  return out;
}

/** Borra de verdad, en Firebase y en el equipo. */
async function purgarAntiguos(corte, cols) {
  if (!FB.db || !FB.user) return 0;
  const { fs } = FB.mods;
  const mias = misFincas();
  let total = 0;
  for (const col of cols) {
    const campo = PURGABLES[col].campo;
    for (let i = 0; i < mias.length; i += 30) {
      const s = await fs.getDocs(fs.query(fs.collection(FB.db, col),
        fs.where("fincaId", "in", mias.slice(i, i + 30)),
        fs.where(campo, "<", corte)));
      if (s.empty) continue;
      await borrarEnLotes(s.docs.map(d => d.ref));
      s.docs.forEach(d => { delete (FB.espejo[col] || {})[d.id]; });
      total += s.size;
    }
    D[col] = (D[col] || []).filter(x => !(x[campo] && x[campo] < corte));
    for (const cajon of Object.values(FB.cajones[col] || {})) {
      // los cajones también, para que no reaparezcan al recombinar
      const i = cajon.findIndex(x => x[campo] && x[campo] < corte);
      if (i >= 0) FB.cajones[col][Object.keys(FB.cajones[col]).find(k => FB.cajones[col][k] === cajon)] =
        cajon.filter(x => !(x[campo] && x[campo] < corte));
    }
  }
  recalcularAccesos();
  guardarLocal();
  return total;
}


/* ==========================================================
   DIAGNÓSTICO DE CONEXIÓN
   Prueba cada consulta por separado y dice exactamente cuál
   falla y por qué. Los errores de Firestore traen el enlace
   para crear el índice que falte.
   ========================================================== */

async function diagnosticar() {
  const out = [];
  const paso = (que, estado, detalle) => out.push({ que, estado, detalle: detalle || "" });

  if (!D.config.firebase?.apiKey) { paso("Configuración", "mal", "No hay proyecto configurado."); return out; }
  paso("Configuración", "ok", "Proyecto " + D.config.firebase.projectId);

  if (!FB.mods) { paso("SDK de Firebase", "mal", "No cargó."); return out; }
  paso("SDK de Firebase", "ok");

  if (!FB.user) { paso("Sesión", "mal", "Nadie ha iniciado sesión."); return out; }
  paso("Sesión", "ok", FB.user.email);

  const { fs } = FB.mods;
  const correo = FB.user.email.toLowerCase();

  // 1. Mi documento de usuario
  let mias = [];
  try {
    const s = await fs.getDoc(fs.doc(FB.db, "usuarios", correo));
    if (!s.exists()) {
      paso("Tu permiso en la base", "mal",
        `No existe el documento usuarios/${correo}. Sin él no puedes ver nada. ` +
        `Créalo en Firestore con los campos rol y fincas.`);
      return out;
    }
    const d = s.data();
    mias = (d.fincas || []).filter(Boolean);
    paso("Tu permiso en la base", "ok",
      `rol: ${d.rol || "sin rol"} · fincas asignadas: ${mias.length ? mias.join(", ") : "ninguna"}`);
    if (!mias.length && d.rol !== "superadmin") {
      paso("Fincas asignadas", "aviso",
        "Tu usuario no tiene ninguna finca. Por eso no se baja nada. " +
        "Crea una finca o pide que te asignen a una.");
    }
  } catch (e) {
    paso("Tu permiso en la base", "mal", errorFB(e) + " — revisa las reglas de Firestore.");
    return out;
  }

  // 2. Cada colección por separado
  const trozo = mias.slice(0, 30);
  const corte = corteVentana();
  const probar = async (nombre, filtros, etiqueta) => {
    try {
      const q = filtros.length
        ? fs.query(fs.collection(FB.db, nombre), ...filtros)
        : fs.collection(FB.db, nombre);
      const s = await fs.getDocs(q);
      paso(etiqueta, "ok", `${s.size} documento(s)`);
    } catch (e) {
      const m = String(e?.message || e);
      const url = (m.match(/https:\/\/console\.firebase\.google\.com\S+/) || [])[0];
      if (url) (FB.indicesFaltantes ||= {})[nombre] = url;
      paso(etiqueta, "mal",
        (String(e?.code || "").includes("failed-precondition")
          ? "Falta un índice en Firestore. " + (url ? "Ábrelo aquí para crearlo con un clic: " + url : m)
          : String(e?.code || "").includes("permission-denied")
          ? "Las reglas lo rechazan. Vuelve a publicar las reglas desde el paso 3."
          : m));
    }
  };

  if (!trozo.length) { paso("Colecciones", "aviso", "Sin fincas asignadas no hay nada que probar."); return out; }

  await probar("fincas", [fs.where(fs.documentId(), "in", trozo)], "Leer fincas");
  await probar("personas", [fs.where("fincas", "array-contains-any", trozo)], "Leer personal");
  await probar("personas", [fs.where("sinFinca", "==", true)], "Leer personal sin finca");
  await probar("animales", [fs.where("fincaId", "in", trozo)], "Leer animales");
  await probar("partos", [fs.where("fincaId", "in", trozo)], "Leer partos");
  for (const [col, campo] of Object.entries(CON_VENTANA)) {
    const filtros = [fs.where("fincaId", "in", trozo)];
    if (corte) filtros.push(fs.where(campo, ">=", corte));
    await probar(col, filtros, `Leer ${col}${corte ? " (con recorte de fechas)" : ""}`);
  }

  // 3. Escritura de verdad en cada colección, con borrado inmediato.
  const finca1 = trozo[0];
  const prueba = {
    animales:       { fincaId: finca1, nombre: "PRUEBA", chapeta: "__test__", categoria: "vaca",
                      estado: "activo", tieneFoto: false, hechas: {}, partosPrevios: 0 },
    partos:         { fincaId: finca1, animalId: "__test__", tipo: "parto", fecha: hoyISO() },
    inseminaciones: { fincaId: finca1, animalId: "__test__", fecha: hoyISO(), aplicaciones: [] },
    palpaciones:    { fincaId: finca1, animalId: "__test__", fecha: hoyISO(), resultado: "vacia" },
    secados:        { fincaId: finca1, animalId: "__test__", fecha: hoyISO(), motivo: "ventana" },
    tratamientos:   { fincaId: finca1, animalId: "__test__", tipo: "PRUEBA", inicio: hoyISO() },
    leche:          { fincaId: finca1, fecha: hoyISO(), litros: 1, dias: 1, momento: "total" },
    anotaciones:    { fincaId: finca1, fecha: hoyISO(), texto: "PRUEBA" },
    fotos:          { fincaId: finca1, dato: "prueba" },
  };
  for (const [col, datos] of Object.entries(prueba)) {
    const ref = fs.doc(FB.db, col, "__diagnostico__");
    try {
      await fs.setDoc(ref, datos);
      await fs.deleteDoc(ref);
      paso(`Escribir en ${col}`, "ok");
    } catch (e) {
      const cod = String(e?.code || "");
      paso(`Escribir en ${col}`, "mal",
        cod.includes("permission-denied")
          ? "Las reglas lo rechazan. Vuelve a publicarlas desde el paso 3 de Configuración."
          : String(e?.message || e));
    }
  }

  try {
    await fs.setDoc(fs.doc(FB.db, "usuarios", correo), { revisado: new Date().toISOString() }, { merge: true });
    paso("Escribir tu usuario", "ok");
  } catch (e) {
    paso("Escribir tu usuario", "mal", errorFB(e));
  }

  return out;
}


/**
 * Chrome abre los enlaces de Google con la primera cuenta que tengas
 * conectada. Si el proyecto de Firebase está en la segunda, sale un 403.
 * Esto mete el número de cuenta en la dirección para que abra con la buena.
 */
function conCuenta(url) {
  const n = Number(D.config.cuentaGoogle) || 0;
  if (!n) return url;
  return String(url).replace("console.firebase.google.com/",
                             `console.firebase.google.com/u/${n}/`);
}


/* ==========================================================
   RECUPERAR MIS FINCAS

   Si en versiones anteriores se crearon varias fichas para el
   mismo correo, las fincas quedaron repartidas entre ellas. La
   app no puede leerlas porque no están en su lista de permisos,
   y no puede arreglar la lista porque no ve las fincas.

   Se rompe por el único lado permitido: cada ficha guarda su
   propia lista de fincas, y el correo propio siempre se puede
   leer. Con la unión de todas se rehace el permiso.
   ========================================================== */

/**
 * Rehace el permiso comparándolo con lo que existe de verdad.
 *
 * El documento de usuario puede quedar apuntando a fincas borradas: entonces
 * Firebase da permiso sobre nada y rechaza todo lo que se intente guardar en
 * la finca real. Esto lo detecta y lo corrige.
 */
async function repararPermiso(silencioso) {
  if (!FB.db || !FB.user) return null;
  const { fs } = FB.mods;
  const correo = FB.user.email.toLowerCase();

  // Mis fichas, que siempre puedo leer por ser mi correo.
  let mias = [];
  try {
    const s = await fs.getDocs(fs.query(fs.collection(FB.db, "personas"),
      fs.where("correo", "==", correo)));
    mias = s.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    if (!silencioso) alert("No pude leer tus fichas: " + errorFB(e));
    return null;
  }
  const misIds = new Set(mias.map(p => p.id));
  const rol = mias.reduce((r, p) => (RANGO[p.rol] ?? 0) > (RANGO[r] ?? 0) ? p.rol : r,
                          FB.rolRemoto || "empleado");

  let buenas = [];
  const antes = [...(FB.fincasRemotas || [])];

  if (rol === "superadmin") {
    // El superadministrador puede leerlas todas: se toman las que existen.
    try {
      const s = await fs.getDocs(fs.collection(FB.db, "fincas"));
      buenas = s.docs.map(d => d.id);
    } catch (e) {
      if (!silencioso) alert("No pude leer las fincas: " + errorFB(e));
      return null;
    }
  } else {
    // Los demás: se comprueba una por una cuáles existen y siguen siendo suyas.
    const candidatas = [...new Set([...antes, ...mias.flatMap(p => p.fincas || [])])];
    for (const id of candidatas) {
      try {
        const d = await fs.getDoc(fs.doc(FB.db, "fincas", id));
        if (d.exists() && (d.data().personas || []).some(x => misIds.has(x))) buenas.push(id);
      } catch { /* no existe o no alcanza: fuera */ }
    }
  }

  const fantasmas = antes.filter(x => !buenas.includes(x));
  const nuevas = buenas.filter(x => !antes.includes(x));
  const persona = mias.find(p => (p.fincas || []).length) || mias[0];

  try {
    await fs.setDoc(fs.doc(FB.db, "usuarios", correo),
      { rol, fincas: buenas, persona: persona?.id || null, activo: true }, { merge: true });
  } catch (e) {
    if (!silencioso) alert("No pude corregir tu permiso: " + errorFB(e));
    return null;
  }

  FB.rolRemoto = rol;
  FB.fincasRemotas = buenas;
  FB.claveFincas = null;
  escucharColecciones(buenas);

  return { rol, buenas: buenas.length, fantasmas, nuevas, fichas: mias.length };
}

async function recuperarMisFincas(silencioso) {
  if (!FB.db || !FB.user) return 0;
  const { fs } = FB.mods;
  const correo = FB.user.email.toLowerCase();

  let fichas = [];
  try {
    const s = await fs.getDocs(fs.query(fs.collection(FB.db, "personas"),
      fs.where("correo", "==", correo)));
    fichas = s.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    if (!silencioso) alert("No se pudieron leer tus fichas: " + errorFB(e));
    return 0;
  }
  if (fichas.length < 2) return 0;

  // Todas las fincas que aparecen en cualquiera de mis fichas.
  const union = [...new Set(fichas.flatMap(f => f.fincas || []).filter(Boolean))];

  // La ficha que se queda, el mejor nombre y el rol más alto.
  const puntos = (p) => (p.fincas || []).length * 100 +
    (p.nombrePorDefecto ? 0 : 50) + (RANGO[p.rol] ?? 0);
  fichas.sort((a, b) => puntos(b) - puntos(a));
  const buena = fichas[0];
  const conNombre = fichas.find(p => !p.nombrePorDefecto && (p.nombre || "").trim());
  const rol = fichas.reduce((r, p) => (RANGO[p.rol] ?? 0) > (RANGO[r] ?? 0) ? p.rol : r, buena.rol);

  try {
    await fs.setDoc(fs.doc(FB.db, "usuarios", correo),
      { rol, fincas: union, persona: buena.id, activo: true }, { merge: true });
  } catch (e) {
    if (!silencioso) alert("No se pudo actualizar tu permiso: " + errorFB(e));
    return 0;
  }

  // Con el permiso rehecho ya se pueden bajar todas las fincas.
  FB.claveFincas = null;
  FB.rolRemoto = rol;
  FB.personaRemota = buena.id;
  escucharColecciones(union);

  return { fichas: fichas.length, fincas: union.length,
           nombre: conNombre?.nombre || buena.nombre, rol };
}

const REGLAS = `rules_version = '2';

// Control Ganadero — cada quien solo ve sus fincas.
// El permiso sale de /usuarios/{correo}, que lleva el rol y la
// lista de fincas asignadas. La app mantiene esos documentos sola.
//
// Roles, de mayor a menor: superadmin, dueno, administrador, empleado.
// El superadministrador ve y reasigna todo; los demás quedan encerrados
// en las fincas que tengan asignadas.

service cloud.firestore {
  match /databases/{database}/documents {

    function yo() {
      return get(/databases/$(database)/documents/usuarios/$(request.auth.token.email)).data;
    }
    function registrado() {
      // Tiene que existir su documento y NO estar inactivo.
      return request.auth != null
        && exists(/databases/$(database)/documents/usuarios/$(request.auth.token.email))
        && yo().get('activo', true) != false;
    }
    function misFincas()  { return yo().fincas; }
    function rol()        { return yo().rol; }
    function esSuper()    { return rol() == 'superadmin'; }
    function manda()      { return esSuper() || rol() == 'dueno' || rol() == 'administrador'; }
    function esDueno()    { return esSuper() || rol() == 'dueno'; }

    // El documento pertenece a una finca que tengo asignada.
    // El superadministrador pasa por encima de ese filtro.
    function mia()        { return esSuper() || resource.data.fincaId in misFincas(); }
    function seraMia()    { return esSuper() || request.resource.data.fincaId in misFincas(); }

    // De menor a mayor. Sirve para que nadie reparta un puesto igual o
    // mayor al suyo, ni le quite el suyo a alguien que está por encima.
    function rango(r) {
      return r == 'superadmin' ? 4 : r == 'dueno' ? 3 : r == 'administrador' ? 2 : 1;
    }

    // ---- ajustes que son de la finca, no de cada equipo ----
    // «finca» lleva los parámetros de manejo; «mando» lleva permisos,
    // cupos y quién es el dueño principal, que es cosa aparte.
    match /ajustes/{cual} {
      allow read:  if registrado();
      allow write: if registrado() && (cual == 'finca'
                     ? manda()
                     : esDueno());
    }

    // ---- quién puede entrar y a qué fincas ----
    // OJO: este documento ES el permiso. Quien pueda escribirlo a su antojo
    // manda en todo, así que aquí no basta con "es administrador": antes,
    // cualquier administrador podía ponerse superadmin desde la consola del
    // navegador y quedarse con todas las fincas.
    match /usuarios/{correo} {
      function esMio() { return correo == request.auth.token.email; }

      // Sobre el propio permiso: la app lo repara sola (recuperar fincas,
      // unir fichas duplicadas), así que hay que dejarla escribir. Lo que
      // NO puede cambiar nunca es su rol ni volverse a activar.
      function arregloMio() {
        return esMio() && (esSuper() || (
          request.resource.data.rol == resource.data.rol
          && request.resource.data.get('activo', true) == resource.data.get('activo', true)
        ));
      }

      // Sobre el permiso de otro: solo alguien de rango mayor, sin repartir
      // fincas que no tenga ni puestos iguales o mayores al suyo.
      function otorgoAOtro() {
        return !esMio() && manda() && (esSuper() || (
          rango(request.resource.data.rol) < rango(rol())
          && request.resource.data.fincas is list
          && request.resource.data.fincas.hasOnly(misFincas())
        ));
      }

      allow read:   if request.auth != null
                    && (esMio() || (registrado() && manda()));
      allow create: if registrado() && otorgoAOtro();
      allow update: if registrado() && (arregloMio() ||
                    (otorgoAOtro()
                     && (esSuper() || rango(resource.data.get('rol', 'empleado')) < rango(rol()))));
      allow delete: if registrado() && !esMio() && (esSuper()
                    || (manda() && rango(resource.data.get('rol', 'empleado')) < rango(rol())));
    }

    // ---- fincas: solo las asignadas ----
    match /fincas/{id} {
      allow read:   if registrado() && (esSuper() || id in misFincas());
      allow create: if registrado() && manda();
      allow update: if registrado() && manda() && (esSuper() || id in misFincas());
      allow delete: if registrado() && esDueno() && (esSuper() || id in misFincas());
    }

    // ---- personal: solo quien comparte finca conmigo ----
    match /personas/{id} {
      allow read:   if registrado() && (
                      esSuper()
                      || (manda() && resource.data.fincas.hasAny(misFincas()))
                      || (manda() && resource.data.creadoPor == yo().persona)
                      || (manda() && resource.data.sinFinca == true)
                      || resource.data.correo == request.auth.token.email);
      // Antes bastaba con ser administrador para editar o borrar a
      // CUALQUIERA del proyecto, aunque fuera de otra finca. Ahora alcanza
      // solo a quien comparte finca conmigo o a quien yo registré, y nunca
      // a alguien de rango igual o mayor.
      function alcanzo() {
        return esSuper() || (manda() && (
          resource.data.fincas.hasAny(misFincas())
          || resource.data.creadoPor == yo().persona
          || resource.data.sinFinca == true
        ) && rango(resource.data.get('rol', 'empleado')) < rango(rol()));
      }
      // Su propia ficha sí la edita cada quien (nombre, teléfono), pero
      // sin cambiarse el rol.
      function miFicha() {
        return resource.data.get('correo', '') == request.auth.token.email
               && request.resource.data.rol == resource.data.rol;
      }
      allow create: if registrado() && manda()
                    && (esSuper() || rango(request.resource.data.rol) < rango(rol()));
      allow update: if registrado() && (miFicha() || (alcanzo()
                    && (esSuper() || rango(request.resource.data.rol) < rango(rol()))));
      allow delete: if registrado() && alcanzo();
    }

    // ---- ganado y sus eventos: filtrados por finca ----
    // Las fotos van aparte para que la lista de animales sea liviana.
    match /fotos/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && mia();
    }

    match /animales/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /inseminaciones/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /palpaciones/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /partos/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /secados/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /tratamientos/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /leche/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /anotaciones/{id} {
      allow read:   if registrado() && mia();
      allow create: if registrado() && seraMia();
      allow update: if registrado() && mia() && seraMia();
      allow delete: if registrado() && manda() && mia();
    }

    match /{document=**} { allow read, write: if false; }
  }
}`;

function paso(n, titulo, cuerpo) {
  return `<div class="paso"><div class="paso-n">${n}</div>
    <div class="paso-c"><h4>${titulo}</h4>${cuerpo}</div></div>`;
}

function bloqueCodigo(txt, etiqueta) {
  const clave = "cod_" + Math.random().toString(36).slice(2, 8);
  window[clave] = txt;
  return `<div class="codigo">
    <div class="codigo-cab"><span>${etiqueta}</span>
      <button class="btn btn-sm" data-copiar="${clave}">Copiar</button></div>
    <pre>${esc(txt)}</pre></div>`;
}

/**
 * En móvil las tablas se dibujan como tarjetas y cada celda necesita
 * saber a qué columna pertenece. Se toma del encabezado, así que no
 * hay que repetir los nombres en cada vista.
 */
function etiquetarTablas(raiz) {
  (raiz || document).querySelectorAll("table").forEach(t => {
    const enc = [...t.querySelectorAll("thead th")].map(th => th.textContent.trim());
    if (!enc.length) return;
    t.querySelectorAll("tbody tr").forEach(tr => {
      if (tr.classList.contains("grupo")) return;
      [...tr.children].forEach((td, i) => {
        if (enc[i] && !td.classList.contains("flecha")) td.setAttribute("data-label", enc[i]);
      });
    });
  });
}

    guardar(); pintar(); avisar("Parámetros guardados");
  };

/** Reduce la foto antes de guardarla: si no, el navegador se llena. */
function comprimirFoto(file, max = 640, calidad = 0.62) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h > max) { w = Math.round(w * max / h); h = max; }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", calidad));
      };
      img.onerror = () => rej(new Error("imagen"));
      img.src = r.result;
    };
    r.onerror = () => rej(new Error("lectura"));
    r.readAsDataURL(file);
  });
}

function pedirFoto(animalId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const a = animal(animalId);
      a.foto = await comprimirFoto(f);
      a.tieneFoto = true;
      guardar(); fichaAnimal(animalId); avisar("Foto guardada");
    } catch { alert("No se pudo leer esa imagen. Intenta con otra."); }
  };
  inp.click();
}

function datos(f) {
  const o = {};
  const fd = new FormData(f);
  fd.forEach((v, k) => o[k] = typeof v === "string" ? v.trim() : v);
  if (f.querySelector('[name=personas]')) o.personas = fd.getAll("personas");
  if (f.querySelector('[name=fincas]')) o.fincas = fd.getAll("fincas");
  return o;
}
function error(f, msg) {
  const a = f.querySelector("[data-error]");
  a.textContent = msg; a.hidden = false;
}

/**
 * Comprueba el permiso EN EL MOMENTO DE GUARDAR, no solo al dibujar.
 * Si a alguien le quitan la finca o le bajan el rol con un formulario
 * abierto, no puede guardar lo que ya no le corresponde.
 */
function permitidoGuardar(tipo, id, v) {
  const mias = misFincas();
  const enMiFinca = (fid) => !fid || mias.includes(fid);

  if (tipo === "finca") {
    if (id) return puedoEditarFinca(finca(id)) || "Esa finca ya no está a tu cargo.";
    return puede("editaFinca") || "No tienes permiso para crear fincas.";
  }
  if (tipo === "persona") return true;          // ya se valida aparte, por rango

  if (tipo === "animal") {
    if (id) {
      const a = animal(id);
      if (!a) return "Ese animal ya no existe.";
      if (!enMiFinca(a.fincaId)) return "Ese animal ya no está en una finca tuya.";
      if (!puedoEditarAnimal(a)) return mensajeBloqueo(a);
    } else if (!puede("editaAnimal")) return "No tienes permiso para añadir animales.";
    if (!enMiFinca(v.fincaId)) return "No puedes poner un animal en una finca que no es tuya.";
    return true;
  }

  // Eventos: tienen que caer en una finca propia y sobre un animal propio.
  if (!puede("eventos")) return "No tienes permiso para registrar eventos.";
  if (v.animalId) {
    const a = animal(v.animalId);
    if (!a) return "Ese animal ya no existe.";
    if (!enMiFinca(a.fincaId)) return "Ese animal ya no está en una finca tuya.";
    if (!puedoEditarAnimal(a)) return mensajeBloqueo(a);
  }
  if (!enMiFinca(v.fincaId)) return "Esa finca ya no está a tu cargo.";
  return true;
}

/* ----------------------------------------------------------
   CAMPOS OBLIGATORIOS

   Los desplegables con buscador guardan el valor en un campo
   oculto, y el navegador no valida los ocultos. Por eso se
   comprueban aquí, uno por uno, con un mensaje que dice qué
   falta en vez de un aspa muda.
   ---------------------------------------------------------- */
const REQUERIDOS = {
  animal: [["chapeta","la chapeta"], ["nombre","el nombre"],
           ["fincaId","la finca"], ["categoria","la categoría"]],
  finca:  [["nombre","el nombre de la finca"]],
  persona:[["nombre","el nombre completo"]],
  insem:  [["animalId","el animal"]],
  palp:   [["animalId","el animal"], ["fecha","la fecha de la palpación"]],
  parto:  [["animalId","el animal"], ["fecha","la fecha"], ["tipo","si fue parto o aborto"]],
  secado: [["animalId","el animal"], ["fecha","la fecha del secado"],
           ["motivo","el motivo"]],
  trat:   [["animalId","el animal"], ["tipo","el tipo de tratamiento"],
           ["inicio","la fecha de inicio"]],
  leche:  [["fincaId","la finca"], ["fecha","la fecha"], ["litros","la cantidad de litros"]],
  nota:   [["fincaId","la finca"], ["fecha","la fecha"], ["texto","la nota"]],
};

function faltaAlgo(tipo, v, f) {
  for (const [campo, et] of (REQUERIDOS[tipo] || [])) {
    const valor = v[campo];
    const vacio = valor === undefined || valor === null || String(valor).trim() === "";
    if (!vacio) continue;
    // Señalar el campo para que se vea cuál es.
    const el = f.querySelector(`[name="${campo}"]`);
    const caja = el?.closest(".campo");
    if (caja) {
      caja.classList.add("falta");
      try { caja.scrollIntoView?.({ block: "center", behavior: "smooth" }); } catch {}
      setTimeout(() => caja.classList.remove("falta"), 2600);
      try {
        caja.querySelector("input:not([type=hidden]), select, textarea, .combo-btn")?.focus?.();
      } catch {}
    }
    return `Falta ${et}.`;
  }
  return null;
}

function enviar(f) {
  const [tipo, id] = f.dataset.guardar.split(":");
  const v = datos(f);

  const falta = faltaAlgo(tipo, v, f);
  if (falta) return error(f, falta);

  const permiso = permitidoGuardar(tipo, id, v);
  if (permiso !== true) {
    return error(f, permiso + " Puede que te hayan cambiado los permisos mientras tenías " +
                    "esto abierto.");
  }
  const nuevo = (o) => ({ id: uid(), creadoPor: S.persona?.id || null, ...o });

  if (tipo === "animal") {
    // Estos dos ya no se escriben a mano: salen de los partos registrados.
    // Lo que traiga de antes (importado o de una versión anterior) se respeta.
    const previo = id ? animal(id) : null;
    v.partosPrevios = previo ? (Number(previo.partosPrevios) || 0) : 0;
    v.ultimoPartoPrevio = previo ? (previo.ultimoPartoPrevio || null) : null;
    delete v.especie;   // se deriva de la categoría
    const cat = CATEGORIAS[v.categoria];
    if (!cat || cat.sexo !== "H" || cat.etapa !== "adulta") {
      v.partosPrevios = 0; v.ultimoPartoPrevio = null;
    }
    if (id) {
      const antes = animal(id);
      if (!puedoEditarAnimal(antes)) return error(f, mensajeBloqueo(antes));
    }
    if (v.estado !== "activo" && !v.fechaSalida) {
      return error(f, `Pon la fecha en que ${v.estado === "vendido" ? "se vendió" : "murió"}.`);
    }
    if (v.estado !== "activo" && dias(v.fechaSalida) < 0) {
      return error(f, "Esa fecha de salida todavía no ha llegado.");
    }
    if (v.estado === "activo") { v.fechaSalida = null; v.motivoSalida = ""; }
    if (D.animales.some(a => a.chapeta === v.chapeta && a.id !== id))
      return error(f, `La chapeta ${v.chapeta} ya está registrada.`);
    if (v.estado !== "activo" && !v.fechaSalida)
      return error(f, "Pon la fecha de salida para un animal vendido o muerto.");
    let movidas = 0;
    if (id) {
      const antes = animal(id);
      movidas = renombrarChapeta(antes.chapeta, v.chapeta);
      Object.assign(antes, v);
    } else D.animales.push(nuevo(v));
    if (movidas) setTimeout(() => avisar(`Se actualizó la chapeta en ${movidas} cría(s)`), 400);
    return persistir(id ? "Animal actualizado" : "Animal añadido");
  }

  if (tipo === "finca") {
    if (!id && !cupo("fincas").ok) return error(f, mensajeCupo("fincas"));
    v.personas = v.personas || [];
    if (!id && S.persona && !v.personas.includes(S.persona.id)) v.personas.push(S.persona.id);
    if (id) Object.assign(finca(id), v);
    else D.fincas.push(nuevo(v));
    return persistir("Finca guardada");
  }

  if (tipo === "persona") {
    v.activo = v.activo !== "no";
    if (!id) {
      const clave = v.rol === "administrador" ? "administradores"
                  : v.rol === "empleado" ? "empleados" : null;
      if (clave && !cupo(clave).ok) return error(f, mensajeCupo(clave));
    }
    if (!esSuper()) {
      const previo = id ? persona(id) : null;
      if (previo) v.rol = previo.rol;                               // el rol no se toca
      else if (!rolesQuePuedoCrear().includes(v.rol)) {
        return error(f, "No puedes crear a alguien con ese rol.");
      }
      if (previo && !puedoEditarPersona(previo)) {
        return error(f, "Esa persona no está bajo tu cargo.");
      }
    }
    if (v.correo && D.personas.some(p => p.correo && p.correo.toLowerCase() === v.correo.toLowerCase() && p.id !== id))
      return error(f, `Ya hay una persona con el correo ${v.correo}.`);
    const marcadas = v.fincas;      // undefined si el formulario no las mostró
    delete v.fincas;                // se derivan de finca.personas, no se guardan aquí

    let pid = id;
    if (id) {
      const antes = persona(id);
      const correoViejo = (antes.correo || "").toLowerCase();
      Object.assign(antes, v);
      delete antes.nombrePorDefecto;   // ya lo escribió una persona
      // Si le cambiaron el correo, el anterior no debe seguir entrando.
      const correoNuevo = (v.correo || "").toLowerCase();
      if (correoViejo && correoViejo !== correoNuevo) {
        moverConfigDe(correoViejo, correoNuevo);   // dueño principal, accesos y permisos
        borrarUsuarioRemoto(correoViejo);
      }
    } else {
      const p = nuevo(v);
      D.personas.push(p);
      pid = p.id;
    }

    if (marcadas) asignarFincas(pid, marcadas);
    return persistir("Persona guardada");
  }

  if (tipo === "insem") {
    // intento y estatus no se guardan: se calculan al mostrar.
    const fd = new FormData(f);
    const fechas = fd.getAll("ap_fecha"), horas = fd.getAll("ap_hora");
    const pajs = fd.getAll("ap_pajilla"), dets = fd.getAll("ap_detalles");

    const aplicaciones = fechas.map((fe, k) => ({
      fecha: fe, hora: (horas[k] || "").trim(),
      pajilla: (pajs[k] || "").trim(), detalles: (dets[k] || "").trim(),
    })).filter(a => a.fecha)
       .sort((a, b) => (a.fecha + (a.hora || "00:00")).localeCompare(b.fecha + (b.hora || "00:00")));

    if (!aplicaciones.length) return error(f, "Pon al menos una pajilla con su fecha.");
    if (aplicaciones.some(a => !a.pajilla)) return error(f, "Cada pajilla necesita su nombre.");

    // Dos aplicaciones idénticas serían un error de digitación.
    const firmas = aplicaciones.map(a => a.fecha + "|" + a.hora + "|" + a.pajilla.toLowerCase());
    if (new Set(firmas).size !== firmas.length) {
      return error(f, "Hay dos pajillas iguales a la misma hora. Cambia la hora o quita una.");
    }
    // Más de 5 días entre la primera y la última ya no es el mismo servicio.
    const luz = dias(aplicaciones[0].fecha, aFecha(aplicaciones[aplicaciones.length - 1].fecha));
    if (luz > 5) {
      return error(f, `Entre la primera y la última pajilla hay ${luz} días. ` +
        `Eso son servicios distintos: regístralos por separado para que los intentos cuenten bien.`);
    }

    delete v.ap_fecha; delete v.ap_hora; delete v.ap_pajilla; delete v.ap_detalles;
    v.palpar = ["si", "no"].includes(v.palpar) ? v.palpar : null;
    v.aplicaciones = aplicaciones;
    v.fecha = aplicaciones[0].fecha;   // la gestación cuenta desde la primera

    if (id) Object.assign(D.inseminaciones.find(x => x.id === id), v);
    else D.inseminaciones.push(nuevo(v));
    return persistir(aplicaciones.length > 1
      ? `Servicio con ${aplicaciones.length} pajillas registrado` : "Servicio registrado");
  }

  if (tipo === "palp") {
    v.mesesGest = Math.max(0, Number(v.mesesGest) || 0);
    v.diasGest = Math.max(0, Number(v.diasGest) || 0);
    v.manda = v.manda === "on" || v.manda === true;
    if (v.resultado !== "prenada") { v.mesesGest = 0; v.diasGest = 0; v.manda = false; }
    delete v.diasGestacion;
    if (v.resultado === "prenada" && v.animalId) {
      const r = reparoPalpacion(animal(v.animalId), v);
      if (r) return error(f, `No cuadra: ${r}.`);
    }
    v.diasGestacion = v.diasGestacion ? Number(v.diasGestacion) : null;
    if (id) Object.assign(D.palpaciones.find(x => x.id === id), v);
    else D.palpaciones.push(nuevo(v));
    return persistir("Palpación registrada");
  }

  if (tipo === "parto") {
    if (v.tipo === "aborto") v.sexoCria = "";
    if (id) Object.assign(D.partos.find(x => x.id === id), v);
    else D.partos.push(nuevo(v));
    // Una novillona que pare pasa a ser vaca.
    const a = animal(v.animalId);
    if (a && v.tipo === "parto" && CATEGORIAS[a.categoria]?.etapa === "levante") {
      const esp = CATEGORIAS[a.categoria].especie;
      const adulta = Object.entries(CATEGORIAS)
        .find(([, c]) => c.especie === esp && c.sexo === "H" && c.etapa === "adulta");
      if (adulta) a.categoria = adulta[0];
    }
    return persistir(v.tipo === "parto" ? "Parto registrado" : "Aborto registrado");
  }

  if (tipo === "secado") {
    const prev = D.secados.find(x => x.animalId === v.animalId && x.fecha === v.fecha && x.id !== id);
    if (prev) return error(f, "Esa vaca ya tiene un secado registrado en esa misma fecha.");
    if (id) Object.assign(D.secados.find(x => x.id === id), v);
    else D.secados.push(nuevo(v));
    return persistir("Secado registrado");
  }

  if (tipo === "leche") {
    v.litros = Number(v.litros) || 0;
    v.dias = Math.max(1, Number(v.dias) || 1);
    v.precio = Number(v.precio) || 0;
    if (v.litros <= 0) return error(f, "Pon cuántos litros salieron.");
    if (!v.fincaId) return error(f, "Elige la finca.");
    if (dias(v.fecha) < 0) return error(f, "Esa fecha todavía no ha llegado.");
    // Dos registros iguales el mismo día casi siempre es un doble guardado.
    if (v.animalId) {
      const av = animal(v.animalId);
      if (av && !enProduccionEn(av, v.fecha) &&
          !confirm(`${av.nombre} no estaba en producción el ${fmtCorto(v.fecha)}: ` +
            `${motivoNoProduce(av, v.fecha)}.\n\n` +
            `El registro se guarda, pero no entrará en el promedio de la finca ` +
            `ni en el suyo.\n\n¿Guardar de todas formas?`)) return;
    }
    const igual = D.leche.find(x => x.id !== id && x.fecha === v.fecha &&
      x.fincaId === v.fincaId && x.momento === v.momento &&
      (x.animalId || "") === (v.animalId || ""));
    if (igual && !confirm(`Ya hay un registro de ${litros(igual.litros)} litros ese día ` +
        `con el mismo momento.\n\n¿Guardar otro de todas formas?`)) return;
    if (id) Object.assign(D.leche.find(x => x.id === id), v);
    else D.leche.push(nuevo(v));
    return persistir("Leche registrada");
  }

  if (tipo === "trat") {
    if (id) Object.assign(D.tratamientos.find(x => x.id === id), v);
    else D.tratamientos.push(nuevo(v));
    return persistir("Tratamiento guardado");
  }

  if (tipo === "nota") {
    if (id) Object.assign(D.anotaciones.find(x => x.id === id), v);
    else D.anotaciones.push(nuevo(v));
    return persistir("Anotación guardada");
  }
}

async function borrar(tipo, id) {
  const dep = dependencias(tipo, id);

  if (tipo === "animal") {
    const a = animal(id);
    if (!puedoEditarAnimal(a)) return alert(mensajeBloqueo(a));
    let msg = `¿Eliminar a ${a.nombre} (${a.chapeta})?`;
    if (dep.eventos) msg += `\n\nSe borran también sus ${dep.eventos} registros de ` +
      `inseminación, parto, palpación, secado y tratamiento.`;
    if (dep.crias) msg += `\n\n${dep.crias} animal(es) lo tienen anotado como madre o padre; ` +
      `esa anotación se queda como está.`;
    msg += "\n\nNo se puede deshacer.";
    if (!confirm(msg)) return;
  }

  else if (tipo === "finca") {
    const f = finca(id);
    if (!puedoBorrarFinca(f)) return alert("Solo quien creó la finca, o un superadministrador, puede eliminarla.");
    if (dep.animales) {
      if (!confirm(`La finca ${f.nombre} tiene ${dep.animales} animal(es).\n\n` +
        `Si continúas se borran ellos y todos sus eventos. Si prefieres conservarlos, ` +
        `cancela y muévelos antes a otra finca.\n\n¿Borrar la finca con todo lo que tiene?`)) return;
      if (!confirm(`Última confirmación: se van a borrar ${dep.animales} animales con su historial.`)) return;
    } else if (!confirm(`¿Eliminar la finca ${f.nombre}?` +
        (dep.notas ? `\n\nSe borran sus ${dep.notas} anotación(es).` : "") +
        (dep.gente ? `\n\n${dep.gente} persona(s) quedan sin esta finca asignada.` : ""))) return;
    const barrido = await barrerFincaRemota(id);
    if (borrarEnCascada("finca", id, { arrastrarAnimales: true }) === null) return;
    persistir("Finca eliminada");
    if (barrido) avisar(`Se limpiaron ${barrido} registros, incluidos los más viejos`);
    return;
  }

  else if (tipo === "persona") {
    const p = persona(id);
    if (!puedoEditarPersona(p)) return alert("Esa persona no está bajo tu cargo.");
    if (p.id === S.persona?.id) return alert("No puedes eliminarte a ti mismo.");
    if ((p.correo || "").toLowerCase() === (D.config.maestro || "").toLowerCase() && p.correo) {
      return alert(`${p.nombre} es el dueño principal: es el único que administra la conexión ` +
        `con la base de datos.\n\nAntes de eliminarlo, pásale ese papel a otro correo desde ` +
        `Configuración → Conexión con Firebase.`);
    }
    let msg = `¿Eliminar a ${p.nombre}?`;
    if (p.correo) msg += `\n\nPierde el acceso a la app de inmediato.`;
    if (dep.fincas) msg += `\n\nQueda desasignada de ${dep.fincas} finca(s).`;
    if (dep.creo) msg += `\n\nLos ${dep.creo} registros que hizo NO se borran; quedan sin autor.`;
    if (!confirm(msg)) return;
  }

  else if (!confirm("¿Eliminar este registro?")) return;

  // Lo que quedó fuera de la ventana también hay que barrerlo.
  if (tipo === "animal") {
    const a = animal(id);
    const barrido = await barrerAnimalRemoto(id, a.fincaId);
    if (borrarEnCascada(tipo, id) === null) return;
    persistir("Animal eliminado");
    if (barrido) avisar(`Se limpiaron ${barrido} registros suyos, incluidos los más viejos`);
    return;
  }
  if (borrarEnCascada(tipo, id) === null) return;
  persistir("Registro eliminado");
}

/* ---------- exportar / importar / reiniciar ---------- */
async function acciones(a) {
  const val = (id) => document.getElementById(id)?.value.trim() || "";

  if (a === "guardar-cfg") {
    const cfg = leerConfigPegada(val("cfg-pegar"));
    if (!cfg) return alert("No encontré apiKey ni projectId ahí.\n\n" +
      "Copia el bloque completo desde Configuración del proyecto → Tus apps → Web.");
    D.config.firebase = cfg; guardarLocal();
    avisar("Configuración guardada"); conectarFirebase();
    return;
  }
  if (a === "entrar-fb" || a === "registrar-fb") {
    const c = val("fb-correo"), k = val("fb-clave");
    if (!c || !k) return alert("Escribe el correo y la contraseña.");
    try { await entrarFirebase(c, k, a === "registrar-fb"); avisar("Sesión iniciada"); }
    catch (e) { FB.error = errorFB(e); pintar(); }
    return;
  }
  if (a === "salir-fb")     { await salirFirebase(); avisar("Sesión cerrada"); return; }
  if (a === "subir-todo")   { await subirTodo(); return; }
  if (a === "desconectar")  { desconectarFirebase(); return; }
  if (a === "publicar")     { generarArchivoPublicable(); return; }
  if (a === "instalar")     { instalarApp(); return; }
  if (a === "bajar-sw")     { descargarSW(); return; }
  if (a === "actualizar")   { aplicarActualizacion(); return; }
  if (a === "revisar-version") { await buscarActualizacion(true); return; }
  if (a === "dar-acceso") {
    const c = val("nuevo-acceso").toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) return alert("Escribe un correo válido.");
    if (c === (D.config.maestro || "").toLowerCase()) return alert("Ese ya es el dueño principal.");
    if ((D.config.accesoConfig || []).includes(c)) return alert("Ese correo ya tiene acceso.");
    if (!confirm(`Vas a darle a ${c} acceso a la conexión con Firebase, las reglas y la ` +
                 `publicación.\n\n¿Seguro?`)) return;
    (D.config.accesoConfig ||= []).push(c);
    guardar(); pintar(); avisar("Acceso concedido");
    return;
  }
  if (a === "permisos-todo" || a === "permisos-nada") {
    const c = V.permisosQuien; if (!c) return;
    const abrir = a === "permisos-todo";
    D.config.permisos[c] = {};
    if (!abrir) VISTAS.filter(v => v.id !== "configuracion")
      .forEach(v => { D.config.permisos[c][v.id] = false; });
    guardar(); pintar(); avisar(abrir ? "Todas abiertas" : "Todas cerradas");
    return;
  }
  if (a === "reintentar-indices") {
    if (!FB.user) return alert("Primero inicia sesión.");
    FB.sinIndice = new Set();
    FB.indicesFaltantes = {};
    FB.fallos = {};
    FB.estado = "listo"; FB.error = "";
    FB.claveFincas = null;
    escucharColecciones(fincasAutorizadas());
    pintar();
    avisar("Volviendo a intentar con los índices nuevos…");
    setTimeout(async () => {
      const caja = document.querySelector("[data-diagnostico]");
      if (caja) { caja.innerHTML = '<p class="expl">Revisando…</p>'; await acciones("diagnosticar"); }
    }, 1500);
    return;
  }
  if (a === "abrir-indices") {
    const urls = Object.values(FB.indicesFaltantes || {});
    if (!urls.length) return alert("No hay índices pendientes.");
    let n = 0;
    urls.forEach((u2, i) => setTimeout(() => {
      const v = window.open(conCuenta(u2), "_blank", "noopener");
      if (v) n++;
      if (i === urls.length - 1) setTimeout(() => {
        if (!n) alert("El navegador bloqueó las ventanas emergentes.\n\n" +
          "Permítelas para esta página, o usa los enlaces «Crear» de la lista uno por uno.");
        else avisar(`Se abrieron ${n} pestañas. En cada una pulsa Crear.`);
      }, 300);
    }, i * 350));
    return;
  }
  if (a === "recuperar-fincas") {
    if (!FB.user) return alert("Primero inicia sesión.");
    avisar("Revisando tus permisos…");

    // 1) Corregir el permiso: quitar fincas que ya no existen y poner las que sí.
    const rp = await repararPermiso(false);
    if (rp) {
      const lineas = [];
      if (rp.fantasmas.length) lineas.push(`• ${rp.fantasmas.length} finca(s) que ya no existen, quitadas`);
      if (rp.nuevas.length) lineas.push(`• ${rp.nuevas.length} finca(s) recuperadas`);
      if (lineas.length) {
        setTimeout(() => { unificarPersonas(); pintar(); }, 1200);
        return alert(`Permiso corregido.\n\n${lineas.join("\n")}\n\n` +
          `Ahora tienes ${rp.buenas} finca(s) y rol ${ROLES[rp.rol]?.et || rp.rol}.\n\n` +
          `Si habías intentado guardar animales y no subían, vuelve a intentarlo: ` +
          `Firebase los rechazaba porque el permiso apuntaba a fincas borradas.`);
      }
    }

    avisar("Buscando fincas en fichas viejas…");
    const r = await recuperarMisFincas(false);
    if (!r) {
      const n = unificarPersonas(); pintar();
      return alert(n ? `Se unieron ${n} ficha(s). No había fincas colgando de otras.`
                     : "Solo tienes una ficha y todas tus fincas están a la vista.");
    }
    setTimeout(() => {
      const n = unificarPersonas();
      pintar();
      alert(`Listo.\n\n` +
        `• ${r.fichas} fichas tuyas encontradas\n` +
        `• ${r.fincas} finca(s) recuperadas\n` +
        `• Nombre: ${r.nombre}\n` +
        `• Rol: ${ROLES[r.rol]?.et || r.rol}` +
        (n ? `\n• ${n} ficha(s) duplicadas unidas` : ""));
    }, 1500);
    return;
  }
  if (a === "unificar-personas") {
    const n = unificarPersonas();
    pintar();
    alert(n ? `Se unieron ${n} ficha(s) duplicadas.\n\nLas fincas y los registros que ` +
              `apuntaban a las viejas ahora apuntan a la que quedó.`
            : "No encontré fichas duplicadas.");
    return;
  }
  if (a === "sin-recorte") {
    // Solo mientras dure esta sesión. Antes dejaba la ventana en 0 guardada,
    // y desde ahí la app abría siempre con la base entera sin decir nada:
    // parecía que el recorte no se aplicaba al entrar.
    FB.todoElHistorial = true;
    if (FB.user) { FB.claveFincas = null; escucharColecciones(fincasAutorizadas()); }
    pintar();
    avisar("Se bajará todo el historial mientras dure esta sesión");
    return;
  }
  if (a === "diagnosticar") {
    const caja = document.querySelector("[data-diagnostico]");
    caja.innerHTML = '<p class="expl">Revisando…</p>';
    const r = await diagnosticar();
    caja.innerHTML = `<ul class="diag">${r.map(x => `
      <li class="${x.estado}">
        <span class="diag-marca">${x.estado === "ok" ? "✓" : x.estado === "aviso" ? "!" : "×"}</span>
        <div><strong>${esc(x.que)}</strong>${x.detalle ? `<p>${
          esc(x.detalle).replace(/(https:\/\/\S+)/,
            '<a href="$1" target="_blank" rel="noopener">$1</a>')}</p>` : ""}</div>
      </li>`).join("")}</ul>`;
    return;
  }
  if (a === "importar-masivo") { abrirImportador(""); return; }
  if (a === "contar-antiguos") {
    const f2 = document.querySelector("[data-purgar]");
    const v = datos(f2), cols = new FormData(f2).getAll("cols");
    const caja = document.querySelector("[data-conteo-antiguos]");
    if (!cols.length) return alert("Marca al menos un tipo de registro.");
    caja.innerHTML = '<p class="expl">Contando…</p>';
    const cuenta = await contarAntiguos(v.corte, cols);
    if (!cuenta) { caja.innerHTML = '<div class="aviso">Necesitas estar conectado a Firebase.</div>'; return; }
    const total = Object.values(cuenta).reduce((a2, b) => a2 + b, 0);
    caja.innerHTML = total
      ? `<div class="nota recorte" style="margin-top:12px"><div>
          <strong>${total} registros anteriores al ${fmt(v.corte)}</strong><br>
          ${Object.entries(cuenta).filter(([, n]) => n)
            .map(([c, n]) => `${n} ${PURGABLES[c].et.toLowerCase()}`).join(" · ")}
         </div></div>`
      : `<div class="nota" style="margin-top:12px">No hay nada anterior a esa fecha.</div>`;
    return;
  }
  if (a === "reintentar-subida") {
    FB.falloSubida = {};
    FB.espejo = {};          // fuerza a reenviar todo lo que haya
    FB.estado = "listo"; FB.error = "";
    programarEmpuje();
    pintar();
    avisar("Reintentando la subida…");
    setTimeout(() => {
      const quedan = Object.keys(FB.falloSubida || {});
      pintar();
      if (quedan.length) alert("Todavía fallan: " + quedan.join(", ") +
        "\n\nMira el detalle en el panel de diagnóstico.");
      else avisar("Todo subió bien");
    }, 3000);
    return;
  }
  if (a === "giro") {
    D.config.giroBloqueado = !D.config.giroBloqueado;
    guardarLocal();
    const listo = await aplicarGiro(true);
    pintar();
    if (listo) avisar(D.config.giroBloqueado
      ? "Pantalla fija en esta posición"
      : "La pantalla vuelve a girar sola");
    return;
  }
  if (a === "volver-recorte") { volverAlRecorte(); pintar(); return; }
  if (a === "palpar-grupo") { abrirPalpacionGrupo(); return; }
  if (a === "todo-historial") {
    if (!confirm("Se va a bajar todo el historial de tus fincas, sin recorte de fechas.\n\n" +
                 "En una finca con años de registros puede tardar y consumir datos. ¿Continuar?")) return;
    traerTodoElHistorial();
    return;
  }
  if (a === "revisar-datos") {
    const inf = revisarIntegridad(false);
    if (!inf.length) return alert("Todo en orden: no hay registros huérfanos ni enlaces rotos.");
    const lista = inf.map(x => `• ${x.n} ${x.que}`).join("\n");
    if (!confirm(`Se encontraron problemas:\n\n${lista}\n\n¿Corregirlos ahora?`)) return;
    revisarIntegridad(true); pintar(); avisar("Datos corregidos");
    return;
  }
  if (a === "guardar-maestro") {
    const m = val("maestro").toLowerCase();
    if (m && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return alert("Ese correo no es válido.");
    const mio = (S.persona?.correo || "").toLowerCase();
    if (m && m !== mio &&
        !confirm(`Vas a pasarle el control de la base de datos a ${m}.\n\n` +
                 `Tú dejarás de ver la conexión con Firebase, las reglas y la publicación ` +
                 `en este equipo. ¿Seguro?`)) return;
    D.config.maestro = m;
    guardar(); pintar(); avisar("Dueño principal actualizado");
    return;
  }
  if (a === "cambiar-clave") {
    const c = FB.user?.email;
    if (!c) return;
    try { await enviarReinicio(c); avisar(`Te mandamos un correo a ${c}`); }
    catch (e) { alert("No se pudo: " + errorFB(e)); }
    return;
  }
  if (a === "poner-clave") {
    const k = val("nueva-clave");
    if (k.length < 6) return alert("La contraseña debe tener al menos 6 caracteres.");
    try { await definirClave(k); avisar("Contraseña guardada"); pintar(); }
    catch (e) { alert("No se pudo: " + errorFB(e) +
      "\n\nSi dice que hace falta volver a entrar, cierra sesión y entra de nuevo."); }
    return;
  }
  if (a === "params-fabrica") {
    if (!confirm("¿Volver a los valores de fábrica?")) return;
    D.config.params = JSON.parse(JSON.stringify(PARAMS_BASE));
    guardar(); pintar(); avisar("Parámetros restablecidos");
    return;
  }

  if (a === "exportar") {
    // Una copia recortada no sirve como respaldo: hay que decirlo.
    if (historialRecortado() && !confirm(
        `Esta copia solo llevará los eventos desde el ${fmt(FB.corte)}, que es lo que ` +
        `tienes bajado.\n\nSi la quieres como respaldo completo, primero pulsa ` +
        `«Bajar todo ahora» en «Cuánto historial se baja».\n\n¿Exportar así de todos modos?`)) return;
    const b = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
    const u = URL.createObjectURL(b);
    const el = document.createElement("a");
    el.href = u; el.download = `control-ganadero-${hoyISO()}.json`;
    el.click(); URL.revokeObjectURL(u);
    avisar("Copia descargada");
  }
  if (a === "importar") {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const j = JSON.parse(r.result);
          if (!j.animales || !j.fincas) throw 0;
          if (historialRecortado() && !confirm(
              "Tienes el historial recortado. Al importar, esta copia reemplaza lo que hay " +
              "en pantalla, pero lo anterior al recorte sigue intacto en Firebase.\n\n¿Continuar?")) return;
          D = migrar(j); guardar(); pintar(); avisar("Datos importados");
        } catch { alert("Ese archivo no tiene el formato esperado. Usa uno exportado desde esta misma app."); }
      };
      r.readAsText(f);
    };
    inp.click();
  }
  if (a === "reiniciar") {
    if (!confirm("Esto borra todos los animales, fincas, personas y eventos de este equipo.\n\n" +
                 "Si tienes Firebase conectado, los datos de la nube NO se borran.\n\n¿Seguro?")) return;
    if (!confirm("Última confirmación: no hay forma de deshacer esto.")) return;
    const pre = (CLAVE_DATOS || CLAVE) + "-f-";
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.startsWith(pre)) localStorage.removeItem(k);
      }
      localStorage.removeItem(CLAVE_SUBIDAS());
      if (CLAVE_DATOS) localStorage.removeItem(CLAVE_DATOS);
    } catch {}
    (async () => {
      for (const k of await fotoClaves()) {
        if (typeof k === "string" && k.startsWith(pre)) await fotoBorrar(k);
      }
    })();
    _fotosEnDisco = new Map();
    FB.fotosSubidas = new Map(); _subidasCargadas = false;
    const cfg = D.config;
    D = migrar({ ...semilla(), config: cfg });
    guardarLocal();
    S.persona = null; S.modo = null; guardarSesion();
    pantallaAcceso();
  }
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarHoja(); });

aplicarTema();
/* El manifiesto ya no va dentro de este archivo: Chrome no puede crear una
   aplicación de verdad a partir de uno incrustado, y sin eso no deja fijar la
   pantalla. Si el archivo no está en el servidor, más vale decirlo. */
fetch("./manifest.webmanifest", { method: "GET" })
  .then(r => { if (!r.ok) throw 0; })
  .catch(() => setTimeout(() => avisar(
    "Falta manifest.webmanifest en el servidor: la app no se podrá instalar bien"), 2500));
aplicarGiro(false);
recuperarSesion();
pintar();

// Si el archivo cambió de versión desde la última vez, avisarlo.
const versionPrevia = revisarVersion();
if (versionPrevia) setTimeout(() => avisar(`Actualizada de la ${versionPrevia} a la ${VERSION}`), 900);
conectarFirebase(true);


/**
 * Pone o quita a una persona de las fincas marcadas. Solo toca las que
 * quien está editando administra: las demás quedan como estaban, para no
 * desasignar a alguien de una finca que ni siquiera puedes ver.
 */
function asignarFincas(personaId, marcadas) {
  const mias = new Set(misFincasObj().map(f => f.id));
  const quiere = new Set(marcadas || []);
  for (const f of D.fincas) {
    if (!mias.has(f.id)) continue;
    f.personas ||= [];
    const tiene = f.personas.includes(personaId);
    if (quiere.has(f.id) && !tiene) f.personas.push(personaId);
    if (!quiere.has(f.id) && tiene) f.personas = f.personas.filter(x => x !== personaId);
  }
}


/* ---------- pasos de la carga masiva ---------- */
async function accionImportar(a) {
  if (a === "archivo") {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".csv,.tsv,.txt,text/csv";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { document.getElementById("imp-texto").value = r.result; accionImportar("leer"); };
      r.readAsText(f, "utf-8");
    };
    inp.click();
    return;
  }

  if (a === "plantilla") {
    const linea = lineaPlantilla(IMP.destino);
    try { await navigator.clipboard.writeText(linea); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = linea; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    avisar("Plantilla copiada");
    return;
  }

  if (a === "leer") {
    const txt = document.getElementById("imp-texto").value.trim();
    if (!txt) return alert("Pega los datos o sube un archivo.");
    const sep = detectarSeparador(txt);
    const filas = partirTabla(txt, sep);
    if (!filas.length) return alert("No encontré ninguna fila.");

    if (IMP.modo === "orden") {
      // Sin encabezado: las columnas van en el orden de la plantilla.
      const campos = camposDe(IMP.destino);
      // Si por costumbre pegaron también la fila de títulos, se descarta.
      const primera = filas[0].map(x => normaliza(x).trim());
      const esTitulo = campos.some((c, i) => primera[i] === normaliza(c.et).trim());
      IMP.filas = esTitulo ? filas.slice(1) : filas;
      IMP.conEncabezado = false;
      IMP.encabezados = campos.map(c => c.et);
      IMP.mapeo = campos.map(c => c.k);
      if (!IMP.filas.length) return alert("Solo veo la fila de títulos, sin datos.");
    } else {
      if (filas.length < 2) return alert("Necesito el encabezado y al menos una fila de datos.");
      IMP.filas = filas;
      IMP.conEncabezado = true;
      IMP.encabezados = filas[0].map(x => String(x).trim());
      IMP.destino = IMP.destino || adivinarDestino(IMP.encabezados);
      IMP.mapeo = adivinarMapeo(IMP.destino, IMP.encabezados);
    }
    IMP.ordenFecha = proponerOrdenFecha(
      IMP.conEncabezado ? IMP.filas : [[], ...IMP.filas], IMP.mapeo, IMP.destino);
    IMP.paso = 2;
    return pintarImportador();
  }

  if (a === "atras")  { IMP.paso = 1; return pintarImportador(); }
  if (a === "atras2") { IMP.paso = 2; return pintarImportador(); }

  if (a === "revisar") {
    const def = DESTINOS[IMP.destino];
    const faltan = def.campos.filter(c => c.req && !IMP.mapeo.includes(c.k));
    if (faltan.length) return alert("Falta asignar: " + faltan.map(c => c.et).join(", "));
    procesarImportacion();
    IMP.paso = 3;
    return pintarImportador();
  }

  if (a === "guardar") return guardarImportacion();
}

/**
 * Con fechas como 11/09/2024 no se sabe si es 11 de septiembre o 9 de noviembre.
 * Si alguna fila tiene un número mayor que 12 en la primera posición, ya está claro.
 */
function proponerOrdenFecha(filas, mapeo, destino) {
  const def = DESTINOS[destino];
  const cols = mapeo.map((k, i) => ({ k, i }))
    .filter(x => x.k && def.campos.find(c => c.k === x.k && c.tipo === "fecha"));
  for (const fila of filas.slice(1, 200)) {
    for (const { i } of cols) {
      const m = String(fila[i] ?? "").trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.]/);
      if (!m) continue;
      if (Number(m[1]) > 12) return "dmy";
      if (Number(m[2]) > 12) return "mdy";
    }
  }
  return "mdy";
}
